<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Info · WFA</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f1f5f9; min-height: 100vh; font-size: 16px; }
  .app-header { background: white; border-bottom: 3px solid #1798d3; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .app-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; color: #1798d3; }
  .app-subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }
  .container { max-width: 720px; margin: 0 auto; padding: 20px; }

  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .home-grid { grid-template-columns: 1fr; } }
  .home-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; border: 2px solid transparent; text-align: left; }
  .home-card:hover { border-color: #1798d3; }
  .home-card .icon { font-size: 32px; margin-bottom: 10px; }
  .home-card .name { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: #1e293b; margin-bottom: 4px; }
  .home-card .desc { font-size: 13px; color: #64748b; }

  .back-btn { background: none; border: none; color: #1798d3; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 16px; padding: 8px 0; }
  .section-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 20px; color: #1e293b; margin-bottom: 4px; }
  .section-desc { font-size: 14px; color: #64748b; margin-bottom: 16px; }

  .add-btn { background: #1798d3; color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 16px; }
  .add-btn:hover { background: #1483ba; }

  .list-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; }
  .list-row:last-child { border-bottom: none; }
  .list-row .main { flex: 1; min-width: 0; }
  .list-row .primary { font-weight: bold; font-size: 15px; color: #1e293b; }
  .list-row .secondary { font-size: 13px; color: #64748b; margin-top: 2px; }
  .row-btn { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; color: #475569; flex-shrink: 0; }
  .row-btn:hover { background: #f1f5f9; }
  .row-btn.danger { color: #dc2626; }
  .empty-msg { padding: 30px 18px; text-align: center; color: #94a3b8; font-size: 14px; }
  .colour-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(0,0,0,.1); }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-family: 'Nunito', sans-serif; font-weight: 900; color: #1798d3; font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 6px; }
  .field input[type=text], .field input[type=email], .field input[type=date], .field input[type=number], .field select {
    width: 100%; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 16px; font-family: inherit;
  }
  .field input[type=color] { width: 60px; height: 40px; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 2px; cursor: pointer; }
  .day-checks { display: flex; gap: 10px; flex-wrap: wrap; }
  .day-checks label { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: normal; color: #1e293b; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-primary { flex: 1; background: #1798d3; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-primary:hover { background: #1483ba; }
  .btn-cancel { background: #f1f5f9; color: #475569; border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px; cursor: pointer; }

  .confirm-modal p { font-size: 15px; color: #1e293b; margin-bottom: 4px; }
  .confirm-modal .warn { font-size: 13px; color: #dc2626; margin-top: 8px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 14px 22px; border-radius: 8px; font-size: 14px; z-index: 2000; display: none; max-width: 90%; text-align: center; }
  .toast.show { display: block; }
  .toast.error { background: #dc2626; }

  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .access-checks { display: flex; flex-direction: column; gap: 6px; }
  .access-checks label { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: normal; color: #1e293b; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .access-checks input { margin-top: 3px; flex-shrink: 0; }
  .access-note { font-size: 13px; color: #64748b; background: #f8fafc; border-radius: 8px; padding: 10px 12px; }
  .suggest-btn { background: #e0f2fe; color: #0369a1; border: none; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; margin-top: 6px; }
  .no-login { color: #b45309; }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="app-title">School Info</div>
    <div class="app-subtitle">Term dates, calendar events, meetings, staff list and logins, day timings, and bookable resources</div>
  </div>
</div>

<div class="container" id="app"></div>

<div class="modal-bg" id="formModalBg">
  <div class="modal" id="formModal"></div>
</div>

<div class="modal-bg" id="confirmModalBg">
  <div class="modal confirm-modal" id="confirmModal"></div>
</div>

<div class="toast" id="toast"></div>

<footer style="text-align:center;padding:16px;font-size:12px;color:#94a3b8">Wallscourt Farm Academy · School Info · WFA-05.11.26b</footer>

<script>
// Calls go through the site's own /_api proxy, which checks the staff login and adds the
// real token itself — no token lives in this page any more (25.09.26).
const API_BASE = '/_api/planning/admin';
const TOKEN = '__hub__'; // placeholder the proxy swaps for the real token

const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const YEAR_GROUPS = ['', 'Reception', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5', 'Y6'];
const YG_TO_CODE = { 'Reception': 'YR', 'Y1': 'Y1', 'Y2': 'Y2', 'Y3': 'Y3', 'Y4': 'Y4', 'Y5': 'Y5', 'Y6': 'Y6', '': '' };
const ROLES = ['', 'Class', 'Cover Teacher', 'Teaching Partner', 'Learning Partner', 'Learning Support', 'Phase', 'Phase Lead', 'SENCO', 'Assistant Principal', 'Vice Principal', 'Principal', 'Administrator', 'Operations', 'Site Manager'];
const NEEDS_COVER_TO_VALUE = { 'Automatic (class teachers need cover, others don\'t)': '', 'Yes — needs cover when absent': 'Yes', 'No — doesn\'t need cover (available to cover others)': 'No' };
const VALUE_TO_NEEDS_COVER = Object.fromEntries(Object.entries(NEEDS_COVER_TO_VALUE).map(([k, v]) => [v, k]));
// Same "R,4,5" form as SubjectGroups/DayTimings year groups; the teaching schedule reads it as-is.
const YG_CHECKS = [['R', 'Reception'], ['1', 'Y1'], ['2', 'Y2'], ['3', 'Y3'], ['4', 'Y4'], ['5', 'Y5'], ['6', 'Y6']];
const CODE_TO_YG = Object.fromEntries(Object.entries(YG_TO_CODE).map(([k, v]) => [v, k]));

// Logins (05.11.26). Each staff tool is gated by a Cloudflare login list; the API
// (/planning/admin/access) reads and changes those lists one email at a time, and only
// for people who can open this page. These are the lists ticked by default for a new
// person, by role — the 09.09.26 Access Register decision. Anything can be changed
// by hand before saving.
const ACCESS_STAFF = 'eaebdb89-1861-4380-9c0d-905e7872a0a5';
const ACCESS_TEACHING = [ACCESS_STAFF,
  '031d448f-2488-4d09-94d8-3659b587164f', // Curriculum Planner
  '2e6dd3af-f55d-4fda-bd77-3616a403642b', // Reading Challenge Log + Certificates
  'fb790b8f-1899-49bc-8ac3-3f73c35d01ac', // Writing Tracker + RTP Tracker
  '3c98bd88-eab4-458e-a51a-c87392315303', // WFA Pupil Tracker
  '4f0c59a3-7e07-4d35-9b83-51c476d0d4c0', // Cohort Trajectories
  '6639c900-26d7-498f-90c0-34beab0de05e', // WFA App Dashboard
];
const ACCESS_SUPPORT = [ACCESS_STAFF, '031d448f-2488-4d09-94d8-3659b587164f', '4f0c59a3-7e07-4d35-9b83-51c476d0d4c0'];
const TEACHING_ROLES = ['Class', 'Cover Teacher', 'Teaching Partner', 'Phase', 'Phase Lead', 'SENCO', 'Assistant Principal', 'Vice Principal', 'Principal'];
const SUPPORT_ROLES = ['Learning Partner', 'Learning Support'];
function defaultAccessFor(role) {
  if (TEACHING_ROLES.includes(role)) return ACCESS_TEACHING;
  if (SUPPORT_ROLES.includes(role)) return ACCESS_SUPPORT;
  return [ACCESS_STAFF];
}
function accessOn() { return !!(state.access && state.access.groups); }
// What to tick for an email. An email already saved on this person shows exactly what
// they have now, so editing anything else never changes their logins. A newly typed
// email shows the role's defaults, unless it already has tool access beyond the hub
// (a new starter already let in to the hub still gets their role's tools ticked).
function ticksFor(email, role) {
  email = (email || '').trim().toLowerCase();
  if (email && email === state.formSavedEmail) return groupsOf(email);
  const g = groupsOf(email);
  return g.filter(id => id !== ACCESS_STAFF).length ? g : defaultAccessFor(role || '');
}
function groupsOf(email) {
  email = (email || '').trim().toLowerCase();
  if (!email || !accessOn()) return [];
  return state.access.groups.filter(g => g.emails.includes(email)).map(g => g.id);
}
// A known login email whose name part has both their first and last name in it, if exactly one does.
function suggestEmail(name) {
  if (!accessOn()) return '';
  const words = (name || '').toLowerCase().replace(/[^a-z\s-]/g, '').split(/[\s-]+/).filter(w => w.length > 1);
  if (words.length < 2) return '';
  const all = new Set(state.access.groups.flatMap(g => g.emails));
  const hits = [...all].filter(e => { const local = e.split('@')[0]; return local.includes(words[0]) && local.includes(words[words.length - 1]); });
  return hits.length === 1 ? hits[0] : '';
}
function escapeHtml(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

const SECTIONS = {
  TermDates: {
    icon: '📅', name: 'Term Dates', desc: 'When each week of term starts',
    primary: r => r.Label, secondary: r => 'Starts ' + r.StartDate,
    fields: [
      { key: 'Term', label: 'Term', type: 'select', options: ['1','2','3','4','5','6'] },
      { key: 'Week', label: 'Week number', type: 'number', min: 1, max: 10 },
      { key: 'StartDate', label: 'Start date', type: 'date' },
    ],
    beforeSave: v => ({ ...v, Label: 'T' + v.Term + 'W' + v.Week }),
  },
  CalendarEvents: {
    icon: '🎉', name: 'Calendar Events', desc: 'Holidays, INSET days, and other events',
    primary: r => r.Label || r.Type, secondary: r => r.StartDate + (r.EndDate && r.EndDate !== r.StartDate ? ' – ' + r.EndDate : ''),
    fields: [
      { key: 'Label', label: 'What is it? (e.g. "Half Term", "INSET Day")', type: 'text' },
      { key: 'Type', label: 'Category', type: 'text', list: ['Bank Holiday','Christmas','Easter','Event','Half Term','INSET 1','INSET 2','INSET 3','INSET 4','INSET 5','Off-Site','Summer Holiday'] },
      { key: 'StartDate', label: 'Start date', type: 'date' },
      { key: 'EndDate', label: 'End date (leave blank if just one day)', type: 'date', optional: true },
    ],
  },
  EventsMeetings: {
    icon: '👥', name: 'Meetings', desc: 'Weekly staff meetings',
    primary: r => r.Label, secondary: r => [r.Day, r.Time, r.Session, r.YearGroups ? 'For ' + yearGroupsLabel(r.YearGroups) : ''].filter(Boolean).join(' · '),
    fields: [
      { key: 'Label', label: 'Meeting name', type: 'text' },
      { key: 'Day', label: 'Day', type: 'select', options: DAY_NAMES.map(d => ({Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday'}[d])) },
      { key: 'Session', label: 'When', type: 'select', options: ['Before School', 'After School'] },
      { key: 'Time', label: 'Start time (optional)', type: 'time', optional: true },
      { key: 'Colour', label: 'Colour', type: 'color' },
      { key: 'YearGroups', label: 'Who is it for?', hint: 'Tick the year groups whose teaching schedules should show it. None ticked = whole school.', type: 'yeargroups' },
    ],
  },
  Staff: {
    icon: '🧑‍🏫', name: 'Staff List', desc: 'Add, remove, or update staff',
    primary: r => r.Name, secondary: r => [accessOn() && !r.Email ? '<span class="no-login">No login email</span>' : '', CODE_TO_YG[r.YearGroup] || r.YearGroup, r.Role, r.DayOffCover === 'No' ? 'Available for cover' : '', r.CoverRole ? 'Cover: ' + r.CoverRole : '', workingDaysLabel(r.WorkingDays)].filter(Boolean).join(' · '),
    fields: [
      { key: 'Name', label: 'Name', type: 'text' },
      { key: 'Email', label: 'Email (the address they log in with)', type: 'email', optional: true,
        hint: 'Their school address, e.g. jo.bloggs@clf.uk. Without it they can\'t log in to any staff tool.' },
      { key: 'YearGroup', label: 'Year group', type: 'select', options: YEAR_GROUPS.map(yg => yg || '(none / support staff)'), valueMap: { ...YG_TO_CODE, '(none / support staff)': '' }, displayMap: CODE_TO_YG },
      { key: 'WorkingDays', label: 'Working days', type: 'days' },
      { key: 'Role', label: 'Role', type: 'select', options: ROLES.map(r => r || '(not set)'), valueMap: { '(not set)': '' },
        hint: 'Cover Teacher = a teacher with no class of their own: available for cover, lunch cover and FAB, not tied to a year group. Otherwise, to take a teacher out of their class change this from Class to what they do now.' },
      { key: 'Access', label: 'Staff tools they can open', type: 'access' },
      { key: 'DayOffCover', label: 'Needs cover when absent?', type: 'select', options: Object.keys(NEEDS_COVER_TO_VALUE), valueMap: NEEDS_COVER_TO_VALUE, displayMap: VALUE_TO_NEEDS_COVER,
        hint: 'Leave on Automatic unless the cover planner is getting it wrong for this person.' },
      { key: 'Phone', label: 'Mobile number for text notifications', type: 'text', optional: true,
        hint: 'The cover planner texts this number when cover changes affect them. Type it normally, e.g. 07700 900123. Leave blank for no texts.' },
      { key: 'Colour', label: 'Colour', type: 'color', optional: true,
        hint: 'Their dot here, their avatar in the cover planner and their strip on the teaching schedule when they are off.' },
      { key: 'CoverRole', label: 'Gives cover as (blank = not on the cover list)', type: 'text', optional: true, list: ['Cover Supervisor', 'Teaching Partner', 'Learning Partner'],
        hint: 'Fill this in to make them appear in the cover planner\'s Cover Staff panel, available to cover other classes.' },
    ],
    beforeSave: v => (v.Role === 'Cover Teacher' ? { ...v, YearGroup: '', DayOffCover: '' } : v),
  },
};

SECTIONS.DayTimings = {
  icon: '⏰', name: 'Day Timings', desc: 'Start and end times of each part of the school day, per year group',
  primary: r => (r.Label || r.ID) + (r.YearGroup ? ' · ' + yearGroupsLabel(r.YearGroup) : ' · All years'),
  secondary: r => r.HideTime === 'true' ? 'Time hidden on the schedule' : (r.Time || 'No time set'),
  fields: [
    { key: 'Label', label: 'Name shown on the schedule', type: 'text' },
    { key: 'Time', label: 'Time (e.g. 09:00-10:30, or 15:15 for a single time)', type: 'text' },
    { key: 'YearGroup', label: 'Year groups (blank = every year; otherwise e.g. 4,5,6 — use R for Reception)', type: 'text', optional: true },
    { key: 'Order', label: 'Order down the day (1 = first)', type: 'number', min: 1, max: 99 },
    { key: 'Type', label: 'Type', type: 'select', options: ['session', 'fixed'] },
    { key: 'HideTime', label: 'Hide the time on the schedule', type: 'check' },
    { key: 'ID', label: 'Short ID (letters, no spaces — cannot be changed later)', type: 'text', addOnly: true },
  ],
  sort: (a, b) => (parseInt(a.r.Order, 10) || 0) - (parseInt(b.r.Order, 10) || 0) || (a.r.YearGroup || '').localeCompare(b.r.YearGroup || ''),
  canDuplicate: true,
  duplicateHint: 'Change the year groups (and times) so this copy and the original don\'t cover the same year. Then edit the original to match.',
  deleteWarn: 'Removing a row can make part of the day disappear from the teaching schedule for those year groups.',
};

const RESOURCE_TYPE_TO_VALUE = { 'Room / space (one booking at a time)': 'space', 'Equipment (several can be booked at once)': 'equipment' };
const RESOURCE_VALUE_TO_TYPE = Object.fromEntries(Object.entries(RESOURCE_TYPE_TO_VALUE).map(([k, v]) => [v, k]));

SECTIONS.Resources = {
  icon: '📦', name: 'Booking Resources', desc: 'The rooms and equipment that can be booked on the Resource Booking page',
  primary: r => r.Name,
  secondary: r => (r.Type === 'equipment' ? 'Equipment · ' + r.Quantity + ' available' : 'Room / space') + ' · shown in position ' + (r.Order || '?'),
  fields: [
    { key: 'Name', label: 'Name (as shown on the booking page)', type: 'text' },
    { key: 'Type', label: 'What kind of resource is it?', type: 'select', options: Object.keys(RESOURCE_TYPE_TO_VALUE), valueMap: RESOURCE_TYPE_TO_VALUE, displayMap: RESOURCE_VALUE_TO_TYPE },
    { key: 'Quantity', label: 'How many are there? (1 for a room)', type: 'number', min: 1, max: 500 },
    { key: 'Colour', label: 'Colour', type: 'color' },
    { key: 'Order', label: 'Position in the list (1 = first; rooms before equipment is tidiest)', type: 'number', min: 0, max: 99 },
  ],
  // The short ID is how bookings find their resource, so it is made from the name once, when adding, and never changed.
  beforeSave: (v, isAdd, rows) => {
    if (!isAdd) return v;
    const base = (v.Name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'resource';
    const taken = new Set(rows.map(r => (r.Id || '').trim()));
    let id = base, n = 2;
    while (taken.has(id)) id = base + '-' + (n++);
    const maxOrder = Math.max(0, ...rows.map(r => parseInt(r.Order, 10) || 0));
    return { ...v, Id: id, Order: v.Order || String(maxOrder + 1) };
  },
  sort: (a, b) => (parseInt(a.r.Order, 10) || 99) - (parseInt(b.r.Order, 10) || 99),
  deleteWarn: 'It disappears from the booking page straight away. Bookings already made for it stay in the weekly records but can no longer be seen or moved there. If you only want to rename it, use Edit instead.',
};

function yearGroupsLabel(yg) {
  return yg.split(',').map(x => x.trim() === 'R' ? 'Reception' : 'Y' + x.trim()).join(', ');
}

function workingDaysLabel(wd) {
  if (!wd) return '';
  const nums = wd.split(',').map(n => n.trim()).filter(Boolean);
  if (nums.length === 5) return 'Every day';
  return nums.map(n => DAY_NAMES[parseInt(n, 10) - 1]).filter(Boolean).join(', ');
}

let state = { view: 'home', tab: null, rows: [], editingIndex: null, access: null, accessTouched: false };

async function api(path, opts = {}) {
  const url = API_BASE + path + (path.includes('?') ? '&' : '?') + 'token=' + TOKEN;
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'X-WFA-Proxy': '1' } });
  const json = await res.json();
  return json;
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

async function loadTab(tab) {
  state.view = 'list';
  state.tab = tab;
  state.rows = [];
  render();
  const accessLoad = tab === 'Staff' ? loadAccess() : null;
  const res = await api('/tab?tab=' + tab);
  if (accessLoad) await accessLoad;
  if (res.error) {
    showToast('Could not load this list: ' + res.error, true);
    state.rows = [];
  } else {
    state.rows = res.rows || [];
  }
  render();
}

async function loadAccess() {
  try {
    const r = await fetch('/_api/planning/admin/access?token=' + TOKEN, { headers: { 'X-WFA-Proxy': '1' } });
    state.access = await r.json();
  } catch (e) {
    state.access = { error: 'could not reach the login lists' };
  }
}

function accessFieldHtml(row, isAdd) {
  const a = state.access;
  if (!a || a.error === 'not_allowed') return null; // only people who manage logins see this at all
  if (a.error === 'not_configured') return '<div class="access-note">Logins can\'t be changed from here yet (the server isn\'t connected to Cloudflare). Ask Innes.</div>';
  if (a.error) return '<div class="access-note">Couldn\'t load the login lists: ' + escapeHtml(a.error) + '. Other changes still save.</div>';
  state.formSavedEmail = (row.Email || '').trim().toLowerCase();
  const ticked = new Set(ticksFor(row.Email, row.Role));
  let html = '<div style="font-size:12px;color:#64748b;margin:-2px 0 6px">Ticked = they can open it. Saved for their email above; they get a login code by email the first time they open a tool.</div><div class="access-checks">';
  a.groups.forEach(g => {
    html += '<label title="' + escapeHtml(g.tools.join(', ')) + '"><input type="checkbox" name="acc_' + g.id + '" ' + (ticked.has(g.id) ? 'checked' : '') +
      (g.id === ACCESS_STAFF ? ' data-staff="1"' : '') + ' onchange="state.accessTouched = true"> <span>' + escapeHtml(g.label) + '</span></label>';
  });
  return html + '</div>';
}

function setTicks(form, ids) {
  const want = new Set(ids);
  form.querySelectorAll('input[name^="acc_"]').forEach(cb => { cb.checked = want.has(cb.name.slice(4)); });
}

function useSuggestedEmail(email) {
  const form = document.getElementById('entryForm');
  form.elements.Email.value = email;
  if (!state.accessTouched) setTicks(form, ticksFor(email, form.elements.Role ? form.elements.Role.value : ''));
  const s = document.getElementById('emailSuggest');
  if (s) s.remove();
}

function goHome() {
  state.view = 'home';
  state.tab = null;
  render();
}

function openAddForm() {
  openForm(null);
}

function openEditForm(index) {
  openForm(index);
}

function openDuplicateForm(index) {
  openForm(null, state.rows[index]);
}

function openForm(editIndex, prefill) {
  const section = SECTIONS[state.tab];
  const row = editIndex !== null ? state.rows[editIndex] : (prefill || {});
  state.editingIndex = editIndex;

  let html = '<h3>' + (editIndex !== null ? 'Edit' : (prefill ? 'Copy of row' : 'Add')) + ' — ' + section.name + '</h3>' +
    (prefill && section.duplicateHint ? '<p style="font-size:13px;color:#64748b;margin:-8px 0 16px">' + section.duplicateHint + '</p>' : '') + '<form id="entryForm">';
  state.accessTouched = false;
  section.fields.forEach(f => {
    if (f.addOnly && editIndex !== null) return;
    if (f.type === 'access') {
      const inner = accessFieldHtml(row, editIndex === null);
      if (inner) html += '<div class="field"><label>' + f.label + '</label>' + inner + '</div>';
      return;
    }
    const rawVal = row[f.key] || '';
    html += '<div class="field"><label>' + f.label + '</label>' + (f.hint ? '<div style="font-size:12px;color:#64748b;margin:-2px 0 6px">' + f.hint + '</div>' : '');
    if (f.type === 'check') {
      html += '<label style="font-weight:normal"><input type="checkbox" name="' + f.key + '" ' + (rawVal === 'true' ? 'checked' : '') + '> Yes</label>';
    } else if (f.type === 'select') {
      const display = f.displayMap ? (f.displayMap[rawVal] || '') : rawVal;
      html += '<select name="' + f.key + '">';
      // a value already saved that isn't in the list (e.g. an older role) stays selectable, so saving never wipes it
      const opts = (rawVal && !f.displayMap && !f.options.includes(rawVal)) ? f.options.concat([rawVal]) : f.options;
      opts.forEach(opt => {
        const optVal = typeof opt === 'string' ? opt : opt;
        const selected = optVal === display || optVal === rawVal ? 'selected' : '';
        html += '<option value="' + optVal + '" ' + selected + '>' + optVal + '</option>';
      });
      html += '</select>';
    } else if (f.type === 'days') {
      const active = new Set((rawVal || '').split(',').map(n => n.trim()));
      html += '<div class="day-checks">';
      DAY_NAMES.forEach((d, i) => {
        const num = String(i + 1);
        html += '<label><input type="checkbox" name="day_' + num + '" ' + (active.has(num) ? 'checked' : '') + '> ' + d + '</label>';
      });
      html += '</div>';
    } else if (f.type === 'yeargroups') {
      const active = new Set((rawVal || '').split(',').map(n => n.trim()));
      html += '<div class="day-checks">';
      YG_CHECKS.forEach(([code, name]) => {
        html += '<label><input type="checkbox" name="yg_' + code + '" ' + (active.has(code) ? 'checked' : '') + '> ' + name + '</label>';
      });
      html += '</div>';
    } else if (f.type === 'color') {
      html += '<input type="color" name="' + f.key + '" value="' + (rawVal || '#1798d3') + '"' + (f.optional ? ' style="opacity:' + (rawVal ? 1 : .35) + '" oninput="const n = this.form.elements[this.name + \'_none\']; n.checked = false; this.style.opacity = 1"' : '') + '>';
      // optional colours can stay blank, so saving other changes never gives someone a colour by accident
      if (f.optional) html += ' <label style="display:inline-flex;align-items:center;gap:5px;font-weight:normal;margin-left:10px"><input type="checkbox" name="' + f.key + '_none" ' + (rawVal ? '' : 'checked') + ' onchange="this.closest(\'.field\').querySelector(\'input[type=color]\').style.opacity = this.checked ? .35 : 1"> No colour</label>';
    } else if (f.list) {
      html += '<input type="' + f.type + '" name="' + f.key + '" value="' + rawVal.replace(/"/g, '&quot;') + '" list="dl_' + f.key + '">';
      html += '<datalist id="dl_' + f.key + '">' + f.list.map(o => '<option value="' + o + '">').join('') + '</datalist>';
    } else {
      html += '<input type="' + f.type + '" name="' + f.key + '" value="' + rawVal.replace(/"/g, '&quot;') + '"' + (f.min ? ' min="' + f.min + '"' : '') + (f.max ? ' max="' + f.max + '"' : '') + (f.type === 'email' ? ' autocomplete="off" autocapitalize="off" spellcheck="false"' : '') + '>';
      if (f.key === 'Email' && !rawVal && editIndex !== null) {
        const sug = suggestEmail(row.Name);
        if (sug) html += '<div id="emailSuggest"><button type="button" class="suggest-btn" onclick="useSuggestedEmail(\'' + sug + '\')">Use ' + escapeHtml(sug) + ' (already on the login lists)</button></div>';
      }
    }
    html += '</div>';
  });
  html += '<div class="modal-actions"><button type="button" class="btn-cancel" onclick="closeForm()">Cancel</button><button type="submit" class="btn-primary">Save</button></div>';
  html += '</form>';

  document.getElementById('formModal').innerHTML = html;
  document.getElementById('formModalBg').classList.add('open');
  const form = document.getElementById('entryForm');
  form.addEventListener('submit', handleFormSubmit);
  if (state.tab === 'Staff' && form.querySelector('input[name^="acc_"]')) {
    // A new role or a typed email that's already on the lists re-ticks the boxes, until they're ticked by hand.
    if (form.elements.Role) form.elements.Role.addEventListener('change', () => {
      if (!state.accessTouched) setTicks(form, ticksFor(form.elements.Email.value, form.elements.Role.value));
    });
    form.elements.Email.addEventListener('change', () => {
      if (!state.accessTouched) setTicks(form, ticksFor(form.elements.Email.value, form.elements.Role.value));
    });
  }
}

function closeForm() {
  document.getElementById('formModalBg').classList.remove('open');
}

async function handleFormSubmit(e) {
  e.preventDefault();
  const section = SECTIONS[state.tab];
  const formData = new FormData(e.target);
  let values = {};

  section.fields.forEach(f => {
    if (f.addOnly && state.editingIndex !== null) return;
    if (f.type === 'access') return;
    if (f.type === 'check') {
      values[f.key] = formData.get(f.key) ? 'true' : '';
    } else if (f.type === 'days') {
      const days = [];
      DAY_NAMES.forEach((d, i) => { if (formData.get('day_' + (i + 1))) days.push(String(i + 1)); });
      values['WorkingDays'] = days.join(',');
    } else if (f.type === 'yeargroups') {
      values[f.key] = YG_CHECKS.filter(([code]) => formData.get('yg_' + code)).map(([code]) => code).join(',');
    } else if (f.type === 'color' && f.optional && formData.get(f.key + '_none')) {
      values[f.key] = '';
    } else if (f.valueMap) {
      const display = formData.get(f.key);
      values[f.key] = f.valueMap[display] !== undefined ? f.valueMap[display] : display;
    } else {
      values[f.key] = formData.get(f.key) || '';
    }
  });

  if (section.beforeSave) values = section.beforeSave(values, state.editingIndex === null, state.rows);

  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  let res;
  if (state.editingIndex !== null) {
    res = await api('/tab/update', {
      method: 'POST',
      body: JSON.stringify({ tab: state.tab, row_index: state.editingIndex, values }),
    });
  } else {
    res = await api('/tab/add', {
      method: 'POST',
      body: JSON.stringify({ tab: state.tab, values }),
    });
  }

  if (res.status === 'ok') {
    let msg = 'Saved';
    let failed = false;
    if (state.tab === 'Staff' && e.target.querySelector('input[name^="acc_"]')) {
      const out = await saveAccess(e.target, values, state.editingIndex !== null ? state.rows[state.editingIndex] : {});
      msg = out.msg; failed = out.failed;
    }
    closeForm();
    showToast(msg, failed);
    loadTab(state.tab);
  } else {
    showToast(res.message || 'Something went wrong — nothing was changed', true);
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save';
  }
}

// After the Staff row has saved: make their logins match the ticks (only if something differs).
async function saveAccess(form, values, before) {
  const email = (values.Email || '').trim().toLowerCase();
  const oldEmail = (before.Email || '').trim().toLowerCase();
  const wanted = [...form.querySelectorAll('input[name^="acc_"]')].filter(cb => cb.checked).map(cb => cb.name.slice(4));
  if (!email) return { msg: wanted.length ? 'Saved — but with no email they can\'t log in to any tool yet' : 'Saved', failed: false };
  const have = groupsOf(email);
  const same = have.length === wanted.length && wanted.every(id => have.includes(id));
  const moving = oldEmail && oldEmail !== email && groupsOf(oldEmail).length;
  if (same && !moving) return { msg: 'Saved', failed: false };
  const res = await accessSet({ email, groups: wanted, old_email: moving ? oldEmail : '' });
  if (res.status === 'ok') return { msg: 'Saved — logins updated' + (wanted.length && !have.length ? '. They can now log in with ' + email : ''), failed: false };
  return { msg: 'Saved, but logins were not changed: ' + (res.message || 'something went wrong'), failed: true };
}

async function accessSet(body) {
  try {
    const r = await fetch('/_api/planning/admin/access/set?token=' + TOKEN, { method: 'POST', headers: { 'X-WFA-Proxy': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    await loadAccess();
    return j;
  } catch (err) {
    return { status: 'error', message: 'could not reach the server' };
  }
}

function openDeleteConfirm(index) {
  const section = SECTIONS[state.tab];
  const row = state.rows[index];
  const html = '<p>Remove <strong>' + section.primary(row) + '</strong>?</p>' +
    '<p class="warn">This can\'t be undone.' + (section.deleteWarn ? ' ' + section.deleteWarn : '') + '</p>' +
    (state.tab === 'Staff' && groupsOf(row.Email).length ? '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px"><input type="checkbox" id="removeLogins" checked> Also remove their logins to staff tools (' + escapeHtml(row.Email) + ')</label>' : '') +
    '<div class="modal-actions">' +
    '<button type="button" class="btn-cancel" onclick="closeConfirm()">Cancel</button>' +
    '<button type="button" class="btn-primary" style="background:#dc2626" onclick="doDelete(' + index + ')">Remove</button>' +
    '</div>';
  document.getElementById('confirmModal').innerHTML = html;
  document.getElementById('confirmModalBg').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmModalBg').classList.remove('open');
}

async function doDelete(index) {
  const removeLogins = !!(document.getElementById('removeLogins') || {}).checked;
  const email = (state.rows[index] || {}).Email || '';
  closeConfirm();
  const res = await api('/tab/delete', {
    method: 'POST',
    body: JSON.stringify({ tab: state.tab, row_index: index, expect: { Name: state.rows[index].Name || '' } }),
  });
  if (res.status === 'ok') {
    if (removeLogins && email) {
      const r = await accessSet({ email, groups: [] });
      showToast(r.status === 'ok' ? 'Removed, and their logins taken away' : 'Removed, but their logins were NOT taken away: ' + (r.message || 'error'), r.status !== 'ok');
      loadTab(state.tab);
      return;
    }
    showToast('Removed');
    loadTab(state.tab);
  } else {
    showToast(res.message || 'Something went wrong — nothing was removed', true);
  }
}

function render() {
  const app = document.getElementById('app');

  if (state.view === 'home') {
    let html = '<div class="home-grid">';
    Object.entries(SECTIONS).forEach(([key, s]) => {
      html += '<div class="home-card" onclick="loadTab(\'' + key + '\')">' +
        '<div class="icon">' + s.icon + '</div>' +
        '<div class="name">' + s.name + '</div>' +
        '<div class="desc">' + s.desc + '</div></div>';
    });
    html += '</div>';
    app.innerHTML = html;
    return;
  }

  const section = SECTIONS[state.tab];
  let html = '<button class="back-btn" onclick="goHome()">← Back</button>';
  html += '<div class="section-title">' + section.icon + ' ' + section.name + '</div>';
  html += '<div class="section-desc">' + section.desc + '</div>';
  html += '<button class="add-btn" onclick="openAddForm()">+ Add new</button>';

  if (state.rows.length === 0 && state.view === 'list') {
    html += '<div class="list-card"><div class="loading">Loading…</div></div>';
  } else {
    html += '<div class="list-card">';
    const sorted = state.rows.map((r, i) => ({ r, i }));
    if (state.tab === 'Staff') sorted.sort((a, b) => (a.r.Name || '').localeCompare(b.r.Name || ''));
    if (section.sort) sorted.sort(section.sort);
    if (sorted.length === 0) {
      html += '<div class="empty-msg">Nothing here yet — use "+ Add new" above.</div>';
    } else {
      sorted.forEach(({ r, i }) => {
        html += '<div class="list-row">';
        if (r.Colour) html += '<span class="colour-dot" style="background:' + r.Colour + '"></span>';
        html += '<div class="main"><div class="primary">' + (section.primary(r) || '(untitled)') + '</div>' +
          '<div class="secondary">' + (section.secondary(r) || '') + '</div></div>' +
          (section.canDuplicate ? '<button class="row-btn" onclick="openDuplicateForm(' + i + ')">Duplicate</button>' : '') +
          '<button class="row-btn" onclick="openEditForm(' + i + ')">Edit</button>' +
          '<button class="row-btn danger" onclick="openDeleteConfirm(' + i + ')">Remove</button>' +
          '</div>';
      });
    }
    html += '</div>';
  }
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
