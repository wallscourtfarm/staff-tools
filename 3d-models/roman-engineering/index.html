<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" type="image/png" href="../../favicon.png">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roman Engineering</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
  /* Layout: full-screen 3D scene; WFA-blue header with three tabs; info card top-left;
     a hint line and the controls floating at the bottom. Light and dark palettes. */
  :root {
    --bg: #e8f2f8;
    --panel: rgba(255, 255, 255, 0.95);
    --edge: #c6d8e4;
    --fg: #11212b;
    --muted: #4d6372;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --btn: #1798d3;
    --on-btn: #ffffff;
    --press: #dff0fa;
    --force: #d9480f;
    --on-force: #ffffff;
    --lbl-bg: rgba(255, 255, 255, 0.93);
    --lbl-fg: #11212b;
    --shadow: rgba(16, 50, 70, 0.16);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --ctl: 70px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1c24; --panel: rgba(22, 37, 48, 0.95); --edge: #2c4555; --fg: #e8f1f6; --muted: #9fb4c3;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --force: #ff8a4c; --on-force: #1a0a00;
    --lbl-bg: rgba(15, 28, 36, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1c24; --panel: rgba(22, 37, 48, 0.95); --edge: #2c4555; --fg: #e8f1f6; --muted: #9fb4c3;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --force: #ff8a4c; --on-force: #1a0a00;
    --lbl-bg: rgba(15, 28, 36, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45); color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--on-blue); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #ffffff; color: #0f6d99; border-color: #ffffff; }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(340px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; min-height: 28px; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  .info p.forces { border-left: 4px solid var(--force); padding-left: 10px; }
  .info b { color: var(--blue); }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }

  .say {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); margin: 0;
    bottom: calc(var(--ctl) + 32px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: min(600px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 16px;
    font-weight: 800; font-size: 15px; line-height: 1.35; text-align: center; text-wrap: balance;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .say:empty { display: none; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(820px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--btn); background: var(--btn); color: var(--on-btn);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.ghost[aria-pressed="true"] { background: var(--press); border-color: var(--btn); }
  .controls button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .lbl {
    font: 800 13px var(--font); background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--edge);
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px var(--shadow);
  }
  .lbl.force { background: var(--force); color: var(--on-force); border-color: transparent; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }
  [hidden] { display: none !important; }
  .stepper { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; font-weight: 800; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .stepper input { width: 130px; accent-color: var(--btn); }
  .oops { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 11px; }
    .controls button { font-size: 14px; padding: 6px 12px; }
    .controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    .say { font-size: 14px; }
    .lbl { font-size: 12px; padding: 2px 8px; }
    footer .tip { display: none; }
  }
</style>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Roman Engineering</h1>
    <span>Year 5 History · Arches, aqueducts and roads of the Roman Empire</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Choose a model">
    <button role="tab" data-tab="build" aria-selected="true">Build an arch</button>
    <button role="tab" data-tab="pull" aria-selected="false">Pull the keystone</button>
    <button role="tab" data-tab="aqueduct" aria-selected="false">Aqueduct</button>
    <button role="tab" data-tab="road" aria-selected="false">Roman road</button>
  </nav>
</header>

<details class="info" id="info" open>
  <summary id="infoTitle">How did the Romans build an arch?</summary>
  <div id="infoBody"></div>
  <dl id="readouts"></dl>
</details>

<p class="say" id="say" aria-live="polite"></p>

<div class="controls" id="controls">
  <button type="button" data-for="build" id="addBtn">Add a stone</button>
  <button type="button" data-for="build" id="allBtn" class="ghost">Add them all</button>
  <button type="button" data-for="build" id="frameBtn">Take away the frame</button>
  <button type="button" data-for="pull" id="pullBtn">Pull out the keystone</button>
  <button type="button" data-for="pull" id="noKeyBtn" class="ghost">Try with no keystone</button>
  <button type="button" data-for="aqueduct" id="viewBtn">Walk along the top</button>
  <button type="button" data-for="aqueduct" id="slopeBtn" class="ghost" aria-pressed="false">Show the slope</button>
  <button type="button" data-for="road" id="roadBack" class="ghost">◀ Back</button>
  <button type="button" data-for="road" id="roadNext">Next layer ▶</button>
  <label class="stepper" data-for="road"><span id="roadNum">1 of 8</span><input type="range" id="roadRange" min="0" max="7" step="1" value="0" aria-label="Choose a step"></label>
  <button type="button" data-for="road" id="roadGravel" class="ghost" aria-pressed="false">Gravel top (Britain)</button>
  <button type="button" data-for="road" id="roadRain" class="ghost" aria-pressed="false">Rain</button>
  <button type="button" data-for="build pull" id="forcesBtn" class="ghost" aria-pressed="false">Show the forces</button>
  <button type="button" data-for="build pull aqueduct road" id="labelsBtn" class="ghost" aria-pressed="true">Labels</button>
  <button type="button" data-for="build" id="resetBtn" class="ghost">Start again</button>
  <button type="button" data-for="pull" id="rebuildBtn" class="ghost">Rebuild</button>
</div>

<footer><span class="tip">Drag to turn · pinch or scroll to zoom · </span>Wallscourt Farm Academy · Y5-17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = s => document.querySelector(s);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------- Renderer, camera, labels ----------------
const wrap = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="oops">Sorry, this device cannot show 3D models.</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = 'labels';
wrap.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI / 2 - 0.06;   // keep the camera above the ground

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a5a, 1.15));
const sun = new THREE.DirectionalLight(0xfff3df, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
function setSun(range, pos) {
  sun.position.copy(pos);
  const c = sun.shadow.camera;
  c.left = c.bottom = -range; c.right = c.top = range; c.near = 1; c.far = range * 5;
  c.updateProjectionMatrix();
}

// ---------------- Canvas textures (no image files) ----------------
function canvasTex(w, h, draw, repeat = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  t.repeat.set(repeat, repeat);
  return t;
}
function speckle(g, w, h, rnd, n, dark, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(${dark},${0.05 + rnd() * 0.14})` : `rgba(${light},${0.05 + rnd() * 0.12})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
  }
}
// Pale limestone, tinted per stone by the material colour
const stoneTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(7);
  g.fillStyle = '#f2ede3'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, rnd, 9000, '90,70,40', '255,252,240');
  for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(110,90,60,${0.15 + rnd() * 0.2})`; g.beginPath(); g.arc(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 0, 7); g.fill(); }
}, 0.6);
// Squared blocks for the aqueduct walls (texture units are world units)
const blockTex = canvasTex(512, 256, (g, w, h) => {
  const rnd = seeded(21);
  g.fillStyle = '#7d6a4c'; g.fillRect(0, 0, w, h);
  for (let row = 0; row < 2; row++) for (let col = -1; col < 5; col++) {
    const x = col * 128 + (row % 2) * 64, y = row * 128;
    const l = 196 + rnd() * 30;
    g.fillStyle = `rgb(${l},${l * 0.88},${l * 0.66})`;
    g.fillRect(x + 3, y + 3, 122, 122);
  }
  speckle(g, w, h, rnd, 14000, '90,70,40', '255,250,235');
});
blockTex.repeat.set(1 / 3.2, 1 / 1.6);
const woodTex = canvasTex(256, 64, (g, w, h) => {
  const rnd = seeded(3);
  g.fillStyle = '#a8743f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = `rgba(70,40,15,${0.15 + rnd() * 0.25})`; g.lineWidth = 1 + rnd() * 1.5;
    const y = rnd() * h; g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 3);
    g.stroke();
  }
});
const grassTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = seeded(5);
  g.fillStyle = '#86a95c'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, rnd, 30000, '40,70,20', '200,220,140');
  g.fillStyle = 'rgba(176,150,105,0.55)';                 // trodden earth around the building site
  g.beginPath(); g.ellipse(w / 2, h / 2, w * 0.3, h * 0.2, 0, 0, 7); g.fill();
  g.globalCompositeOperation = 'destination-in';           // soft edge, so the page colour shows beyond
  const r = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const waterTex = canvasTex(256, 64, (g, w, h) => {
  const rnd = seeded(9);
  g.fillStyle = '#3f8fc4'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(220,240,255,${0.15 + rnd() * 0.35})`;
    g.fillRect(rnd() * w, rnd() * h, 10 + rnd() * 40, 1.5 + rnd() * 2);
  }
});

const mats = {
  wood: new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85, transparent: true }),
  block: new THREE.MeshStandardMaterial({ map: blockTex, roughness: 0.9 }),
  force: new THREE.MeshBasicMaterial({ color: 0xe8590c }),
};

// ---------------- Labels ----------------
const labels = [];
function addLabel(parent, text, pos, show, cls = '') {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls; el.textContent = text;
  const o = new CSS2DObject(el);
  o.position.copy(pos); parent.add(o);
  labels.push({ o, show });
  return o;
}

// =====================================================================
//  ARCH (tabs 1 and 2)
// =====================================================================
const RI = 2, RO = 2.9, D = 1.2, N = 11, KEY = 5, H = 2.6;
const PIER_OUT = RO + 0.6, PIER_D = D + 0.2;
const RM = (RI + RO) / 2, STEP = Math.PI / N, GAP = 0.018;
const ORDER = [0, 10, 1, 9, 2, 8, 3, 7, 4, 6, 5];    // both sides at once, keystone last

const arch = new THREE.Group();
scene.add(arch);

const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 72), new THREE.MeshStandardMaterial({ map: grassTex, transparent: true, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.x = 1.6; ground.receiveShadow = true;
arch.add(ground);

// Piers: courses of squared blocks, with a projecting top course (the impost)
{
  const rnd = seeded(31);
  for (const side of [1, -1]) {
    const courses = 5, ch = H / courses;
    for (let c = 0; c < courses; c++) {
      const widths = c === courses - 1 ? [PIER_OUT - RI] : (c % 2 ? [0.55, 0.95] : [0.95, 0.55]);
      let x = RI;
      const top = c === courses - 1;
      for (const bw of widths) {
        const tint = 0.92 + rnd() * 0.1;
        const m = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.9, color: new THREE.Color(0.86 * tint, 0.78 * tint, 0.6 * tint) });
        const ext = top ? 0.08 : 0;
        const b = new THREE.Mesh(new THREE.BoxGeometry(bw - 0.03 + ext * 2, ch - 0.03, PIER_D - 0.02 + ext * 2), m);
        b.position.set(side * (x + bw / 2 + (top ? 0 : 0)), c * ch + ch / 2, 0);
        b.castShadow = b.receiveShadow = true;
        arch.add(b);
        x += bw;
      }
    }
  }
}

// Voussoirs: wedge-shaped stones, each built round its own centre so it can fly and fall
const stones = [];
{
  const rnd = seeded(47);
  for (let i = 0; i < N; i++) {
    const a0 = i * STEP + GAP, a1 = (i + 1) * STEP - GAP, m = (i + 0.5) * STEP;
    const ro = i === KEY ? RO + 0.2 : RO;
    const cx = RM * Math.cos(m), cy = RM * Math.sin(m);
    const shape = new THREE.Shape();
    const seg = 6, pts = [];
    for (let k = 0; k <= seg; k++) { const a = a0 + (a1 - a0) * k / seg; pts.push([RI * Math.cos(a) - cx, RI * Math.sin(a) - cy]); }
    for (let k = seg; k >= 0; k--) { const a = a0 + (a1 - a0) * k / seg; pts.push([ro * Math.cos(a) - cx, ro * Math.sin(a) - cy]); }
    shape.moveTo(...pts[0]); for (const p of pts.slice(1)) shape.lineTo(...p);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: D, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 1, curveSegments: 4 });
    geo.translate(0, 0, -D / 2);
    const tint = 0.93 + rnd() * 0.09;
    const col = i === KEY ? new THREE.Color(0.98, 0.84, 0.55) : new THREE.Color(0.9 * tint, 0.8 * tint, 0.6 * tint);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: stoneTex, color: col, roughness: 0.85 }));
    mesh.castShadow = mesh.receiveShadow = true;
    arch.add(mesh);
    // Corner points used to stop falling stones going through the ground
    const corners = [];
    for (const z of [-D / 2, D / 2]) for (const [a, r] of [[a0, RI], [a1, RI], [a0, ro], [a1, ro], [m, ro], [m, RI]])
      corners.push(new THREE.Vector3(r * Math.cos(a) - cx, r * Math.sin(a) - cy, z));
    stones.push({ i, m, mesh, corners, home: new THREE.Vector3(cx, H + cy, 0),
      pilePos: new THREE.Vector3(), pileQ: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI / 2, -m)),
      state: 'pile', v: new THREE.Vector3(), w: new THREE.Vector3(), delay: 0, still: 0, t: 0, dur: 1 });
  }
  // The pile beside the arch: the keystone at the front, the others in two rows
  ORDER.forEach((idx, k) => {
    const s = stones[idx];
    // lift each stone so its lowest corner just touches the ground
    let low = Infinity;
    for (const c of s.corners) low = Math.min(low, c.clone().applyQuaternion(s.pileQ).y);
    const y = -low + 0.03;
    if (idx === KEY) s.pilePos.set(4.4, y, 3.2);
    else s.pilePos.set(5.2 + (k % 2) * 1.45, y, 2.1 - Math.floor(k / 2) * 1.05);
  });
}

// The wooden frame (centring) that holds the stones while the arch is built
const frame = new THREE.Group();
arch.add(frame);
{
  const add = (geo, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, mats.wood); m.position.set(x, y, z); m.rotation.z = rz; m.castShadow = m.receiveShadow = true; frame.add(m); return m; };
  const boards = 16, bw = (Math.PI * (RI - 0.05)) / boards - 0.025;
  for (let k = 0; k < boards; k++) {
    const a = (k + 0.5) * Math.PI / boards, r = RI - 0.05;
    add(new THREE.BoxGeometry(bw, 0.08, D + 0.16), r * Math.cos(a), H + r * Math.sin(a), 0, a - Math.PI / 2);
  }
  const rib = new THREE.Shape();
  rib.absarc(0, 0, RI - 0.09, 0, Math.PI, false);

      <p>There were no pumps. The water simply flowed downhill, so the channel had to slope gently all the way.</p>
      <p>The <b>Pont du Gard</b> in France was built about 2,000 years ago, in the 1st century AD. It carried water across the River Gardon to the city of Nîmes.</p>
      <p class="note">Roman Britain had no giant arched aqueducts like this. Towns such as Dorchester got their water along channels dug into the hillside.</p>`,
  },
  road: {
    title: 'How did the Romans build a road?',
    body: `<p>Roman roads let soldiers, traders and messengers travel quickly across the Empire. In Britain the Romans built thousands of kilometres of road, and many were built by soldiers.</p>
      <p>A good road was built in layers. Press <b>Next layer</b> to build one, step by step.</p>
      <p class="note"><b>In Britain</b>, most roads had a top of packed gravel, not paving slabs. Paved roads were mostly in towns. Not every road had every layer: builders used whatever stone they could find nearby.</p>
      <p><b>Did you know?</b> Roman roads are famous for running straight. Fosse Way, Watling Street and Ermine Street still have long, straight stretches, and many modern roads follow them. Fosse Way ran through Aquae Sulis (Bath), and another road ran from Bath to a Roman port at Sea Mills, in Bristol.</p>
      <p class="note">The layers are drawn thicker than real, so you can see them.</p>`,
  },
};
const FORCES_P = `<p class="forces">The weight of the stones is pushed down and outwards round the curve, into the thick piers. That is why piers must be strong and heavy.</p>`;

function roadHint() {
  if (rs.rain) {
    if (rs.step < 5) return 'Rain! Finish the road, then see where the water goes.';
    if (rs.step === 5) return 'On a flat road, rain sits in puddles and soaks in. The road soon breaks up.';
    return 'The camber sends the rain off the road and into the ditches.';
  }
  return R_STEPS[rs.step].why;
}
function hint() {
  if (ui.tab === 'road') return roadHint();
  const n = placedCount();
  if (ui.tab === 'aqueduct') return ui.view === 'top'
    ? 'This is the view along the channel. It slopes, but far too gently to see!'
    : 'Water flows along the top, all the way from the spring to the city.';
  if (archState === 'falling') return fallReason === 'pulled' ? 'Out comes the keystone…' : 'The frame is going…';
  if (archState === 'fallen') return fallReason === 'pulled'
    ? 'Crash! Without the keystone, nothing locks the two sides together.'
    : 'Crash! With no keystone, the two sides lean in and fall.';
  if (archState === 'empty') return 'The frame has gone, but there is no arch yet. Press “Start again”.';
  if (archState === 'standing') return ui.tab === 'pull'
    ? 'The arch is standing. What will happen if you pull out the keystone?'
    : (frameState === 'out' ? 'It stands by itself! The stones push against each other and hold the arch up.' : 'It holds…');
  if (ui.tab === 'pull' && archState === 'building') return 'No keystone this time. Watch what happens when the frame is taken away…';
  if (flying || queue.length) return 'Lifting a stone into place…';
  if (n === 0) return 'Press “Add a stone”. Roman builders worked from both sides at once.';
  if (n === N - 1) return 'One gap left at the top. Add the keystone!';
  if (n === N) return 'The keystone is in. Now take away the wooden frame.';
  return `${n} of ${N} stones are in. The wooden frame is holding them up.`;
}
function readouts() {
  if (ui.tab === 'road') {
    const st = R_STEPS[rs.step];
    const made = rs.step === 5 && rs.gravel ? 'Packed gravel' : st.made;
    const r = [['Step', `${rs.step + 1} of ${R_STEPS.length}`], ['Stage', st.name], ['Made of', made]];
    if (rs.step >= 5) r.push(['Top', rs.gravel ? 'Gravel (most roads in Britain)' : 'Paving slabs (mostly in towns)']);
    if (rs.step >= 6) r.push(['Roman mile', 'about 1,480 m']);
    return r;
  }
  if (ui.tab === 'aqueduct') return [
    ['Real height', 'about 49 m'], ['Whole aqueduct', 'about 50 km long'],
    ['Total drop', 'about 12 m'], ['Slope', 'about 2.5 cm every 100 m'],
  ];
  const archWord = { building: 'Being built', standing: 'Standing', falling: 'Falling!', fallen: 'Fallen down', empty: 'No arch yet' }[archState];
  const k = stones[KEY].state;
  const keyWord = k === 'placed' ? 'In place' : k === 'pile' ? 'Not yet' : 'Pulled out';
  if (ui.tab === 'pull') return [['Arch', archWord], ['Keystone', keyPull ? 'Pulled out' : keyWord]];
  return [
    ['Stones placed', `${placedCount()} of ${N}`], ['Keystone', keyWord],
    ['Wooden frame', frameState === 'in' ? 'Holding the stones' : 'Taken away'], ['Arch', archWord],
  ];
}
let dirty = true, lastHint = '';
function refresh() {
  dirty = false;
  const t = TEXT[ui.tab];
  $('#infoTitle').textContent = t.title;
  $('#infoBody').innerHTML = t.body + (isArchTab() && ui.forces ? FORCES_P : '');
  $('#readouts').innerHTML = readouts().map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  const h = hint();
  if (h !== lastHint) { $('#say').textContent = h; lastHint = h; }
  for (const b of document.querySelectorAll('#controls [data-for]')) b.hidden = !b.dataset.for.split(' ').includes(ui.tab);
  $('#roadBack').disabled = rs.step === 0;
  $('#roadNext').disabled = rs.step === R_STEPS.length - 1;
  $('#roadNum').textContent = `${rs.step + 1} of ${R_STEPS.length}`;
  $('#roadGravel').setAttribute('aria-pressed', rs.gravel);
  $('#roadRain').setAttribute('aria-pressed', rs.rain);
  const narrow = innerWidth < 640;
  for (const [o, long, short] of shortLbl) o.element.textContent = narrow ? short : long;
  surfLbl.element.textContent = rs.gravel ? (narrow ? 'Gravel' : 'Packed gravel (most roads in Britain)') : (narrow ? 'Paving slabs' : 'Paving slabs (summa crusta)');
  rSurf.material = rs.gravel ? rmat.grav : rmat.pave;
  const busy = !!flying || queue.length > 0;
  $('#addBtn').disabled = frameState !== 'in' || committed >= N;
  $('#allBtn').disabled = frameState !== 'in' || committed >= N;
  $('#frameBtn').disabled = frameState !== 'in' || busy;
  $('#pullBtn').disabled = archState !== 'standing';
  $('#noKeyBtn').disabled = archState === 'falling' || frameState === 'removing';
  $('#rebuildBtn').disabled = archState === 'falling';
  $('#forcesBtn').setAttribute('aria-pressed', ui.forces);
  $('#labelsBtn').setAttribute('aria-pressed', ui.labels);
  $('#slopeBtn').setAttribute('aria-pressed', ui.slope);
  $('#viewBtn').textContent = ui.view === 'top' ? 'See the whole bridge' : 'Walk along the top';
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === ui.tab);
  layoutVars();
}

// ---------------- Buttons ----------------
function setTab(tab) {
  ui.tab = tab;
  const aqTab = tab === 'aqueduct';
  arch.visible = isArchTab(); aq.visible = aqTab; road.visible = tab === 'road';
  if (aqTab) { setSun(30, new THREE.Vector3(18, 30, 22)); ui.view = 'whole'; }
  else if (tab === 'road') setSun(11, new THREE.Vector3(9, 15, 11));
  else setSun(9, new THREE.Vector3(7, 13, 9));
  if (tab === 'pull' && archState !== 'standing') resetArch(true);
  dirty = true; refresh();
  userMoved = false;
  flyTo(homeView(tab));
}
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setTab(b.dataset.tab));
$('#addBtn').onclick = () => addStone();
$('#allBtn').onclick = () => { while (committed < N) addStone(true); };
$('#frameBtn').onclick = removeFrame;
$('#resetBtn').onclick = () => resetArch(false);
$('#pullBtn').onclick = pullKeystone;
$('#noKeyBtn').onclick = tryNoKey;
$('#rebuildBtn').onclick = () => resetArch(true);
$('#forcesBtn').onclick = () => { ui.forces = !ui.forces; dirty = true; };
$('#labelsBtn').onclick = () => { ui.labels = !ui.labels; dirty = true; };
$('#slopeBtn').onclick = () => { ui.slope = !ui.slope; aq.userData.slope.visible = ui.slope; dirty = true; };
$('#roadNext').onclick = () => setRoadStep(rs.step + 1);
$('#roadBack').onclick = () => setRoadStep(rs.step - 1, false);
$('#roadRange').oninput = e => setRoadStep(+e.target.value, false);
$('#roadGravel').onclick = () => { rs.gravel = !rs.gravel; dirty = true; };
$('#roadRain').onclick = () => { rs.rain = !rs.rain; dirty = true; };
$('#viewBtn').onclick = () => { ui.view = ui.view === 'top' ? 'whole' : 'top'; flyTo(ui.view === 'top' ? topView() : homeView('aqueduct')); dirty = true; };

// ---------------- Resize and loop ----------------
function layoutVars() {
  document.documentElement.style.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
  document.documentElement.style.setProperty('--ctl', $('#controls').offsetHeight + 'px');
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  const hdr = $('#hdr').offsetHeight, bottom = $('#controls').offsetHeight + 80;
  camera.setViewOffset(w, h, -sideShift(), -(hdr - bottom) / 2, w, h);   // centre the model in the space between header and controls
  camera.updateProjectionMatrix();
  layoutVars();
  if (!userMoved && !fly) flyTo(ui.tab === 'aqueduct' && ui.view === 'top' ? topView() : homeView(ui.tab), true);
}
addEventListener('resize', resize);
$('#info').addEventListener('toggle', resize);
if (innerWidth < 700) $('#info').open = false;

resetArch(false);
setRoadStep(0, false);
setSun(9, new THREE.Vector3(7, 13, 9));
refresh();
resize();
flyTo(homeView('build'), true);

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  for (let k = timers.length - 1; k >= 0; k--) { timers[k].t -= dt; if (timers[k].t <= 0) { const f = timers[k].fn; timers.splice(k, 1); f(); } }
  const wasBusy = !!flying || queue.length > 0;
  updateFlights(dt);
  if (wasBusy !== (!!flying || queue.length > 0)) dirty = true;
  updateFrame(dt);
  updateFalling(dt);
  updateForces();
  if (aq.visible) { aq.userData.chanTex.offset.x -= dt * 0.6; aq.userData.rivTex.offset.y += dt * 0.25; }
  updateRoad(dt);
  updateFly(dt);
  for (const l of labels) l.o.visible = !!l.show();
  if (dirty) refresh();
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
</script>

</html>
