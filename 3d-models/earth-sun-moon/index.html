<style>
  /* Layout: full-screen 3D space scene; WFA-blue header with three tabs; info card top-left;
     controls floating at the bottom; a "what we see" window bottom-right in Moon mode.
     Deliberately one dark look (it is space), so no light/dark switch. */
  :root {
    color-scheme: dark;
    --space: #05080f;
    --panel: rgba(13, 21, 36, 0.92);
    --edge: #24354f;
    --fg: #e9f1f9;
    --muted: #a3b5ca;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --sun: #ffc83d;
    --on-sun: #1f1600;
    --night: #2c3570;
    --twilight: #b4532a;
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --ctl: 80px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--space); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .85; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 40px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid rgba(255,255,255,.55); background: transparent; color: var(--on-blue); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--on-blue); color: var(--blue); border-color: var(--on-blue); }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(340px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 40px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; }
  .info p { margin: 8px 0 0; line-height: 1.45; color: var(--fg); }
  .info p.note { color: var(--muted); font-size: 13px; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; }
  .chip.day { background: var(--sun); color: var(--on-sun); }
  .chip.night { background: var(--night); color: var(--fg); }
  .chip.twilight { background: var(--twilight); color: var(--fg); }

  .inset {
    position: fixed; z-index: 2; margin: 0;
    right: var(--gutter-r); bottom: calc(var(--ctl) + 24px + env(safe-area-inset-bottom, 0px));
    width: clamp(130px, 22vw, 220px); aspect-ratio: 1; max-width: 100%;
    border: 2px solid var(--edge); border-radius: 14px; pointer-events: none;
  }
  .inset figcaption {
    position: absolute; left: 0; right: 0; top: -26px; text-align: center;
    font-size: 13px; font-weight: 800; color: var(--muted);
  }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(760px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue); color: var(--on-blue);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.ghost[aria-pressed="true"] { border-color: var(--sun); color: var(--sun); }
  .slider { flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider span { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; height: 30px; accent-color: var(--sun); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 11px; }
    .inset { width: 120px; }
    .controls { bottom: calc(46px + env(safe-area-inset-bottom, 0px)); }
    .inset { bottom: calc(var(--ctl) + 72px + env(safe-area-inset-bottom, 0px)); }
  }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------- Constants (sizes are not to scale) ----------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const TILT = 23.44 * DEG;                 // Earth's real tilt
const BRISTOL = { lat: 51.45, lon: -2.59 };
const EARTH_ORBIT = 14, MOON_ORBIT = 5, MOON_R = 0.27;
const MOON_TILT = 15 * DEG;               // real tilt is about 5°, made bigger so it can be seen
const SYNODIC = 29.53, YEAR = 365.25;
const UP = new THREE.Vector3(0, 1, 0);

// ---------------- Starting state: today, now, tonight's real Moon ----------------
const now = new Date();
const dayNow = () => { const d = new Date(); return (d - new Date(d.getFullYear(), 0, 1)) / 864e5; };
const hourNow = () => { const d = new Date(); return Math.round((d.getHours() + d.getMinutes() / 60) * 4) / 4; };
const ageNow = () => (((Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5) % SYNODIC + SYNODIC) % SYNODIC;
const state = { mode: 'day', day: dayNow(), hour: hourNow(), age: ageNow(), playing: false, shadow: true, eclipse: false };
const YEAR_NUM = now.getFullYear();

// ---------------- Helpers ----------------
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function latLonToVec(lat, lon, r) {          // matches how three.js wraps a 2:1 map round a sphere
  const phi = (lon + 180) * DEG, th = lat * DEG;
  return new THREE.Vector3(-Math.cos(phi) * Math.cos(th) * r, Math.sin(th) * r, Math.sin(phi) * Math.cos(th) * r);
}
function circle(radius, segments = 160) {
  const pts = [];
  for (let i = 0; i < segments; i++) { const a = (i / segments) * TAU; pts.push(new THREE.Vector3(radius * Math.cos(a), 0, -radius * Math.sin(a))); }
  return new THREE.BufferGeometry().setFromPoints(pts);
}
function dateLabel(day) {
  const d = new Date(YEAR_NUM, 0, 1 + Math.floor(((day % 365) + 365) % 365));
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
}
function timeLabel(h) {
  const m = Math.round(((h % 24) + 24) % 24 * 60);
  return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}
function hm(hours) { const m = Math.round(hours * 60); return `${Math.floor(m / 60)} h ${m % 60} min`; }

try { await document.fonts.load('800 64px Nunito'); } catch (e) {}

function label(text, { px = 64, color = '#e9f1f9', h = 0.4 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = `800 ${px}px Nunito, system-ui, sans-serif`;
  g.font = font;
  c.width = Math.ceil(g.measureText(text).width + px * 0.7); c.height = Math.ceil(px * 1.45);
  g.font = font;
  g.fillStyle = 'rgba(5,8,15,0.6)';
  g.beginPath(); g.roundRect(0, 0, c.width, c.height, c.height / 2); g.fill();
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, px * 0.35, c.height / 2 + px * 0.04);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(h * c.width / c.height, h, 1);
  return s;
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,214,90,0.95)'); grad.addColorStop(0.35, 'rgba(255,180,50,0.35)'); grad.addColorStop(1, 'rgba(255,160,40,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
function moonTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d'), rnd = seeded(11);
  g.fillStyle = '#b3b4b8'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = 'rgba(105,108,116,0.55)';                  // dark "seas"
  for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(rnd() * 1024, 120 + rnd() * 270, 40 + rnd() * 90, 30 + rnd() * 60, rnd() * 3, 0, TAU); g.fill(); }
  for (let i = 0; i < 260; i++) {                          // craters
    const x = rnd() * 1024, y = 20 + rnd() * 472, r = 2 + Math.pow(rnd(), 2.5) * 22;
    g.fillStyle = 'rgba(80,82,90,0.35)'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(235,236,240,0.3)'; g.lineWidth = Math.max(1, r / 6); g.beginPath(); g.arc(x - r * 0.15, y - r * 0.15, r, 0, TAU); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---------------- Scene ----------------
const wrap = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;

// Stars
{
  const rnd = seeded(7), pts = [];
  for (let i = 0; i < 2200; i++) {
    const u = rnd() * 2 - 1, th = rnd() * TAU, s = Math.sqrt(1 - u * u);
    pts.push(600 * s * Math.cos(th), 600 * u, 600 * s * Math.sin(th));
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xcdd6ff, size: 1.5, sizeAttenuation: false })));
}

// Sun (the light comes from here)
const sun = new THREE.Mesh(new THREE.SphereGeometry(2.6, 48, 32), new THREE.MeshBasicMaterial({ color: 0xffd24a }));
scene.add(sun);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
glow.scale.set(14, 14, 1); scene.add(glow);
const sunLabel = label('Sun', { h: 0.9, color: '#ffd24a' }); sunLabel.position.set(0, 3.7, 0); scene.add(sunLabel);
scene.add(new THREE.PointLight(0xffffff, 5.5, 0, 0));
scene.add(new THREE.AmbientLight(0x8fa3c8, 0.07));

// Earth: earthGroup moves round the Sun; tiltGroup holds the fixed 23.4° tilt; earth spins inside it
const earthGroup = new THREE.Group(); scene.add(earthGroup);
const tiltGroup = new THREE.Group(); tiltGroup.rotation.z = TILT; earthGroup.add(tiltGroup);
const earthTex = new THREE.TextureLoader().load(window.EARTH_TEXTURE);
earthTex.colorSpace = THREE.SRGBColorSpace; earthTex.anisotropy = 8;
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.MeshLambertMaterial({ map: earthTex }));
tiltGroup.add(earth);
{
  const axis = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.45, 0), new THREE.Vector3(0, 1.45, 0)]),
    new THREE.LineBasicMaterial({ color: 0xa3b5ca }));
  tiltGroup.add(axis);
  const n = label('N', { h: 0.32 }); n.position.set(0, 1.68, 0); tiltGroup.add(n);
  const s = label('S', { h: 0.32 }); s.position.set(0, -1.68, 0); tiltGroup.add(s);
}
const BRISTOL_LOCAL = latLonToVec(BRISTOL.lat, BRISTOL.lon, 1);
const A_BRISTOL = Math.atan2(BRISTOL_LOCAL.z, BRISTOL_LOCAL.x);
const pin = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff4f5e }));
pin.position.copy(BRISTOL_LOCAL).multiplyScalar(1.02); earth.add(pin);
const pinLabel = label('Bristol', { h: 0.2 }); pinLabel.position.copy(BRISTOL_LOCAL).multiplyScalar(1.28); earth.add(pinLabel);

// Earth's path round the Sun, with month markers
const earthOrbit = new THREE.LineLoop(circle(EARTH_ORBIT, 240), new THREE.LineBasicMaterial({ color: 0x3a5078 }));
scene.add(earthOrbit);
const orbitAngle = day => TAU * (day - 172) / YEAR;      // 21 June sits on the +x side
const monthMarks = new THREE.Group(); scene.add(monthMarks);
for (const [txt, day] of [['21 June', 172], ['22 September', 265], ['21 December', 355], ['20 March', 79]]) {
  const a = orbitAngle(day), s = label(txt, { h: 0.9 });
  s.position.set((EARTH_ORBIT + 3.4) * Math.cos(a), 0.6, -(EARTH_ORBIT + 3.4) * Math.sin(a));
  monthMarks.add(s);
}

// Moon, its tilted path, and Earth's shadow
const moon = new THREE.Mesh(new THREE.SphereGeometry(MOON_R, 48, 32), new THREE.MeshLambertMaterial({ map: moonTexture() }));
scene.add(moon);
const moonOrbit = new THREE.LineLoop(circle(MOON_ORBIT), new THREE.LineBasicMaterial({ color: 0x6b7fa3 }));
scene.add(moonOrbit);
const shadowGeo = new THREE.CylinderGeometry(0.6, 1, 8, 48, 1, true); shadowGeo.translate(0, 4, 0);
const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0x262d5c, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide }));
scene.add(shadow);
const shadowLabel = label("Earth's shadow", { h: 0.42, color: '#a3b5ca' }); scene.add(shadowLabel);

// Sunlight arrows (point from the Sun towards the Earth)
const rays = new THREE.Group(); scene.add(rays);
const rayArrows = [];
{
  const mat = new THREE.MeshBasicMaterial({ color: 0xffc83d });
  const shaft = new THREE.CylinderGeometry(0.035, 0.035, 1.3, 12); shaft.rotateZ(Math.PI / 2); shaft.translate(-0.65, 0, 0);
  const head = new THREE.ConeGeometry(0.11, 0.3, 16); head.rotateZ(Math.PI / 2); head.translate(-1.45, 0, 0);
  for (const [y, z] of [[0.55, 0.55], [0, 0], [-0.55, -0.55]]) {
    const a = new THREE.Group();                       // an arrow pointing from the Sun side towards the Earth
    a.add(new THREE.Mesh(shaft, mat), new THREE.Mesh(head, mat));
    a.position.set(0, y, z); rays.add(a); rayArrows.push(a);
  }
}
const rayLabel = label('Sunlight', { h: 0.3, color: '#ffc83d' }); rays.add(rayLabel);

// ---------------- Positions for the current state ----------------
const tmpQ = new THREE.Quaternion(), white = new THREE.Color(1, 1, 1), bloodRed = new THREE.Color(0.62, 0.2, 0.1);
let sunDir = new THREE.Vector3(), eclipseAmount = 0;

function update() {
  const th = orbitAngle(state.day);
  earthGroup.position.set(EARTH_ORBIT * Math.cos(th), 0, -EARTH_ORBIT * Math.sin(th));
  sunDir = earthGroup.position.clone().negate().normalize();      // from Earth towards the Sun

  // Spin: Bristol faces the Sun at "Sun time" 12:00. Clock time adds British Summer Time,
  // and Bristol is 2.6° west of Greenwich, so the Sun is highest about 10 minutes after noon.
  const bst = state.day >= 87 && state.day < 300 ? 1 : 0;
  const hour = state.mode === 'day' ? state.hour - bst - 0.17 : 12;
  tiltGroup.getWorldQuaternion(tmpQ).invert();
  const dl = sunDir.clone().applyQuaternion(tmpQ);
  earth.rotation.y = A_BRISTOL - Math.atan2(dl.z, dl.x) + TAU * (hour - 12) / 24;

  // Moon: age 0 = new Moon (between Earth and Sun)
  const sunAng = Math.atan2(-sunDir.z, sunDir.x);
  const psi = sunAng + TAU * state.age / SYNODIC;
  const nu = state.eclipse ? sunAng : sunAng + Math.PI / 2;      // where the tilted path crosses Earth's level
  const nodeAxis = new THREE.Vector3(Math.cos(nu), 0, -Math.sin(nu));
  const off = new THREE.Vector3(Math.cos(psi), 0, -Math.sin(psi)).multiplyScalar(MOON_ORBIT).applyAxisAngle(nodeAxis, MOON_TILT);
  moon.position.copy(earthGroup.position).add(off);
  moon.lookAt(earthGroup.position);                                // same face always towards Earth
  moonOrbit.position.copy(earthGroup.position);
  moonOrbit.quaternion.setFromAxisAngle(nodeAxis, MOON_TILT);

  const away = sunDir.clone().negate();
  shadow.position.copy(earthGroup.position);
  shadow.quaternion.setFromUnitVectors(UP, away);
  shadowLabel.position.copy(earthGroup.position).addScaledVector(away, 3).add(new THREE.Vector3(0, 1.4, 0));

  // Is the Moon inside Earth's shadow?
  const along = off.dot(away), perp = off.clone().addScaledVector(away, -along).length();
  eclipseAmount = along > 0 ? clamp((1 - 0.05 * along + MOON_R - perp) / (2 * MOON_R), 0, 1) : 0;
  moon.material.color.copy(white).lerp(bloodRed, eclipseAmount);

  // Sunlight arrows sit on the Sun side of the Earth
  const start = state.mode === 'moon' ? 8.2 : 3.1;
  rays.position.copy(earthGroup.position);
  rays.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), sunDir);
  rayArrows.forEach(a => a.position.x = start);
  rayLabel.position.set(start - 0.7, 1.05, 0.55);
}

// ---------------- Readouts ----------------
const infoTitle = document.getElementById('infoTitle'), infoBody = document.getElementById('infoBody'), readouts = document.getElementById('readouts');
const COPY = {
  day: {
    title: 'Why do we have day and night?',
    body: `<p>The Sun stays still. The Earth spins round once every 24 hours.</p>
           <p>When Bristol faces the Sun it is day. When Bristol has turned away from the Sun it is night.</p>
           <p>The Earth spins towards the east, so the Sun seems to rise in the east and set in the west.</p>`
  },
  seasons: {
    title: 'Why do we have seasons?',
    body: `<p>The Earth's axis is tilted, and the tilt always points the same way in space.</p>
           <p>In June the northern half, where the UK is, leans towards the Sun. Days are long and the Sun is high: summer.</p>
           <p>In December it leans away. Days are short and the Sun is low: winter.</p>
           <p class="note">Seasons are not caused by the Earth getting closer to the Sun. We are actually closest in early January.</p>`
  },
  moon: {
    title: 'Why does the Moon change shape?',
    body: `<p>The Moon makes no light of its own. The Sun always lights up half of it.</p>
           <p>As the Moon travels round the Earth every 29½ days, we see different amounts of that lit half. Watch the window in the corner.</p>
           <p>Phases are not caused by Earth's shadow. A lunar eclipse only happens when a full Moon passes right through Earth's shadow, which is rare because the Moon's path is tilted.</p>
           <p class="note">The tilt of the Moon's path is drawn bigger than it really is, so you can see it.</p>`
  }
};
function row(k, v) { return `<dt>${k}</dt><dd>${v}</dd>`; }
const COMPASS = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];

function readOut() {
  const axisW = UP.clone().applyQuaternion(tiltGroup.getWorldQuaternion(tmpQ));
  const decl = Math.asin(clamp(axisW.dot(sunDir), -1, 1));               // how far the north leans to the Sun
  if (state.mode === 'day') {
    const pinW = pin.getWorldPosition(new THREE.Vector3());
    const up = pinW.clone().sub(earthGroup.position).normalize();
    const toSun = sunDir;                       // the real Sun is so far away its rays arrive parallel
    const east = axisW.clone().cross(up).normalize(), north = up.clone().cross(east);
    const elev = Math.asin(clamp(toSun.dot(up), -1, 1)) / DEG;
    const az = Math.atan2(toSun.dot(east), toSun.dot(north)) / DEG;
    const status = elev > 2.5 ? '<span class="chip day">Daytime</span>'
      : elev > -3 ? `<span class="chip twilight">${state.hour < 12 ? 'Sunrise' : 'Sunset'}</span>`
      : '<span class="chip night">Night-time</span>';
    const where = elev > -1 ? `In the ${COMPASS[Math.round(((az + 360) % 360) / 45) % 8]}` : 'Below the horizon';
    readouts.innerHTML = row('Date', dateLabel(state.day)) + row('Time in Bristol', timeLabel(state.hour)) + row('Bristol', status) + row('The Sun', where);
  } else if (state.mode === 'seasons') {
    const m = new Date(YEAR_NUM, 0, 1 + Math.floor(state.day)).getMonth();
    const season = ['Winter', 'Winter', 'Spring', 'Spring', 'Spring', 'Summer', 'Summer', 'Summer', 'Autumn', 'Autumn', 'Autumn', 'Winter'][m];
    const phi = BRISTOL.lat * DEG;
    const daylight = 24 / Math.PI * Math.acos(clamp(-Math.tan(phi) * Math.tan(decl), -1, 1));
    const d = decl / DEG;
    const lean = d > 2 ? 'Towards the Sun' : d < -2 ? 'Away from the Sun' : 'Neither way';
    readouts.innerHTML = row('Date', dateLabel(state.day)) + row('UK season', season)
      + row('North half leans', lean) + row('Daylight in Bristol', `About ${hm(daylight)}`)
      + row('Midday Sun height', `${Math.round(90 - BRISTOL.lat + d)}° above the ground`);
  } else {
    const f = state.age / SYNODIC;
    const name = f < 0.03 || f > 0.97 ? 'New Moon' : f < 0.22 ? 'Waxing crescent' : f < 0.28 ? 'First quarter' : f < 0.47 ? 'Waxing gibbous'
      : f < 0.53 ? 'Full Moon' : f < 0.72 ? 'Waning gibbous' : f < 0.78 ? 'Last quarter' : 'Waning crescent';
    const lit = Math.round((1 - Math.cos(TAU * f)) / 2 * 100);
    let eclipse = 'No';
    if (eclipseAmount > 0.6) eclipse = '<span class="chip twilight">Yes! In Earth\'s shadow</span>';
    else if (eclipseAmount > 0) eclipse = 'Starting: the Moon is touching the shadow';
    else if (Math.abs(f - 0.5) < 0.05) eclipse = state.eclipse ? 'Not right now' : 'No. The Moon passes above or below the shadow';
    readouts.innerHTML = row('Phase', name) + row('Lit part we see', `${lit}%`) + row('Moon\'s cycle', `Day ${Math.floor(state.age) + 1} of 29½`) + row('Lunar eclipse', eclipse);
  }
}

// ---------------- Modes and controls ----------------
const slider = document.getElementById('slider'), sliderLabel = document.getElementById('sliderLabel');
const playBtn = document.getElementById('play'), nowBtn = document.getElementById('now');
const shadowBtn = document.getElementById('shadowBtn'), eclipseBtn = document.getElementById('eclipseBtn');
const insetEl = document.getElementById('inset'), info = document.getElementById('info');

const MODES = {
  day:     { key: 'hour', min: 0, max: 24, step: 0.25, speed: 2,  label: () => `Time in Bristol: ${timeLabel(state.hour)}` },
  seasons: { key: 'day',  min: 0, max: 365, step: 1,   speed: 16, label: () => `Date: ${dateLabel(state.day)}` },
  moon:    { key: 'age',  min: 0, max: SYNODIC, step: 0.1, speed: 2, label: () => `Moon's cycle: day ${Math.floor(state.age) + 1} of 29½` }
};

function placeCamera() {
  const e = earthGroup.position, side = sunDir.clone().cross(UP).normalize();
  if (state.mode === 'day') {
    camera.position.copy(e).addScaledVector(side, 6.2).addScaledVector(sunDir, 1.2).add(new THREE.Vector3(0, 2.2, 0));
    controls.target.copy(e).addScaledVector(sunDir, 1.3);
    controls.minDistance = 2.2; controls.maxDistance = 30;
  } else if (state.mode === 'seasons') {
    camera.position.set(0, 34, 46);
    controls.target.set(0, 0, 0);
    controls.minDistance = 8; controls.maxDistance = 90;
  } else {
    camera.position.copy(e).addScaledVector(side, 7).addScaledVector(sunDir, 1).add(new THREE.Vector3(0, 19, 0));
    controls.target.copy(e).addScaledVector(sunDir, 1.5);
    controls.minDistance = 4; controls.maxDistance = 60;
  }
  // Tall, narrow screens (phones held upright) need the camera further back to fit the scene in
  if (camera.aspect < 1.25) {
    const k = Math.min(2.6, 1.25 / camera.aspect);
    if (state.mode === 'day') controls.target.copy(e).addScaledVector(sunDir, 0.9);
    camera.position.sub(controls.target).multiplyScalar(k).add(controls.target);
  }
  controls.update();
}

function setPlaying(p) { state.playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; }

function setMode(mode) {
  if (!MODES[mode]) mode = 'day';
  state.mode = mode; setPlaying(false);
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
  const m = MODES[mode];
  slider.min = m.min; slider.max = m.max; slider.step = m.step; slider.value = state[m.key];
  infoTitle.textContent = COPY[mode].title; infoBody.innerHTML = COPY[mode].body;

  const isMoon = mode === 'moon', isSeasons = mode === 'seasons';
  moon.visible = moonOrbit.visible = isMoon;
  shadow.visible = shadowLabel.visible = isMoon && state.shadow;
  earthOrbit.visible = monthMarks.visible = isSeasons;
  rays.visible = !isSeasons;
  earthGroup.scale.setScalar(isSeasons ? 2.2 : 1);
  insetEl.hidden = !isMoon; shadowBtn.hidden = eclipseBtn.hidden = !isMoon;
  if (location.hash.slice(1) !== mode) history.replaceState(null, '', '#' + mode);

  resize(); update(); placeCamera(); refreshText();
}
function refreshText() { sliderLabel.textContent = MODES[state.mode].label(); readOut(); }

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
window.addEventListener('hashchange', () => { const m = location.hash.slice(1); if (m !== state.mode && MODES[m]) setMode(m); });
playBtn.addEventListener('click', () => setPlaying(!state.playing));
slider.addEventListener('input', () => { state[MODES[state.mode].key] = parseFloat(slider.value); setPlaying(false); });
nowBtn.addEventListener('click', () => {
  state.day = dayNow(); state.hour = hourNow(); state.age = ageNow(); state.eclipse = false;
  eclipseBtn.setAttribute('aria-pressed', 'false'); eclipseBtn.textContent = 'Show an eclipse';
  slider.value = state[MODES[state.mode].key]; setPlaying(false);
});
shadowBtn.addEventListener('click', () => {
  state.shadow = !state.shadow; shadowBtn.setAttribute('aria-pressed', String(state.shadow));
  shadow.visible = shadowLabel.visible = state.shadow;
});
eclipseBtn.addEventListener('click', () => {
  state.eclipse = !state.eclipse;
  eclipseBtn.setAttribute('aria-pressed', String(state.eclipse));
  eclipseBtn.textContent = state.eclipse ? 'Normal month' : 'Show an eclipse';
  if (state.eclipse) { state.age = 13; setPlaying(true); }
  resize();
});

// ---------------- Layout + render loop ----------------
const hdr = document.getElementById('hdr'), ctl = document.getElementById('controls');
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  // On wide screens, slide the scene right so the info card doesn't cover it
  const shift = info.open && w > 760 ? -(info.offsetWidth + 16) / 2 : 0;
  camera.setViewOffset(w, h, shift, 0, w, h);
  camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  document.documentElement.style.setProperty('--ctl', ctl.offsetHeight + 'px');
  // Turning a tablet or phone between upright and sideways: re-frame the view
  const upright = camera.aspect < 1.25;
  if (lastUpright !== null && upright !== lastUpright) placeCamera();
  lastUpright = upright;
}
let lastUpright = null;
window.addEventListener('resize', resize);
info.addEventListener('toggle', resize);
// Phones start with the info card folded so the model can be seen
const narrow = window.matchMedia('(max-width: 559px)');
if (narrow.matches) info.open = false;
narrow.addEventListener('change', e => { info.open = !e.matches; });
resize();

const insetCam = new THREE.PerspectiveCamera(14, 1, 0.05, 2000);
const clutter = [moonOrbit, shadow, shadowLabel, rays, glow];
function renderInset() {
  const r = insetEl.getBoundingClientRect(), c = renderer.domElement.getBoundingClientRect();
  const x = r.left - c.left + 2, y = c.bottom - r.bottom + 2, w = r.width - 4, h = r.height - 4;
  if (w < 10) return;
  const toMoon = moon.position.clone().sub(earthGroup.position).normalize();
  insetCam.position.copy(earthGroup.position).addScaledVector(toMoon, 1.05);
  insetCam.up.copy(UP); insetCam.lookAt(moon.position);
  insetCam.aspect = w / h; insetCam.updateProjectionMatrix();
  const was = clutter.map(o => o.visible); clutter.forEach(o => o.visible = false);
  renderer.setScissorTest(true); renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
  renderer.render(scene, insetCam);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, c.width, c.height);
  clutter.forEach((o, i) => o.visible = was[i]);
}

const clock = new THREE.Clock();
let textTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const m = MODES[state.mode];
  if (state.playing) {
    const speed = state.mode === 'moon' && state.eclipse ? 0.6 : m.speed;   // slow down so the eclipse can be seen
    state[m.key] = (state[m.key] + dt * speed) % m.max;
    slider.value = state[m.key];
  }
  update();
  textTimer += dt;
  if (textTimer > 0.1) { textTimer = 0; refreshText(); }
  controls.update();
  renderer.render(scene, camera);
  if (state.mode === 'moon') renderInset();
});

setMode(location.hash.slice(1) || 'day');
</script>
