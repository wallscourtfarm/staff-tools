<style>
  /* Layout: full-screen 3D space scene; WFA-blue header with four tabs; info card top-left;
     controls floating at the bottom. Deliberately one dark look (it is space), like Earth, Sun and Moon. */
  :root {
    color-scheme: dark;
    --space: #05080f;
    --panel: rgba(13, 21, 36, 0.93);
    --edge: #24354f;
    --fg: #e9f1f9;
    --muted: #a3b5ca;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --sun: #ffc83d;
    --on-sun: #1f1600;
    --x: #c38cf0;
    --good: #74dc8f;
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --ctl: 80px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--space); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap;
    font: inherit; font-size: 13px; font-weight: 800; color: var(--fg); line-height: 1.2;
    background: rgba(5, 8, 15, .62); border: 1px solid rgba(163, 181, 202, .28); border-radius: 999px; padding: 3px 9px;
  }
  .lbl.x { color: var(--x); border-color: var(--x); }
  .lbl.sun { color: var(--sun); border-color: rgba(255, 200, 61, .5); }
  .lbl.quiet { cursor: default; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .85; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 40px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid rgba(255,255,255,.55); background: transparent; color: var(--on-blue); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--on-blue); color: var(--blue); border-color: var(--on-blue); }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(350px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 44px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  .info h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 800; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dl:empty { display: none; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; background: #24354f; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .opts button, .info .act {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--edge); background: transparent; color: var(--fg);
  }
  .opts button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .verdict { margin: 6px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(36, 53, 79, .6); line-height: 1.4; }
  .verdict b.good { color: var(--good); }
  .verdict b.close { color: var(--sun); }
  .chart { display: block; width: 100%; height: auto; margin-top: 8px; }
  .chart text { font-family: var(--font); font-weight: 800; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(760px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 14px;
  }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue); color: var(--on-blue);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.arrow { min-width: 48px; padding: 8px 10px; }
  .now { flex: 1 1 120px; text-align: center; font-weight: 800; font-size: 16px; min-width: 0; }
  .slider { flex: 1 1 220px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider span { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; height: 30px; accent-color: var(--sun); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  #toast {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--ctl) + 34px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: calc(100% - 32px); text-align: center;
    background: var(--panel); border: 1px solid var(--sun); color: var(--fg); border-radius: 14px;
    padding: 8px 14px; font-weight: 800; line-height: 1.35; pointer-events: none;
  }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 11px; }
    .controls { bottom: calc(40px + env(safe-area-inset-bottom, 0px)); padding: 8px 10px; }
    #toast { bottom: calc(var(--ctl) + 52px + env(safe-area-inset-bottom, 0px)); }
    .lbl { font-size: 12px; padding: 2px 7px; }
    .info { max-height: calc(100% - var(--hdr) - var(--ctl) - 66px); }
  }
</style>

<div id="scene"></div>
<div id="labels"></div>

<header id="hdr">
  <div class="brand">
    <h1>Solar System Explorer</h1>
    <span>Year 5 Science · Astronomy</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Choose a model">
    <button role="tab" data-mode="orbits" aria-selected="true">Orbits</button>
    <button role="tab" data-mode="sizes" aria-selected="false">Sizes</button>
    <button role="tab" data-mode="dist" aria-selected="false">Distances</button>
    <button role="tab" data-mode="predict" aria-selected="false">Planet Predictor</button>
  </nav>
</header>

<details class="info" id="info" open>
  <summary id="infoTitle">How do the planets move?</summary>
  <div id="infoBody"></div>
  <dl id="readouts"></dl>
  <div id="infoExtra"></div>
</details>

<div id="toast" hidden></div>

<div class="controls" id="controls">
  <div class="grp" data-for="orbits">
    <button id="oPlay" type="button">Pause</button>
    <label class="slider" for="oSpeed"><span id="oSpeedLbl">Speed</span><input id="oSpeed" type="range" min="0" max="100" value="55"></label>
    <button id="oToday" type="button" class="ghost">Today</button>
    <button id="oAll" type="button" class="ghost" hidden>All planets</button>
  </div>
  <div class="grp" data-for="sizes" hidden>
    <button id="sPrev" type="button" class="ghost arrow" aria-label="Previous">◀</button>
    <span class="now" id="sName">The whole row</span>
    <button id="sNext" type="button" class="ghost arrow" aria-label="Next">▶</button>
    <button id="sAll" type="button" class="ghost">Whole row</button>
  </div>
  <div class="grp" data-for="dist" hidden>
    <button id="dFly" type="button">Fly to Neptune</button>
    <label class="slider" for="dSl"><span id="dLbl">Distance from the Sun</span><input id="dSl" type="range" min="0" max="3100" value="0"></label>
    <button id="dAll" type="button" class="ghost">Whole solar system</button>
  </div>
  <div class="grp" data-for="predict" hidden>
    <label class="slider" for="pSl"><span id="pLbl">Planet X distance</span><input id="pSl" type="range" min="0" max="1000"></label>
    <button id="pReveal" type="button">Reveal</button>
    <button id="pNew" type="button" class="ghost">New planet</button>
  </div>
</div>

<footer><span id="scaleNote">Not to scale.</span> · <span style="white-space:nowrap">Wallscourt Farm Academy · Y5-17.11.26a</span></footer>

  controls.update();
}

  _off.copy(camera.position).sub(controls.target);
  let L = _off.length();

  if (goal.len != null) { L = L + (goal.len - L) * k; _off.setLength(L); }

  infoExtra.innerHTML = `<p class="note">Light is the fastest thing there is. It travels 300,000 km every second.</p>`;
  setReadouts([['Distance from the Sun', '', 'roDist'], ['Light from the Sun takes', '', 'roLight'], ['Nearest planet', '', 'roNear'], ['Spaceship speed', '', 'roSpeed']]);
  updateDistReadouts(true);
}
let lastDistKey = '';
function updateDistReadouts(force) {
  const s = state.s, key = s.toFixed(3) + state.flying;
  if (!force && key === lastDistKey) return; lastDistKey = key;
  const mkm = s * 149.6;
  const dTxt = mkm < 10 ? `${(Math.round(mkm * 10) / 10)} million km` : `${nf(Math.round(mkm))} million km`;
  $('dLbl').textContent = `Distance from the Sun: ${dTxt}`;
  if (!$('roDist')) return;
  $('roDist').textContent = `${dTxt} (${s < 10 ? Math.round(s * 10) / 10 : Math.round(s)} × Earth's distance)`;
  $('roLight').textContent = s < 0.002 ? '—' : lightTime(s);
  const n = nearestPlanet(s); $('roNear').textContent = n.name;
  $('roSpeed').textContent = state.flying ? `${nf(Math.round(flySpeed(s) * LIGHT_S_PER_AU))} times faster than light (impossible in real life!)` : 'stopped';
}
let toastTimer = 0;
function toast(html) { const t = $('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }
function startFly() {
  if (state.s >= 30.15) { state.s = 0; state.passed = -1; }
  state.passed = PLANETS.findIndex(p => p.au > state.s) - 1;
  state.flying = true; controls.enabled = false; goal.target = null;
  $('dFly').textContent = 'Pause';
}
function pauseFly() {
  state.flying = false; controls.enabled = true;
  $('dFly').textContent = state.s > 30.15 ? 'Fly again' : state.s > 0 ? 'Keep flying' : 'Fly to Neptune';
  updateDistReadouts(true);
}
function distJump(i) {
  if (state.mode !== 'dist') return;
  if (state.flying) pauseFly();
  const s = i < 0 ? 0 : Math.max(0, PLANETS[i].au - 0.05);
  state.s = s; $('dSl').value = Math.round(s * 100);
  state.passed = PLANETS.findIndex(p => p.au > s) - 1;
  const o = flyOff(); setGoal(flyTarget(s), o.length(), o);
  $('dFly').textContent = s > 0 ? 'Keep flying' : 'Fly to Neptune';
  if (i >= 0) { const p = PLANETS[i]; toast(`${p.name}: ${nf(p.mkm)} million km from the Sun. Light takes ${lightTime(p.au)} to get there.`); }
  updateDistReadouts(true);
}
function distOverview(instant = false) {
  if (state.flying) pauseFly();
  const w = 38 * K, len = fitLen(w, w * 0.55), t = new THREE.Vector3(13 * K, 0, 0);
  const dir = new THREE.Vector3(0, 0.8, 0.6);
  if (instant) placeNow(t, dir, len); else setGoal(t, len, dir);
}
$('dFly').addEventListener('click', () => {
  if (state.flying) { pauseFly(); return; }
  if (state.s >= 30.15) { state.s = 0; }
  // glide into the cockpit view first, then go
  flyCam(state.s); startFly();
});
$('dSl').addEventListener('input', () => {
  if (state.flying) pauseFly();
  state.s = +$('dSl').value / 100; goal.target = null;
  state.passed = PLANETS.findIndex(p => p.au > state.s) - 1;
  flyCam(state.s); controls.update();
  $('dFly').textContent = state.s > 30.15 ? 'Fly again' : state.s > 0 ? 'Keep flying' : 'Fly to Neptune';
  updateDistReadouts(true);
});
$('dAll').addEventListener('click', () => distOverview());

// ---------------- Planet Predictor ----------------
const PX_MIN = 0.25, PX_MAX = 40;
const sl2au = v => PX_MIN * Math.pow(PX_MAX / PX_MIN, v / 1000);
const au2sl = a => Math.round(1000 * Math.log(a / PX_MIN) / Math.log(PX_MAX / PX_MIN));
const xTemp = au => Math.round((288 / Math.sqrt(au) - 273) / 10) * 10;      // rough: no atmosphere blanket, set so Earth comes out at 15 °C
const xYear = au => Math.pow(au, 1.5);                                       // Kepler's pattern
function neighbours(au) {
  let inner = null, outer = null;
  for (const p of PLANETS) { if (p.au <= au) inner = p; else if (!outer) outer = p; }
  return { inner, outer };
}
function betweenText(au) {
  const { inner, outer } = neighbours(au);
  if (!inner) return `closer to the Sun than ${outer.name}`;
  if (!outer) return `further from the Sun than ${inner.name}`;
  return `between ${inner.name} and ${outer.name}`;
}
function chartSVG() {
  const items = PLANETS.map(p => ({ n: p.name.slice(0, 3), t: p.tempC, c: p.colour, au: p.au }));
  items.push({ n: 'X', t: xTemp(state.xAU), c: '#c38cf0', au: state.xAU, x: true });
  items.sort((a, b) => a.au - b.au);
  const W = 300, top = 16, H = 120, lo = -250, hi = 500, y0 = top + H * hi / (hi - lo), bw = W / items.length;
  const y = t => top + H * (hi - t) / (hi - lo);
  let s = `<svg class="chart" viewBox="0 0 ${W} 168" role="img" aria-label="Bar chart of average temperature for each planet, in order from the Sun">`;
  s += `<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#a3b5ca" stroke-width="1"/>`;
  s += `<text x="2" y="${y0 - 3}" font-size="8" fill="#a3b5ca">0 °C</text>`;
  items.forEach((it, i) => {
    const cx = i * bw + bw / 2, hide = it.x && !state.revealed;
    if (!hide) {
      const yt = y(it.t), yy = Math.min(yt, y0), hh = Math.max(1.5, Math.abs(yt - y0));
      s += `<rect x="${cx - bw * 0.32}" y="${yy}" width="${bw * 0.64}" height="${hh}" rx="2" fill="${it.c}"${it.x ? ' stroke="#fff" stroke-width="1.5"' : ''}/>`;
      s += `<text x="${cx}" y="${it.t >= 0 ? yy - 3 : yy + hh + 9}" font-size="8.5" fill="#e9f1f9" text-anchor="middle">${it.t}</text>`;
    } else {
      s += `<text x="${cx}" y="${y0 - 6}" font-size="14" fill="#c38cf0" text-anchor="middle">?</text>`;
    }
    s += `<text x="${cx}" y="164" font-size="9" fill="${it.x ? '#c38cf0' : '#a3b5ca'}" text-anchor="middle">${it.n}</text>`;
  });
  return s + `</svg>`;
}
function renderPredictInfo() {
  const au = state.xAU, mkm = au * 149.6;
  infoTitle.textContent = 'Planet Predictor';
  infoBody.innerHTML = `<p>Scientists have spotted a new planet, Planet X. Look at the <b>patterns</b> in the real planets, then <b>predict</b> what Planet X is like.</p>`;
  setReadouts([
    ['Distance from the Sun', `${nf(Math.round(mkm))} million km (${au < 10 ? Math.round(au * 10) / 10 : Math.round(au)} × Earth's distance)`],
    ['Where is it?', betweenText(au)],
  ]);
  const q = (id, text, a, b, val) => `<h3>${text}</h3><div class="opts" data-q="${id}">
      <button type="button" data-v="${a.toLowerCase()}" aria-pressed="${val === a.toLowerCase()}">${a}</button>
      <button type="button" data-v="${b.toLowerCase()}" aria-pressed="${val === b.toLowerCase()}">${b}</button></div>`;
  let html = q('T', 'Will it be hotter or colder than Earth?', 'Hotter', 'Colder', state.guessT)
           + q('Y', "Will its year be longer or shorter than Earth's?", 'Longer', 'Shorter', state.guessY);
  if (state.revealed) {
    const T = xTemp(au), Y = xYear(au), close = Math.abs(au - 1) < 0.04;
    const tRight = au < 1 ? 'hotter' : 'colder', yRight = au < 1 ? 'shorter' : 'longer';
    const mark = (g, right) => close ? `<b class="close">It is so close to Earth's distance that either answer is fair.</b>`
      : !g ? '' : g === right ? `<b class="good">You predicted ${g}. Well done!</b>` : `<b class="close">You predicted ${g}. Have another look at the pattern.</b>`;
    const { inner, outer } = neighbours(au);
    const nb = [inner, outer].filter(Boolean).map(p => `${p.name}: ${p.temp.split(' (')[0]}, year ${p.year}`).join('<br>');
    html += `<h3>What scientists would expect</h3>
      <p class="verdict">Year: <b>${yearText(Y)}</b><br>${mark(state.guessY, yRight)}</p>
      <p class="verdict">Temperature: <b>about ${T} °C</b><br>${mark(state.guessT, tRight)}</p>
      <p class="note">Its neighbours:<br>${nb}</p>`;
  }
  html += `<h3>Average temperature of each planet (°C), in order from the Sun</h3>${chartSVG()}
    <p class="note">Look at Venus! It breaks the pattern. It is further away than Mercury but hotter, because its thick <b>atmosphere</b> (layer of gas) traps heat like a blanket. A planet's temperature depends on its atmosphere as well as its distance from the Sun.</p>`;
  infoExtra.innerHTML = html;
}
infoExtra.addEventListener('click', e => {
  const b = e.target.closest('.opts button'); if (!b) return;
  const q = b.parentElement.dataset.q;
  if (q === 'T') state.guessT = b.dataset.v; else state.guessY = b.dataset.v;
  renderPredictInfo();
});
function setX(au, fromSlider) {
  state.xAU = au; state.revealed = false; state.guessT = state.guessY = null;
  if (!fromSlider) $('pSl').value = au2sl(au);
  $('pLbl').textContent = `Planet X distance: ${nf(Math.round(au * 149.6))} million km`;
  $('pReveal').textContent = 'Reveal';
  renderPredictInfo();
  if (state.mode === 'predict') setGoal(new THREE.Vector3(0, 0, 0), orbitHomeLen(Math.max(orbitR(30.07), orbitR(au))), HOME_DIR);
}
$('pSl').addEventListener('input', () => setX(sl2au(+$('pSl').value), true));
$('pReveal').addEventListener('click', () => {
  state.revealed = !state.revealed;
  $('pReveal').textContent = state.revealed ? 'Hide answers' : 'Reveal';
  renderPredictInfo();
  if (state.revealed && narrow) $('info').open = true;
});
const xRnd = seeded(Date.now() % 100000);
$('pNew').addEventListener('click', () => {
  let au; do { au = sl2au(xRnd() * 1000); } while (Math.abs(au - 1) < 0.15 || PLANETS.some(p => Math.abs(Math.log(p.au / au)) < 0.12));
  setX(au);
});

// ---------------- Modes ----------------
const NOTES = {
  orbits: 'Not to scale: sizes and distances are squashed so everything fits.',
  sizes: 'Sizes are to scale. The gaps between the planets are not.',
  dist: 'Distances are to scale. The dots are far bigger than the real planets.',
  predict: 'Not to scale. Planet X is made up.',
};
function setMode(m) {
  if (state.flying) pauseFly();
  state.mode = m;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  document.querySelectorAll('.grp').forEach(g => { g.hidden = g.dataset.for !== m; });
  orbitGroup.visible = m === 'orbits' || m === 'predict';
  X.holder.visible = X.orbit.visible = m === 'predict';
  sizesGroup.visible = m === 'sizes';
  distGroup.visible = m === 'dist';
  controls.enabled = true;
  $('toast').hidden = true;
  $('scaleNote').textContent = NOTES[m];
  if (m === 'orbits' || m === 'predict') {
    camera.fov = 45; camera.updateProjectionMatrix();
    controls.minDistance = 2.5; controls.maxDistance = 320;
    if (m === 'orbits') {
      state.focus = null; $('oAll').hidden = true;
      placeNow(new THREE.Vector3(0, 0, 0), HOME_DIR, orbitHomeLen(orbitR(30.07)));
      renderOrbitsInfo();
    } else {
      placeNow(new THREE.Vector3(0, 0, 0), HOME_DIR, orbitHomeLen(Math.max(orbitR(30.07), orbitR(state.xAU))));
      renderPredictInfo();
    }
  } else if (m === 'sizes') {
    camera.fov = 30; camera.updateProjectionMatrix();
    controls.minDistance = 1.5; controls.maxDistance = 2000;
    sizesGo(state.sizeStep, true);
  } else {
    camera.fov = 45; camera.updateProjectionMatrix();
    controls.minDistance = 0.5; controls.maxDistance = 3000;
    if (state.s > 0) { flyCam(state.s); controls.update(); } else distOverview(true);
    renderDistInfo();
  }
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// ---------------- Tap to choose ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (state.mode === 'orbits' && goal.target && typeof goal.target !== 'function') goal.target = null;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 500; down = null;
  if (moved > 8 || !quick) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables[state.mode] || [], false)[0];
  if (hit && hit.object.userData.onPick) hit.object.userData.onPick();
});

// ---------------- Resize ----------------
const hdr = $('hdr'), ctl = $('controls');
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  document.documentElement.style.setProperty('--ctl', ctl.offsetHeight + 'px');
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe(ctl);
new ResizeObserver(resize).observe(hdr);
resize();

// ---------------- Start ----------------
if (narrow) $('info').open = false;
state.xAU = 2.8; $('pSl').value = au2sl(state.xAU);
$('pLbl').textContent = `Planet X distance: ${nf(Math.round(state.xAU * 149.6))} million km`;
setMode('orbits');

// ---------------- Animation loop ----------------
const clock = new THREE.Clock();
let lastDate = '';
renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), 0.05)));
function frame(dt) {
  if (state.mode === 'orbits' && state.playing) state.simYears += dt * speedYPS();
  if (state.mode === 'predict') { state.simYears += dt * 0.2; state.xAngle += dt * 0.2 * TAU / xYear(state.xAU); }
  if (orbitGroup.visible) placeOrbits();
  for (const s of spinners) s.mesh.rotation.y += dt * s.rate;

  if (state.mode === 'orbits') {
    const d = fmtDate(state.simYears);
    if (d !== lastDate && $('roDate')) { $('roDate').textContent = d; lastDate = d; }
  }
  if (state.mode === 'dist') {
    if (state.flying) {
      const prev = state.s;
      state.s = Math.min(30.2, state.s + flySpeed(state.s) * dt);
      flyCam(state.s);
      $('dSl').value = Math.round(state.s * 100);
      PLANETS.forEach((p, i) => {
        if (prev < p.au && state.s >= p.au) {
          state.passed = i;
          toast(`Passing ${p.name}: ${nf(p.mkm)} million km from the Sun.<br>Light from the Sun takes ${lightTime(p.au)} to get here.`);
        }
      });
      if (state.s >= 30.2) { pauseFly(); toast('You reached Neptune! Even light takes about 4 hours to make this journey.'); }
    }
    ship.position.x = state.s * K;
    updateDistReadouts(false);
  }
  stepGoal(dt);
  if (!state.flying) controls.update();
  renderer.render(scene, camera);
  updateLabels();
}
</script>
