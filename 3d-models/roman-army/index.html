<style>
  /* Layout: full-screen 3D scene; WFA-blue header with three tabs; info card top-left;
     a hint line and the controls floating at the bottom. Light and dark palettes. */
  :root {
    --bg: #ecf2f6;
    --panel: rgba(255, 255, 255, 0.95);
    --edge: #c6d8e4;
    --fg: #11212b;
    --muted: #4d6372;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --btn: #1798d3;
    --on-btn: #ffffff;
    --press: #dff0fa;
    --roman: #a3261f;
    --ask-bg: #fff4dc;
    --ask-edge: #e0b252;
    --lbl-bg: rgba(255, 255, 255, 0.93);
    --lbl-fg: #11212b;
    --shadow: rgba(16, 50, 70, 0.16);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --ctl: 70px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1c24; --panel: rgba(22, 37, 48, 0.95); --edge: #2c4555; --fg: #e8f1f6; --muted: #9fb4c3;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --roman: #ff8a7a; --ask-bg: #2e2612; --ask-edge: #8a6a22;
    --lbl-bg: rgba(15, 28, 36, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1c24; --panel: rgba(22, 37, 48, 0.95); --edge: #2c4555; --fg: #e8f1f6; --muted: #9fb4c3;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --roman: #ff8a7a; --ask-bg: #2e2612; --ask-edge: #8a6a22;
    --lbl-bg: rgba(15, 28, 36, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45); color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand > span { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .02em; }
  .short { display: none; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--on-blue); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #ffffff; color: #0f6d99; border-color: #ffffff; }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(360px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; min-height: 28px; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  .info p.piece { border-left: 4px solid var(--roman); padding-left: 10px; }
  .info p.ask { background: var(--ask-bg); border: 1px solid var(--ask-edge); border-radius: 10px; padding: 8px 10px; }
  .info b { color: var(--blue); }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }

  .say {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); margin: 0;
    bottom: calc(var(--ctl) + 32px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: min(600px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 16px;
    font-weight: 800; font-size: 15px; line-height: 1.35; text-align: center; text-wrap: balance;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .say:empty { display: none; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(820px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--btn); background: var(--btn); color: var(--on-btn);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.ghost[aria-pressed="true"] { background: var(--press); border-color: var(--btn); }
  .controls button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  /* Labels sit above the point they name, with a short stem */
  .lw { display: flex; flex-direction: column; align-items: center; transform: translateY(-50%); }
  .lbl {
    font: 800 13px var(--font); background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--edge);
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px var(--shadow);
  }
  .lbl.hot { background: var(--roman); color: #ffffff; border-color: transparent; }
  .stem { width: 2px; height: 10px; background: var(--lbl-fg); opacity: .55; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }
  .oops { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 11px; }
    .controls button { font-size: 14px; padding: 6px 12px; }
    .controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
    .say { font-size: 14px; }
    .lbl { font-size: 12px; padding: 2px 8px; }
    footer .tip { display: none; }
    .long { display: none; }
    .short { display: inline; }
    .tabs { gap: 5px; }
    .tabs button { padding: 5px 10px; }
  }
</style>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Roman Army</h1>
    <span>Year 5 History · <span class="long">The Roman Empire and its Impact on Britain</span><span class="short">The Roman Empire</span></span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Choose a model">
    <button role="tab" data-tab="kit" aria-selected="true">Legionary kit</button>
    <button role="tab" data-tab="testudo" aria-selected="false">Testudo</button>
    <button role="tab" data-tab="battle" aria-selected="false"><span class="long">Boudicca's last battle</span><span class="short">Boudicca's battle</span></button>

  <summary id="infoTitle">What did a legionary carry?</summary>

<div class="controls" id="controls">
  <button type="button" data-for="kit" id="nextPieceBtn">Next piece ▶</button>
  <button type="button" data-for="kit" id="equipBtn" class="ghost">Take the kit off</button>
  <button type="button" data-for="kit" id="skinBtn" class="ghost">Another soldier</button>
  <button type="button" data-for="kit" id="spinBtn" class="ghost" aria-pressed="true">Turn</button>
  <button type="button" data-for="testudo" id="formBtn">Make a testudo</button>
  <button type="button" data-for="testudo" id="fireBtn">Fire arrows</button>
  <button type="button" data-for="testudo" id="marchBtn" class="ghost" aria-pressed="false">March forward</button>
  <button type="button" data-for="testudo" id="tResetBtn" class="ghost">Start again</button>
  <button type="button" data-for="battle" id="prevBtn" class="ghost">◀ Back</button>
  <button type="button" data-for="battle" id="nextBtn">Next ▶</button>
  <button type="button" data-for="battle" id="againBtn" class="ghost">Start again</button>
  <button type="button" data-for="kit testudo battle" id="labelsBtn" class="ghost" aria-pressed="true">Labels</button>
</div>

<footer><span class="tip">Drag to turn · pinch or scroll to zoom · </span>Wallscourt Farm Academy · Y5-17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = s => document.querySelector(s);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const UP = V(0, 1, 0);

// ---------------- Renderer, camera, labels ----------------
const wrap = $('#scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="oops">Sorry, this device cannot show 3D models.</div>');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = 'labels';
wrap.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 - 0.06;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a5a, 1.15));
const sun = new THREE.DirectionalLight(0xfff3df, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
function setSun(range, pos, target = V(0, 0, 0)) {
  sun.position.copy(pos).add(target); sun.target.position.copy(target);
  const c = sun.shadow.camera;
  c.left = c.bottom = -range; c.right = c.top = range; c.near = 0.5; c.far = range * 6;
  c.updateProjectionMatrix();
}

// ---------------- Canvas textures (no image files) ----------------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
function speckle(g, w, h, rnd, n, dark, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(${dark},${0.05 + rnd() * 0.14})` : `rgba(${light},${0.05 + rnd() * 0.12})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
  }
}
// Grass with a soft edge, so the page colour shows beyond it
function grassDisc(seed, earth) {
  return canvasTex(512, 512, (g, w, h) => {
    const rnd = seeded(seed);
    g.fillStyle = '#86a95c'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, rnd, 30000, '40,70,20', '200,220,140');
    if (earth) { g.fillStyle = 'rgba(176,150,105,0.5)'; g.fillRect(w * 0.42, 0, w * 0.16, h); }
    g.globalCompositeOperation = 'destination-in';
    const r = g.createRadialGradient(w / 2, h / 2, w * 0.32, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
}
// Red shield with yellow border, wings and thunderbolts (a common legion design)
const shieldTex = canvasTex(256, 384, (g, w, h) => {
  g.fillStyle = '#a3201b'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#e8b93a'; g.lineWidth = 9; g.strokeRect(14, 14, w - 28, h - 28);
  g.fillStyle = '#e8b93a'; g.strokeStyle = '#e8b93a'; g.lineWidth = 7; g.lineJoin = 'round';
  const cx = w / 2, cy = h / 2;
  for (const s of [-1, 1]) {
    // wings
    g.beginPath(); g.moveTo(cx + s * 34, cy - 10);
    g.quadraticCurveTo(cx + s * 95, cy - 70, cx + s * 100, cy - 20);
    g.quadraticCurveTo(cx + s * 70, cy - 30, cx + s * 34, cy + 6); g.fill();
    // thunderbolts up and down
    for (const v of [-1, 1]) {
      g.beginPath(); g.moveTo(cx + s * 8, cy + v * 40);
      g.lineTo(cx + s * 26, cy + v * 85); g.lineTo(cx + s * 10, cy + v * 95); g.lineTo(cx + s * 34, cy + v * 150);
      g.stroke();
    }
  }
  const rnd = seeded(4); speckle(g, w, h, rnd, 3000, '60,10,5', '255,200,180');
});
const loricaTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = '#a5acb3'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16) { g.fillStyle = '#6f767d'; g.fillRect(0, y, w, 3); g.fillStyle = '#c9cfd4'; g.fillRect(0, y + 3, w, 2); }
});
const strapTex = canvasTex(64, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.strokeStyle = '#6b4626'; g.lineWidth = 7;
  for (let i = -2; i < 4; i++) { g.beginPath(); g.moveTo(i * 22, 0); g.lineTo(i * 22 + 40, h); g.stroke(); g.beginPath(); g.moveTo(i * 22 + 40, 0); g.lineTo(i * 22, h); g.stroke(); }
});
strapTex.repeat.set(2, 1);
const woodTex = canvasTex(128, 32, (g, w, h) => {
  const rnd = seeded(3); g.fillStyle = '#8d6236'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) { g.fillStyle = `rgba(50,30,10,${0.15 + rnd() * 0.25})`; g.fillRect(0, rnd() * h, w, 1 + rnd() * 1.5); }
});

const M = (color, rough = 0.8, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const IRON = () => M(0x9ca3aa, 0.38, 0.55);
const BRASS = () => M(0xc9a447, 0.35, 0.6);

// ---------------- Labels ----------------
const labels = [];
function addLabel(parent, text, pos, show, hot = false) {
  const outer = document.createElement('div');
  const inner = document.createElement('div'); inner.className = 'lw';
  const tag = document.createElement('span'); tag.className = 'lbl' + (hot ? ' hot' : ''); tag.textContent = text;
  const stem = document.createElement('span'); stem.className = 'stem';
  inner.append(tag, stem); outer.append(inner);
  const o = new CSS2DObject(outer);
  o.position.copy(pos); parent.add(o);
  const L = { o, show, tag };
  labels.push(L);
  return L;
}
const shownUp = o => { for (let p = o.parent; p; p = p.parent) if (!p.visible) return false; return true; };

function limb(a, b, r, mat, parent, r2 = r * 0.9, seg = 10) {
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r2, len, seg), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
  m.castShadow = true; parent.add(m); return m;
}
function add(parent, geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; parent.add(m); return m;
}

const SKINS = ['#c68a5e', '#f0c6a3', '#7f4e2f', '#e0ac83', '#a86d45', '#5b3720'];
const HAIRS = ['#2b1d14', '#5a3b22', '#141010', '#3a2a1c', '#1c1410', '#0f0b09'];

// =====================================================================
//  TAB 1: LEGIONARY KIT
// =====================================================================
const kitG = new THREE.Group(); scene.add(kitG);
{
  const ground = new THREE.Mesh(new THREE.CircleGeometry(5.5, 64), new THREE.MeshStandardMaterial({ map: grassDisc(5, false), transparent: true, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.07; ground.receiveShadow = true; kitG.add(ground);
}
const stage = new THREE.Group(); kitG.add(stage);
{
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 2.0, 0.07, 64), M(0xcdbf9f, 0.9));
  disc.position.y = -0.035; disc.receiveShadow = true; stage.add(disc);
}
const skinMat = M(SKINS[0], 0.7), hairMat = M(HAIRS[0], 0.9), tunicMat = M(0xa3261f, 0.85), beltMat = M(0x5a3a1e, 0.8);
// ---- the soldier's body (stays put) ----
const body = new THREE.Group(); stage.add(body);
{
  for (const s of [-1, 1]) {
    limb(V(s * 0.1, 0.03, 0), V(s * 0.1, 0.62, 0), 0.065, skinMat, body);
    add(body, new THREE.BoxGeometry(0.1, 0.06, 0.22), skinMat, s * 0.1, 0.03, 0.04);
  }
  add(body, new THREE.CylinderGeometry(0.2, 0.25, 0.44, 18), tunicMat, 0, 0.78, 0);
  add(body, new THREE.CylinderGeometry(0.2, 0.2, 0.5, 18), tunicMat, 0, 1.22, 0);
  const sh = add(body, new THREE.SphereGeometry(0.2, 18, 10), tunicMat, 0, 1.45, 0); sh.scale.set(1.25, 0.5, 0.9);
  limb(V(0, 1.45, 0), V(0, 1.57, 0), 0.055, skinMat, body);
  add(body, new THREE.SphereGeometry(0.105, 20, 14), skinMat, 0, 1.64, 0);
  add(body, new THREE.BoxGeometry(0.03, 0.05, 0.04), skinMat, 0, 1.63, 0.1);
  for (const s of [-1, 1]) add(body, new THREE.SphereGeometry(0.012, 8, 6), M(0x1a1410), s * 0.035, 1.665, 0.094, false);
  const hair = add(body, new THREE.SphereGeometry(0.11, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), hairMat, 0, 1.655, -0.012); hair.scale.set(1, 0.95, 1.02);
  // arms: right (soldier's right is -x) holds the pilum; left holds the shield
  const arm = (S, E, H) => { limb(S, E, 0.055, skinMat, body); limb(S, S.clone().lerp(E, 0.45), 0.066, tunicMat, body); limb(E, H, 0.05, skinMat, body); add(body, new THREE.SphereGeometry(0.05, 12, 8), skinMat, H.x, H.y, H.z); };
  arm(V(-0.25, 1.42, 0), V(-0.31, 1.17, 0.04), V(-0.34, 1.0, 0.15));
  arm(V(0.25, 1.42, 0), V(0.31, 1.2, 0.14), V(0.22, 1.06, 0.3));
  // belt (cingulum) with a hanging apron of studded straps
  const belt = add(body, new THREE.TorusGeometry(0.206, 0.024, 8, 32), beltMat, 0, 0.99, 0); belt.rotation.x = Math.PI / 2;
  for (let i = 0; i < 4; i++) {
    const x = -0.06 + i * 0.04, st = add(body, new THREE.BoxGeometry(0.022, 0.22, 0.01), beltMat, x, 0.88, 0.235);
    st.rotation.x = -0.08;
    for (let k = 0; k < 4; k++) add(body, new THREE.SphereGeometry(0.008, 6, 4), BRASS(), x, 0.95 - k * 0.05, 0.243, false);
  }
}

// ---- the kit: each piece has a "worn" place and a "laid out" place ----
const PIECES = {
  galea: { name: 'Helmet', latin: 'galea', made: 'Iron, with brass trim',
    job: 'Cheek guards protected the sides of the face. The wide guard at the back protected the neck from blows from above.' },
  lorica: { name: 'Strip armour', latin: 'lorica segmentata', made: 'Strips of iron joined by leather straps',
    job: 'The strips slid over each other, so the soldier could bend and twist. Many soldiers wore mail armour, made of tiny iron rings, instead.' },

      <p class="ask"><b>Do you trust these numbers?</b> Why might a Roman writer want the British army to seem huge and Roman losses to seem small? What might a Briton have said?</p>
      <p class="note">After the revolt, the Romans ruled Britain more carefully. <b>Romanisation</b> (Roman towns, roads and ways of life) spread across the south.</p>` },
];
const TEXT = {
  kit: { title: 'What did a legionary carry?',
    body: () => {
      const sel = kit.sel ? `<p class="piece"><b>${PIECES[kit.sel].name} (${PIECES[kit.sel].latin}).</b> ${PIECES[kit.sel].job}</p>` : '';
      return `<p>A <b>legionary</b> was a soldier in a Roman legion. Legionaries had to be Roman citizens, and they signed up for 20 to 25 years.</p>${sel}
        <p class="note">On the march, a legionary carried his armour, weapons and pack. Historians think this was about 30 kg or more: about the weight of a Year 5 child! Roman writers say soldiers trained to march about 30 km in five hours.</p>
        <p class="note"><b>Auxiliaries</b> fought alongside the legions. They came from all over the empire. At Vindolanda, near Hadrian's Wall, soldiers came from what are now Belgium and the Netherlands. Archers from Syria and a unit from North Africa also served on the Wall. After about 25 years, auxiliaries became Roman citizens.</p>`;
    } },
  testudo: { title: 'How did the testudo work?',
    body: () => `<p><b>Testudo</b> is Latin for tortoise. Soldiers packed tightly together and locked their shields. The front row held them in front, the outside rows held them at the sides, and everyone in the middle held theirs over their heads.</p>
      <p>It was used to get close to a wall or a gate while the enemy threw arrows, stones and spears down from above.</p>
      <p><b>Its weaknesses:</b> it was very slow, and soldiers could hardly fight from inside it. Once they reached the wall, they had to break formation.</p>
      <p class="note">The testudo is carved on Trajan's Column in Rome, and Roman writers describe it being used to attack town walls and forts.</p>` },
  battle: { title: "Boudicca's last battle",
    body: () => STEP_TEXT[bat.step].body + (bat.step < 5 ? `<p class="note">The model is not to scale. The site is unknown: it was probably beside Watling Street, the Roman road from London to the north-west.</p>` : '') },
};
function readouts() {
  if (ui.tab === 'kit') {
    const p = kit.sel && PIECES[kit.sel];
    return [['Kit', p ? `${p.name} (${p.latin})` : 'Tap a piece'], ['Made of', p ? p.made : '–']];
  }
  if (ui.tab === 'testudo') {
    return [['Formation', tes.form > 0.95 ? 'Testudo' : tes.form < 0.05 ? 'Marching block' : 'Changing…'], ['Speed', tes.form > 0.5 ? 'Very slow' : 'Marching pace'],
      ['Arrows stopped by shields', tes.blocked], ['Arrows that got through gaps', tes.through]];
  }
  return [['When', 'AD 60 or 61'], ['Where', 'Unknown, probably by Watling Street'], ['Romans', 'About 10,000 (Tacitus’s claim)'], ['Britons', 'Unknown: many more']];
}
function hint() {
  if (ui.tab === 'kit') {
    if (kit.dir) return '';
    if (kit.t > 0.98) return kit.sel && innerWidth < 640 ? `${PIECES[kit.sel].name}: ${PIECES[kit.sel].latin}` : 'All the kit is laid out. Tap a piece to find out what it was for.';
    return kit.sel ? `${PIECES[kit.sel].name}: ${PIECES[kit.sel].latin}` : 'Tap a piece of kit to find out what it was for.';
  }
  if (ui.tab === 'testudo') {
    if (tes.atWall) return 'At the wall! Now they must break formation to attack.';
    if (tes.form > 0.95) return 'Fire arrows at the testudo, or march it up to the wall.';
    if (tes.form < 0.05) return tes.through ? 'Arrows got through the gaps! Try making a testudo.' : 'Fire arrows at the marching block, then try a testudo.';
    return '';
  }
  return `Step ${bat.step + 1} of ${STEPS}: ${STEP_TEXT[bat.step].name}`;
}

// =====================================================================
//  UI
// =====================================================================
const ui = { tab: 'kit', labels: true };
let dirty = true, lastHint = null, lastBody = '';
function refresh() {
  dirty = false;
  const t = TEXT[ui.tab];
  $('#infoTitle').textContent = t.title;
  const b = t.body(); if (b !== lastBody) { $('#infoBody').innerHTML = b; lastBody = b; }
  $('#readouts').innerHTML = readouts().map(([a, v]) => `<dt>${a}</dt><dd>${v}</dd>`).join('');
  const h = hint();
  if (h !== lastHint) { $('#say').textContent = h; lastHint = h; }
  for (const btn of document.querySelectorAll('#controls button')) btn.hidden = !btn.dataset.for.split(' ').includes(ui.tab);
  $('#equipBtn').textContent = kit.t > 0.5 ? 'Put the kit on' : 'Take the kit off';
  $('#equipBtn').disabled = !!kit.dir;
  $('#spinBtn').setAttribute('aria-pressed', kit.spin);
  $('#formBtn').textContent = tes.form > 0.5 ? 'Back to marching' : 'Make a testudo';
  $('#formBtn').disabled = !!tes.dir;
  $('#marchBtn').setAttribute('aria-pressed', tes.marching);
  $('#marchBtn').textContent = tes.marching ? 'Stop' : 'March forward';
  $('#marchBtn').disabled = tes.atWall;
  $('#prevBtn').disabled = bat.step === 0;
  $('#nextBtn').disabled = bat.step === STEPS - 1;
  $('#labelsBtn').setAttribute('aria-pressed', ui.labels);
  for (const btn of document.querySelectorAll('.tabs button')) btn.setAttribute('aria-selected', btn.dataset.tab === ui.tab);
  layoutVars();
}
function setTab(tab) {
  ui.tab = tab;
  kitG.visible = tab === 'kit'; tesG.visible = tab === 'testudo'; batG.visible = tab === 'battle';
  if (tab === 'kit') setSun(4, V(3, 7, 5));
  else if (tab === 'testudo') setSun(16, V(9, 16, 10), V(0, 0, -4));
  else setSun(1, V(30, 50, 25));
  renderer.shadowMap.enabled = tab !== 'battle';
  scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  sun.castShadow = tab !== 'battle';
  controls.minDistance = tab === 'battle' ? 15 : tab === 'testudo' ? 4 : 2;
  controls.maxDistance = tab === 'battle' ? 160 : tab === 'testudo' ? 50 : 14;
  lastBody = '';
  dirty = true; refresh();
  userMoved = false;
  flyTo(homeView(tab));
}
for (const btn of document.querySelectorAll('.tabs button')) btn.addEventListener('click', () => setTab(btn.dataset.tab));
$('#nextPieceBtn').onclick = () => selectPiece(ORDER[(ORDER.indexOf(kit.sel) + 1) % ORDER.length]);
$('#equipBtn').onclick = () => { kit.dir = kit.t > 0.5 ? -1 : 1; dirty = true; };
$('#skinBtn').onclick = () => setSkin((kit.skin + 1) % SKINS.length);
$('#spinBtn').onclick = () => { kit.spin = !kit.spin; dirty = true; };
$('#formBtn').onclick = () => { tes.dir = tes.form > 0.5 ? -1 : 1; dirty = true; };
$('#fireBtn').onclick = fireArrows;
$('#marchBtn').onclick = () => { tes.marching = !tes.marching; dirty = true; };
$('#tResetBtn').onclick = resetTestudo;
$('#prevBtn').onclick = () => goStep(bat.step - 1);
$('#nextBtn').onclick = () => goStep(bat.step + 1);
$('#againBtn').onclick = () => { for (const u of units) { u.cur.copy(u.at[0]); u.a = u.alpha[0]; } bat.step = 0; bat.t = 1; bat.pila = []; bat.first = false; dirty = true; };
$('#labelsBtn').onclick = () => { ui.labels = !ui.labels; dirty = true; };

// Tap a piece of kit (a tap, not a drag)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; kit.dragging = true; });
addEventListener('pointerup', e => {
  kit.dragging = false;
  if (!downAt || ui.tab !== 'kit') { downAt = null; return; }
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved > 6 || e.target !== renderer.domElement) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  for (const hit of ray.intersectObjects(stage.children, true)) {
    let o = hit.object; while (o && !o.userData.kit) o = o.parent;
    if (o) { selectPiece(o.userData.kit); return; }
  }
});

// =====================================================================
//  CAMERA
// =====================================================================
let fly = null, userMoved = false;
function homeView(tab) {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  const hdr = $('#hdr').offsetHeight, bottom = $('#controls').offsetHeight + 80;
  const avail = Math.max(0.35, (h - hdr - bottom) / h);
  const tanF = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  let target, dir, needW, needH;
  if (tab === 'kit') { target = V(0, 1.0, 0); dir = V(-0.45, 0.3, 1); needW = aspect < 0.8 ? 3.9 : 4.2; needH = 2.5; }
  else if (tab === 'testudo') { target = aspect < 0.8 ? V(-2.2, 1.2, -3) : V(0, 1.2, -4.5); dir = V(0.62, 0.5, 1); needW = aspect < 0.8 ? 7.5 : 15; needH = aspect < 0.8 ? 12 : 9.5; }
  else { target = V(0, 1, -3); dir = V(0.2, 1.0, 0.95); needW = aspect < 0.8 ? 58 : 84; needH = 52; }
  const availW = Math.max(0.4, (w - 2 * sideShift()) / w);
  const d = Math.max((needH / 2) / tanF / avail, (needW / 2) / (tanF * aspect * availW));
  return { pos: target.clone().add(dir.normalize().multiplyScalar(d)), target };
}
function sideShift() {
  const info = $('#info');
  return innerWidth >= 700 && info.open ? (info.offsetWidth + 16) / 2 : 0;
}
function flyTo(v, instant = false) {
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); fly = null; return; }
  fly = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.target };
}
controls.addEventListener('start', () => { fly = null; userMoved = true; });
function updateFly(dt) {
  if (!fly) return;
  fly.t += dt / 1.3;
  const k = ease(fly.t);
  camera.position.lerpVectors(fly.p0, fly.p1, k);
  controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (fly.t >= 1) fly = null;
}

// ---------------- Resize and loop ----------------
function layoutVars() {
  document.documentElement.style.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
  document.documentElement.style.setProperty('--ctl', $('#controls').offsetHeight + 'px');
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  const hdr = $('#hdr').offsetHeight, bottom = $('#controls').offsetHeight + 80;
  camera.setViewOffset(w, h, -sideShift(), -(hdr - bottom) / 2, w, h);   // centre the model in the space between header and controls
  camera.updateProjectionMatrix();
  layoutVars();
  if (!userMoved && !fly) flyTo(homeView(ui.tab), true);
}
addEventListener('resize', resize);
$('#info').addEventListener('toggle', () => { resize(); if (!userMoved) flyTo(homeView(ui.tab)); });
if (innerWidth < 700) $('#info').open = false;

let clock = 0;
setSkin(0);
setTab('kit');
resize();
flyTo(homeView('kit'), true);
placeUnits();

function tick(dt) {
  clock += dt;
  kitUpdate(dt);
  tesUpdate(dt);
  if (batG.visible || !bat.first) batUpdate(dt);
  updateFly(dt);
  for (const L of BL) if (L.L.show()) L.L.o.position.copy(L.fn());
  for (const l of labels) l.o.visible = !!l.show() && shownUp(l.o);
  if (dirty || ui.tab === 'testudo' && (tes.dir || tes.marching)) refresh();
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
}
// TESTHOOK
let last = performance.now();
renderer.setAnimationLoop(now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; tick(dt); });
</script>

</html>
