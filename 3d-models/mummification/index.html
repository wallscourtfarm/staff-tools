<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="../../favicon.png">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mummification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen 3D scene; WFA-blue header; a day strip with the eight steps under the header;
     info card top-left; hint line and controls floating at the bottom. */
  :root {
    --bg: #f1ebe0;
    --panel: rgba(255, 255, 255, 0.95);
    --edge: #d9cdb8;
    --fg: #1f1a12;
    --muted: #6a5d48;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --btn: #1798d3;
    --on-btn: #ffffff;
    --press: #dff0fa;
    --gold: #b7791f;
    --day: #d08a2e;
    --lbl-bg: rgba(255, 255, 255, 0.93);
    --lbl-fg: #1f1a12;
    --shadow: rgba(60, 40, 10, 0.18);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --strip: 0px;
    --ctl: 70px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1b1610; --panel: rgba(34, 28, 20, 0.95); --edge: #4a3f2e; --fg: #f3ece0; --muted: #bfae92;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --gold: #e0a84a; --day: #e8a04a;
    --lbl-bg: rgba(27, 22, 16, 0.92); --lbl-fg: #f3ece0; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1b1610; --panel: rgba(34, 28, 20, 0.95); --edge: #4a3f2e; --fg: #f3ece0; --muted: #bfae92;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --gold: #e0a84a; --day: #e8a04a;
    --lbl-bg: rgba(27, 22, 16, 0.92); --lbl-fg: #f3ece0; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .02em; }

  /* Day strip with the eight steps */
  .strip {
    position: fixed; z-index: 2; top: calc(var(--hdr) + 10px); right: var(--gutter-r);
    width: min(520px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 12px 8px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .day-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-weight: 800; }
  .day-top b { font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .day-top span { font-size: 12px; color: var(--muted); }
  .day-bar { position: relative; height: 10px; margin-top: 4px; border-radius: 6px; background: var(--edge); overflow: hidden; }
  .day-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--day); border-radius: 6px; }
  .chips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 7px; }
  .chips button {
    font: inherit; font-weight: 800; font-size: 12px; min-height: 34px; padding: 2px 2px; border-radius: 10px; cursor: pointer;
    border: 1.5px solid var(--edge); background: transparent; color: var(--fg); line-height: 1.1;
  }
  .chips button i { display: block; font-style: normal; font-size: 10px; color: var(--muted); }
  .chips button[aria-current="step"] { background: var(--btn); border-color: var(--btn); color: var(--on-btn); }
  .chips button[aria-current="step"] i { color: var(--on-btn); opacity: .85; }
  .chips button.done { border-color: var(--day); }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(350px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; min-height: 28px; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  .info p.think { border-left: 4px solid var(--gold); padding-left: 10px; }
  .info ul { margin: 6px 0 0; padding-left: 20px; line-height: 1.45; }
  .info b { color: var(--blue); }
  .kchip { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--day); color: #1f1a12; margin-bottom: 2px; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }

  .say {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); margin: 0;
    bottom: calc(var(--ctl) + 32px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: min(600px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 16px;
    font-weight: 800; font-size: 15px; line-height: 1.35; text-align: center; text-wrap: balance;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .say:empty { display: none; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(720px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--btn); background: var(--btn); color: var(--on-btn);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.ghost[aria-pressed="true"] { background: var(--press); border-color: var(--btn); }
  .controls button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .lbl {
    font: 800 13px var(--font); background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--edge);
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px var(--shadow);
  }
  .lbl small { display: block; font-weight: 700; font-size: 11px; color: var(--muted); text-align: center; }
  .lbl.hot { background: var(--gold); color: #fff; border-color: transparent; }
  .lbl.hot small { color: #fff; opacity: .9; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }
  .oops { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }

  @media (max-width: 899px) {
    .strip { left: var(--gutter-l); right: var(--gutter-r); width: auto; }
    .info { top: calc(var(--hdr) + var(--strip) + 18px); max-height: calc(100% - var(--hdr) - var(--strip) - var(--ctl) - 116px); }
  }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .controls button { font-size: 14px; padding: 6px 12px; }
    .controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 8px; gap: 6px; }
    .say { font-size: 14px; }
    .lbl { font-size: 12px; padding: 2px 8px; }
    .lbl small { display: none; }
    .strip { padding: 6px 8px; }
    .chips { gap: 3px; }
    .chips button { font-size: 12px; min-height: 30px; }
    .chips button i { display: none; }
    footer .tip { display: none; }
  }
</style>
</head>
<body>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Mummification</h1>
    <span>Year 5 History · Ancient Egypt</span>
  </div>
</header>

<div class="strip" id="strip" aria-label="Steps and days">
  <div class="day-top"><b id="dayText">Day 1</b><span>Making a mummy took about 70 days</span></div>
  <div class="day-bar"><span class="day-fill" id="dayFill"></span></div>
  <div class="chips" id="chips"></div>
</div>

<details class="info" id="info" open>
  <summary id="infoTitle">Mummification</summary>
  <div id="infoBody"></div>
  <dl id="readouts"></dl>
</details>

<p class="say" id="say" aria-live="polite"></p>

<div class="controls" id="controls">
  <button type="button" id="backBtn" class="ghost">◀ Back</button>
  <button type="button" id="nextBtn">Next step ▶</button>
  <button type="button" id="againBtn" class="ghost">↺ Again</button>
  <button type="button" id="playBtn" class="ghost" aria-pressed="false">Play all</button>
  <button type="button" id="labelsBtn" class="ghost" aria-pressed="true">Labels</button>
</div>

<footer><span class="tip">Drag to turn · pinch or scroll to zoom · </span>Wallscourt Farm Academy · Y5-18.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = s => document.querySelector(s);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);          // how far p is through [a, b], 0 to 1
const sstep = (a, b, x) => ease(seg(x, a, b));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------- Renderer, camera, labels ----------------
const wrap = $('#scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<div class="oops">Sorry, this device cannot show 3D models.</div>'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;                       // used to wrap the bandages on from the feet up
wrap.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = 'labels';
wrap.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.2; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2 - 0.04;

scene.add(new THREE.HemisphereLight(0xfff8ec, 0x9a7d55, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.1);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
(function setSun(range, center, dir) {
  sun.target.position.copy(center);
  sun.position.copy(center).add(dir.normalize().multiplyScalar(range * 2.2));
  const c = sun.shadow.camera;
  c.left = c.bottom = -range; c.right = c.top = range; c.near = 0.5; c.far = range * 5;
  c.updateProjectionMatrix();
})(9, V(2.5, 0, 0), V(0.5, 1, 0.55));

// ---------------- Textures drawn in code ----------------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
function speckle(g, w, h, rnd, n, dark, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(${dark},${0.05 + rnd() * 0.14})` : `rgba(${light},${0.05 + rnd() * 0.12})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
  }
}
const sandTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = seeded(11);
  g.fillStyle = '#dcc08a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, rnd, 26000, '140,100,50', '255,240,200');
  g.globalCompositeOperation = 'destination-in';
  const r = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const sheetTex = canvasTex(128, 128, (g, w, h) => {          // plain linen sheet
  const rnd = seeded(22); g.fillStyle = '#f4eedf'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(150,130,95,${0.05 + rnd() * 0.06})`; g.fillRect(0, y, w, 1); }
  for (let x = 0; x < w; x += 3) { g.fillStyle = `rgba(150,130,95,${0.03 + rnd() * 0.05})`; g.fillRect(x, 0, 1, h); }
});
const bandTex = canvasTex(128, 128, (g, w, h) => {           // inner bandages: strips wound in one direction
  const rnd = seeded(23); g.fillStyle = '#ecdfc0'; g.fillRect(0, 0, w, h);
  g.lineWidth = 1.6;
  for (let k = -h; k < w + h; k += 11) { g.strokeStyle = `rgba(120,95,60,${0.3 + rnd() * 0.2})`; g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h * 0.5, h); g.stroke(); }
  speckle(g, w, h, rnd, 700, '120,95,60', '255,250,240');
});
bandTex.repeat.set(3, 9);
const band2Tex = canvasTex(128, 128, (g, w, h) => {          // outer bandages: criss-cross pattern
  const rnd = seeded(24); g.fillStyle = '#e3cfa6'; g.fillRect(0, 0, w, h);
  g.lineWidth = 2;
  for (let k = -h; k < w + h; k += 16) {
    g.strokeStyle = `rgba(110,80,45,${0.32 + rnd() * 0.15})`; g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke();
    g.beginPath(); g.moveTo(k + h, 0); g.lineTo(k, h); g.stroke();
  }
  speckle(g, w, h, rnd, 700, '110,80,45', '255,245,225');
});
band2Tex.repeat.set(3, 7);
const natronTex = canvasTex(256, 256, (g, w, h) => {         // white salt crystals
  const rnd = seeded(25); g.fillStyle = '#efece4'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, rnd, 9000, '170,165,150', '255,255,255');
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,255,255,${0.4 + rnd() * 0.5})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
});
natronTex.repeat.set(3, 2);
const stoneTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(26); g.fillStyle = '#d8ccb3'; g.fillRect(0, 0, w, h); speckle(g, w, h, rnd, 12000, '120,105,80', '255,250,235');
});
const woodTex = canvasTex(128, 32, (g, w, h) => {
  const rnd = seeded(19); g.fillStyle = '#9a6a3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(60,35,12,${0.2 + rnd() * 0.25})`; const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + rnd() * 4 - 2); g.stroke(); }
});
const matTex = canvasTex(128, 128, (g, w, h) => {            // woven reed mat
  g.fillStyle = '#c8a764'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) {
    g.fillStyle = ((x + y) / 16) % 2 ? 'rgba(120,85,35,.28)' : 'rgba(255,240,200,.18)';
    if (((x + y) / 16) % 2) g.fillRect(x, y + 2, 16, 12); else g.fillRect(x + 2, y, 12, 16);
  }
});
matTex.repeat.set(5, 4);
const basketTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#b08848'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 6) { g.fillStyle = 'rgba(90,60,20,.35)'; g.fillRect(0, y, w, 2); }
  for (let x = 0; x < w; x += 8) { g.fillStyle = 'rgba(255,230,180,.18)'; g.fillRect(x, 0, 3, h); }
});
basketTex.repeat.set(4, 1);
const rockTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(15); g.fillStyle = '#c9a777'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '120,85,45' : '240,215,170'},${0.12 + rnd() * 0.18})`; g.fillRect(0, rnd() * h, w, 2 + rnd() * 8); }
  speckle(g, w, h, rnd, 12000, '90,60,30', '250,230,190');
});
rockTex.repeat.set(2, 2);
const waterTex = canvasTex(256, 64, (g, w, h) => {
  const rnd = seeded(18); g.fillStyle = '#2f7fa8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 46; i++) { g.fillStyle = `rgba(220,240,255,${0.12 + rnd() * 0.3})`; g.fillRect(rnd() * w, rnd() * h, 10 + rnd() * 40, 1.5 + rnd() * 2); }
});
waterTex.repeat.set(6, 1);
const nemesTex = canvasTex(64, 64, (g, w, h) => {            // gold and blue stripes (headcloth)
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#1f4f8f' : '#e3b23c'; g.fillRect(0, i * 8, w, 8); }
});
// Coffin painting. u goes round the coffin (lid = 0.5 to 1, middle of lid = 0.75); v goes from feet (0) to head (1).
const coffinTex = canvasTex(256, 512, (g, w, h) => {
  const yOf = v => (1 - v) * h;
  g.fillStyle = '#6e3420'; g.fillRect(0, 0, w / 2, h);                                     // base: dark red
  g.fillStyle = '#d7a738'; for (let y = 20; y < h; y += 60) g.fillRect(0, y, w / 2, 6);
  g.fillStyle = '#d7a738'; g.fillRect(w / 2, 0, w / 2, h);                                 // lid: gold
  const cols = ['#1f4f8f', '#2f8f83', '#a33a2a'];
  for (let y = yOf(0.62), k = 0; y < yOf(0.1); y += 13, k++) {                           // feathered wings
    g.strokeStyle = cols[k % 3]; g.lineWidth = 5; g.beginPath();
    g.moveTo(w / 2, y); g.lineTo(w * 0.75, y + 18); g.lineTo(w, y); g.stroke();
  }
  for (let k = 0; k < 6; k++) { g.fillStyle = ['#1f4f8f', '#d7a738', '#a33a2a', '#2f8f83', '#d7a738', '#1f4f8f'][k]; g.fillRect(w / 2, yOf(0.7) + k * 7, w / 2, 7); } // collar
  for (let y = yOf(0.98), k = 0; y < yOf(0.7); y += 9, k++) {                            // headcloth stripes at the sides
    g.fillStyle = k % 2 ? '#1f4f8f' : '#e8bb46'; g.fillRect(w / 2, y, 34, 9); g.fillRect(w - 34, y, 34, 9);
  }
  g.fillStyle = '#e9bf55'; g.beginPath(); g.ellipse(w * 0.75, yOf(0.84), 27, 40, 0, 0, 7); g.fill();  // face
  g.fillStyle = '#1b1612';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(w * 0.75 + s * 11, yOf(0.87), 6, 3, 0, 0, 7); g.fill(); g.fillRect(w * 0.75 + s * 11 - 8, yOf(0.9), 16, 2.5); }
  g.fillStyle = '#a33a2a'; g.fillRect(w * 0.75 - 7, yOf(0.8), 14, 3);                      // mouth

// ---------------- Helpers for shapes ----------------
const matCache = new Map();
function M(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true, ...o }));
  return matCache.get(key);
}
function TM(map, color = '#ffffff', o = {}) { return new THREE.MeshStandardMaterial({ map, color, roughness: 0.9, ...o }); }
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const alongX = g => { g.rotateZ(Math.PI / 2); return g; };   // turn an upright shape so it lies along x
function lathe(points, segs = 24, phi0 = 0, phiLen = Math.PI * 2) {
  return new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), segs, phi0, phiLen);
}

}
const VIEWS = [
  () => view(V(0.2, 1.25, -0.4), V(0.25, 0.5, 1), 6.6, 3.4),
  () => view(V(1.35, 1.05, 0.45), V(0.15, 0.65, 1), 2.4, 1.3),
  () => view(V(0.35, 1.35, 0.1), V(0.12, 0.5, 1), 2.7, 1.5),
  () => view(V(1.2, 1.2, -0.6), V(0.2, 0.5, 1), 4.2, 2.3),
  () => view(V(-0.6, 1.0, -0.5), V(0.15, 0.7, 1), 4.0, 1.8),
  () => view(V(0.45, 1.3, 0.2), V(0.2, 0.55, 1), 3.4, 2.0),
  () => view(V(-0.2, 1.3, -0.3), V(0.12, 0.45, 1), 4.6, 2.5),
];
function homeView() {
  if (ui.step === 8) return ui.p < 0.6 ? view(V(2.2, 1.0, 0.05), V(0.12, 0.55, 1), 6.4, 2.3) : view(V(6.85, 1.1, -0.3), V(-0.4, 0.2, 1), 3.4, 2.6);
  return VIEWS[ui.step - 1]();
}
function flyTo(v, instant = false) {
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); fly = null; return; }
  fly = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.target };
}
controls.addEventListener('start', () => { fly = null; userMoved = true; });
function updateFly(dt) {
  if (!fly) return;
  fly.t += dt / 1.4; const k = ease(fly.t);
  camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (fly.t >= 1) fly = null;
}
function goHome() { userMoved = false; flyTo(homeView()); }

// =====================================================================
//  UI
// =====================================================================
function infoHTML(S) {
  return S.p.map(x => typeof x === 'string' ? `<p>${x}</p>`
    : x.note ? `<p class="note">${x.note}</p>`
    : x.think ? `<p class="think">${x.think}</p>`
    : `<ul>${x.list.map(li => `<li>${li}</li>`).join('')}</ul>`).join('');
}
let lastInfo = -1, lastSay = '';
function refresh() {
  dirty = false;
  const S = STEPS[ui.step - 1], day = S.day(ui.p);
  if (lastInfo !== ui.step) {
    lastInfo = ui.step;
    $('#infoTitle').textContent = S.q;
    $('#infoBody').innerHTML = `<span class="kchip">Step ${ui.step} of 8</span>` + infoHTML(S);
  }
  $('#readouts').innerHTML = [['Day', day === 70 ? 'about 70' : (day === 1 ? '1' : 'about ' + day)], ...S.rows].map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  $('#dayText').textContent = day === 70 ? 'Day 70' : 'Day ' + day;
  $('#dayFill').style.width = (day / 70 * 100) + '%';
  let say = S.say(ui.p);
  if (ui.jar >= 0) { const J = JARS[ui.jar]; say = `${J.name}, the ${J.who} son of Horus, guarded the ${J.organ}.`; }
  if (say !== lastSay) { $('#say').textContent = say; lastSay = say; }
  for (const b of document.querySelectorAll('#chips button')) {
    const n = +b.dataset.s;
    if (n === ui.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', n < ui.step);
  }
  JARS.forEach((J, i) => J.lbl.element.classList.toggle('hot', ui.jar === i));
  $('#backBtn').disabled = ui.step === 1;
  $('#nextBtn').disabled = ui.step === 8;
  $('#playBtn').textContent = ui.playing ? 'Stop' : 'Play all';
  $('#playBtn').setAttribute('aria-pressed', ui.playing);
  $('#labelsBtn').setAttribute('aria-pressed', ui.labels);
  layoutVars();
}
function goStep(n, keepPlaying = false) {
  ui.step = clamp(n, 1, 8); ui.p = 0; ui.animating = true; ui.wait = 0; ui.jar = -1;
  if (!keepPlaying) ui.playing = false;
  dirty = true; refresh(); goHome();
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goStep(+b.dataset.s); });
$('#backBtn').onclick = () => goStep(ui.step - 1);
$('#nextBtn').onclick = () => goStep(ui.step + 1);
$('#againBtn').onclick = () => goStep(ui.step);
$('#playBtn').onclick = () => {
  if (ui.playing) { ui.playing = false; dirty = true; return; }
  ui.playing = true; goStep(ui.step === 8 && !ui.animating ? 1 : ui.step, true);
};
$('#labelsBtn').onclick = () => { ui.labels = !ui.labels; dirty = true; };

// Tap a jar to see which son of Horus guards it
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(JARS.map(J => J.g), true)[0];
  if (hit) {
    let o = hit.object; while (o && o.userData.jar === undefined && o.parent) o = o.parent;
    const i = JARS.findIndex(J => { let q = hit.object; while (q) { if (q === J.g) return true; q = q.parent; } return false; });
    ui.jar = ui.jar === i ? -1 : i; dirty = true;
  }
});

// ---------------- Resize and loop ----------------
function layoutVars() {
  const r = document.documentElement.style;
  r.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
  r.setProperty('--strip', $('#strip').offsetHeight + 'px');
  r.setProperty('--ctl', $('#controls').offsetHeight + 'px');
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  const top = topSpace(), bottom = $('#controls').offsetHeight + 80;
  camera.setViewOffset(w, h, -sideShift(), -(top - bottom) / 2, w, h);
  camera.updateProjectionMatrix();
  layoutVars();
  if (!userMoved && !fly) flyTo(homeView(), true);
}
addEventListener('resize', resize);
$('#info').addEventListener('toggle', () => { resize(); if (!userMoved) flyTo(homeView()); });
if (innerWidth < 700) $('#info').open = false;

refresh(); resize(); apply(1, 0); flyTo(homeView(), true);

let last = performance.now(), lastPhase = 0;
function frame(dt, draw = true) {
  clock += dt;
  if (ui.animating) {
    ui.p = Math.min(1, ui.p + dt / STEPS[ui.step - 1].dur);
    if (ui.p >= 1) { ui.animating = false; ui.wait = 0; }
    dirty = true;
  } else if (ui.playing) {
    ui.wait += dt;
    if (ui.wait > 4) { if (ui.step < 8) goStep(ui.step + 1, true); else { ui.playing = false; dirty = true; } }
  }
  const phase = ui.step === 8 && ui.p >= 0.6 ? 1 : 0;           // step 8: follow the coffin to the tomb
  if (phase !== lastPhase) { lastPhase = phase; if (!userMoved) flyTo(homeView()); }
  apply(ui.step, ui.p);
  updateFly(dt);
  for (const l of labels) l.o.visible = !!l.show() && chainVisible(l.o);
  if (dirty) refresh();
  controls.update();
  if (!draw) return;
  renderer.render(scene, camera);
  labelR.render(scene, camera);
}
renderer.setAnimationLoop(now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt); });
// Test helper: jump to a step and progress, then draw one frame
window.__mummy = { go: (s, p = 1) => { goStep(s); ui.p = p; ui.animating = p < 1; dirty = true; lastPhase = s === 8 && p >= 0.6 ? 1 : 0; frame(0, false); flyTo(homeView(), true); frame(0); } };
</script>
</body>
</html>
