<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" type="image/png" href="../../favicon.png">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ancient Egypt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen 3D scene; WFA-blue header with an Old/New Kingdom switch and three tabs per kingdom;
     a timeline strip under the header; info card top-left; hint line and controls floating at the bottom. */
  :root {
    --bg: #f1ebe0;
    --panel: rgba(255, 255, 255, 0.95);
    --edge: #d9cdb8;
    --fg: #1f1a12;
    --muted: #6a5d48;
    --blue: #1798d3;
    --on-blue: #ffffff;
    --btn: #1798d3;
    --on-btn: #ffffff;
    --press: #dff0fa;
    --gold: #b7791f;
    --old: #d08a2e;
    --new: #2f7fb5;
    --rome: #8a8f98;
    --lbl-bg: rgba(255, 255, 255, 0.93);
    --lbl-fg: #1f1a12;
    --shadow: rgba(60, 40, 10, 0.18);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --tl: 0px;
    --ctl: 70px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1b1610; --panel: rgba(34, 28, 20, 0.95); --edge: #4a3f2e; --fg: #f3ece0; --muted: #bfae92;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --gold: #e0a84a; --old: #e8a04a; --new: #5aa8de; --rome: #a4a9b2;
    --lbl-bg: rgba(27, 22, 16, 0.92); --lbl-fg: #f3ece0; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #1b1610; --panel: rgba(34, 28, 20, 0.95); --edge: #4a3f2e; --fg: #f3ece0; --muted: #bfae92;
    --btn: #3aaee3; --on-btn: #04121a; --press: #17384a; --gold: #e0a84a; --old: #e8a04a; --new: #5aa8de; --rome: #a4a9b2;
    --lbl-bg: rgba(27, 22, 16, 0.92); --lbl-fg: #f3ece0; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .02em; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-left: auto; }
  .king { display: flex; background: rgba(0, 0, 0, .16); border-radius: 999px; padding: 3px; }
  .king button {
    font: inherit; font-weight: 800; font-size: 13px; min-height: 38px; padding: 4px 12px; border: 0; border-radius: 999px;
    background: transparent; color: var(--on-blue); cursor: pointer; letter-spacing: .02em;
  }
  .king button[aria-pressed="true"] { background: #0d5f86; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--on-blue); cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #ffffff; color: #0f6d99; border-color: #ffffff; }

  /* Timeline strip */
  .timeline {
    position: fixed; z-index: 2; top: calc(var(--hdr) + 10px); right: var(--gutter-r);
    width: min(470px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 14px 6px;
    box-shadow: 0 4px 14px var(--shadow); font-size: 11px; font-weight: 800; color: var(--muted);
  }
  .tl-bar { position: relative; height: 12px; margin-top: 18px; border-radius: 6px; background: var(--edge); }
  .tl-band { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .tl-band.ok { background: var(--old); } .tl-band.nk { background: var(--new); } .tl-band.rb { background: var(--rome); }
  .tl-mark { position: absolute; top: -18px; transform: translateX(-50%); color: var(--fg); white-space: nowrap; font-size: 11px; transition: left .5s; }
  .tl-mark::after { content: ""; position: absolute; left: var(--a, 50%); top: 14px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--fg); }
  .tl-ticks { position: relative; height: 14px; margin-top: 3px; }
  .tl-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tl-ticks span:first-child { transform: none; } .tl-ticks span:last-child { transform: translateX(-100%); }
  .tl-key { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; }
  .tl-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(340px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 110px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; min-height: 28px; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  .info p.think { border-left: 4px solid var(--gold); padding-left: 10px; }
  .info b { color: var(--blue); }
  .kchip { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: #fff; margin-bottom: 2px; }
  .kchip.old { background: var(--old); color: #1f1a12; } .kchip.new { background: var(--new); }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }

  .say {
    position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); margin: 0;
    bottom: calc(var(--ctl) + 32px + env(safe-area-inset-bottom, 0px));
    width: max-content; max-width: min(600px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 8px 16px;
    font-weight: 800; font-size: 15px; line-height: 1.35; text-align: center; text-wrap: balance;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .say:empty { display: none; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: min(860px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .controls button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--btn); background: var(--btn); color: var(--on-btn);
  }
  .controls button.ghost { background: transparent; color: var(--fg); border-color: var(--edge); }
  .controls button.ghost[aria-pressed="true"] { background: var(--press); border-color: var(--btn); }
  .controls button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .lbl {
    font: 800 13px var(--font); background: var(--lbl-bg); color: var(--lbl-fg); border: 1px solid var(--edge);
    padding: 3px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px var(--shadow);
  }
  .lbl small { display: block; font-weight: 700; font-size: 11px; color: var(--muted); text-align: center; }
  .lbl.hot { background: var(--gold); color: #fff; border-color: transparent; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(3px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }
  .oops { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 800; }

  @media (max-width: 899px) {
    .timeline { left: var(--gutter-l); right: var(--gutter-r); width: auto; }
    .info { top: calc(var(--hdr) + var(--tl) + 18px); max-height: calc(100% - var(--hdr) - var(--tl) - var(--ctl) - 116px); }
  }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .nav { margin-left: 0; gap: 6px 8px; }
    .king button { font-size: 12px; min-height: 36px; padding: 3px 10px; }
    .tabs button { font-size: 14px; padding: 4px 11px; min-height: 40px; }
    .controls button { font-size: 14px; padding: 6px 12px; }
    .controls { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding: 8px; gap: 6px; }
    .say { font-size: 14px; }
    .lbl { font-size: 12px; padding: 2px 8px; }
    .lbl small { display: none; }
    .timeline { padding: 6px 10px 4px; }
    .tl-key { display: none; }
    .tl-ticks .opt { display: none; }
    footer .tip { display: none; }
  }
</style>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Ancient Egypt</h1>
    <span>Year 5 History · Old Kingdom and New Kingdom</span>
  </div>
  <div class="nav">
    <div class="king" role="group" aria-label="Choose a kingdom">
      <button type="button" data-k="old" aria-pressed="true">Old Kingdom</button>
      <button type="button" data-k="new" aria-pressed="false">New Kingdom</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Choose a model">
      <button role="tab" data-tab="pyramids" data-k="old" aria-selected="true">Pyramids</button>
      <button role="tab" data-tab="build" data-k="old" aria-selected="false">Building</button>
      <button role="tab" data-tab="nile" data-k="old" aria-selected="false">The Nile</button>
      <button role="tab" data-tab="tomb" data-k="new" aria-selected="false">Royal tomb</button>
      <button role="tab" data-tab="heart" data-k="new" aria-selected="false">The heart</button>
      <button role="tab" data-tab="temple" data-k="new" aria-selected="false">Temple</button>
    </nav>
  </div>
</header>

<div class="timeline" id="tl" aria-label="Timeline">
  <div class="tl-bar">
    <span class="tl-band ok" id="bandOK"></span><span class="tl-band nk" id="bandNK"></span><span class="tl-band rb" id="bandRB"></span>
    <span class="tl-mark" id="tlMark"></span>
  </div>
  <div class="tl-ticks" id="tlTicks"></div>
  <div class="tl-key"><span><i style="background:var(--old)"></i>Old Kingdom</span><span><i style="background:var(--new)"></i>New Kingdom</span><span><i style="background:var(--rome)"></i>Romans in Britain</span></div>
</div>

<details class="info" id="info" open>
  <summary id="infoTitle">Ancient Egypt</summary>
  <div id="infoBody"></div>
  <dl id="readouts"></dl>
</details>

<p class="say" id="say" aria-live="polite"></p>

<div class="controls" id="controls">
  <button type="button" data-for="pyramids" id="prevBtn" class="ghost">◀ Previous</button>
  <button type="button" data-for="pyramids" id="nextBtn">Next ▶</button>
  <button type="button" data-for="pyramids" id="allBtn" class="ghost">See them all</button>
  <button type="button" data-for="build" id="pullBtn">Pull the sledge</button>
  <button type="button" data-for="build" id="waterBtn" class="ghost" aria-pressed="true">Water on the sand</button>
  <button type="button" data-for="build" id="leverBtn">Use the levers</button>
  <button type="button" data-for="build" id="rampBtn" class="ghost">Another ramp idea</button>
  <button type="button" data-for="nile" id="dipBtn">Lower the bucket</button>
  <button type="button" data-for="nile" id="liftBtn">Lift and swing</button>
  <button type="button" data-for="nile" id="seasonBtn" class="ghost">Next season</button>
  <button type="button" data-for="tomb" id="openBtn">Open the next layer</button>
  <button type="button" data-for="tomb" id="closeBtn" class="ghost">Close them all</button>
  <button type="button" data-for="tomb" id="insideBtn" class="ghost">Go into the burial chamber</button>
  <button type="button" data-for="heart" id="weighBtn">Weigh the heart</button>
  <button type="button" data-for="heart" id="heavyBtn" class="ghost">What if it was heavy?</button>
  <button type="button" data-for="temple" id="obBtn">See the obelisk</button>
  <button type="button" data-for="temple" id="stepBtn">Next step</button>
  <button type="button" data-for="temple" id="againBtn" class="ghost">Start again</button>
  <button type="button" data-for="pyramids build nile tomb heart temple" id="labelsBtn" class="ghost" aria-pressed="true">Labels</button>
</div>

<footer><span class="tip">Drag to turn · pinch or scroll to zoom · </span>Wallscourt Farm Academy · Y5-17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = s => document.querySelector(s);
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------- Renderer, camera, labels ----------------
const wrap = $('#scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<div class="oops">Sorry, this device cannot show 3D models.</div>'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = 'labels';
wrap.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 900);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 2; controls.maxDistance = 260;
controls.maxPolarAngle = Math.PI / 2 - 0.04;

scene.add(new THREE.HemisphereLight(0xfff8ec, 0x9a7d55, 1.2));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
function setSun(range, center, dir = V(0.55, 1, 0.45)) {
  sun.target.position.copy(center);
  sun.position.copy(center).add(dir.clone().normalize().multiplyScalar(range * 2.2));
  const c = sun.shadow.camera;
  c.left = c.bottom = -range; c.right = c.top = range; c.near = 0.5; c.far = range * 5;
  c.updateProjectionMatrix();
}

// ---------------- Textures drawn in code ----------------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
function speckle(g, w, h, rnd, n, dark, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rnd() < 0.5 ? `rgba(${dark},${0.05 + rnd() * 0.14})` : `rgba(${light},${0.05 + rnd() * 0.12})`;
    g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.5, 1 + rnd() * 2.5);
  }
}
const linenTex = canvasTex(64, 256, (g, w, h) => {        // wrapped linen bandages
  const rnd = seeded(23); g.fillStyle = '#efe6cf'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 7) { g.strokeStyle = `rgba(120,95,60,${0.25 + rnd() * 0.2})`; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + 9); g.stroke(); }
  speckle(g, w, h, rnd, 900, '120,95,60', '255,250,240');
});
const sandTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = seeded(11);
  g.fillStyle = '#dcc08a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, rnd, 26000, '140,100,50', '255,240,200');
  g.globalCompositeOperation = 'destination-in';
  const r = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const plainSand = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(12); g.fillStyle = '#dcc08a'; g.fillRect(0, 0, w, h); speckle(g, w, h, rnd, 6000, '140,100,50', '255,240,200');
});
const courseTex = canvasTex(256, 256, (g, w, h) => {      // rows of limestone blocks; 1 tile = 4 x 4 blocks
  const rnd = seeded(13);
  g.fillStyle = '#9c8662'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = -1; c < 5; c++) {
    const l = 200 + rnd() * 34, x = c * 64 + (r % 2) * 32;
    g.fillStyle = `rgb(${l},${l * 0.9},${l * 0.72})`; g.fillRect(x + 2, r * 64 + 2, 60, 60);
  }
  speckle(g, w, h, rnd, 9000, '90,70,40', '255,250,235');
});
const smoothTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(14); g.fillStyle = '#efe6d2'; g.fillRect(0, 0, w, h); speckle(g, w, h, rnd, 9000, '120,100,70', '255,255,245');
  g.strokeStyle = 'rgba(120,100,70,.18)'; for (let y = 0; y < h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
});
const rockTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(15); g.fillStyle = '#c9a777'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '120,85,45' : '240,215,170'},${0.12 + rnd() * 0.18})`; g.fillRect(0, rnd() * h, w, 2 + rnd() * 8); }
  speckle(g, w, h, rnd, 12000, '90,60,30', '250,230,190');
});
const mudTex = canvasTex(256, 128, (g, w, h) => {
  const rnd = seeded(16); g.fillStyle = '#6e5133'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = -1; c < 5; c++) {
    const l = 120 + rnd() * 30, x = c * 64 + (r % 2) * 32;
    g.fillStyle = `rgb(${l * 1.15},${l * 0.88},${l * 0.6})`; g.fillRect(x + 2, r * 32 + 2, 60, 28);
  }
  speckle(g, w, h, rnd, 4000, '60,40,20', '220,190,150');
});
const soilTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = seeded(17); g.fillStyle = '#3d2c1f'; g.fillRect(0, 0, w, h); speckle(g, w, h, rnd, 14000, '20,12,6', '120,95,70');
});
const waterTex = canvasTex(256, 64, (g, w, h) => {
  const rnd = seeded(18); g.fillStyle = '#2f7fa8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 46; i++) { g.fillStyle = `rgba(220,240,255,${0.12 + rnd() * 0.3})`; g.fillRect(rnd() * w, rnd() * h, 10 + rnd() * 40, 1.5 + rnd() * 2); }
});
const woodTex = canvasTex(128, 32, (g, w, h) => {
  const rnd = seeded(19); g.fillStyle = '#9a6a3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(60,35,12,${0.2 + rnd() * 0.25})`; const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + rnd() * 4 - 2); g.stroke(); }
});
// Simple hieroglyph-style signs: reed, water, bird, eye, ankh, loaf, sun

  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    quad([B[i][0], y0, B[i][1]], [T[i][0], y0 + h, T[i][1]], [T[j][0], y0 + h, T[j][1]], [B[j][0], y0, B[j][1]]);

  else { p1 = L.stand.p; q1 = L.stand.q; }                                                 // coffin lids stand against the wall

function view(target, dir, needW, needH) {

  const top = topSpace(), bottom = $('#controls').offsetHeight + 80;
  const avail = Math.max(0.35, (h - top - bottom) / h), availW = Math.max(0.4, (w - 2 * sideShift()) / w);
  const tanF = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max((needH / 2) / tanF / avail, (needW / 2) / (tanF * aspect * availW));
  return { pos: target.clone().add(dir.clone().normalize().multiplyScalar(d)), target };
}
function homeView() {
  const t = ui.tab;
  if (t === 'pyramids') {
    if (pyrAll) return view(V(54, 4, 0), V(0.1, 0.36, 1), 116, 20);
    const P = PYR[pyrIdx]; return view(V(P.x, P.top * 0.42, 0), V(0.55, 0.42, 1), P.size * 1.5, P.top * 1.5 + 2);
  }
  if (t === 'build') return view(V(15, 4, 0), V(0.6, 0.5, 1), 50, 16);
  if (t === 'nile') return view(V(1.5, 1.4, 6), V(0.3, 0.55, 1), 24, 11);
  if (t === 'tomb' && tombSt.inside && tombSt.opened >= LAYERS.length - 1) return view(V(16.75, -5.75, -2), V(0.12, 0.6, 1), 3.9, 2.0);   // close-up of the mummy
  if (t === 'tomb') return tombSt.inside ? view(V(16.7, -5.3, -1.9), V(0.08, 0.42, 1), 7.6, 3.9) : view(V(5, -3.4, -1), V(0.08, 0.16, 1), 52, 20);
  if (t === 'heart') return view(V(0.5, 1.5, 0), V(0.1, 0.22, 1), innerWidth < 640 ? 14.5 : 10.5, 3.6);
  if (ob.view) return view(V(OBX + 10, 13.5, 0), V(0.25, 0.5, 1), 54, 33);
  return view(V(0, 6, -14), V(0.18, 0.55, 1), 72, 30);
}
function flyTo(v, instant = false) {
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); fly = null; return; }
  fly = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.target };
}
controls.addEventListener('start', () => { fly = null; userMoved = true; });
function updateFly(dt) {
  if (!fly) return;
  fly.t += dt / 1.4; const k = ease(fly.t);
  camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (fly.t >= 1) fly = null;
}
function goHome() { userMoved = false; flyTo(homeView()); }
function sunFor() {
  const t = ui.tab;
  if (t === 'pyramids') return pyrAll ? setSun(70, V(54, 0, 0)) : setSun(PYR[pyrIdx].size * 1.1 + 4, V(PYR[pyrIdx].x, 0, 0));
  if (t === 'build') setSun(36, V(14, 0, 0));
  else if (t === 'nile') setSun(28, V(0, 0, 5));
  else if (t === 'tomb') setSun(30, V(4, -2, 0), V(-0.3, 1, 0.6));
  else if (t === 'heart') setSun(8, V(0.5, 0, 0), V(0.3, 1, 0.8));
  else setSun(ob.view ? 36 : 50, ob.view ? V(OBX + 10, 0, 0) : V(0, 0, -10));
}

// =====================================================================
//  UI
// =====================================================================
let lastHint = '', lastYear = null;
function refresh() {
  dirty = false;
  const I = infoFor(ui.tab);
  $('#infoTitle').textContent = I.title;
  $('#infoBody').innerHTML = I.body;
  $('#readouts').innerHTML = I.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  const mk = $('#tlMark'), pc = pct(I.year); mk.style.left = pc + '%'; mk.style.setProperty('--a', pc + '%'); mk.style.transform = `translateX(-${pc}%)`; mk.textContent = I.ydate;
  const h = hint(); if (h !== lastHint) { $('#say').textContent = h; lastHint = h; }
  for (const b of document.querySelectorAll('#controls button')) b.hidden = !b.dataset.for.split(' ').includes(ui.tab);
  for (const b of document.querySelectorAll('.tabs button')) { b.hidden = b.dataset.k !== ui.king; b.setAttribute('aria-selected', b.dataset.tab === ui.tab); }
  for (const b of document.querySelectorAll('.king button')) b.setAttribute('aria-pressed', b.dataset.k === ui.king);
  $('#prevBtn').disabled = !pyrAll && pyrIdx === 0;
  $('#nextBtn').disabled = !pyrAll && pyrIdx === PYR.length - 1;
  $('#allBtn').setAttribute('aria-pressed', pyrAll);
  $('#pullBtn').disabled = build.moving || build.spiral;
  $('#pullBtn').textContent = build.u >= U_END - 0.01 ? 'Pull another block' : 'Pull the sledge';
  $('#waterBtn').disabled = build.moving || build.spiral;
  $('#waterBtn').setAttribute('aria-pressed', build.water);
  $('#waterBtn').textContent = build.water ? 'Water on the sand: on' : 'Water on the sand: off';
  $('#leverBtn').disabled = build.levering;
  $('#leverBtn').textContent = build.lever >= 3 ? 'Do it again' : 'Use the levers';
  $('#rampBtn').disabled = build.moving;
  $('#rampBtn').textContent = build.spiral ? 'Back to the straight ramp' : 'Another ramp idea';
  $('#dipBtn').disabled = shad.busy || shad.state !== 'up' || shad.season === 0;
  $('#liftBtn').disabled = shad.busy || shad.state !== 'down';
  $('#seasonBtn').disabled = shad.busy;
  $('#seasonBtn').textContent = `Next season (now ${SEASONS[shad.season].name.split(':')[0]})`;
  $('#openBtn').disabled = tombSt.busy || tombSt.opened >= LAYERS.length - 1;
  $('#closeBtn').disabled = tombSt.busy || tombSt.opened === 0;
  $('#insideBtn').textContent = tombSt.inside ? 'See the whole tomb' : 'Go into the burial chamber';
  $('#weighBtn').disabled = hw.state === 'weighing';
  $('#heavyBtn').disabled = hw.state === 'weighing';
  $('#obBtn').textContent = ob.view ? 'See the temple' : 'See the obelisk';
  $('#stepBtn').hidden = $('#againBtn').hidden = !(ui.tab === 'temple' && ob.view);
  $('#stepBtn').disabled = ob.busy || ob.step >= OB_STEPS.length - 1;
  $('#againBtn').disabled = ob.busy || ob.step === 0;
  $('#labelsBtn').setAttribute('aria-pressed', ui.labels);
  layoutVars();
}
const GROUPS = { pyramids: pyr, build: bld, nile, tomb, heart, temple };
function setTab(tab) {
  ui.tab = tab;
  for (const [k, g] of Object.entries(GROUPS)) g.visible = k === tab;
  ui.king = ['tomb', 'heart', 'temple'].includes(tab) ? 'new' : 'old';
  sunFor(); dirty = true; refresh(); resize(); goHome();
}
for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setTab(b.dataset.tab));
for (const b of document.querySelectorAll('.king button')) b.addEventListener('click', () => { if (b.dataset.k !== ui.king) setTab(b.dataset.k === 'old' ? 'pyramids' : 'tomb'); });
$('#prevBtn').onclick = () => { if (pyrAll) { pyrAll = false; pyrIdx = PYR.length - 1; } else pyrIdx = Math.max(0, pyrIdx - 1); sunFor(); dirty = true; refresh(); goHome(); };
$('#nextBtn').onclick = () => { if (pyrAll) { pyrAll = false; pyrIdx = 0; } else pyrIdx = Math.min(PYR.length - 1, pyrIdx + 1); sunFor(); dirty = true; refresh(); goHome(); };
$('#allBtn').onclick = () => { pyrAll = true; sunFor(); dirty = true; refresh(); goHome(); };
$('#pullBtn').onclick = pullSledge;
$('#waterBtn').onclick = () => { build.water = !build.water; dirty = true; };
$('#leverBtn').onclick = useLevers;
$('#rampBtn').onclick = () => { build.spiral = !build.spiral; ramp.visible = !build.spiral; spiral.visible = build.spiral; sledge.visible = !build.spiral; for (const p of team) p.visible = !build.spiral; dirty = true; };
$('#dipBtn').onclick = lowerBucket;
$('#liftBtn').onclick = liftAndSwing;
$('#seasonBtn').onclick = () => setSeason((shad.season + 1) % 3);
$('#openBtn').onclick = () => { if (!tombSt.inside) { tombSt.inside = true; goHome(); } openLayer(); };
$('#closeBtn').onclick = closeLayers;
$('#insideBtn').onclick = () => { tombSt.inside = !tombSt.inside; dirty = true; goHome(); };
$('#weighBtn').onclick = () => weigh(false);
$('#heavyBtn').onclick = () => weigh(true);
$('#obBtn').onclick = () => { ob.view = !ob.view; sunFor(); dirty = true; refresh(); goHome(); };
$('#stepBtn').onclick = obNext;
$('#againBtn').onclick = obReset;
$('#labelsBtn').onclick = () => { ui.labels = !ui.labels; dirty = true; };

// ---------------- Resize and loop ----------------
function layoutVars() {
  const r = document.documentElement.style;
  r.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
  r.setProperty('--tl', $('#tl').offsetHeight + 'px');
  r.setProperty('--ctl', $('#controls').offsetHeight + 'px');
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  const top = topSpace(), bottom = $('#controls').offsetHeight + 80;
  camera.setViewOffset(w, h, -sideShift(), -(top - bottom) / 2, w, h);
  camera.updateProjectionMatrix();
  layoutVars();
  if (!userMoved && !fly) flyTo(homeView(), true);
}
addEventListener('resize', resize);
$('#info').addEventListener('toggle', () => { resize(); if (!userMoved) flyTo(homeView()); });
if (innerWidth < 700) $('#info').open = false;

setSeason(1, true);
setTab('pyramids');
placeBuild(); placeShaduf(); placeScale(); placeObelisk();
flyTo(homeView(), true);

let last = performance.now(), clock = 0;
function frame(dt, draw = true) {
  clock += dt;
  runTweens(dt);
  if (bld.visible) {
    if (build.moving) build.walk += dt * 6;
    placeBuild();
    const tp = pathAt(build.u + 3.0 + 1.25); lblTeam.position.set(tp.x, tp.y + 2.3, 0);
    pour.scale.y = 0.8 + Math.sin(clock * 12) * 0.1;
  }
  if (nile.visible) {
    placeShaduf();
    tilt.updateWorldMatrix(true, false);
    lblCW.position.set(0, 0.55, SH.short + 0.1).applyMatrix4(tilt.matrixWorld);
    lblBucket.position.copy(bucketHang.position).add(V(0, -SH.rope - 0.6, 0));
    boat.position.x += dt * 1.4; if (boat.position.x > 46) boat.position.x = -46;
    waterTex.offset.x -= dt * 0.04;
  }
  if (heart.visible) {
    if (hw.state !== 'start') { hw.vel += (hw.target - hw.ang) * 9 * dt; hw.vel *= Math.pow(0.18, dt); hw.ang += hw.vel * dt * 2.2; }
    placeScale();
  }
  if (temple.visible) placeObelisk();
  updateFly(dt);
  for (const l of labels) l.o.visible = !!l.show() && chainVisible(l.o);
  if (dirty) refresh();
  controls.update();
  if (!draw) return;
  renderer.render(scene, camera);
  labelR.render(scene, camera);
}
renderer.setAnimationLoop(now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt); });
window.__egypt = { step: (n = 60) => { for (let k = 0; k < n; k++) frame(1 / 30, k === n - 1); } };   // test helper: run n frames at once
</script>
