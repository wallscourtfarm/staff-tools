<style>
  /* Layout: full-screen 3D scene of 1 cm cubes; WFA-blue header with three tabs;
     info card top-left; controls floating at the bottom. Light and dark palettes. */
  :root {
    --bg: #eef6fb; --bg2: #dbeaf4;
    --panel: rgba(255, 255, 255, 0.95); --label-bg: #ffffff;
    --edge: #c6dae8; --fg: #0a1a24; --muted: #4c6476;
    --blue: #1798d3; --blue-ink: #0d6c9b; --on-blue: #ffffff;
    --good: #1c7d45; --good-bg: #e2f4e9; --try: #8f4f00; --try-bg: #fcefdc;
    --grid1: #9fc2d8; --grid2: #cfe2ee; --line: #0a1a24; --ghost: #5a7486;
    --shadow: rgba(10, 40, 60, 0.14);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px; --ctl: 160px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1b23; --bg2: #13262f;
    --panel: rgba(24, 41, 52, 0.95); --label-bg: #1b2f3b;
    --edge: #2d4656; --fg: #e8f1f6; --muted: #9db3c2;
    --blue: #3aaee3; --blue-ink: #7fcaef; --on-blue: #04121a;
    --good: #67d397; --good-bg: #163828; --try: #f5bb63; --try-bg: #3a2a12;
    --grid1: #3d5d70; --grid2: #22394a; --line: #e8f1f6; --ghost: #8aa3b4;
    --shadow: rgba(0, 0, 0, 0.4); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0e1b23; --bg2: #13262f;
    --panel: rgba(24, 41, 52, 0.95); --label-bg: #1b2f3b;
    --edge: #2d4656; --fg: #e8f1f6; --muted: #9db3c2;
    --blue: #3aaee3; --blue-ink: #7fcaef; --on-blue: #04121a;
    --good: #67d397; --good-bg: #163828; --try: #f5bb63; --try-bg: #3a2a12;
    --grid1: #3d5d70; --grid2: #22394a; --line: #e8f1f6; --ghost: #8aa3b4;
    --shadow: rgba(0, 0, 0, 0.4); color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); background-image: radial-gradient(circle at 60% 45%, var(--bg2), var(--bg) 70%);
         color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .85; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 40px; padding: 6px 14px;
    border-radius: 999px; border: 2px solid currentColor; background: transparent; color: var(--on-blue); cursor: pointer; opacity: .9;
  }
  .tabs button[aria-selected="true"] { background: var(--on-blue); color: var(--blue); border-color: var(--on-blue); opacity: 1; }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(330px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 60px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }
  .found { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .found span { background: var(--good-bg); color: var(--good); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 14px; }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: min(780px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 4px 18px var(--shadow);
  }
  .pane { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  button { font: inherit; font-weight: 800; font-size: 16px; min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
           border: 2px solid var(--blue); background: var(--blue); color: var(--on-blue); }
  button.ghost { background: transparent; color: var(--blue-ink); }
  button.ghost[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .dims { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 10px; }
  .stepper { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stepper .lab { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stepper output { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper .sb { display: flex; gap: 4px; }
  .stepper button { width: 44px; padding: 0; font-size: 24px; line-height: 1; }

  .act { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .eq { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; text-wrap: balance; }
  .eq small { font-size: 14px; font-weight: 700; color: var(--muted); display: block; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .slider { flex: 1 1 160px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider span { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; height: 30px; accent-color: var(--blue); }

  .answer { display: flex; align-items: baseline; gap: 6px; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .answer .box { min-width: 88px; padding: 2px 12px; border: 2px solid var(--edge); border-radius: 10px; text-align: right;
                 font-variant-numeric: tabular-nums; background: var(--label-bg); min-height: 44px; }
  .answer .box.empty { color: var(--muted); }
  .keypad { display: grid; grid-template-columns: repeat(5, 44px) 66px; gap: 6px; }
  .keypad button { padding: 0; font-size: 20px; }
  .keypad .check { grid-column: span 1; font-size: 15px; }
  .qside { flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .say { font-weight: 700; line-height: 1.4; padding: 8px 12px; border-radius: 10px; background: var(--bg2); min-height: 44px; }
  .say.good { background: var(--good-bg); color: var(--good); }
  .say.try { background: var(--try-bg); color: var(--try); }
  .score { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }

  .targets { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .targets .lab { font-weight: 800; }
  .targets button { min-width: 64px; padding: 6px 10px; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 11px; }
    .info summary { font-size: 15px; }
    .controls { padding: 10px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
    .eq { font-size: 19px; }
    .pane { gap: 8px 12px; }
    .answer { font-size: 22px; }
    footer .wide { display: none; }
    .targets .lab { display: none; }
    .targets button { min-width: 0; padding: 4px 8px; font-size: 15px; }
  }
</style>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Volume Builder</h1>
    <span>Year 5 Maths · Volume</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Choose an activity">
    <button role="tab" data-mode="build" aria-selected="true">Build</button>
    <button role="tab" data-mode="quiz" aria-selected="false">How many cubes?</button>
    <button role="tab" data-mode="same" aria-selected="false">Same volume</button>
  </nav>
</header>

<details class="info" id="info" open>
  <summary id="infoTitle">What is volume?</summary>
  <div id="infoBody"></div>
  <dl id="readouts"></dl>
  <div class="found" id="foundList"></div>
</details>

<div class="controls" id="controls">
  <!-- Build -->
  <div class="pane" id="pane-build">
    <div class="dims" data-group="build"></div>
    <div class="act">
      <div class="eq" id="buildEq"></div>
      <div class="row">
        <button id="buildBtn" type="button">Build it</button>
        <label class="slider" for="layerSl"><span id="layerLab">Layers</span><input id="layerSl" type="range" min="0" max="2" step="1" value="2"></label>
      </div>
    </div>
  </div>

  <!-- How many cubes? -->
  <div class="pane" id="pane-quiz" hidden>
    <div>
      <div class="answer"><span class="box empty" id="ansBox" aria-live="polite">?</span><span>cm³</span></div>
      <div class="keypad" id="keypad" aria-label="Number keypad"></div>
    </div>
    <div class="qside">
      <div class="say" id="quizSay" aria-live="polite">How many 1 cm cubes make this cuboid? Some are hidden!</div>
      <div class="row">
        <button id="hintBtn" type="button" class="ghost" aria-pressed="false">Edge lengths</button>
        <button id="showBtn" type="button" class="ghost">Show me</button>
        <button id="nextBtn" type="button" hidden>Next cuboid</button>
        <span class="score" id="score">Score: 0</span>
      </div>
    </div>
  </div>

  <!-- Same volume -->
  <div class="pane" id="pane-same" hidden>
    <div class="targets" id="targets"><span class="lab">Make</span></div>
    <div class="dims" data-group="same"></div>
    <div class="qside">
      <div class="say" id="sameSay" aria-live="polite"></div>
      <span class="score" id="sameCount"></span>
    </div>
  </div>
</div>

<footer><span class="wide">Each cube is 1 cm long, 1 cm wide and 1 cm high, so it has a volume of 1 cm³. · </span>Wallscourt Farm Academy · Y5-17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------- Constants ----------------
const MAX = 8, CAP = MAX * MAX * MAX;
const DEG = Math.PI / 180;
const GAP = 0.9;                         // how far layers pull apart when revealed
const LAYER_COLS = ['#1798d3', '#f07d2c', '#2fae66', '#8a5cd6', '#f2b416', '#e5484d', '#159a9c', '#d6589b'];
const TARGETS = [12, 16, 24, 36];
const $ = s => document.querySelector(s);
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeBack = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

// ---------------- State ----------------
const st = {
  mode: 'build',
  build: { l: 4, w: 3, h: 2 },
  quiz: { l: 3, w: 2, h: 2, entry: '', tries: 0, done: false, score: 0, asked: 0, hint: false },
  same: { l: 2, w: 2, h: 2, target: 24, found: { 12: [], 16: [], 24: [], 36: [] } },
};
let cur = { l: 4, w: 3, h: 2 };
let shown = 2;                                 // layers on show (Build tab)
const anim = { on: false, t0: 0, layerT: .9 };
const SWEEP = .5, FALL = .45, DROP = 3.2;
let pop = { t0: -10 };
let explode = 0, explodeTarget = 0;

// ---------------- Scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
$('#scene').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
camera.position.set(6, 6.5, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8ea6b8, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 12, 8); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, .35); fill.position.set(-8, 4, -6); scene.add(fill);

try { await document.fonts.load('800 64px Nunito'); } catch (e) {}

// One cube texture: white with a darker border, tinted per layer, so every cube can be counted
function cubeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(0,0,0,0.42)'; g.lineWidth = 10; g.strokeRect(5, 5, 118, 118);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const cubes = new THREE.InstancedMesh(new THREE.BoxGeometry(.97, .97, .97),
  new THREE.MeshStandardMaterial({ map: cubeTexture(), roughness: .55 }), CAP);
cubes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
cubes.frustumCulled = false;
const tmpCol = new THREE.Color();
for (let i = 0; i < CAP; i++) cubes.setColorAt(i, tmpCol.set('#ffffff'));
scene.add(cubes);

let grid = null, ghost = null, dimLines = null;
const labels = { len: null, wid: null, hei: null, tags: [] };
const labelGroup = new THREE.Group(); scene.add(labelGroup);

function makeGrid() {
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper(MAX + 4, MAX + 4, tok('--grid1'), tok('--grid2'));
  grid.position.y = -0.005;
  scene.add(grid);
  alignGrid();
}
function alignGrid() { if (grid) { grid.position.x = (cur.l % 2) * .5; grid.position.z = (cur.w % 2) * .5; } }

// Text label drawn on a canvas, shown as a sprite that always faces the camera
function makeLabel(text, { swatch = null, size = .55, anchor = .5 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = '800 60px Nunito, sans-serif';
  g.font = font;
  const tw = g.measureText(text).width, pad = 24, sw = swatch ? 50 : 0;
  c.width = Math.ceil(tw + pad * 2 + sw); c.height = 92;
  g.font = font;
  g.fillStyle = tok('--label-bg'); g.strokeStyle = tok('--edge'); g.lineWidth = 4;
  g.beginPath(); g.roundRect(2, 2, c.width - 4, c.height - 4, 22); g.fill(); g.stroke();
  if (swatch) { g.fillStyle = swatch; g.beginPath(); g.roundRect(pad - 4, 24, 40, 44, 9); g.fill(); }
  g.fillStyle = tok('--fg'); g.textBaseline = 'middle'; g.fillText(text, pad + sw, 49);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(size * c.width / c.height, size, 1);
  s.center.set(anchor, .5);
  s.renderOrder = 10;
  return s;
}
function disposeObj(o) { if (!o) return; o.parent && o.parent.remove(o); o.geometry && o.geometry.dispose();
  if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }

// ---------------- Rebuild when the cuboid changes ----------------
function layerFits(l, w, h) { return 0.5 * Math.sqrt(l * l + w * w + h * h); }
function rebuild() {
  const { l, w, h } = cur;
  cubes.count = l * w * h;
  for (let j = 0; j < h; j++) {
    tmpCol.set(LAYER_COLS[j % LAYER_COLS.length]);
    for (let n = 0; n < l * w; n++) cubes.setColorAt(j * l * w + n, tmpCol);
  }
  cubes.instanceColor.needsUpdate = true;
  alignGrid();

  // dashed outline of the whole cuboid (shows the shape before every layer is in)
  disposeObj(ghost);
  ghost = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(l, h, w)),
    new THREE.LineDashedMaterial({ color: tok('--ghost'), dashSize: .22, gapSize: .16 }));
  ghost.computeLineDistances(); ghost.position.y = h / 2; scene.add(ghost);

  // dimension lines with end ticks
  disposeObj(dimLines);
  const o = .38, t = .16, y = .03, p = [];
  const seg = (a, b) => p.push(...a, ...b);
  seg([-l / 2, y, w / 2 + o], [l / 2, y, w / 2 + o]);                       // length (front)
  seg([-l / 2, y, w / 2 + o - t], [-l / 2, y, w / 2 + o + t]); seg([l / 2, y, w / 2 + o - t], [l / 2, y, w / 2 + o + t]);
  seg([l / 2 + o, y, -w / 2], [l / 2 + o, y, w / 2]);                       // width (right side)
  seg([l / 2 + o - t, y, -w / 2], [l / 2 + o + t, y, -w / 2]); seg([l / 2 + o - t, y, w / 2], [l / 2 + o + t, y, w / 2]);
  seg([-l / 2 - o, 0, w / 2], [-l / 2 - o, h, w / 2]);                      // height (left front edge)
  seg([-l / 2 - o - t, 0, w / 2], [-l / 2 - o + t, 0, w / 2]); seg([-l / 2 - o - t, h, w / 2], [-l / 2 - o + t, h, w / 2]);
  const gm = new THREE.BufferGeometry(); gm.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  dimLines = new THREE.LineSegments(gm, new THREE.LineBasicMaterial({ color: tok('--line'), transparent: true, opacity: .75 }));
  scene.add(dimLines);

  makeLabels();
  refit();
}

function makeLabels() {
  const { l, w, h } = cur;
  [labels.len, labels.wid, labels.hei, ...labels.tags].forEach(disposeObj);
  labels.tags = [];
  const size = clamp(layerFits(l, w, h) / 5, .5, .85);
  const o = .38;
  labels.len = makeLabel(`${l} cm`, { size }); labels.len.position.set(0, .03, w / 2 + o + size * .9);
  labels.wid = makeLabel(`${w} cm`, { size, anchor: 0 }); labels.wid.position.set(l / 2 + o + .25, .03, 0);
  labels.hei = makeLabel(`${h} cm`, { size, anchor: 1 }); labels.hei.position.set(-l / 2 - o - .25, h / 2, w / 2);
  labelGroup.add(labels.len, labels.wid, labels.hei);
  const reveal = st.mode === 'quiz';
  for (let j = 0; j < h; j++) {
    const text = reveal ? `${l * w} cubes` : `Layer ${j + 1}`;
    const s = makeLabel(text, { swatch: LAYER_COLS[j % LAYER_COLS.length], size: Math.min(.8, size), anchor: 0 });
    s.userData.j = j;
    labels.tags.push(s); labelGroup.add(s);
  }
}

// ---------------- Camera framing: keep the cuboid in the clear space ----------------
const fit = { on: false, dist: 14, ty: 1 };
function availRect() {
  const W = innerWidth, H = innerHeight;
  const hdr = $('#hdr').getBoundingClientRect(), card = $('#info').getBoundingClientRect(), ctl = $('#controls').getBoundingClientRect();
  let left = 0, top = hdr.bottom;
  if (W >= 900) left = card.right; else top = Math.max(top, card.bottom);
  return { left, top, right: W, bottom: Math.min(H, ctl.top) };
}
function refit() {
  const { l, w, h } = cur;
  const H3 = h + (h - 1) * GAP * explodeTarget;
  const r = 0.5 * Math.sqrt((l + 2.4) ** 2 + (w + 1.6) ** 2 + (H3 + .6) ** 2);
  const a = availRect(), W = innerWidth, H = innerHeight;
  const ah = Math.max(90, a.bottom - a.top - 16), aw = Math.max(90, a.right - a.left - 16);
  const t = Math.tan(camera.fov * DEG / 2) * Math.min(ah, aw) / H;
  fit.dist = clamp(r / Math.sin(Math.atan(t)), 4, 58);
  fit.ty = H3 / 2;
  fit.on = true;
  const cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2;
  camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H);
  camera.updateProjectionMatrix();
}
controls.addEventListener('start', () => { fit.on = false; });

// ---------------- Per-frame cube placement ----------------
const M = new THREE.Matrix4(), P = new THREE.Vector3(), Q = new THREE.Quaternion(), S = new THREE.Vector3();
function landedLayers(t) {
  return clamp(Math.floor((t - anim.t0 - SWEEP - FALL) / anim.layerT) + 1, 0, cur.h);
}
function placeCubes(t) {
  const { l, w, h } = cur;
  const popS = st.mode === 'quiz' ? clamp(easeBack(clamp((t - pop.t0) / .5, 0, 1)), 0, 1.2) : 1;
  for (let j = 0; j < h; j++) for (let k = 0; k < w; k++) for (let i = 0; i < l; i++) {
    const idx = j * l * w + k * l + i;
    let s = 1, y = j + .5 + j * explode * GAP;
    if (st.mode === 'build') {
      if (anim.on) {
        const d = j * anim.layerT + (i + k) / Math.max(1, l + w - 2) * SWEEP;
        const p = clamp((t - anim.t0 - d) / FALL, 0, 1);
        if (p <= 0) s = 0; else y += DROP * (1 - easeOut(p));
      } else if (j >= shown) s = 0;
    }
    s *= popS;
    P.set(i - (l - 1) / 2, y, k - (w - 1) / 2);
    S.setScalar(Math.max(s, 1e-4));
    cubes.setMatrixAt(idx, M.compose(P, Q, S));
  }
  cubes.instanceMatrix.needsUpdate = true;
}

function placeLabels(t) {
  const { l, w, h } = cur;
  const m = st.mode;
  const showDims = m === 'build' || m === 'same' || (m === 'quiz' && (st.quiz.hint || st.quiz.done));
  labels.len.visible = labels.wid.visible = showDims;
  labels.hei.visible = showDims && explode < .05;
  dimLines.visible = showDims;
  const visLayers = m === 'build' ? (anim.on ? landedLayers(t) : shown) : h;
  ghost.visible = m === 'build' && visLayers < h;
  for (const s of labels.tags) {
    const j = s.userData.j;
    s.position.set(l / 2 + .3, j + .5 + j * explode * GAP, -w / 2 - .3);
    s.visible = (m === 'build' && j < visLayers) || (m === 'quiz' && explode > .4);
  }
}

// ---------------- UI: steppers ----------------
const NAMES = { l: 'Length', w: 'Width', h: 'Height' };
function makeSteppers(group) {
  const box = document.querySelector(`.dims[data-group="${group}"]`);
  for (const d of ['l', 'w', 'h']) {
    const el = document.createElement('div');
    el.className = 'stepper';
    el.innerHTML = `<span class="lab">${NAMES[d]}</span><output data-v="${d}"></output>
      <div class="sb"><button type="button" data-d="${d}" data-s="-1" aria-label="Make the ${NAMES[d].toLowerCase()} smaller">−</button>
      <button type="button" data-d="${d}" data-s="1" aria-label="Make the ${NAMES[d].toLowerCase()} bigger">+</button></div>`;
    box.appendChild(el);
  }
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const dims = st[group], d = b.dataset.d;
    dims[d] = clamp(dims[d] + Number(b.dataset.s), 1, MAX);
    if (group === 'build') { anim.on = false; shown = dims.h; }
    setCur(dims);
    if (group === 'same') checkSame();
    updateUI();
  });
}
makeSteppers('build');
makeSteppers('same');

function setCur(d) {
  const changed = d.l !== cur.l || d.w !== cur.w || d.h !== cur.h;
  cur = { l: d.l, w: d.w, h: d.h };
  if (changed || !ghost) rebuild();
}

// ---------------- Build tab ----------------
const layerSl = $('#layerSl');
$('#buildBtn').addEventListener('click', () => {
  anim.on = true; anim.t0 = performance.now() / 1000;
  anim.layerT = Math.min(.9, 6 / cur.h);
  updateUI();
});
layerSl.addEventListener('input', () => { anim.on = false; shown = Number(layerSl.value); updateUI(); });

// ---------------- How many cubes? tab ----------------
const kp = $('#keypad');
['1', '2', '3', '4', '5', '⌫', '6', '7', '8', '9', '0', 'Check'].forEach(k => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = k; b.dataset.k = k;
  if (k === '⌫') b.setAttribute('aria-label', 'Delete');
  if (k === 'Check') b.className = 'check';
  kp.appendChild(b);
});
kp.addEventListener('click', e => { const b = e.target.closest('button'); if (b) key(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (st.mode !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) key(e.key);
  else if (e.key === 'Backspace') key('⌫');
  else if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') key('Check');
  else return;
  e.preventDefault();
});
function key(k) {
  const q = st.quiz; if (q.done) return;
  if (k === '⌫') q.entry = q.entry.slice(0, -1);
  else if (k === 'Check') return checkQuiz();
  else if (q.entry.length < 3) q.entry = (q.entry === '0' ? '' : q.entry) + k;
  updateUI();
}
function say(el, text, kind = '') { el.textContent = text; el.className = 'say' + (kind ? ' ' + kind : ''); }
function newQuestion() {
  const q = st.quiz;
  let l, w, h;
  do { l = rnd(2, 5); w = rnd(2, 5); h = rnd(2, 4); } while (l === q.l && w === q.w && h === q.h);
  Object.assign(q, { l, w, h, entry: '', tries: 0, done: false, hint: false });
  explodeTarget = 0;
  setCur(q); makeLabels();
  pop.t0 = performance.now() / 1000;
  say($('#quizSay'), 'How many 1 cm cubes make this cuboid? Some are hidden! Drag to turn it.');
  refit(); updateUI();
}
function reveal() {
  st.quiz.done = true; st.quiz.asked++;
  explodeTarget = 1; refit(); updateUI();
}
function checkQuiz() {
  const q = st.quiz, v = q.l * q.w * q.h, n = q.l * q.w;
  if (!q.entry) { say($('#quizSay'), 'Use the keypad to type your answer first.'); return; }
  const a = Number(q.entry);
  if (a === v) {
    q.score++;
    say($('#quizSay'), `Brilliant! One layer has ${q.l} × ${q.w} = ${n} cubes. ${n} × ${q.h} layers = ${v} cm³.`, 'good');
    reveal();
  } else if (q.tries === 0) {
    q.tries = 1; q.entry = '';
    const hint = a < v ? 'Remember the cubes you can’t see.' : 'That’s too many.';
    say($('#quizSay'), `Not quite. ${hint} Count the cubes along the length and width to find one layer. Then count the layers. Have another go!`, 'try');
    updateUI();
  } else {
    say($('#quizSay'), `Good try! It’s ${v} cm³. Each layer has ${q.l} × ${q.w} = ${n} cubes, and there are ${q.h} layers. ${n} × ${q.h} = ${v}.`, 'try');
    reveal();
  }
}
$('#hintBtn').addEventListener('click', () => { st.quiz.hint = !st.quiz.hint; updateUI(); });
$('#showBtn').addEventListener('click', () => {
  const q = st.quiz, n = q.l * q.w, v = n * q.h;
  say($('#quizSay'), `Here it is pulled apart. Each layer has ${q.l} × ${q.w} = ${n} cubes. ${n} × ${q.h} layers = ${v} cm³.`);
  reveal();
});
$('#nextBtn').addEventListener('click', newQuestion);

// ---------------- Same volume tab ----------------
const combos = {};
for (const T of TARGETS) {
  combos[T] = 0;
  for (let a = 1; a <= MAX; a++) for (let b = a; b <= MAX; b++) for (let c = b; c <= MAX; c++) if (a * b * c === T) combos[T]++;
}
const tg = $('#targets');
TARGETS.forEach(T => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.dataset.t = T;
  b.textContent = `${T} cm³`; tg.appendChild(b);
});
tg.addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  st.same.target = Number(b.dataset.t); checkSame(); updateUI();
});
function checkSame() {
  const s = st.same, v = s.l * s.w * s.h, T = s.target, el = $('#sameSay');
  const list = s.found[T];
  if (v === T) {
    const key = [s.l, s.w, s.h].sort((a, b) => a - b).join(' × ');
    if (list.includes(key)) {
      say(el, `${s.l} × ${s.w} × ${s.h} = ${v} cm³. You’ve found this one already: it’s ${key} turned round. Try a different shape!`);
    } else {
      list.push(key);
      if (list.length === combos[T]) say(el, `Amazing! ${s.l} × ${s.w} × ${s.h} = ${v} cm³. You found all ${combos[T]} cuboids!`, 'good');
      else say(el, `Yes! ${s.l} × ${s.w} × ${s.h} = ${v} cm³. That’s a new one. Can you find another?`, 'good');
    }
  } else if (v > T) say(el, `That makes ${v} cm³. That’s too many cubes — try again.`, 'try');
  else say(el, `That makes ${v} cm³. You need ${T - v} more ${T - v === 1 ? 'cube' : 'cubes'} — try again.`, 'try');
}

// ---------------- Mode switching ----------------
const INFO = {
  build: ['What is volume?', `
    <p>Volume is the amount of space a 3D shape takes up. We measure it in cubic centimetres, written <b>cm³</b>.</p>
    <p>Each cube is 1 cm long, 1 cm wide and 1 cm high. That is 1 cm³.</p>
    <p>Count the cubes in one layer: length × width. Then multiply by the number of layers: the height.</p>`],
  quiz: ['How many cubes are there?', `
    <p>Some cubes are hidden at the back and in the middle. You can’t see them all, so you can’t just count!</p>
    <p>Count the cubes along the length and the width. Multiply to find one layer. Then multiply by the number of layers.</p>
    <p class="note">Drag to turn the cuboid. Tap “Edge lengths” for a clue.</p>`],
  same: ['Can different cuboids have the same volume?', `
    <p>Yes! A long, thin cuboid and a short, wide one can hold the same number of cubes.</p>
    <p>Change the length, width and height to make the target volume. How many different cuboids can you find?</p>
    <p class="note">Turning a cuboid round does not make a new one: 2 × 3 × 4 is the same as 4 × 3 × 2.</p>`],
};
function setMode(m) {
  st.mode = m;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  for (const p of ['build', 'quiz', 'same']) $('#pane-' + p).hidden = p !== m;
  $('#infoTitle').textContent = INFO[m][0];
  $('#infoBody').innerHTML = INFO[m][1];
  anim.on = false;
  if (m === 'build') { explodeTarget = 0; shown = st.build.h; setCur(st.build); }
  if (m === 'same') { explodeTarget = 0; setCur(st.same); checkSame(); }
  if (m === 'quiz') {
    if (!st.quiz.started) { st.quiz.started = true; newQuestion(); }
    explodeTarget = st.quiz.done ? 1 : 0; setCur(st.quiz); pop.t0 = performance.now() / 1000;
  }
  makeLabels();
  updateUI();
  requestAnimationFrame(refit);
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); });

// ---------------- Readouts ----------------
let lastShownLayers = -1;
function updateUI(t = performance.now() / 1000) {
  const m = st.mode, rd = [];
  // steppers
  for (const g of ['build', 'same']) {
    const dims = st[g], box = document.querySelector(`.dims[data-group="${g}"]`);
    for (const d of ['l', 'w', 'h']) {
      box.querySelector(`output[data-v="${d}"]`).textContent = `${dims[d]} cm`;
      box.querySelector(`button[data-d="${d}"][data-s="-1"]`).disabled = dims[d] <= 1;
      box.querySelector(`button[data-d="${d}"][data-s="1"]`).disabled = dims[d] >= MAX;
    }
  }
  $('#foundList').innerHTML = '';
  if (m === 'build') {
    const { l, w, h } = st.build, n = l * w, v = n * h;
    const layersNow = anim.on ? landedLayers(t) : shown;
    lastShownLayers = layersNow;
    layerSl.max = h; layerSl.value = layersNow;
    $('#layerLab').textContent = `Layers: ${layersNow} of ${h}`;
    $('#buildEq').innerHTML = `<small>Volume = length × width × height</small>${l} × ${w} × ${h} = ${v} cm³`;
    $('#buildBtn').textContent = anim.on ? 'Building…' : 'Build it';
    $('#buildBtn').disabled = anim.on;
    rd.push(['Cubes in one layer', `${l} × ${w} = ${n}`], ['Number of layers', h], ['Volume', `${n} × ${h} = ${v} cm³`]);
    if (layersNow < h) rd.push(['Cubes so far', `${n * layersNow}`]);
  } else if (m === 'quiz') {
    const q = st.quiz;
    const box = $('#ansBox');
    box.textContent = q.entry || '?'; box.classList.toggle('empty', !q.entry);
    kp.querySelectorAll('button').forEach(b => b.disabled = q.done);
    $('#hintBtn').setAttribute('aria-pressed', String(q.hint || q.done));
    $('#hintBtn').disabled = q.done;
    $('#showBtn').hidden = q.done;
    $('#nextBtn').hidden = !q.done;
    $('#score').textContent = `Score: ${q.score} out of ${q.asked}`;
    rd.push(['Score', `${q.score} out of ${q.asked}`]);
    if (q.done) {
      const n = q.l * q.w;
      rd.push(['Cubes in one layer', `${q.l} × ${q.w} = ${n}`], ['Number of layers', q.h], ['Volume', `${n} × ${q.h} = ${n * q.h} cm³`]);
    } else if (q.hint) rd.push(['Edges', `${q.l} cm, ${q.w} cm, ${q.h} cm`]);
  } else {
    const s = st.same, v = s.l * s.w * s.h, list = s.found[s.target];
    tg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.t) === s.target)));
    $('#sameCount').textContent = `Found ${list.length} of ${combos[s.target]} cuboids for ${s.target} cm³`;
    rd.push(['Target', `${s.target} cm³`], ['Your cuboid', `${s.l} × ${s.w} × ${s.h} = ${v} cm³`], ['Found', `${list.length} of ${combos[s.target]}`]);
    $('#foundList').innerHTML = list.map(k => `<span>${k}</span>`).join('');
  }
  $('#readouts').innerHTML = rd.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}

// ---------------- Theme changes ----------------
function retheme() {
  makeGrid();
  if (ghost) ghost.material.color.set(tok('--ghost'));
  if (dimLines) dimLines.material.color.set(tok('--line'));
  makeLabels();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------- Layout + loop ----------------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  document.documentElement.style.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
  document.documentElement.style.setProperty('--ctl', $('#controls').offsetHeight + 'px');
  refit();
}
addEventListener('resize', resize);
const ro = new ResizeObserver(resize);
ro.observe($('#hdr')); ro.observe($('#controls')); ro.observe($('#info'));
$('#info').addEventListener('toggle', resize);

if (innerWidth < 640) $('#info').open = false;
makeGrid();
setCur(st.build);
setMode('build');
{ // start looking from the front right, a little above
  const dir = new THREE.Vector3(.55, .62, 1).normalize();
  camera.position.copy(dir.multiplyScalar(fit.dist)).add(new THREE.Vector3(0, fit.ty, 0));
  controls.target.set(0, fit.ty, 0);
}
resize();
// open on a quick build so pupils see the layers stack
anim.on = true; anim.t0 = performance.now() / 1000 + .3; anim.layerT = .9;

const clock = new THREE.Clock();
const V = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = performance.now() / 1000;
  // build animation finished?
  if (anim.on && t - anim.t0 > (cur.h - 1) * anim.layerT + SWEEP + FALL + .05) { anim.on = false; shown = cur.h; updateUI(t); }
  if (anim.on && st.mode === 'build' && landedLayers(t) !== lastShownLayers) updateUI(t);
  explode += (explodeTarget - explode) * Math.min(1, dt * 4);
  // ease the camera to frame the cuboid
  controls.target.y += (fit.ty - controls.target.y) * Math.min(1, dt * 4);
  if (fit.on) {
    V.subVectors(camera.position, controls.target);
    const d = V.length(), nd = d + (fit.dist - d) * Math.min(1, dt * 4);
    camera.position.copy(controls.target).add(V.setLength(nd));
    if (Math.abs(nd - fit.dist) < .01) fit.on = false;
  }
  placeCubes(t);
  placeLabels(t);
  controls.update();
  renderer.render(scene, camera);
});
</script>

</html>
