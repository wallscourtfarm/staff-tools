<!DOCTYPE html>
<html lang="en-GB">

<style>
  /* Layout: full-screen 3D landscape model; WFA-blue header; info card top-left;
     journey stops + buttons floating at the bottom; HTML labels pinned to 3D points. */
  :root {
    --brand: #1798d3;
    --on-brand: #ffffff;
    --sky1: #bfe0f3;
    --sky2: #eef7fc;
    --fog: #d9ecf7;
    --panel: rgba(255, 255, 255, 0.95);
    --edge: #c8dae7;
    --fg: #0a1a24;
    --muted: #4b6475;
    --ink: #0f6c99;
    --lbl-bg: rgba(255, 255, 255, 0.94);
    --lbl-fg: #0a1a24;
    --shadow: rgba(10, 40, 60, 0.16);
    --erosion: #b04a26;
    --transport: #a86f00;
    --deposit: #2c7d47;
    --chip-fg: #ffffff;
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px;
    --ctl: 120px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --sky1: #0b1824; --sky2: #1b3247; --fog: #172b3c;
    --panel: rgba(15, 27, 39, 0.95); --edge: #2b4459; --fg: #e8f1f6; --muted: #9fb6c7; --ink: #6cc6ef;
    --lbl-bg: rgba(15, 27, 39, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45);
    --erosion: #e88460; --transport: #e9b443; --deposit: #5cc884; --chip-fg: #0b1218; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --sky1: #0b1824; --sky2: #1b3247; --fog: #172b3c;
    --panel: rgba(15, 27, 39, 0.95); --edge: #2b4459; --fg: #e8f1f6; --muted: #9fb6c7; --ink: #6cc6ef;
    --lbl-bg: rgba(15, 27, 39, 0.92); --lbl-fg: #e8f1f6; --shadow: rgba(0, 0, 0, 0.45);
    --erosion: #e88460; --transport: #e9b443; --deposit: #5cc884; --chip-fg: #0b1218; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sky2); background-image: linear-gradient(180deg, var(--sky1), var(--sky2) 70%);
         color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 4;
    background: var(--brand); color: var(--on-brand);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .88; letter-spacing: .02em; }
  .where { margin-left: auto; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap;
         background: var(--lbl-bg); color: var(--lbl-fg); font-weight: 800; font-size: 13px; line-height: 1.2;
         padding: 4px 10px; border-radius: 999px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--edge);
         margin-top: -8px; transition: opacity .3s; }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 2px; height: 7px; background: var(--lbl-fg); opacity: .6; transform: translateX(-50%); }
  .lbl small { display: block; font-weight: 700; font-size: 11px; color: var(--muted); }

  .info {
    position: fixed; z-index: 3; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(350px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 48px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; color: var(--ink); }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.note { color: var(--muted); font-size: 13px; }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; min-width: 0; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 13px; color: var(--chip-fg); margin: 0 4px 3px 0; }
  .chip.erosion { background: var(--erosion); }
  .chip.transport { background: var(--transport); }
  .chip.deposit { background: var(--deposit); }

  .controls {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: min(820px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 4px 18px var(--shadow);
    display: flex; flex-direction: column; gap: 8px;
  }
  .stops { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .stops::-webkit-scrollbar { display: none; }
  .stops button { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .stops button b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px;
                    background: var(--edge); color: var(--fg); }
  .stops button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .stops button[aria-pressed="true"] b { background: var(--on-brand); color: var(--brand); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 8px 14px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--edge); background: transparent; color: var(--fg);
  }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  button[disabled] { opacity: .4; cursor: default; }
  button.ghost[aria-pressed="true"] { border-color: var(--brand); color: var(--ink); }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  footer {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: calc(5px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; font-weight: 700; color: var(--muted);
  }

  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .where { display: none; }
    .info { padding: 10px 12px; font-size: 14px; }
    .info summary { font-size: 16px; }
    .stops button { font-size: 14px; padding: 6px 10px; }
    .stops button span { display: none; }
    .stops button[aria-pressed="true"] span { display: inline; }
    .row button { flex: 1 1 auto; font-size: 14px; padding: 6px 10px; }
    .lbl { font-size: 12px; padding: 3px 8px; }
    footer { font-size: 10px; }
    footer .nts { display: none; }
    .info { max-height: min(42vh, calc(100% - var(--hdr) - var(--ctl) - 48px)); }
  }
</style>

<div id="scene"></div>
<div id="labels"></div>

<header id="hdr">
  <div class="brand">
    <h1>River Journey</h1>
    <span>Year 5 Geography · Rivers</span>
  </div>
  <div class="where" id="where">From source to sea</div>
</header>

<details class="info" id="info" open>

  <dl id="readouts"></dl>
</details>

<div class="controls" id="controls">
  <div class="stops" id="stops" role="group" aria-label="Stops along the river"></div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================= Helpers =================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function table(tab, x) {            // straight-line interpolation through [x, value] pairs

    const [x0, y0] = tab[i - 1], [x1, y1] = tab[i]; return lerp(y0, y1, (x - x0) / (x1 - x0));

}
function hash(i, j) {

  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295;

function vnoise(x, z) {

  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return lerp(lerp(hash(i, j), hash(i + 1, j), u), lerp(hash(i, j + 1), hash(i + 1, j + 1), u), v);
}
function fbm(x, z) { let s = 0, a = .5, f = 1; for (let o = 0; o < 4; o++) { s += a * vnoise(x * f, z * f); a *= .5; f *= 2.03; } return s / .9375; }
function seeded(seed) { let s = seed >>> 0; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
const rand = seeded(7);

// ================= The landscape plan =================
// x runs from the mountains (west, negative) to the sea (east, positive). 1 unit is roughly 30 m of height.
const X0 = -62, X1 = 62, Z0 = -32, Z1 = 32, STEP = 0.5;
const NX = Math.round((X1 - X0) / STEP) + 1, NZ = Math.round((Z1 - Z0) / STEP) + 1;
const SEA = 0.05;
const XS = -57, XE = 61, XW = -31, DROP = 2.6;     // source, end, waterfall position, waterfall height

const MAIN_PTS = [[-57,-13],[-52,-10.5],[-46,-7],[-40,-5],[-35,-6.5],[-31,-5],[-26,-3],[-21,0],
  [-16,-3.5],[-11,2.5],[-6,-3.5],[-1,2.5],[4,-3.5],[9,2],[14.5,-3.5],[18.5,0.6],[21.5,1],[24.5,1],[27.5,0.4],[33.5,4],[40,-1],[45,0],[51,0],[61,0]];
const toCurve = pts => new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
const mainCurve = toCurve(MAIN_PTS);

// River level along the river, by how far east the river has reached (cx). The waterfall is a sudden step.
function riverLevel(cx, xw = XW) {
  const u = clamp((cx - XS) / (XE - XS), 0, 1);
  return 0.06 + 15.5 * Math.pow(1 - u, 2.4) + DROP * (1 - sstep(xw - 0.12, xw + 0.12, cx));
}
const CW = [[-57,.16],[-46,.3],[-44,.38],[-21,.55],[-19,.68],[12,1.0],[44,1.6],[49,3.4],[54,6],[61,7]];        // half-width of channel
const DEPTH = [[-57,.25],[-21,.45],[12,.7],[44,.9],[52,.6]];
const FLOOD = [[-57,0],[-21,.3],[-10,2.4],[12,4],[20,9],[44,12],[61,12]];                                  // flat valley floor width
const RISE = [[-57,5],[-30,6],[-21,9],[12,12],[44,14]];                                                     // how far valley sides spread
const VSHAPE = [[-57,1],[-22,1],[-12,0],[61,0]];                                                             // 1 = straight V sides
const MINDEEP = [[-57,4],[-21,3],[12,1.2],[44,.5],[52,0]];
const LIFT = [[-57,0],[-21,.15],[12,.3],[44,.3],[50,.1]];
const LOWER = x => sstep(10, 16, x) * (1 - sstep(43, 47, x));            // 1 in the lower course
const BENDY = x => sstep(-22, -16, x) * (1 - sstep(42, 46, x));          // meander bank shapes
const ESTUARY = x => sstep(44, 49, x);

function hill(x, z) {
  const mf = sstep(-5, -50, x);
  let h = 1.5 + 22.5 * Math.pow(sstep(44, -62, x), 1.3);
  h += 4 * Math.pow(Math.abs(z) / 32, 2);
  h += (1 + 4.5 * mf) * (fbm(x * .06 + 3.1, z * .06 - 7.3) - .5) * 2;
  h += mf * Math.pow(Math.max(0, fbm(x * .11 + 11, z * .11 + 4) - .45), 2) * 22;
  return h;
}
const coast = (x, z) => 3.2 * sstep(46.5, 54, x + 3 * (fbm(z * .12, 5.5) - .5) * 2);   // land drops into the sea

// ---- polylines for distance lookups ----
function makePoly(curve, n) {
  const p = curve.getSpacedPoints(n), N = p.length;
  const px = new Float32Array(N), pz = new Float32Array(N), kx = new Float32Array(N), kz = new Float32Array(N);
  for (let i = 0; i < N; i++) { px[i] = p[i].x; pz[i] = p[i].z; }
  const tx = [], tz = [];
  for (let i = 0; i < N; i++) {
    const a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);
    let dx = px[b] - px[a], dz = pz[b] - pz[a]; const l = Math.hypot(dx, dz) || 1; tx.push(dx / l); tz.push(dz / l);
  }
  const ds = curve.getLength() / (N - 1);
  for (let i = 0; i < N; i++) {
    const a = Math.max(0, i - 2), b = Math.min(N - 1, i + 2);
    kx[i] = (tx[b] - tx[a]) / ((b - a) * ds); kz[i] = (tz[b] - tz[a]) / ((b - a) * ds);
  }
  return { px, pz, kx, kz, tx, tz, N };
}
const Q = { d: 0, cx: 0, i: 0, f: 0, inside: false, k: 0 };
function nearest(P, x, z) {
  let best = 1e9, bi = 0, bf = 0;
  const { px, pz, N } = P;
  for (let i = 0; i < N - 1; i++) {
    const ax = px[i], az = pz[i], bx = px[i + 1] - ax, bz = pz[i + 1] - az;
    let t = ((x - ax) * bx + (z - az) * bz) / (bx * bx + bz * bz); t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = x - ax - bx * t, dz = z - az - bz * t, d2 = dx * dx + dz * dz;
    if (d2 < best) { best = d2; bi = i; bf = t; }
  }
  Q.d = Math.sqrt(best); Q.i = bi; Q.f = bf;
  const qx = px[bi] + (px[bi + 1] - px[bi]) * bf, qz = pz[bi] + (pz[bi + 1] - pz[bi]) * bf;
  Q.cx = qx;
  const kx = P.kx[bi], kz = P.kz[bi];
  Q.k = Math.hypot(kx, kz); Q.inside = ((x - qx) * kx + (z - qz) * kz) > 0;
  return Q;
}
const mainPoly = makePoly(mainCurve, 420);

// Tributaries end exactly on the main river, so they meet at a confluence.
function nearestMainPoint(x, z) { nearest(mainPoly, x, z); const i = Q.i; return [mainPoly.px[i], mainPoly.pz[i]]; }
const joinA = nearestMainPoint(-47.5, -7.5), joinB = nearestMainPoint(-43, -6);
const tribs = [
  { pts: [[-59.5, 4], [-55.5, 0.5], [-51.5, -4.3], joinA] },
  { pts: [[-50, -26], [-47, -18.5], [-44.6, -11.5], joinB] },
].map(t => {
  const curve = toCurve(t.pts), poly = makePoly(curve, 70);
  const wj = riverLevel(t.pts[3][0]);
  const start = Math.min(hill(t.pts[0][0], t.pts[0][1]) - 3, wj + 6.5);
  return { curve, poly, wj, start, W: s => wj + (start - wj) * Math.pow(1 - s, 1.15) };
});

// Oxbow lake: the old meander loop, cut off where the river now runs straight across its neck.
// Its two ends sit just off the bank, sealed by a strip of silt.
const OX = { x: 23, z: 6.35, r: 3.2 };
const oxPts = [];
for (let i = 0; i <= 48; i++) { const a = (-62 + (i / 48) * 304) * Math.PI / 180; oxPts.push(new THREE.Vector3(OX.x + Math.cos(a) * OX.r, 0, OX.z + Math.sin(a) * OX.r * 0.85)); }
const oxCurve = new THREE.CatmullRomCurve3(oxPts, false);
const oxPoly = makePoly(oxCurve, 60);
const OX_LEVEL = riverLevel(OX.x) - 0.08;   // still water, a little below the flat ground round it
const OX_ENDS = [oxPts[0], oxPts[oxPts.length - 1]];   // where silt has sealed the old loop off

// ================= Build the height map =================
const H = new Float32Array(NX * NZ), KIND = new Uint8Array(NX * NZ), CXA = new Float32Array(NX * NZ), DA = new Float32Array(NX * NZ);
// KIND: 0 land, 1 river bed, 2 inside-bend sand, 3 river cliff, 4 floodplain, 5 mud, 6 lake bed, 7 levée, 8 soft rock
for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
  const x = X0 + i * STEP, z = Z0 + j * STEP, id = j * NX + i;
  const hl = hill(x, z);
  // --- main river ---
  nearest(mainPoly, x, z);
  const d = Q.d, cx = Q.cx;
  const cw = table(CW, cx) * (1 + 0.5 * Math.exp(-(((cx - XW - 0.9) / 0.7) ** 2)));

  const xe = lerp(cx, x, sstep(cwc, cwc + 5, d)), W = riverLevel(xe);

  const lift = table(LIFT, xe), bend = BENDY(cx) * clamp(Q.k / 0.22, 0, 1);

    const est = ESTUARY(cx);

      const mud = Math.max(0, fbm(x * .45 + 2, z * .45 - 9) - .44) * 5.5 * est * sstep(.2, .45, r) * (1 - sstep(.85, 1, r));

    }

    const hillE = Math.max(hl, W + lift + table(MINDEEP, xe));
    let shape = 0;
    if (e > fw) { const s = clamp((e - fw) / rw, 0, 1); shape = lerp(s * s * (3 - 2 * s), Math.pow(s, .9), lin); }
    h = W + lift + (hillE - W - lift) * shape;
    if (shape < .02 && fw > 1) kind = 4;
    const lev = LOWER(xe) * 0.34 * Math.exp(-(((e - 0.45) / 0.5) ** 2));
    if (lev > 0.08) kind = 7;
    h += lev;
    if (bend > .25) {
      if (!Q.inside) { const c = 0.9 * bend * (1 - sstep(0, 1.3, e)); h += c; if (c > .25) kind = 3; }
      else if (e < 0.9) kind = 2;
    }
    if (Math.abs(cx - XW) < 0.75 && h < riverLevel(XW - 1) - 0.65 && h > riverLevel(XW + 1) - 0.1 && e < 2.2) kind = 8;
  }
  CXA[id] = xe; DA[id] = d - cwc;
  // --- tributaries (take whichever valley is lowest) ---
  for (const t of tribs) {
    nearest(t.poly, x, z);
    if (Q.d > 9) continue;
    const s = (Q.i + Q.f) / (t.poly.N - 1), Wt = t.W(s), c2 = 0.16 + 0.12 * s + 0.15, hl2 = Math.max(hl, Wt + 2);
    const ht = Q.d < c2 ? Wt - 0.22 * (1 - (Q.d / c2) ** 2) : Wt + (hl2 - Wt) * clamp((Q.d - c2) / 4.5, 0, 1);
    if (ht < h) { h = ht; kind = Q.d < c2 ? 1 : 0; DA[id] = Math.min(DA[id], Q.d - c2); }
  }
  // --- oxbow lake ---

const apexM = bendApex(-9, -3, -1), apexM2 = bendApex(-4, 2, 1);
function bankPoint(r, outside, off) {   // point on the outside (or inside) bank of a bend
  const k = ribInfo.indexOf(r), a = ribInfo[Math.max(0, k - 6)], b = ribInfo[Math.min(ribInfo.length - 1, k + 6)];
  const cx = (a.x + b.x) / 2 - r.x, cz = (a.z + b.z) / 2 - r.z, l = Math.hypot(cx, cz) || 1;   // towards the inside
  const s = outside ? -1 : 1, px = r.x + s * cx / l * off, pz = r.z + s * cz / l * off;
  return V(px, heightAt(px, pz) + .25, pz);
}
const mudSpot = (() => {
  let best = null;
  for (let id = 0; id < H.length; id++) if (KIND[id] === 5) { const x = X0 + (id % NX) * STEP; if (!best || Math.abs(x - 48) < Math.abs(best.x - 48)) best = { x, z: Z0 + Math.floor(id / NX) * STEP, h: H[id] }; }
  return best ? V(best.x, best.h + .2, best.z) : onRiver(48);

// ================= Stops =================
const chip = (k, t) => `<span class="chip ${k}">${t}</span>`;
const E = chip('erosion', 'Erosion'), T = chip('transport', 'Transportation'), D = chip('deposit', 'Deposition');
const STOPS = [
  { id: 'whole', name: 'Whole river', q: 'What is a river basin?',
    p: ['A river begins high up at its source and flows downhill all the way to its mouth, where it meets the sea. Rivers never start at the coast.',
        'Smaller streams called tributaries join it on the way. All the land that drains water into the river and its tributaries is called the river basin.',
        'Geographers split the journey into the upper, middle and lower course. Tap a stop below to visit each part, or fly the whole river.'],
    dl: [['Starts', 'Source, on high ground'], ['Ends', 'Mouth, at the sea'], ['Flows', 'Always downhill'], ['Parts', 'Upper, middle and lower course']],
    view: () => ({ f: V(0, 2, 0), off: V(0, 62, 58), fit: 2.1, hw: 64 }),
    labels: () => [['Source', onRiver(XS + .5, .4)], ['Mouth', onRiver(50, .4)], ['Tributary', V(midTB.x, heightAt(midTB.x, midTB.z) + .3, midTB.z)],
      ['Upper course', onRiver(-33, .6)], ['Middle course', onRiver(-5, .6)], ['Lower course', onRiver(28, .6)], ['Sea', V(57, SEA, -16)],
      ['River basin', V(-8, heightAt(-8, 14) + .5, 14), 'land drained by the river']] },
  { id: 'source', name: 'Source', q: 'Where does a river begin?',
    p: ['Rain and snow fall on the mountains. This is called precipitation. Some water runs over the ground as run-off. Some soaks in as groundwater, then bubbles out of the ground at a spring.',
        'Tiny mountain streams trickle downhill. A stream that joins a bigger river is called a tributary. The place where they meet is a confluence.',
        'Up here the river is narrow and shallow, with a rocky bed and banks.'],
    dl: [['Height', 'About 600 m above sea level'], ['Gradient', 'Very steep'], ['Width', 'Less than 1 m'], ['Depth', 'Very shallow'], ['Main job', E]],
    view: () => ({ f: onRiver(-49, 0), off: V(13, 22, 17), fit: 1.6, hw: 15 }),
    labels: () => [['Spring', onRiver(XS + .3, .3), 'the source'], ['Snow', V(peak.x, peak.h + .4, peak.z)], ['Rain clouds', V(CLOUDS[0][0], CLOUDS[0][1] + 1.8, CLOUDS[0][2]), 'precipitation'],
      ['Tributary', V(midTB.x, heightAt(midTB.x, midTB.z) + .3, midTB.z)], ['Mountain stream', V(midTA.x, heightAt(midTA.x, midTA.z) + .3, midTA.z)],
      ['Confluence', V(joinA[0], riverLevel(joinA[0]) + .3, joinA[1]), 'streams meet']] },
  { id: 'upper', name: 'Upper course', q: 'Why are mountain valleys V-shaped?',
    p: ['The river wears away its bed and banks and carries the bits downstream. This is erosion. Over thousands of years the river cuts down into the land and carves a steep V-shaped valley.',
        'At the waterfall, a layer of hard rock sits on top of soft rock. The soft rock is eroded faster, leaving an overhang. The falling water digs out a deep plunge pool. When the overhang collapses, the waterfall moves back up the valley.',
        { note: 'Mountain streams look fast as they splash, but bumping over boulders slows the water down. Erosion is not the same as weathering: weathering breaks rock where it is; erosion carries it away.' }],
    dl: [['Height', 'About 300 to 500 m'], ['Gradient', 'Steep'], ['Width', '1 to 5 m'], ['Velocity', 'Slower than it looks'], ['Main job', E]],
    view: () => { const f = V(FALL_AT.x - WF.tx * .5, LOW_LEVEL + 1.3, FALL_AT.z - WF.tz * .5); return { f, off: V(WF.tx * 8 - WF.tz * 4, 4.2, WF.tz * 8 + WF.tx * 4), fit: 1.5, hw: 6 }; },
    labels: () => [['Waterfall', V(FALL_AT.x, UP_LEVEL + .45, FALL_AT.z)], ['Hard rock', beside(XW - .2, 1.35, -.15)], ['Overhang', V(FALL_AT.x - WF.tz * .9, UP_LEVEL - .5, FALL_AT.z + WF.tx * .9)],
      ['Soft rock', beside(XW + .05, -1.25, -.6)], ['Plunge pool', V(FALL_AT.x + WF.tx * .9, LOW_LEVEL + .2, FALL_AT.z + WF.tz * .9)],
      ['V-shaped valley', beside(-38, 4.2, .3)], ['Boulders', onRiver(-25, .25)]] },
  { id: 'middle', name: 'Middle course', q: 'Why does a river bend?',
    p: ['The land is gentler and the valley is wider. Tributaries have added more water, so the river is wider and deeper. It transports the rocks and soil it has eroded, rolling and bouncing them along.',
        'The river swings from side to side in bends called meanders. On the outside of each bend the water flows fastest. It erodes the bank and makes a steep river cliff.',

        { note: 'Fieldwork idea: time a floating stick over 10 m. Velocity = distance ÷ time.' }],
    dl: [['Height', 'About 50 to 200 m'], ['Gradient', 'Gentle'], ['Width', '10 to 30 m'], ['Velocity', 'Faster'], ['Main jobs', T + E + D]],
    view: () => ({ f: V(apexM.x, apexM.y, apexM.z + 1), off: V(2, 15, 15), fit: 1.5 }),
    labels: () => [['Meander', onRiver(-11, .4)], ['River cliff', bankPoint(apexM, true, 1.6), 'outside bend: erosion'], ['Slip-off slope', bankPoint(apexM2, false, 1.3), 'inside bend: deposition'],
      ['Wide valley', beside(-12, 9, .3)]] },
  { id: 'lower', name: 'Lower course', q: 'What happens when a river floods?',
    p: ['The land is almost flat now. The river is at its widest and deepest. Its smooth, deep channel lets it flow even faster than the mountain stream, carrying lots of fine mud called silt.',

    view: () => ({ f: V(24, 1.4, 3), off: V(-3, 15, 17), fit: 1.5 }),
    labels: () => [['Oxbow lake', V(OX.x, OX_LEVEL + .2, OX.z + OX.r * .85)], ['Floodplain', V(30, heightAt(30, -10) + .2, -10), 'farmland'],
      ['Levée', beside(25.5, -(table(CW, 25.5) * 1.12 + .65)), 'raised bank'], ['Cut-off', onRiver(21.5, .4), 'the river\'s new, straighter course'], ['Meander', onRiver(32, .4)]] },

    p: ['The mouth is where the river meets the sea. This river ends in a wide estuary. Fresh river water mixes with salty seawater, and the tide flows in and out twice a day.',

    dl: [['Height', '0 m (sea level)'], ['Gradient', 'Flat'], ['Width', 'Up to several kilometres'], ['Water', 'Fresh and salty mixed'], ['Main job', D]],
    view: () => ({ f: V(48, .5, 1), off: V(-13, 13, 17), fit: 1.5 }),
    labels: () => [['Estuary', onRiver(51, .3)], ['Mudflats', mudSpot], ['Sea', V(58.5, SEA, -12)], ['Town', V(TOWN.x, heightAt(TOWN.x, TOWN.z) + 1, TOWN.z), 'ports grow at river mouths'],
      ['Mouth', onRiver(54.5, .3), 'where the river meets the sea']] },
];
const STOP_X = [-1e9, -1e9, -42.5, -21, 12, 44];       // where each part starts along the river

// ================= UI =================
const $ = id => document.getElementById(id);
const stopsEl = $('stops'), lblLayer = $('labels');
STOPS.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.i = i;
  b.innerHTML = `<b>${i === 0 ? '★' : i}</b><span>${s.name}</span>`; b.setAttribute('aria-label', s.name);
  b.addEventListener('click', () => { stopFly(); setStop(i, true); });
  stopsEl.appendChild(b);
});
let cur = -1, labelEls = [], showLabels = true;
function setStop(i, move) {
  if (i === cur && !move) return;
  cur = i; const s = STOPS[i];
  [...stopsEl.children].forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  stopsEl.children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  $('infoTitle').textContent = s.q;
  $('infoBody').innerHTML = s.p.map(p => typeof p === 'string' ? `<p>${p}</p>` : `<p class="note">${p.note}</p>`).join('');
  $('readouts').innerHTML = s.dl.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('where').textContent = i === 0 ? 'From source to sea' : `Stop ${i} of 5 · ${s.name}`;
  $('prev').disabled = i === 0; $('next').disabled = i === STOPS.length - 1;
  lblLayer.innerHTML = '';
  labelEls = s.labels().map(([text, pos, sub]) => {
    const el = document.createElement('div'); el.className = 'lbl';
    el.innerHTML = sub ? `${text}<small>${sub}</small>` : text; lblLayer.appendChild(el); return { el, pos };
  });
  if (move) goTo(s.view());
}
$('prev').addEventListener('click', () => { stopFly(); if (cur > 0) setStop(cur - 1, true); });
$('next').addEventListener('click', () => { stopFly(); if (cur < STOPS.length - 1) setStop(cur + 1, true); });
$('lblBtn').addEventListener('click', () => {
  showLabels = !showLabels; $('lblBtn').setAttribute('aria-pressed', String(showLabels)); lblLayer.hidden = !showLabels;
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click();
});

// ---- camera moves ----
let tween = null;
function viewPose(v) {
  const need = (v.hw || 18) / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect) / v.off.length();
  const k = clamp(need, 1, v.fit || 1.5);
  return { pos: v.f.clone().add(v.off.clone().multiplyScalar(k)), target: v.f.clone() };
}
function goTo(v, dur = 2) {
  const p = viewPose(v);
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p.pos, t1: p.target, s: 0,
            dur, arc: Math.min(25, camera.position.distanceTo(p.pos) * .25) };
  controls.enabled = false;
}
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);
function tickTween(dt) {
  if (!tween) return;
  tween.s = Math.min(1, tween.s + dt / tween.dur);
  const e = smoother(tween.s);
  camera.position.lerpVectors(tween.p0, tween.p1, e); camera.position.y += Math.sin(Math.PI * e) * tween.arc;
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  camera.lookAt(controls.target);
  if (tween.s >= 1) { tween = null; controls.enabled = true; }
}

// ---- fly the whole river ----
let fly = null;
const flyBtn = $('fly');
flyBtn.addEventListener('click', () => { if (fly) { stopFly(); setStop(cur, true); } else startFly(); });
function startFly() {
  tween = null; controls.enabled = false;
  fly = { t: 0, look: onRiver(XS + 3, 0) };
  flyBtn.setAttribute('aria-pressed', 'true'); flyBtn.textContent = 'Stop flying';
}
function stopFly() {
  if (!fly) return; fly = null; controls.enabled = true;
  flyBtn.setAttribute('aria-pressed', 'false'); flyBtn.textContent = 'Fly the whole river';
}
function sampleRib(t) { const f = clamp(t, 0, 1) * (ribInfo.length - 1), k = Math.floor(f); return ribInfo[Math.min(k, ribInfo.length - 1)]; }
function tickFly(dt) {
  if (!fly) return;
  fly.t += dt / 55;
  const r = sampleRib(fly.t), ahead = sampleRib(fly.t + .045);
  let s = 1; for (let k = 1; k < STOP_X.length; k++) if (r.x >= STOP_X[k]) s = k;
  if (s !== cur) setStop(s, false);
  const back = 7, cx = r.x - r.tx * back, cz = r.z - r.tz * back;
  const cy = Math.max(r.y + 5.5, heightAt(cx, cz) + 3, heightAt(r.x, r.z) + 4);
  const want = V(cx, cy, cz), look = V(ahead.x, ahead.y, ahead.z);
  const a = 1 - Math.exp(-dt * 2.2);
  camera.position.lerp(want, a); fly.look.lerp(look, a);
  controls.target.copy(fly.look); camera.lookAt(fly.look);
  if (fly.t >= 1) { stopFly(); setStop(5, true); }
}

// ---- labels follow their 3D points ----
const pv = new THREE.Vector3();
function tickLabels() {
  if (!showLabels) return;
  const w = innerWidth, h = innerHeight;
  for (const { el, pos } of labelEls) {
    pv.copy(pos).project(camera);
    const vis = pv.z < 1 && pv.x > -1.1 && pv.x < 1.1 && pv.y > -1.1 && pv.y < 1.1;
    el.style.opacity = vis ? '1' : '0';
    if (vis) el.style.transform = `translate(${((pv.x + 1) / 2 * w).toFixed(1)}px, ${((1 - pv.y) / 2 * h).toFixed(1)}px) translate(-50%, -100%)`;
  }
}

// ---- theme: fog follows the page colours ----
function syncTheme() {
  const fog = getComputedStyle(document.documentElement).getPropertyValue('--fog').trim() || '#d9ecf7';
  scene.fog.color.set(fog);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
syncTheme();

// ---- sizes ----
function measure() {
  const r = document.documentElement.style;
  r.setProperty('--hdr', $('hdr').offsetHeight + 'px');
  r.setProperty('--ctl', $('controls').offsetHeight + 'px');
}
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); measure();
}
addEventListener('resize', resize);
new ResizeObserver(measure).observe($('controls'));
resize();
if (innerWidth < 640) $('info').open = false;

// start on the whole-river view
setStop(0, false);
{ const p = viewPose(STOPS[0].view()); camera.position.copy(p.pos); controls.target.copy(p.target); }

// test hook: lets a checker step the animation when the tab is in the background
window.__river = { step: (n = 60) => { for (let k = 0; k < n; k++) { const dt = 1 / 30; tickTween(dt); tickFly(dt); } controls.update(); renderer.render(scene, camera); tickLabels(); } };

// ================= Animation loop =================
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  flowTex.offset.x -= dt * .17;
  fallTex.offset.x -= dt * 1.1;
  lakeTex.offset.x += dt * .004;
  seaTex.offset.x += dt * .01; seaTex.offset.y += dt * .006;
  tickSpray(dt); tickRain(dt);
  tickTween(dt); tickFly(dt);
  if (!tween && !fly) controls.update();
  renderer.render(scene, camera);
  tickLabels();
});
</script>
