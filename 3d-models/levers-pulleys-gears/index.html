<!DOCTYPE html>
<html lang="en-GB">
<head>
<link rel="icon" type="image/png" href="../../favicon.png">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levers, Pulleys and Gears</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen 3D workshop; WFA-blue header with three tabs; info card top-left;
     controls floating at the bottom. Light palette with a matching dark one. */
  :root {
    --bg: #eef6fb; --surface: #ffffff; --panel: rgba(255,255,255,.95); --edge: #cfe2ee;
    --fg: #0a0101; --muted: #4a6070; --blue: #1798d3; --on-blue: #ffffff;
    --load: #d4433b; --effort: #1c9a57; --ground: #d9eaf3; --grid: #b5d3e6; --shadow: rgba(10,40,60,.14);
    --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    --hdr: 64px; --ctl: 90px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1c24; --surface: #1a2c37; --panel: rgba(26,44,55,.95); --edge: #2d4756;
    --fg: #e8f1f6; --muted: #9fb5c3; --blue: #3aaee3; --on-blue: #04121a;
    --load: #ff6f66; --effort: #47cc84; --ground: #17303d; --grid: #29495a; --shadow: rgba(0,0,0,.45);
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1c24; --surface: #1a2c37; --panel: rgba(26,44,55,.95); --edge: #2d4756;
    --fg: #e8f1f6; --muted: #9fb5c3; --blue: #3aaee3; --on-blue: #04121a;
    --load: #ff6f66; --effort: #47cc84; --ground: #17303d; --grid: #29495a; --shadow: rgba(0,0,0,.45);
    color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }
  #labels { position: absolute; top: 0; left: 0; pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    background: var(--blue); color: var(--on-blue);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
  .brand span { font-size: 13px; font-weight: 700; opacity: .9; letter-spacing: .02em; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tabs button {
    font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 6px 16px;
    border-radius: 999px; border: 2px solid currentColor; background: transparent; color: var(--on-blue); cursor: pointer; opacity: .9;
  }
  .tabs button[aria-selected="true"] { background: var(--on-blue); color: var(--blue); border-color: var(--on-blue); opacity: 1; }

  .info {
    position: fixed; z-index: 2; left: var(--gutter-l); top: calc(var(--hdr) + 12px);
    width: min(330px, calc(100% - 32px)); max-height: calc(100% - var(--hdr) - var(--ctl) - 40px); overflow: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px var(--shadow);
  }
  .info summary { font-weight: 800; font-size: 17px; cursor: pointer; line-height: 1.3; text-wrap: balance; min-height: 24px; }
  .info p { margin: 8px 0 0; line-height: 1.45; }
  .info p.say { font-weight: 700; background: color-mix(in srgb, var(--blue) 12%, transparent); border-radius: 10px; padding: 8px 10px; }
  .info p.note { color: var(--muted); font-size: 13px; }
  dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; font-weight: 700; }
  dd { margin: 0; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.load { background: var(--load); } .dot.effort { background: var(--effort); }

  .controls {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    width: min(820px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; box-shadow: 0 4px 18px var(--shadow);
  }
  .set { display: contents; }
  [hidden] { display: none !important; }
  .btn {
    font: inherit; font-weight: 800; font-size: 16px; min-height: 44px; padding: 8px 18px; border-radius: 12px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue); color: var(--on-blue);
  }
  .btn.ghost { background: transparent; color: var(--blue); }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > span { font-weight: 800; font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; border: 2px solid var(--blue); border-radius: 12px; overflow: hidden; }
  .seg button { font: inherit; font-weight: 800; font-size: 15px; min-height: 40px; min-width: 44px; padding: 6px 10px;
    border: 0; background: transparent; color: var(--fg); cursor: pointer; }
  .seg button + button { border-left: 2px solid var(--blue); }
  .seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
  select { font: inherit; font-weight: 800; font-size: 16px; min-height: 44px; border-radius: 12px; border: 2px solid var(--blue);
    background: var(--surface); color: var(--fg); padding: 6px 8px; }
  .slider { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .slider span { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slider input { width: 100%; height: 30px; accent-color: var(--blue); }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  .lbl { font: 800 13px/1.2 var(--font); color: var(--fg); background: var(--surface); border: 2px solid var(--edge);
    border-radius: 999px; padding: 3px 10px; white-space: nowrap; box-shadow: 0 2px 6px var(--shadow); }
  .lbl.load { border-color: var(--load); }
  .lbl.effort { border-color: var(--effort); }
  .lbl.small { font-size: 12px; padding: 2px 8px; }
  .lbl.right { translate: calc(50% + 14px) 0; }
  .lbl.left { translate: calc(-50% - 14px) 0; }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: calc(5px + env(safe-area-inset-bottom, 0px));
    padding-left: var(--gutter-l); padding-right: var(--gutter-r);
    text-align: center; font-size: 11px; color: var(--muted);
  }
  @media (max-width: 640px) {
    h1 { font-size: 18px; }
    .tabs { margin-left: 0; }
    .tabs button { font-size: 14px; padding: 5px 13px; }
    .controls { padding: 8px 10px; gap: 6px 10px; }
    .lbl { font-size: 11px; padding: 2px 7px; }
  }
</style>

<div id="scene"></div>

<header id="hdr">
  <div class="brand">
    <h1>Levers, Pulleys and Gears</h1>
    <span>Year 5 Science · Forces</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Choose a mechanism">
    <button role="tab" data-mode="lever" aria-selected="true">Levers</button>
    <button role="tab" data-mode="pulley" aria-selected="false">Pulleys</button>
    <button role="tab" data-mode="gear" aria-selected="false">Gears</button>
  </nav>
</header>

<details class="info" id="info" open>
  <summary id="infoTitle"></summary>
  <div id="infoBody"></div>
  <p class="say" id="say"></p>
  <dl id="readouts"></dl>
  <p class="note" id="note"></p>
</details>

<div class="controls" id="controls">
  <div class="set" data-set="lever">
    <button class="btn" id="pushBtn" type="button">Push down</button>
    <label class="slider"><span id="pivotLbl">Pivot</span><input id="pivotSl" type="range" min="0.6" max="3.4" step="0.1" value="1.2" aria-label="Move the pivot"></label>
  </div>
  <div class="set" data-set="pulley" hidden>
    <button class="btn" id="pullBtn" type="button">Pull</button>
    <div class="grp"><span>Ropes</span><div class="seg" id="ropeSeg">
      <button type="button" data-n="1">1</button><button type="button" data-n="2" aria-pressed="true">2</button><button type="button" data-n="4">4</button>
    </div></div>
    <label class="slider"><span id="pullLbl">Rope pulled</span><input id="pullSl" type="range" min="0" max="100" value="0" aria-label="Pull the rope"></label>
  </div>
  <div class="set" data-set="gear" hidden>
    <button class="btn" id="playBtn" type="button">Play</button>
    <label class="slider"><span id="turnLbl">Driver gear turns</span><input id="turnSl" type="range" min="0" max="4" step="0.05" value="0" aria-label="Turn the driver gear"></label>
    <label class="grp"><span>Driver</span><select id="n1Sel"></select></label>
    <label class="grp"><span>Gear 2</span><select id="n2Sel"></select></label>
    <button class="btn ghost" id="thirdBtn" type="button" aria-pressed="false">Add gear 3</button>
  </div>
  <div class="set" data-set="lever pulley">
    <div class="grp"><span>Load</span><div class="seg" id="kgSeg">
      <button type="button" data-kg="20">20 kg</button><button type="button" data-kg="50" aria-pressed="true">50 kg</button><button type="button" data-kg="100">100 kg</button>
    </div></div>
  </div>
</div>

<footer>Wallscourt Farm Academy · Y5-17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------- Helpers ----------------
const $ = id => document.getElementById(id);
const rootEl = document.documentElement;
const css = n => getComputedStyle(rootEl).getPropertyValue(n).trim();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth01 = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const fmt = (x, dp = 1) => Number(x.toFixed(dp)).toLocaleString('en-GB', { maximumFractionDigits: dp });
const N = x => Math.round(x).toLocaleString('en-GB');
const TAU = Math.PI * 2;
const V1 = new THREE.Vector3(), V2 = new THREE.Vector3();
const approach = (v, t, step) => Math.abs(t - v) <= step ? t : v + Math.sign(t - v) * step;

// ---------------- State ----------------
const S = {
  mode: 'lever', kg: 50,
  pivot: 1.2, push: 0, pushTarget: 0,           // lever (pivot = metres from the load)
  ropes: 2, pull: 0, pullTarget: null,          // pulleys
  T: 0, playing: false, n1: 16, n2: 32, third: false,  // gears
};

// ---------------- Renderer, camera, lights ----------------
const wrap = $('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.id = 'labels';
wrap.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 - 0.04;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8fa9b8, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------------- Shared materials ----------------
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, ...extra });
const M = {
  ground: mat(0xd9eaf3, { roughness: 1 }),
  load: mat(0xd4433b, { roughness: 0.45 }),
  effort: mat(0x1c9a57, { roughness: 0.45 }),
  wood: mat(0xc98f55), darkWood: mat(0x8a5a2e), metal: mat(0x5d7380, { metalness: 0.3, roughness: 0.45 }),
  steel: mat(0x9aa7b0, { metalness: 0.5, roughness: 0.35 }), dark: mat(0x2b3940, { metalness: 0.3 }),
  wheel: mat(0x1798d3, { metalness: 0.2, roughness: 0.4 }), rope: mat(0xcaa46a, { roughness: 0.9 }),
  board: mat(0xe9d8b9, { roughness: 0.85 }), white: mat(0xffffff, { roughness: 0.3 }),
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), M.ground);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(30, 30, 0xffffff, 0xffffff);
grid.position.y = 0.003;
grid.material.transparent = true; grid.material.opacity = 0.7;
scene.add(grid);

function applyTheme() {
  M.ground.color.set(css('--ground'));
  grid.material.color.set(css('--grid'));
  M.load.color.set(css('--load'));
  M.effort.color.set(css('--effort'));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(rootEl, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------- Labels (HTML tags that follow 3D points) ----------------
const labels = { lever: [], pulley: [], gear: [] };
function label(mode, text, cls = '') {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls;
  el.textContent = text;
  const o = new CSS2DObject(el);
  o.userData.t = text;
  o.visible = S.mode === mode;
  labels[mode].push(o);
  return o;
}
function setText(o, t) { if (o.userData.t !== t) { o.element.textContent = t; o.userData.t = t; } }

// ---------------- Arrows (tip at the group's origin, pointing down) ----------------
const headGeo = new THREE.ConeGeometry(0.13, 0.3, 20); headGeo.rotateX(Math.PI); headGeo.translate(0, 0.15, 0);
const shaftGeo = new THREE.CylinderGeometry(0.045, 0.045, 1, 14); shaftGeo.translate(0, 0.5, 0);
function makeArrow(m) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(shaftGeo, m), new THREE.Mesh(headGeo, m));
  g.children.forEach(c => c.castShadow = true);
  return g;
}
const FORCE_SCALE = 1 / 450;                 // metres of arrow per newton
const arrowLen = n => clamp(n * FORCE_SCALE, 0.08, 3.4);
function setArrow(g, len) {
  const L = Math.max(len, 0.45), s = len < 0.45 ? len / 0.45 : 1;
  g.scale.setScalar(s);
  g.children[0].position.y = 0.28;
  g.children[0].scale.y = L - 0.28;
  return L * s;
}

// ---------------- Textures ----------------
try { await document.fonts.load('800 54px Nunito'); } catch (e) {}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function crateTexture(kg) {
  return canvasTex(256, 256, (g) => {
    g.fillStyle = '#c08a52'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = '#8a5a2e'; g.lineWidth = 5;
    for (let y = 64; y < 256; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); }
    g.lineWidth = 16; g.strokeRect(8, 8, 240, 240);
    g.lineWidth = 12; g.beginPath(); g.moveTo(16, 240); g.lineTo(240, 16); g.stroke();
    g.fillStyle = '#fff8ec'; g.beginPath(); g.roundRect(40, 90, 176, 76, 14); g.fill();
    g.fillStyle = '#0a0101'; g.font = '800 54px Nunito, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(`${kg} kg`, 128, 131);
  });
}
const rulerTex = canvasTex(1024, 128, (g, w, h) => {
  g.fillStyle = '#d7a466'; g.fillRect(0, 0, w, h);
  const rnd = (() => { let s = 7; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();
  g.strokeStyle = 'rgba(120,70,30,.25)'; g.lineWidth = 2;
  for (let i = 0; i < 22; i++) { const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 6, w * .6, y - 6, w, y + 3); g.stroke(); }
  g.fillStyle = '#4a2c12';
  const pxm = w / 4.6;
  for (let i = 0; i <= 46; i++) {
    const x = i * pxm / 10, big = i % 10 === 0 ? 34 : i % 5 === 0 ? 24 : 13;
    g.fillRect(x - 1.5, 0, 3, big); g.fillRect(x - 1.5, h - big, 3, big);
  }
});
let crateTex = crateTexture(S.kg);
const crateMats = [mat(0xffffff, { map: crateTex }), mat(0xffffff, { map: crateTex })];
function setKg(kg) {
  S.kg = kg;
  const old = crateTex; crateTex = crateTexture(kg);
  crateMats.forEach(m => { m.map = crateTex; m.needsUpdate = true; });
  old.dispose();
}

// ---------------- Groups for each mode ----------------
const G = { lever: new THREE.Group(), pulley: new THREE.Group(), gear: new THREE.Group() };
Object.values(G).forEach(g => scene.add(g));
const castAll = obj => obj.traverse(o => { if (o.isMesh) o.castShadow = true; });

// =====================================================================
// LEVER: a plank on a pivot lifting a crate
// =====================================================================
const LV = { H: 0.45, HALF: 2.3, LX: 2.0, EX: 2.0, TH: 0.12, D: 0.6 };
const fulShape = new THREE.Shape();
fulShape.moveTo(-0.32, 0); fulShape.lineTo(0.32, 0); fulShape.lineTo(0, LV.H); fulShape.closePath();
const fulGeo = new THREE.ExtrudeGeometry(fulShape, { depth: 0.5, bevelEnabled: false });
fulGeo.translate(0, 0, -0.25);
const fulcrum = new THREE.Mesh(fulGeo, M.metal);
G.lever.add(fulcrum);
const pivotG = new THREE.Group();
G.lever.add(pivotG);
const rulerMat = mat(0xffffff, { map: rulerTex });
const plank = new THREE.Mesh(new THREE.BoxGeometry(LV.HALF * 2, LV.TH, LV.D), [M.wood, M.wood, rulerMat, M.wood, M.wood, M.wood]);
pivotG.add(plank);
const leverCrate = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), crateMats[0]);
pivotG.add(leverCrate);
const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 28), M.effort);
pivotG.add(pad);
const stripGeo = new THREE.BoxGeometry(1, 0.05, 0.02);
const stripL = new THREE.Mesh(stripGeo, M.load), stripE = new THREE.Mesh(stripGeo, M.effort);
pivotG.add(stripL, stripE);
const lblDL = label('lever', '', 'small load'), lblDE = label('lever', '', 'small effort');
pivotG.add(lblDL, lblDE);
const arrLoadL = makeArrow(M.load), arrEffL = makeArrow(M.effort);
G.lever.add(arrLoadL, arrEffL);
const lblLoadL = label('lever', '', 'load'), lblEffL = label('lever', '', 'effort'), lblPivot = label('lever', 'Pivot', 'small');
G.lever.add(lblLoadL, lblEffL, lblPivot);
const barGeo = new THREE.BoxGeometry(0.05, 1, 0.05);
const barL = new THREE.Mesh(barGeo, M.load), barE = new THREE.Mesh(barGeo, M.effort);
G.lever.add(barL, barE);
const lblBarL = label('lever', '', 'small load left'), lblBarE = label('lever', '', 'small effort right');
G.lever.add(lblBarL, lblBarE);
castAll(G.lever);
barL.castShadow = barE.castShadow = false;

function leverUpdate(dt) {
  const { H, HALF, LX, EX, TH, D } = LV;
  if (S.push !== S.pushTarget) {
    S.push = approach(S.push, S.pushTarget, dt / 1.6);
    if (S.push === S.pushTarget) $('pushBtn').textContent = S.pushTarget ? 'Let go' : 'Push down';
  }
  const dL = S.pivot, p = dL - LX, dE = EX - p;
  const th0 = Math.asin(H / (p + HALF)), th1 = -Math.asin(H / (HALF - p));
  const th = th0 + (th1 - th0) * smooth01(S.push);
  fulcrum.position.x = p;
  pivotG.position.set(p, H, 0);
  pivotG.rotation.z = th;
  plank.position.set(-p, TH / 2, 0);
  leverCrate.position.set(-dL, TH + 0.25, 0);
  pad.position.set(dE, TH + 0.025, 0);
  stripL.scale.x = dL; stripL.position.set(-dL / 2, TH * 0.5, D / 2 + 0.012);
  stripE.scale.x = dE; stripE.position.set(dE / 2, TH * 0.5, D / 2 + 0.012);
  lblDL.position.set(-dL / 2, -0.17, D / 2); setText(lblDL, `${fmt(dL)} m`);
  lblDE.position.set(dE / 2, -0.17, D / 2); setText(lblDE, `${fmt(dE)} m`);
  pivotG.updateMatrixWorld(true);

  const loadN = S.kg * 10, effN = loadN * dL / dE;
  const top = pivotG.localToWorld(V1.set(-dL, TH + 0.5, 0));
  const lenL = setArrow(arrLoadL, arrowLen(loadN));
  arrLoadL.position.set(top.x, top.y + 0.04, 0);
  lblLoadL.position.set(top.x, top.y + 0.04 + lenL + 0.22, 0);
  setText(lblLoadL, `Load ${N(loadN)} N`);
  const ep = pivotG.localToWorld(V2.set(dE, TH + 0.05, 0));
  const lenE = setArrow(arrEffL, arrowLen(effN));
  arrEffL.position.copy(ep);
  lblEffL.position.set(ep.x, ep.y + lenE + 0.22, 0);
  setText(lblEffL, `Effort ${N(effN)} N`);
  lblPivot.position.set(p, 0.14, 0.3);

  // How far each end has moved since the start
  const lift = dL * (Math.sin(th0) - Math.sin(th)), drop = dE * (Math.sin(th0) - Math.sin(th));
  const yL0 = H - dL * Math.sin(th0) + TH * Math.cos(th0), yE = H + dE * Math.sin(th) + TH * Math.cos(th);
  const show = S.push > 0.01;
  barL.visible = barE.visible = show;
  lblBarL.visible = lblBarE.visible = show && !narrow();
  if (show) {
    const xL = p - dL * Math.cos(th) - 0.42, xE = p + dE * Math.cos(th) + 0.3;
    barL.position.set(xL, yL0 + lift / 2, 0); barL.scale.y = Math.max(lift, 0.001);
    lblBarL.position.set(xL, yL0 + lift / 2, 0); setText(lblBarL, `Lifted ${N(lift * 100)} cm`);
    barE.position.set(xE, yE + drop / 2, 0); barE.scale.y = Math.max(drop, 0.001);
    lblBarE.position.set(xE, yE + drop / 2, 0); setText(lblBarE, `Pushed ${N(drop * 100)} cm`);
  }

  $('pivotLbl').textContent = `Pivot: ${fmt(dL)} m from the load`;
  const r = dE / dL;
  let t;
  if (r > 1.02) t = `Your end is ${fmt(r)} times as far from the pivot as the load. So you only need ${N(effN)} N to lift ${N(loadN)} N.`;
  else if (r < 0.98) t = `The load is further from the pivot than your end. You need ${N(effN)} N, more than the load's ${N(loadN)} N!`;
  else t = `The pivot is in the middle, so you push with the same force as the load: ${N(effN)} N.`;
  if (S.push > 0.05) t += ` You pushed down ${N(drop * 100)} cm to lift the load ${N(lift * 100)} cm.`;
  say(t);
  readouts([
    ['Load', `<span class="dot load"></span>${S.kg} kg = ${N(loadN)} N`],
    ['Effort needed', `<span class="dot effort"></span>${N(effN)} N`],
    ['Load to pivot', `${fmt(dL)} m`],
    ['Effort to pivot', `${fmt(dE)} m`],
    ['Load lifted', `${N(lift * 100)} cm`],
    ['Your end moved', `${N(drop * 100)} cm`],
  ]);
}

const PL = { FY: 4.75, BEAM: 5.35, CH: 0.8, LIFT: 0.8 };
{ // the wooden frame

  const beam = new THREE.Mesh(new THREE.BoxGeometry(4.9, 0.2, 0.3), M.wood);

const ropeGeo = new THREE.CylinderGeometry(0.03, 0.03, 1, 10);

G.pulley.add(rig);
const arrLoadP = makeArrow(M.load), arrEffP = makeArrow(M.effort);

function makeWheel(r, fixed, cheekLen) {
  const g = new THREE.Group(), wheel = new THREE.Group();
  g.add(wheel);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r - 0.015, r - 0.015, 0.09, 36), M.wheel);
  disc.rotation.x = Math.PI / 2; wheel.add(disc);
  for (const z of [-0.055, 0.055]) {
    const f = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.05, r + 0.05, 0.02, 36), M.wheel);
    f.rotation.x = Math.PI / 2; f.position.z = z; wheel.add(f);
  }
  for (const a of [0, Math.PI / 2]) {      // spokes painted on the front so you can see it turn
    const s = new THREE.Mesh(new THREE.BoxGeometry(2 * r - 0.04, 0.045, 0.012), M.dark);
    s.rotation.z = a; s.position.z = 0.072; wheel.add(s);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.26, 16), M.dark);
  hub.rotation.x = Math.PI / 2; g.add(hub);
  const arc = new THREE.Mesh(new THREE.TorusGeometry(r, 0.03, 8, 30, Math.PI), M.rope);
  if (!fixed) arc.rotation.z = Math.PI;
  g.add(arc);
  for (const z of [-0.11, 0.11]) {          // the metal cheeks holding the axle
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.05, cheekLen, 0.02), M.steel);
    c.position.set(0, fixed ? cheekLen / 2 : -cheekLen / 2, z); g.add(c);
  }
  castAll(g);
  g.userData.wheel = wheel;
  return g;
}

function buildRig() {
  const old = [];
  rig.traverse(o => { if (o.isCSS2DObject) old.push(o); });
  old.forEach(o => o.removeFromParent());
  labels.pulley = labels.pulley.filter(o => !old.includes(o));
  rig.traverse(o => { if (o.isMesh && o.geometry !== ropeGeo) o.geometry.dispose(); });
  rig.clear();

  const n = S.ropes, r = n === 1 ? 0.45 : 0.25, x0 = -n * r;
  const cw = n === 4 ? 1.2 : 0.9, cx = n === 1 ? x0 : x0 + r * (n - 1);
  const carriage = new THREE.Group();
  rig.add(carriage);
  const crate = new THREE.Mesh(new THREE.BoxGeometry(cw, PL.CH, 0.8), crateMats[1]);
  crate.position.set(cx, PL.CH / 2, 0); carriage.add(crate);
  const MY0 = PL.CH + 0.55;
  R = { n, r, x0, cx, cw, carriage, segs: [], wheels: [] };
  for (let s = 0; s < n; s++) {
    const m = new THREE.Mesh(ropeGeo, M.rope); rig.add(m);
    R.segs.push({ m, x: x0 + 2 * r * s, top: n > 1 && s === 0 ? PL.BEAM : PL.FY });
  }
  R.pull = { m: new THREE.Mesh(ropeGeo, M.rope), x: x0 + 2 * r * n };
  rig.add(R.pull.m);
  const addWheel = (s, fixed) => {
    const w = makeWheel(r, fixed, fixed ? PL.BEAM - PL.FY : MY0 - (PL.CH + 0.1));
    w.position.set(x0 + 2 * r * s + r, fixed ? PL.FY : MY0, 0);
    (fixed ? rig : carriage).add(w);
    R.wheels.push({ w: w.userData.wheel, s, fixed });
  };
  if (n === 1) addWheel(0, true);
  else for (let s = 0; s < n; s++) addWheel(s, s % 2 === 1);
  if (n === 1) {
    const hook = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.022, 8, 20), M.steel);
    hook.position.set(x0, PL.CH + 0.12, 0); carriage.add(hook);
  } else {
    const xs = R.wheels.filter(w => !w.fixed).map(w => x0 + 2 * r * w.s + r);
    const lo = Math.min(...xs) - 0.14, hi = Math.max(...xs) + 0.14;
    const yoke = new THREE.Mesh(new THREE.BoxGeometry(hi - lo, 0.08, 0.3), M.steel);
    yoke.position.set((lo + hi) / 2, PL.CH + 0.1, 0); carriage.add(yoke);
    const eye = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.02, 8, 20), M.steel);
    eye.position.set(x0, PL.BEAM - 0.05, 0); rig.add(eye);
  }
  R.grip = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.36, 16), M.effort);
  R.grip.rotation.x = Math.PI / 2; rig.add(R.grip);
  R.share = label('pulley', '', 'small left');
  rig.add(R.share);
  castAll(rig);
  R.pull.m.castShadow = true;
}

function pulleyUpdate(dt) {
  if (S.pullTarget !== null) {
    S.pull = approach(S.pull, S.pullTarget, dt / 2.4);
    $('pullSl').value = Math.round(S.pull * 100);
    if (S.pull === S.pullTarget) { S.pullTarget = null; }
  }
  $('pullBtn').textContent = S.pullTarget !== null ? 'Stop' : S.pull > 0.99 ? 'Let go' : 'Pull';
  const { n, r, x0, cx, cw } = R, lift = PL.LIFT * S.pull;
  R.carriage.position.y = lift;
  const MY = PL.CH + 0.55 + lift, hookY = PL.CH + 0.2 + lift;
  const setSeg = (m, x, yTop, yBot) => { m.position.set(x, (yTop + yBot) / 2, 0); m.scale.y = Math.max(yTop - yBot, 0.001); };
  for (const sg of R.segs) setSeg(sg.m, sg.x, sg.top, n === 1 ? hookY : MY);
  const handY = 0.6 + n * PL.LIFT - n * lift;
  setSeg(R.pull.m, R.pull.x, PL.FY, handY);
  R.grip.position.set(R.pull.x, handY, 0);
  for (const w of R.wheels) w.w.rotation.z = (w.fixed ? -1 : 1) * (w.s + 1) * lift / r;

  const loadN = S.kg * 10, effN = loadN / n;
  const ax = cx - cw / 2 - 0.3;
  const lenL = setArrow(arrLoadP, arrowLen(loadN));
  arrLoadP.position.set(ax, lift + 0.05, 0);
  lblLoadP.position.set(ax, lift + 0.05 + lenL, 0);
  setText(lblLoadP, `Load ${N(loadN)} N`);
  const lenE = setArrow(arrEffP, arrowLen(effN));
  arrEffP.position.set(R.pull.x + 0.3, handY, 0);
  lblEffP.position.set(R.pull.x + 0.3, handY + lenE, 0);
  setText(lblEffP, `Effort ${N(effN)} N`);
  R.share.position.set(x0 - 0.1, (PL.FY + MY) / 2, 0);
  setText(R.share, n === 1 ? `The rope holds ${N(loadN)} N` : `Each rope holds ${N(effN)} N`);

  $('pullLbl').textContent = `Rope pulled: ${N(n * lift * 100)} cm`;
  say(n === 1
    ? `One rope holds the load, so you pull with all ${N(loadN)} N. The pulley lets you pull down to lift up.`
    : `${n} ropes share the load. Each holds ${N(effN)} N, so you only pull with ${N(effN)} N. But you have to pull ${n} times as much rope.`);
  readouts([
    ['Load', `<span class="dot load"></span>${S.kg} kg = ${N(loadN)} N`],
    ['Ropes holding it', `${n}`],
    ['Effort needed', `<span class="dot effort"></span>${N(effN)} N`],
    ['Load lifted', `${N(lift * 100)} cm`],
    ['Rope pulled', `${N(n * lift * 100)} cm`],
  ]);
}

// GEARS: two or three meshing gears on a board
// =====================================================================
const GM = 0.075, GT = 0.18, GY = 1.75;     // tooth size (module), thickness, axle height
const gearCols = [0x1798d3, 0xf07d2c, 0x8a5cd6];
const gearMats = gearCols.map(c => mat(c, { metalness: 0.15, roughness: 0.45 }));
const geoCache = new Map();
function gearGeo(n) {
  if (geoCache.has(n)) return geoCache.get(n);
  const R0 = GM * n / 2, Ra = R0 + GM, Rr = R0 - 1.25 * GM, p = TAU / n;
  const s = new THREE.Shape();
  const pt = (r, a, first) => first ? s.moveTo(r * Math.cos(a), r * Math.sin(a)) : s.lineTo(r * Math.cos(a), r * Math.sin(a));
  for (let k = 0; k < n; k++) {
    const c = k * p;
    pt(Rr, c - 0.5 * p, k === 0); pt(Rr, c - 0.385 * p); pt(Rr, c - 0.27 * p);
    pt(Ra, c - 0.13 * p); pt(Ra, c + 0.13 * p); pt(Rr, c + 0.27 * p); pt(Rr, c + 0.385 * p);
  }
  s.closePath();
  const hole = new THREE.Path(); hole.absarc(0, 0, 0.06, 0, TAU, true); s.holes.push(hole);
  const hub = 0.17, ringIn = Rr - 0.08;
  let markR = 0.15;
  if (ringIn - hub > 0.12) {
    const count = n >= 24 ? 6 : 4, hc = (hub + ringIn) / 2;
    const hr = Math.min((ringIn - hub) / 2 * 0.9, Math.PI * hc / count * 0.62);
    for (let i = 0; i < count; i++) {
      const a = Math.PI / 2 + (i + 0.5) * TAU / count;
      const h = new THREE.Path(); h.absarc(hc * Math.cos(a), hc * Math.sin(a), hr, 0, TAU, true); s.holes.push(h);
    }
    markR = hc;
  }
  const geo = new THREE.ExtrudeGeometry(s, { depth: GT, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.01, bevelSegments: 2, curveSegments: 14 });
  geo.translate(0, 0, -GT / 2);
  const out = { geo, R: R0, Ra, markR };
  geoCache.set(n, out);
  return out;
}
const board = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.1), M.board);
board.receiveShadow = true;
G.gear.add(board);
const gearRoot = new THREE.Group();
G.gear.add(gearRoot);
let gears = [], gearBox = { W: 4, H: 3.4 };

function dirArrow(r, m) {
  const g = new THREE.Group(), inner = new THREE.Group();
  g.add(inner);
  inner.add(new THREE.Mesh(new THREE.TorusGeometry(r, 0.035, 8, 24, 1.1), m));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.24, 16), m);
  cone.geometry.translate(0, 0.06, 0);
  cone.position.set(r * Math.cos(1.1), r * Math.sin(1.1), 0); cone.rotation.z = 1.1;
  inner.add(cone);
  inner.rotation.z = Math.PI / 2 - 0.55;
  return g;
}

function buildGears() {
  for (const g of gears) { g.label.removeFromParent(); g.group.traverse(o => { if (o.isMesh && !o.userData.shared) o.geometry.dispose(); }); }
  labels.gear = labels.gear.filter(o => !gears.some(g => g.label === o));
  gearRoot.clear();
  gears = [];
  const Ns = [S.n1, S.n2].concat(S.third ? [16] : []);
  const xs = [0];
  for (let i = 1; i < Ns.length; i++) xs.push(xs[i - 1] + GM * (Ns[i - 1] + Ns[i]) / 2);
  const left = xs[0] - gearGeo(Ns[0]).Ra, right = xs[xs.length - 1] + gearGeo(Ns[Ns.length - 1]).Ra, mid = (left + right) / 2;
  let maxRa = 0;
  Ns.forEach((n, i) => {
    const info = gearGeo(n);
    maxRa = Math.max(maxRa, info.Ra);
    const group = new THREE.Group();
    group.position.set(xs[i] - mid, GY, 0);
    const spin = new THREE.Group(); group.add(spin);
    const mesh = new THREE.Mesh(info.geo, gearMats[i]); mesh.userData.shared = true; spin.add(mesh);
    if (i === 0) {   // a crank handle on the driver gear
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.34, 14), M.dark);
      arm.rotation.x = Math.PI / 2; arm.position.set(0, info.markR, GT / 2 + 0.17); spin.add(arm);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), M.dark);
      knob.position.set(0, info.markR, GT / 2 + 0.36); spin.add(knob);
    } else {         // a white dot so you can count the turns
      const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.03, 18), M.white);
      dot.rotation.x = Math.PI / 2; dot.position.set(0, info.markR, GT / 2 + 0.02); spin.add(dot);
    }
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, GT + 0.1, 20), M.steel);
    cap.rotation.x = Math.PI / 2; group.add(cap);
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 12), M.steel);
    axle.rotation.x = Math.PI / 2; axle.position.z = -0.2; group.add(axle);
    const arrow = dirArrow(info.Ra + 0.2, gearMats[i]);
    arrow.position.z = GT / 2;
    group.add(arrow);
    const lbl = label('gear', `${i === 0 ? 'Driver' : 'Gear ' + (i + 1)} · ${n} teeth`, 'small');
    lbl.position.set(0, -(info.Ra + 0.3), GT / 2);
    group.add(lbl);
    castAll(group);
    gearRoot.add(group);
    gears.push({ n, group, spin, arrow, label: lbl });
  });
  const bw = right - left + 0.9, bh = GY + maxRa + 0.45;
  board.scale.set(bw, bh, 1);
  board.position.set(0, bh / 2, -0.36);
  gearBox = { W: bw + 0.4, H: bh + 0.5 };
}

const FR = [[1 / 4, 'a quarter'], [1 / 3, 'a third'], [1 / 2, 'half'], [2 / 3, 'two thirds'], [3 / 4, 'three quarters']];
function asMuch(r) {
  if (Math.abs(r - 1) < 1e-6) return null;
  if (r < 1) { const f = FR.find(([v]) => Math.abs(v - r) < 1e-3); return f ? f[1] : fmt(r, 2); }
  if (Math.abs(r - Math.round(r)) < 1e-3) return `${Math.round(r)} times`;
  if (Math.abs(r - 1.5) < 1e-3) return '1½ times';
  if (Math.abs(r - 4 / 3) < 1e-3) return '1⅓ times';
  return `${fmt(r, 2)} times`;
}

function gearUpdate(dt) {
  if (S.playing) {
    S.T += dt * 0.25;
    if (S.T >= 4) { S.T = 4; S.playing = false; }
    $('turnSl').value = S.T;
  }
  $('playBtn').textContent = S.playing ? 'Pause' : S.T >= 4 ? 'Play again' : 'Play';
  let a = -S.T * TAU;                        // the driver turns clockwise
  gears.forEach((g, i) => {
    if (i) { const p = TAU / g.n; a = Math.PI - 0.5 * p - a * gears[i - 1].n / g.n; }
    g.spin.rotation.z = a;
    g.arrow.scale.x = i % 2 === 0 ? -1 : 1;  // clockwise arrows are mirrored
  });
  $('turnLbl').textContent = `Driver gear turns: ${fmt(S.T, 2)}`;

  const n1 = gears[0].n, n2 = gears[1].n;
  const speed = asMuch(n1 / n2), force = asMuch(n2 / n1);
  let t;
  if (n2 > n1) t = `A small gear is turning a big gear. Gear 2 turns ${speed} as fast, but with ${force} the turning force. That is like a low gear on a bike for going up a hill.`;
  else if (n2 < n1) t = `A big gear is turning a small gear. Gear 2 spins ${speed} as fast, but with only ${force} the turning force.`;
  else t = 'The gears are the same size, so they turn at the same speed, but in opposite directions.';
  if (S.third) t += ' Gear 3 turns the same way as the driver: each gear in the chain swaps the direction.';
  say(t);
  const rows = gears.map((g, i) => [i === 0 ? 'Driver gear' : `Gear ${i + 1}`,
    `${g.n} teeth · ${fmt(S.T * n1 / g.n, 2)} turns ${i % 2 === 0 ? '↻' : '↺'}`]);
  rows.push(['Gear 2 speed', speed ? `${speed} as fast` : 'the same']);
  rows.push(['Turning force', force ? `${force} as much` : 'the same']);
  readouts(rows);
}

const INFO = {
  lever: { title: 'How does a lever help you lift?',
    body: '<p>A <b>lever</b> is a bar that turns on a <b>pivot</b>. You push down on one end (the <b>effort</b>) to lift the <b>load</b> on the other end.</p><p>Move the pivot closer to the load and you need less force. But your end has to move further. You swap force for distance.</p>',
    note: 'Weight is a force, measured in newtons (N). 1 kg weighs about 10 N. A newton meter measures forces.' },
  pulley: { title: 'How does a pulley make lifting easier?',
    body: '<p>A <b>pulley</b> is a wheel with a rope running round it. One pulley lets you pull down to lift up, but you still pull with the whole weight.</p><p>Add more pulleys and more ropes hold the load. Each rope takes a share, so you pull with less force. But you have to pull more rope.</p>',
    note: 'We are ignoring friction and the weight of the pulleys. In real life you would need a little more force.' },
  gear: { title: 'How do gears change a turn?',
    body: '<p><b>Gears</b> are wheels with teeth. The teeth lock together, so turning one gear turns the next one.</p><p>Gears that touch turn opposite ways. When a small gear turns a big gear, the big gear turns more slowly, but with more turning force.</p>',
    note: 'Levers, pulleys and gears are all mechanisms: they let a smaller force have a greater effect. You will find gears in bikes, clocks and whisks.' },
};

function setMode(m) {

function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  const hdrB = $('hdr').getBoundingClientRect().bottom, ctlT = $('controls').getBoundingClientRect().top;
  rootEl.style.setProperty('--hdr', hdrB + 'px');
  rootEl.style.setProperty('--ctl', (h - ctlT) + 'px');
  const info = $('info');
  const freeL = (w >= 900 && info.open) ? info.getBoundingClientRect().right + 8 : 0;
  const v = VIEWS[S.mode]();
  const availW = Math.max(120, w - freeL - 32 - (v.padPx || 0)), availH = Math.max(120, ctlT - hdrB - 28);
  const t = Math.tan(camera.fov * Math.PI / 360);
  const D = Math.max(v.H * h / (2 * t * availH), v.W * h / (2 * t * availW));
  camera.aspect = w / h;
  camera.position.copy(v.target).addScaledVector(v.dir.normalize(), D);
  controls.target.copy(v.target);
  controls.minDistance = D * 0.5; controls.maxDistance = D * 1.8;
  const cx = (freeL + w) / 2, cy = (hdrB + ctlT) / 2;
  camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
  camera.updateProjectionMatrix();
  controls.update();
}
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  fit();
}

// ---- controls ----
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('info').addEventListener('toggle', fit);

$('pushBtn').addEventListener('click', () => {
  S.pushTarget = S.pushTarget >= 0.5 ? 0 : 1;
  $('pushBtn').textContent = S.pushTarget ? 'Pushing…' : 'Letting go…';
});
$('pivotSl').addEventListener('input', e => { S.pivot = Number(e.target.value); });

$('pullBtn').addEventListener('click', () => {
  if (S.pullTarget !== null) { S.pullTarget = null; return; }
  S.pullTarget = S.pull > 0.99 ? 0 : 1;
});
$('pullSl').addEventListener('input', e => { S.pullTarget = null; S.pull = Number(e.target.value) / 100; });
$('ropeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.ropes = Number(b.dataset.n);
  $('ropeSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  buildRig();
});
$('kgSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setKg(Number(b.dataset.kg));
  $('kgSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

for (const id of ['n1Sel', 'n2Sel']) {
  const sel = $(id);
  for (const n of [8, 16, 24, 32]) sel.add(new Option(`${n} teeth`, n));
  sel.value = id === 'n1Sel' ? S.n1 : S.n2;
  sel.addEventListener('change', () => { S[id === 'n1Sel' ? 'n1' : 'n2'] = Number(sel.value); buildGears(); fit(); });
}
$('playBtn').addEventListener('click', () => {
  if (S.playing) { S.playing = false; return; }
  if (S.T >= 4) S.T = 0;
  S.playing = true;
});
$('turnSl').addEventListener('input', e => { S.playing = false; S.T = Number(e.target.value); });
$('thirdBtn').addEventListener('click', () => {
  S.third = !S.third;
  $('thirdBtn').setAttribute('aria-pressed', String(S.third));
  $('thirdBtn').textContent = S.third ? 'Remove gear 3' : 'Add gear 3';
  buildGears(); fit();
});

// ---------------- Start ----------------
applyTheme();
buildRig();
buildGears();
if (window.innerWidth < 700) $('info').open = false;
const fromHash = Object.keys(HASH).find(k => HASH[k] === location.hash.slice(1));
window.addEventListener('resize', resize);
resize();
setMode(fromHash || 'lever');
window.addEventListener('hashchange', () => {
  const m = Object.keys(HASH).find(k => HASH[k] === location.hash.slice(1));
  if (m && m !== S.mode) setMode(m);
});

const UPDATE = { lever: leverUpdate, pulley: pulleyUpdate, gear: gearUpdate };
window.__lpg = { S, UPDATE, setMode };     // handy for testing
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  UPDATE[S.mode](dt);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>

</html>
