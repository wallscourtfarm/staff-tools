<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="../../favicon.png">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cube Net Folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* One-screen tool: full-bleed 3D scene, header band on top, control panel floating at the bottom */
  :root { --blue:#1798d3; --on-blue:#ffffff; --fg:#0a0101; --bg:#eef6fb; --surface:#ffffff; --shadow:rgba(10,40,60,.14);
          --font:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --blue:#3aaee3; --on-blue:#04121a; --fg:#e8f1f6; --bg:#0f1c24; --surface:#1a2c37; --shadow:rgba(0,0,0,.4); color-scheme:dark; } }
  :root[data-theme="dark"] {
    --blue:#3aaee3; --on-blue:#04121a; --fg:#e8f1f6; --bg:#0f1c24; --surface:#1a2c37; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--fg); overflow:hidden; }
  #scene { position:fixed; inset:0; touch-action:none; }
  header { position:fixed; top:0; left:0; right:0; z-index:2; background:var(--blue); color:var(--on-blue);
           padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  header h1 { margin:0; font-size:20px; font-weight:800; }
  header p { margin:2px 0 0; font-size:14px; opacity:.9; }
  .facts { position:fixed; top:calc(76px + env(safe-area-inset-top, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); z-index:2;
           background:var(--surface); border-radius:14px; padding:10px 14px; box-shadow:0 4px 14px var(--shadow); font-size:15px; line-height:1.5; }
  .facts b { color:var(--blue); }
  .facts small { display:block; max-width:170px; opacity:.75; margin-top:4px; line-height:1.3; }
  .panel { position:fixed; left:50%; bottom:calc(34px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:2;
           width:min(560px, calc(100% - 32px)); background:var(--surface); border-radius:16px; box-shadow:0 4px 18px var(--shadow);
           padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
  button { font:inherit; font-weight:800; font-size:16px; min-height:44px; padding:10px 18px; border-radius:12px; border:2px solid var(--blue); background:var(--blue); color:var(--on-blue); cursor:pointer; }
  button.alt { background:var(--surface); color:var(--blue); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--fg); outline-offset:2px; }
  input[type=range] { flex:1 1 180px; height:44px; accent-color:var(--blue); }
  footer { position:fixed; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); left:0; right:0; text-align:center; font-size:12px; opacity:.6; z-index:2; }
</style>
<div id="scene"></div>

<header>
  <h1>Cube Net Folder</h1>
  <p>Drag to turn the shape. Pinch or scroll to zoom.</p>
</header>

<div class="facts">
  <div>Faces: <b>6</b></div>
  <div>Edges: <b>12</b></div>
  <div>Vertices: <b>8</b></div>
  <small>Opposite faces add up to 7, just like a dice.</small>
</div>

<div class="panel">
  <button id="foldBtn">Fold</button>
  <input id="slider" type="range" min="0" max="100" value="0" aria-label="Fold amount">
  <button id="spinBtn" class="alt">Spin</button>
</div>

<footer>Wallscourt Farm Academy · v17.11.26a</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Basic scene ----------
const wrap = document.getElementById('scene');
// Transparent canvas, so the page's own light or dark background shows behind the cube
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(3.4, 4.4, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2 - 0.05;   // keep the camera above the floor
controls.autoRotateSpeed = 2.5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb4c4, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(4, 8, 5);
scene.add(sun);

const grid = new THREE.GridHelper(10, 10, 0xb8d7ea, 0xd6e8f3);
grid.position.y = -0.002;
scene.add(grid);

// ---------- Faces ----------
try { await document.fonts.load('800 120px Nunito'); } catch (e) {}

// mirrored = true draws the number back-to-front, so it reads correctly from the other side of the square.
// turn = degrees clockwise (as the viewer sees it) so the number stands upright once folded.
function faceTexture(colour, label, mirrored = false, turn = 0) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  if (mirrored) { g.translate(256, 0); g.scale(-1, 1); }
  g.fillStyle = colour;
  g.fillRect(0, 0, 256, 256);
  g.fillStyle = '#ffffff';
  g.font = '800 130px Nunito, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.translate(128, 128);
  g.rotate((mirrored ? -1 : 1) * turn * Math.PI / 180);
  g.fillText(label, 0, 12);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const squareGeo = new THREE.PlaneGeometry(1, 1);
squareGeo.rotateX(-Math.PI / 2);                 // lie flat, facing up
const edgeGeo = new THREE.EdgesGeometry(squareGeo);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x0a0101 });

// Each square has two sides: the top (seen on the flat net) and the underside
// (which ends up on the outside of the folded cube).
function makeFace(colour, label, turn = 0) {
  const opts = { roughness: 0.6, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
  const mesh = new THREE.Mesh(squareGeo, new THREE.MeshStandardMaterial({
    ...opts, map: faceTexture(colour, label), side: THREE.FrontSide }));
  mesh.add(new THREE.Mesh(squareGeo, new THREE.MeshStandardMaterial({
    ...opts, map: faceTexture(colour, label, true, turn), side: THREE.BackSide })));
  mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));
  return mesh;
}

// A hinge is an invisible pivot on a shared edge; the face hangs off it.
function hinge(parent, edgePos, facePos, colour, label, turn) {
  const pivot = new THREE.Group();
  pivot.position.set(...edgePos);
  parent.add(pivot);
  const face = makeFace(colour, label, turn);
  face.position.set(...facePos);
  pivot.add(face);
  return pivot;
}

// Cross-shaped net. Bottom in the middle, four sides around it, top on the back.
const model = new THREE.Group();
scene.add(model);
model.add(makeFace('#1798d3', '1'));                                        // bottom
const front = hinge(model, [0, 0,  0.5], [0, 0,  0.5], '#e5484d', '2', 180);
const back  = hinge(model, [0, 0, -0.5], [0, 0, -0.5], '#2fae66', '5', 0);
const left  = hinge(model, [-0.5, 0, 0], [-0.5, 0, 0], '#8a5cd6', '3', -90);
const right = hinge(model, [ 0.5, 0, 0], [ 0.5, 0, 0], '#f07d2c', '4', 90);
const top   = hinge(back,  [0, 0, -1],   [0, 0, -0.5], '#f2b416', '6', 180);  // hangs off the back face

// ---------- Folding ----------
let progress = 0, target = 0;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const stage = (x, a, b) => smooth((x - a) / (b - a));
const QUARTER = Math.PI / 2;

function applyFold() {
  const sides = stage(progress, 0, 0.65) * QUARTER;   // four sides fold first
  const lid   = stage(progress, 0.45, 1) * QUARTER;   // then the lid closes
  front.rotation.x = -sides;
  back.rotation.x  =  sides;
  right.rotation.z =  sides;
  left.rotation.z  = -sides;
  top.rotation.x   =  lid;
  model.position.z = 0.5 * (1 - smooth(progress));    // keep it centred on screen
}

const foldBtn = document.getElementById('foldBtn');
const spinBtn = document.getElementById('spinBtn');
const slider  = document.getElementById('slider');

function updateFoldLabel() { foldBtn.textContent = target >= 0.5 ? 'Unfold' : 'Fold'; }

foldBtn.addEventListener('click', () => { target = target >= 0.5 ? 0 : 1; updateFoldLabel(); });
slider.addEventListener('input', () => { progress = target = slider.value / 100; updateFoldLabel(); });
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.textContent = controls.autoRotate ? 'Stop' : 'Spin';
});

// ---------- Resize + animation loop ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (progress !== target) {
    const step = dt * 0.45;                            // about 2 seconds for a full fold
    progress = Math.abs(target - progress) <= step ? target : progress + Math.sign(target - progress) * step;
    slider.value = Math.round(progress * 100);
  }
  applyFold();
  controls.update();
  renderer.render(scene, camera);
});
</script>

</html>
