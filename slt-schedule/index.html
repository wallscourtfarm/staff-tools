<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SLT Schedule · WFA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231798d3'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='white'%3E🏫%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f1f5f9; min-height: 100vh; }

    .app-header { background: white; border-bottom: 2px solid #1798d3; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .app-header img { height: 40px; }
    .app-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; color: #1798d3; line-height: 1.2; }
    .app-subtitle { font-size: 11px; color: #94a3b8; }

    .week-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn { background: #f0f8fd; border: 1.5px solid #bae0f5; border-radius: 5px; padding: 5px 11px; cursor: pointer; font-size: 16px; color: #1798d3; line-height: 1; }
    .nav-btn:hover { background: #dbeafe; }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .week-label { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; color: #1798d3; min-width: 220px; text-align: center; }
    .action-btn { background: white; border: 1.5px solid #cbd5e1; border-radius: 5px; padding: 5px 11px; font-size: 12px; cursor: pointer; color: #475569; }
    .action-btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .action-btn.danger { color: #dc2626; border-color: #fca5a5; }
    .action-btn.danger:hover { background: #fef2f2; }

    .lock-btn { border: 1.5px solid #cbd5e1; border-radius: 5px; padding: 5px 13px; font-size: 13px; cursor: pointer; background: white; color: #475569; display: flex; align-items: center; gap: 5px; }
    .lock-btn.edit { background: #fef3c7; border-color: #fde68a; color: #92400e; }
    .lock-btn:hover { border-color: #94a3b8; }

    .sheet-status { font-size: 10px; color: #94a3b8; margin-left: auto; }
    .sheet-status.ok { color: #22c55e; }
    .sheet-status.err { color: #f97316; }

    .app-body { padding: 12px; max-width: 1400px; margin: 0 auto; }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; padding: 10px 14px; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.07); align-items: center; }
    .legend-hd { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; color: #64748b; margin-right: 4px; }
    .legend-chip { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 5px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Main table */
    .table-wrap { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.07); overflow-x: auto; }
    .slt-table { width: 100%; border-collapse: collapse; min-width: 700px; }

    .slt-table thead th { padding: 10px 8px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; color: #1798d3; text-align: center; white-space: nowrap; }
    .slt-table thead th.name-th { text-align: left; padding-left: 14px; min-width: 160px; }
    .slt-table thead th.sess-th { width: 32px; color: #94a3b8; font-size: 10px; font-weight: 600; }
    .slt-table thead th.day-th { min-width: 110px; }
    .slt-table thead th.day-th.today { background: #1798d3; color: white; }

    .slt-table tbody td { border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .slt-table tbody tr.pm-row td { border-bottom: 2px solid #e2e8f0; }

    .name-cell { padding: 8px 14px; background: #fafafa; vertical-align: middle !important; }
    .person-info { display: flex; align-items: center; gap: 8px; }
    .person-avatar { width: 32px; height: 32px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; flex-shrink: 0; }
    .person-name { font-size: 12px; font-weight: 700; color: #1e293b; }
    .person-role { font-size: 10px; color: #94a3b8; }

    .sess-td { padding: 4px 6px; font-size: 10px; font-weight: 700; color: #94a3b8; text-align: center; background: #fafafa; white-space: nowrap; }
    .am-row .sess-td { color: #1798d3; }
    .pm-row .sess-td { color: #7c3aed; }

    .slot-cell { padding: 4px 6px; min-height: 38px; cursor: default; transition: background .1s; }
    .slot-cell.editable { cursor: pointer; }
    .slot-cell.editable:hover { background: #f0f8fd; }

    .act-badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .slot-empty { font-size: 11px; color: #e2e8f0; padding: 3px 4px; }
    .slot-empty-edit { font-size: 18px; color: #e2e8f0; padding: 0 6px; }

    .slt-table thead th.day-th.today .slt-table-date { color: rgba(255,255,255,.8); }

    /* Picker */
    #pickerOverlay { display: none; position: fixed; inset: 0; z-index: 800; }
    #actPicker { display: none; position: fixed; z-index: 900; background: white; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.2); padding: 12px; min-width: 200px; max-width: 260px; }
    .picker-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .picker-acts { display: flex; flex-direction: column; gap: 4px; }
    .picker-act { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; border: none; background: none; width: 100%; text-align: left; }
    .picker-act:hover { background: #f1f5f9; }
    .picker-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .picker-clear { margin-top: 6px; width: 100%; padding: 6px; border: 1.5px dashed #cbd5e1; border-radius: 6px; background: none; cursor: pointer; font-size: 12px; color: #94a3b8; }
    .picker-clear:hover { border-color: #ef4444; color: #ef4444; }

    /* PIN modal */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: white; border-radius: 10px; padding: 28px; width: 90%; max-width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center; }
    .modal h3 { font-family: 'Nunito', sans-serif; font-weight: 900; color: #1798d3; font-size: 17px; margin-bottom: 6px; }
    .modal p { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
    .pin-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #cbd5e1; transition: all .15s; }
    .pin-dot.filled { background: #1798d3; border-color: #1798d3; }
    .pin-dot.error { background: #ef4444; border-color: #ef4444; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .pin-key { padding: 14px 0; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #f8fafc; cursor: pointer; font-size: 16px; font-weight: 700; color: #1e293b; }
    .pin-key:hover { background: #dbeafe; border-color: #93c5fd; }
    .pin-key:active { background: #bfdbfe; }
    .pin-cancel { width: 100%; padding: 9px; border: none; background: none; cursor: pointer; font-size: 13px; color: #94a3b8; }
    .pin-cancel:hover { color: #64748b; }

    footer { text-align: center; font-size: 10px; color: #cbd5e1; padding: 20px 10px 30px; }
  </style>
</head>
<body>

<div class="app-header">
  <img src="https://cdn.jsdelivr.net/gh/wallscourtfarm/wfa-shared@main/web/wfa_logo.webp" alt="Wallscourt Farm Academy">
  <div>
    <div class="app-title">SLT Schedule</div>
    <div class="app-subtitle">Wallscourt Farm Academy</div>
  </div>
</div>

<div class="week-bar">
  <button class="nav-btn" id="btnPrev" onclick="changeWeek(-1)">‹</button>
  <div class="week-label" id="weekLabel">–</div>
  <button class="nav-btn" id="btnNext" onclick="changeWeek(1)">›</button>
  <button class="action-btn" onclick="goToday()">This week</button>
  <button class="action-btn" onclick="copyToNext()">Copy → next week</button>
  <button class="action-btn" onclick="setAsTerm()" style="border-color:#a3e635;color:#4d7c0f">Set as default</button>
  <button class="action-btn danger" onclick="resetToTerm()">Reset to default</button>
  <button class="lock-btn" id="lockBtn" onclick="toggleLock()"><span id="lockIcon">🔒</span> <span id="lockLabel">View only</span></button>
  <span class="sheet-status" id="sheetStatus">Loading…</span>
</div>

<div class="app-body">
  <div class="legend" id="legend"></div>
  <div class="table-wrap">
    <table class="slt-table" id="sltTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Activity picker -->
<div id="pickerOverlay" onclick="closePicker()"></div>
<div id="actPicker">
  <div class="picker-title">Choose activity</div>
  <div class="picker-acts" id="pickerActs"></div>
  <button class="picker-clear" onclick="selectActivity('')">× Clear slot</button>
</div>

<!-- PIN modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>🔐 Edit PIN</h3>
    <p>Enter the 4-digit PIN to unlock editing</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key" onclick="pinKey('⌫')" style="font-size:13px;color:#94a3b8">⌫</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <div></div>
    </div>
    <button class="pin-cancel" onclick="closePinModal()">Cancel</button>
  </div>
</div>

<footer>Wallscourt Farm Academy · SLT Schedule · 29.07.26a</footer>

<script>
// ── Activity types ─────────────────────────────────────────────────────────────
const ACTIVITIES = [
  { id:'teaching',    label:'Teaching',            colour:'#1798d3' },
  { id:'slt_time',    label:'SLT Time',            colour:'#8b5cf6' },
  { id:'slt_meeting', label:'SLT Meeting',         colour:'#6366f1' },
  { id:'safeguard',   label:'Safeguarding Mtg',    colour:'#ef4444' },
  { id:'non_working', label:'Non-working day',     colour:'#94a3b8' },
  { id:'ops',         label:'Ops Time',            colour:'#f97316' },
  { id:'senco',       label:'SENCO Time',          colour:'#10b981' },
  { id:'phase_lead',  label:'Phase Lead Time',     colour:'#f59e0b' },
  { id:'ppa',         label:'PPA',                 colour:'#64748b' },
  { id:'ab_time',     label:'A&B Time',            colour:'#ec4899' },
];

// Roles included in SLT schedule when InSLTSchedule column is absent
const SLT_ROLES = ['Headteacher', 'Deputy Headteacher', 'Assistant Headteacher', 'SENCO', 'Phase Lead'];

// Change this PIN to restrict edit access
const EDIT_PIN = '4321';

const DAYS    = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const PALETTE = ['#1798d3','#f97316','#22c55e','#e879f9','#64748b','#ef4444','#8b5cf6'];

const SHEET_ID   = '1XsP5yEGnf8sJyXk8iEXqHEtw-NtCsMUFZLaHW4TWNhw';
const SHEET_BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
const SYNC_URL   = ''; // Paste deployed Apps Script URL here

// ── State ─────────────────────────────────────────────────────────────────────
let SLT      = [];
let WEEKS    = [];
let termTemplate = null;
let state    = { weekIdx: 0, slots: {} };
let editMode = false;

// ── CSV helpers ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = []; let inQ=false, cur='', cells=[];
  for (let i=0; i<text.length; i++) {
    const c=text[i];
    if (c==='"') { inQ=!inQ; }
    else if (c===',' && !inQ) { cells.push(cur.trim()); cur=''; }
    else if ((c==='\n'||c==='\r') && !inQ) {
      cells.push(cur.trim()); cur='';
      if (cells.some(x=>x)) rows.push(cells);
      cells=[];
      if (c==='\r' && text[i+1]==='\n') i++;
    } else cur+=c;
  }
  cells.push(cur.trim());
  if (cells.some(x=>x)) rows.push(cells);
  return rows;
}

function csvToObjects(text) {
  text = text.replace(/^﻿/, '');
  const rows = parseCSV(text);
  if (rows.length < 2) return [];
  const firstRow = rows[0];
  const gvizRe = /^([A-Za-z]\w*)( .*)?$/;
  const nonEmpty = firstRow.filter(h => h.length > 0);
  const isGviz = nonEmpty.every(h => gvizRe.test(h))
    && nonEmpty.some(h => { const m=h.match(gvizRe); return m&&m[2]&&m[2].trim(); });
  let headers, dataRows;
  if (isGviz) {
    headers  = firstRow.map(h => { const m=h.match(gvizRe); return m?m[1]:h; });
    const firstData = firstRow.map(h => { const m=h.match(gvizRe); return m&&m[2]?m[2].trim():''; });
    dataRows = [firstData, ...rows.slice(1)];
  } else {
    headers  = firstRow;
    dataRows = rows.slice(1);
  }
  return dataRows.map(r => {
    const obj = {};
    headers.forEach((h,i) => { if (h) obj[h]=(r[i]||'').trim(); });
    return obj;
  });
}

function parseDate(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length !== 3) return null;
  const [d,m,y] = p.map(Number);
  return new Date(y < 100 ? 2000+y : y, m-1, d);
}

// ── SLT staff helpers ─────────────────────────────────────────────────────────
function buildSLT(rows) {
  const colourById = {};
  SLT.forEach(s => { colourById[s.id] = s.col; });
  const hasSLTCol = rows.some(r => 'InSLTSchedule' in r);
  return rows
    .filter(r => r.Name && r.Name.trim())
    .filter(r => {
      if (hasSLTCol) {
        const v = (r.InSLTSchedule || '').trim().toLowerCase();
        return v === 'true' || v === '1' || v === 'yes';
      }
      return SLT_ROLES.includes((r.Role || '').trim());
    })
    .map((r, i) => {
      const name = r.Name.trim();
      const init = (r.Initials || '').trim() || mkInitials(name);
      const id   = name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      const col  = (r.Colour || '').trim() || colourById[id] || PALETTE[i % PALETTE.length];
      const role = (r.Role || '').trim();
      return { id, name, init, col, role };
    });
}

function buildWeeks(rows) {
  return rows
    .filter(r => r.StartDate && r.Term && r.Week)
    .map(r => {
      const start = parseDate(r.StartDate.trim());
      if (!start || isNaN(start)) return null;
      return { start, term: String(r.Term).trim(), week: String(r.Week).trim(),
               label: `T${r.Term.trim()}W${r.Week.trim()}` };
    })
    .filter(Boolean)
    .sort((a,b) => a.start - b.start);
}

function mkInitials(name) {
  const p = name.trim().split(/\s+/);
  return p.length === 1 ? name.slice(0,2).toUpperCase() : (p[0][0]+p[p.length-1][0]).toUpperCase();
}

function contrastColor(hex) {
  if (!hex || hex.length < 7) return '#fff';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255 > 0.55 ? '#1a1a1a' : '#ffffff';
}

function actById(id) { return ACTIVITIES.find(a => a.id === id); }

// ── State helpers ─────────────────────────────────────────────────────────────
function getWeek() {
  const key = state.weekIdx;
  if (!state.slots[key]) {
    state.slots[key] = termTemplate ? deepCopyWeek(termTemplate) : {};
  }
  return state.slots[key];
}

function getPersonWeek(personId) {
  const w = getWeek();
  if (!w[personId]) w[personId] = {};
  return w[personId];
}

function getSlot(personId, di, session) {
  return getPersonWeek(personId)[`${di}_${session}`] || '';
}

function setSlot(personId, di, session, actId) {
  const pw = getPersonWeek(personId);
  if (actId) pw[`${di}_${session}`] = actId;
  else delete pw[`${di}_${session}`];
  save(); render();
}

function deepCopyWeek(src) {
  const copy = {};
  Object.keys(src).forEach(pid => { copy[pid] = { ...src[pid] }; });
  return copy;
}

// ── Persistence ───────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('wfa_slt_state', JSON.stringify(state));
  localStorage.setItem('wfa_slt_slt',   JSON.stringify(SLT));
  localStorage.setItem('wfa_slt_term',  JSON.stringify(termTemplate));
  if (SYNC_URL) {
    fetch(SYNC_URL, { method:'POST', body: JSON.stringify({ state, termTemplate }) }).catch(() => {});
  }
}

function loadAll() {
  try { const s=localStorage.getItem('wfa_slt_state'); if (s) { const p=JSON.parse(s); state.slots=p.slots||{}; state.weekIdx=p.weekIdx||0; } } catch(e) {}
  try { const s=localStorage.getItem('wfa_slt_slt');   if (s) SLT=JSON.parse(s); } catch(e) {}
  try { const s=localStorage.getItem('wfa_slt_term');  if (s) termTemplate=JSON.parse(s); } catch(e) {}
}

// ── Navigation ────────────────────────────────────────────────────────────────
function currentWeekIdx() {
  if (!WEEKS.length) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i=0; i<WEEKS.length; i++) {
    const end = new Date(WEEKS[i].start); end.setDate(end.getDate()+6);
    if (today >= WEEKS[i].start && today <= end) return i;
  }
  for (let i=0; i<WEEKS.length; i++) { if (WEEKS[i].start > today) return i; }
  return WEEKS.length - 1;
}

function weekMonday() {
  if (WEEKS.length && WEEKS[state.weekIdx]) return new Date(WEEKS[state.weekIdx].start);
  const d = new Date(); d.setHours(0,0,0,0);
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0?-6:1-day) + state.weekIdx*7);
  return d;
}

function weekLabel() {
  if (WEEKS.length && WEEKS[state.weekIdx]) {
    const w = WEEKS[state.weekIdx];
    const end = new Date(w.start); end.setDate(w.start.getDate()+4);
    const fmt = x => x.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
    return `${w.label} · ${fmt(w.start)} – ${fmt(end)}`;
  }
  const d = weekMonday(), end = new Date(d); end.setDate(d.getDate()+4);
  const fmt = x => x.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
  return `${fmt(d)} – ${fmt(end)}`;
}

function dayDate(di) {
  const d = weekMonday(); d.setDate(d.getDate()+di);
  return d.toLocaleDateString('en-GB', {day:'numeric',month:'short'});
}

function isToday(di) {
  const d = weekMonday(); d.setDate(d.getDate()+di);
  const t = new Date(); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

function changeWeek(dir) {
  if (WEEKS.length) state.weekIdx = Math.max(0, Math.min(WEEKS.length-1, state.weekIdx+dir));
  else state.weekIdx += dir;
  save(); render();
}

function goToday() {
  state.weekIdx = WEEKS.length ? currentWeekIdx() : 0;
  save(); render();
}

function copyToNext() {
  const next = state.weekIdx + 1;
  if (WEEKS.length && next >= WEEKS.length) { alert('No further weeks in this term.'); return; }
  const nxt = state.slots[next];
  const hasData = nxt && Object.values(nxt).some(pw => Object.keys(pw).length > 0);
  if (hasData && !confirm('Next week already has data — replace with a copy of this week?')) return;
  state.slots[next] = deepCopyWeek(getWeek());
  state.weekIdx = next;
  save(); render();
}

function setAsTerm() {
  if (!confirm('Save this week as the default? New weeks will start with this layout.')) return;
  termTemplate = deepCopyWeek(getWeek());
  save();
  alert('Default saved. New weeks will now start with this layout.');
}

function resetToTerm() {
  const msg = termTemplate
    ? 'Reset this week to the default layout? Changes this week will be lost.'
    : 'No default set yet. Clear all slots for this week?';
  if (!confirm(msg)) return;
  state.slots[state.weekIdx] = termTemplate ? deepCopyWeek(termTemplate) : {};
  save(); render();
}

// ── Edit / PIN lock ───────────────────────────────────────────────────────────
function toggleLock() {
  if (editMode) {
    editMode = false;
    updateLockUI();
  } else {
    openPinModal();
  }
}

function updateLockUI() {
  const btn = document.getElementById('lockBtn');
  document.getElementById('lockIcon').textContent  = editMode ? '🔓' : '🔒';
  document.getElementById('lockLabel').textContent = editMode ? 'Editing' : 'View only';
  btn.className = 'lock-btn' + (editMode ? ' edit' : '');
  render();
}

let pinEntry = '';

function openPinModal() {
  pinEntry = '';
  refreshPinDots();
  document.getElementById('pinModal').classList.add('open');
}

function closePinModal() {
  document.getElementById('pinModal').classList.remove('open');
  pinEntry = '';
  refreshPinDots();
}

function refreshPinDots(error) {
  for (let i=0; i<4; i++) {
    const d = document.getElementById('pd'+i);
    d.className = 'pin-dot';
    if (error) d.classList.add('error');
    else if (i < pinEntry.length) d.classList.add('filled');
  }
}

function pinKey(k) {
  if (k === '⌫') { pinEntry = pinEntry.slice(0,-1); refreshPinDots(); return; }
  if (pinEntry.length >= 4) return;
  pinEntry += k;
  refreshPinDots();
  if (pinEntry.length === 4) {
    if (pinEntry === EDIT_PIN) {
      editMode = true;
      closePinModal();
      updateLockUI();
    } else {
      refreshPinDots(true);
      setTimeout(() => { pinEntry = ''; refreshPinDots(); }, 700);
    }
  }
}

// ── Activity picker ───────────────────────────────────────────────────────────
let pickerTarget = null;

function openPicker(personId, di, session, cellEl) {
  if (!editMode) return;
  pickerTarget = { personId, di, session };

  const picker = document.getElementById('actPicker');
  picker.querySelector('#pickerActs').innerHTML = ACTIVITIES.map(a => `
    <button class="picker-act" onclick="selectActivity('${a.id}')">
      <div class="picker-dot" style="background:${a.colour}"></div>
      <span style="color:#1e293b">${a.label}</span>
    </button>`).join('');

  const rect = cellEl.getBoundingClientRect();
  let top = rect.bottom + 6;
  let left = rect.left;
  if (top + 320 > window.innerHeight) top = rect.top - 320;
  if (left + 220 > window.innerWidth)  left = window.innerWidth - 226;
  picker.style.top  = Math.max(4, top) + 'px';
  picker.style.left = Math.max(4, left) + 'px';
  picker.style.display = 'block';
  document.getElementById('pickerOverlay').style.display = 'block';
}

function closePicker() {
  document.getElementById('actPicker').style.display = 'none';
  document.getElementById('pickerOverlay').style.display = 'none';
  pickerTarget = null;
}

function selectActivity(actId) {
  if (!pickerTarget) return;
  setSlot(pickerTarget.personId, pickerTarget.di, pickerTarget.session, actId);
  closePicker();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderLegend() {
  document.getElementById('legend').innerHTML =
    '<span class="legend-hd">Activities:</span>' +
    ACTIVITIES.map(a => `<span class="legend-chip" style="background:${a.colour}22">
      <span class="legend-dot" style="background:${a.colour}"></span>
      <span style="color:${a.colour}">${a.label}</span>
    </span>`).join('');
}

function render() {
  document.getElementById('weekLabel').textContent = weekLabel();
  if (WEEKS.length) {
    document.getElementById('btnPrev').disabled = state.weekIdx <= 0;
    document.getElementById('btnNext').disabled = state.weekIdx >= WEEKS.length-1;
  }
  renderGrid();
}

function slotHtml(personId, di, session) {
  const actId = getSlot(personId, di, session);
  const act   = actById(actId);
  if (act) {
    const fg = contrastColor(act.colour);
    return `<span class="act-badge" style="background:${act.colour};color:${fg}">${act.label}</span>`;
  }
  return editMode
    ? `<span class="slot-empty-edit">+</span>`
    : `<span class="slot-empty">—</span>`;
}

function renderGrid() {
  const dayHeaders = DAYS.map((d,i) =>
    `<th class="day-th${isToday(i)?' today':''}">${d}<br><span style="font-size:9px;font-weight:normal;opacity:.7">${dayDate(i)}</span></th>`
  ).join('');
  document.getElementById('tableHead').innerHTML =
    `<tr>
      <th class="name-th">SLT Member</th>
      <th class="sess-th"></th>
      ${dayHeaders}
    </tr>`;

  const eCls = editMode ? ' editable' : '';
  document.getElementById('tableBody').innerHTML = SLT.length
    ? SLT.map(p => {
        const amCells = DAYS.map((_,di) =>
          `<td class="slot-cell${eCls}" onclick="openPicker('${p.id}',${di},'am',this)">${slotHtml(p.id,di,'am')}</td>`
        ).join('');
        const pmCells = DAYS.map((_,di) =>
          `<td class="slot-cell${eCls}" onclick="openPicker('${p.id}',${di},'pm',this)">${slotHtml(p.id,di,'pm')}</td>`
        ).join('');
        return `
          <tr class="am-row">
            <td class="name-cell" rowspan="2">
              <div class="person-info">
                <div class="person-avatar" style="background:${p.col};color:${contrastColor(p.col)}">${p.init}</div>
                <div>
                  <div class="person-name">${p.name}</div>
                  <div class="person-role">${p.role}</div>
                </div>
              </div>
            </td>
            <td class="sess-td">AM</td>
            ${amCells}
          </tr>
          <tr class="pm-row">
            <td class="sess-td">PM</td>
            ${pmCells}
          </tr>`;
      }).join('')
    : `<tr><td colspan="7" style="padding:24px;text-align:center;font-size:13px;color:#94a3b8">Loading SLT data…</td></tr>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  loadAll();
  renderLegend();
  updateLockUI();
  render();

  const status = document.getElementById('sheetStatus');
  try {
    const fetches = [
      fetch(SHEET_BASE+'Staff').then(r => { if(!r.ok) throw new Error('Staff'); return r.text(); }),
      fetch(SHEET_BASE+'TermDates').then(r => { if(!r.ok) throw new Error('Terms'); return r.text(); }),
    ];
    if (SYNC_URL) fetches.push(fetch(SYNC_URL).then(r => r.text()).catch(() => null));

    const [staffCsv, termsCsv, remoteRaw] = await Promise.all(fetches);

    const sheetSLT   = buildSLT(csvToObjects(staffCsv));
    const sheetWeeks = buildWeeks(csvToObjects(termsCsv));

    if (sheetSLT.length)   SLT   = sheetSLT;
    if (sheetWeeks.length) {
      WEEKS = sheetWeeks;
      if (state.weekIdx === 0) state.weekIdx = currentWeekIdx();
      state.weekIdx = Math.max(0, Math.min(WEEKS.length-1, state.weekIdx));
    }

    if (remoteRaw && remoteRaw !== '{}') {
      try {
        const remote = JSON.parse(remoteRaw);
        if (remote.state)        { state.slots=remote.state.slots??state.slots; state.weekIdx=remote.state.weekIdx??state.weekIdx; }
        if (remote.termTemplate !== undefined) termTemplate = remote.termTemplate;
      } catch(e) {}
    }

    localStorage.setItem('wfa_slt_state', JSON.stringify(state));
    localStorage.setItem('wfa_slt_slt',   JSON.stringify(SLT));
    localStorage.setItem('wfa_slt_term',  JSON.stringify(termTemplate));
    status.textContent = `Sheet loaded · ${SLT.length} SLT members · ${WEEKS.length} weeks`;
    status.className = 'sheet-status ok';
  } catch(e) {
    console.warn('Sheet load failed, using cached data', e);
    status.textContent = SLT.length ? 'Using cached data (offline)' : 'Sheet unavailable';
    status.className = 'sheet-status err';
  }
  render();
}

init();
</script>
