<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CPOMS Incident Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with term picker + tabs; one working view at a time; forms as stacked section cards */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --sunk:#e8eef2; --ink:#0a0101; --muted:#56636c; --line:#d3dde3;
  --accent:#1798d3; --accent-ink:#ffffff; --accent-soft:#dff0f9; --focus:#0d6e9c;
  --green:#2e8b4e; --green-soft:#dcf1e3; --amber:#b77a00; --amber-soft:#fbefcf; --red:#c4372b; --red-soft:#f9dedb;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#151d23; --sunk:#1c262d; --ink:#e9eef1; --muted:#9aa8b1; --line:#2a363e;
  --accent:#4ab4e6; --accent-ink:#06141c; --accent-soft:#16303d; --focus:#8fd2f2;
  --green:#5cc07e; --green-soft:#16301f; --amber:#e3b04b; --amber-soft:#33290f; --red:#ef7d72; --red-soft:#3a1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#151d23; --sunk:#1c262d; --ink:#e9eef1; --muted:#9aa8b1; --line:#2a363e;
  --accent:#4ab4e6; --accent-ink:#06141c; --accent-soft:#16303d; --focus:#8fd2f2;
  --green:#5cc07e; --green-soft:#16301f; --amber:#e3b04b; --amber-soft:#33290f; --red:#ef7d72; --red-soft:#3a1a17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.8rem}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=date],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:600 .9rem var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-block:22px 40px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:.9rem}
.banner.info{background:var(--accent-soft);border-color:var(--accent)}
.banner.err{background:var(--red-soft);border-color:var(--red)}
h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:70ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile.hero{border-color:var(--accent);background:var(--accent-soft)}
.btn{font:600 .9rem var(--body);border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono);font-size:.85rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.Green{background:var(--green-soft);color:var(--green)}
.pill.Amber{background:var(--amber-soft);color:var(--amber)}
.pill.Red{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.no{background:var(--red-soft);color:var(--red)}
.pill.muted{background:var(--sunk);color:var(--muted)}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.pct.hi{color:var(--green)} .pct.mid{color:var(--amber)} .pct.lo{color:var(--red)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--accent)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:80px}
.stack i.G{background:var(--green)} .stack i.A{background:var(--amber)} .stack i.R{background:var(--red)}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.muted{color:var(--muted)}
.note{font-size:.82rem;color:var(--muted)}
/* form */
form.audit{display:grid;gap:16px}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 18px 18px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.2rem;padding:0 6px}
.sec-note{font-size:.84rem;color:var(--muted);margin:-2px 0 10px}
.q{display:grid;grid-template-columns:2.4em 1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .num{font-family:var(--display);font-weight:600;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.q .txt{padding-top:5px;min-width:0}
.q .follow{grid-column:2 / -1;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));background:var(--sunk);border-radius:8px;padding:10px}
.q .follow label{font-size:.8rem;font-weight:600;color:var(--muted);display:grid;gap:4px}
.q.missing .txt{color:var(--red)}
.q.missing .seg{outline:2px solid var(--red);outline-offset:2px;border-radius:7px}
@media (max-width:640px){.q{grid-template-columns:2em 1fr}.q .seg{grid-column:2}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 13px;font-weight:600;font-size:.88rem;border-left:1px solid var(--line);min-width:3.2em;text-align:center}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input[value="No"]:checked+span,.seg input[value="Red"]:checked+span{background:var(--red);color:#fff}
.seg input[value="Green"]:checked+span{background:var(--green);color:#fff}
.seg input[value="Amber"]:checked+span{background:var(--amber);color:#fff}
.seg input[value="N/A"]:checked+span{background:var(--muted);color:var(--surface)}
.fields{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.f.missing>span{color:var(--red)}
.f.missing select,.f.missing input{border-color:var(--red)}
.f.wide{grid-column:1 / -1}
.checks{display:grid;gap:6px 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.checks label{display:flex;gap:8px;align-items:center;font-size:.92rem}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.formbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.formbar .msg{margin-right:auto;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--red-soft);border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 2.6em;gap:4px 10px;align-items:center;font-size:.88rem}
.bars .b .lab{grid-column:1 / -1;min-width:0}
.bars .b .meter{height:10px}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols .c i{display:block;width:70%;max-width:46px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols .c b{font-size:.8rem;font-variant-numeric:tabular-nums}
.cols-x{display:flex;gap:10px;padding:4px 4px 0}
.cols-x span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.gov p{margin:0 0 10px;max-width:72ch}
.gov p b{font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:.8rem;padding-block:10px 30px;border-top:1px solid var(--line)}
.done-row td{color:var(--muted);text-decoration:line-through}
.done-row td:last-child{text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{header.top,.formbar,.btn,nav{display:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>CPOMS Incident Audit</h1><small id="academyLabel">Wallscourt Farm Academy</small></div>
      <div class="pick">
        <label for="yearPick">Year</label>
        <select id="yearPick"></select>
        <label for="termPick">Term</label>
        <select id="termPick"></select>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="audit">New audit</button>
      <button data-view="dashboard">Dashboard</button>
      <button data-view="termly">Termly review</button>
      <button data-view="council">Academy Council</button>
      <button data-view="followups">Follow-ups</button>
      <button data-view="records">Records</button>
      <button data-view="setup">Set-up</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="status"></div>
  <section id="view-audit" data-v hidden></section>
  <section id="view-dashboard" data-v hidden></section>
  <section id="view-termly" data-v hidden></section>
  <section id="view-council" data-v hidden></section>
  <section id="view-followups" data-v hidden></section>
  <section id="view-records" data-v hidden></section>
  <section id="view-setup" data-v hidden></section>
</main>
<div class="wrap"><div class="foot">CPOMS Incident Audit · version <span id="ver"></span> · Record CPOMS incident IDs only, never pupil names or initials.</div></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const VERSION = "WFA-29.10.26a";
document.getElementById("ver").textContent = VERSION;

/* ------------------------------------------------------------------ schema */
const TERMS = ["Term 1","Term 2","Term 3","Term 4","Term 5","Term 6"];
const YNA = ["Yes","No","N/A"];
const CATEGORIES = {
  "Attendance": [],
  "Behaviour Incident": [],
  "Brook Traffic Light Tool": ["Red","Orange","Green"],
  "Cause for Concern": [],
  "Child on Child": ["Ableist bullying","Abuse in intimate personal relationships","Child physical","Faith bullying",
    "Homophobic, transphobic, biphobic bullying","Initiation, hazing or violence rituals","Online bullying","Physical bullying",
    "Racism bullying","Sexual harassment (in person)","Sexual harassment (online)","Sexual violence","Sharing nudes / semi nudes",
    "Sharing nudes / semi nudes including AI generated","Upskirting","Verbal","Verbal bullying"],
  "Mental Health and Wellbeing": ["Anxiety, panic attacks and phobias","Bereavement","Body image","Low mood","Obsessions and compulsions",
    "Parental wellbeing","Self-injury","Suicidal ideation","Suspected eating concerns","Visual and auditory hallucinations"],
  "Positive Handling": [],
  "Prejudicial Related Incident": ["Ableist","Disablist","Gender based (inc. misogyny/misandry)","Homophobic, transphobic, biphobic","Racial","Religion"],
  "Safeguarding": ["ASB","CAPVA","CCE","Choking incident","Clinical incident","Criminality","CSE","DA","DI Notification","Emotional Abuse",
    "FGM","FII","Forced Marriage","Gang affiliation","Gender questioning","Hate crime","HBV","Health Conditions","HSB",
    "Missing person notification","Modern slavery","Neglect","Offensive weapon","Online safety","Parental substance misuse",
    "Physical abuse","Pregnancy","Radicalisation","SENSO","Serious physical assault","Sexual abuse","Smoking and vaping",
    "Substance misuse","Threat of harm with a weapon","Trafficking","Young parent"]
};
const ONLINE_SUBS = ["Online bullying","Sexual harassment (online)","Sharing nudes / semi nudes","Sharing nudes / semi nudes including AI generated","Online safety"];
const EVIDENCE = ["Pupil voice","Parent discussion","Staff statement","Witness account","Body map","Medical evidence","External agency information","CCTV","Screenshots or online evidence","Other"];
const INTERVENTIONS = ["Family contact","DSL discussion","Pupil meeting","Restorative conversation","Behaviour intervention","Pastoral intervention","Referral to external agency","Monitoring","Safety plan","Other"];
const FOCUS = ["Child on Child Abuse","Positive Handling","Online Safety"];

/* Every Yes / No / N/A check. `core` = counts toward the headline "fully compliant" measure (proposal Q1-24).
   `when` decides whether the question applies to this record. A "No" opens issue + required action. */
const CHECKS = [
  {sec:"rec", id:"rs1", t:"Was the incident recorded appropriately?", core:1, short:"Recorded appropriately"},
  {sec:"rec", id:"rs2", t:"Was the record completed as soon as practical following the incident?", core:1, short:"Logged promptly"},
  {sec:"rec", id:"rs3", t:"Was the correct CPOMS category assigned?", core:1, short:"Correct category"},
  {sec:"rec", id:"rs4", t:"Does the record contain factual information only?", core:1, short:"Factual only"},
  {sec:"rec", id:"rs5", t:"Are verbatim quotes used where appropriate?", core:1, short:"Verbatim quotes"},
  {sec:"rec", id:"rs6", t:"Was TED questioning evident (if applicable)?", core:1, short:"TED questioning"},
  {sec:"rec", id:"rs7", t:"Were leading questions avoided?", core:1, short:"No leading questions"},
  {sec:"rec", id:"rs8", t:"Was a body map used when physical injury/symptoms were reported?", core:1, short:"Body map when needed"},
  {sec:"rec", id:"rs9", t:"Were individuals clearly identified in line with school expectations?", core:1, short:"Individuals identified"},
  {sec:"rec", id:"rs10", t:"Is there sufficient evidence to support any professional judgement?", core:1, short:"Evidence supports judgement"},
  {sec:"rec", id:"rs11", t:"Is rationale provided for key decisions?", core:1, short:"Rationale for decisions"},
  {sec:"time", id:"tm1", t:"Was the safeguarding response timely?", core:1, short:"Timely response", noLabel:"What was delayed?"},
  {sec:"time", id:"tm2", t:"If Child Protection, was action immediate?", core:1, short:"CP action immediate"},
  {sec:"time", id:"tm3", t:"If high-risk safeguarding, was action taken before the learner left site?", core:1, short:"High-risk: actioned before leaving site"},
  {sec:"time", id:"tm4", t:"If pastoral concern, was action taken within 24 hours?", core:1, short:"Pastoral: actioned within 24 hours"},
  {sec:"voice", id:"pv1", t:"Was pupil voice recorded?", core:1, short:"Pupil voice recorded", noFollow:true},
  {sec:"voice", id:"pv2", t:"Was pupil voice meaningful and relevant?", core:1, short:"Pupil voice meaningful", opts:["Yes","No"], when:a=>a.pv1==="Yes"},
  {sec:"voice", id:"pf1", t:"Is parental feedback recorded?", core:0, short:"Parental feedback recorded"},
  {sec:"int", id:"ii1", t:"Is the intervention clearly recorded?", core:1, short:"Intervention clearly recorded"},
  {sec:"int", id:"ii2", t:"Is evidence included that interventions were completed?", core:1, short:"Evidence interventions completed"},
  {sec:"int", id:"ii3", t:"Is the outcome clearly recorded?", core:1, short:"Clear outcome recorded"},
  {sec:"int", id:"ii4", t:"Is the impact of interventions recorded?", core:1, short:"Impact recorded"},
  {sec:"int", id:"ii5", t:"For repeat concerns, have interventions escalated appropriately?", core:1, short:"Escalation for repeat concerns"},
  {sec:"ph", id:"ph1", t:"Was the positive handling record completed in full?", core:0, short:"PH record complete", when:a=>a.category==="Positive Handling"},
  {sec:"ph", id:"ph2", t:"Were parents/carers informed on the same day?", core:0, short:"PH parents informed same day", when:a=>a.category==="Positive Handling"},
  {sec:"ph", id:"ph3", t:"Was there a debrief with the pupil afterwards?", core:0, short:"PH pupil debrief", when:a=>a.category==="Positive Handling"},
  {sec:"ph", id:"ph4", t:"Was any injury recorded on a body map?", core:0, short:"PH injury on body map", when:a=>a.category==="Positive Handling"},
];
const SECTIONS = {
  rec:{title:"Recording standards", note:"For each, a No opens boxes for the issue found and the action needed."},
  time:{title:"Timeliness", note:"Use N/A where the situation did not apply."},
  voice:{title:"Pupil and parent voice", note:""},
  int:{title:"Intervention and impact", note:""},
  ph:{title:"Positive handling", note:"Shown because the category is Positive Handling. Check these against the Positive Handling policy."}
};
const CHECK = Object.fromEntries(CHECKS.map(c=>[c.id,c]));
const applies = (c,a)=>!c.when || c.when(a);

/* ------------------------------------------------------------------ state */
const state = {
  view:"audit", records:[], loaded:false, example:false, exampleRecords:[],
  settings:{academy:"Wallscourt Farm Academy", year:currentYear()},
  term:"", year:"", editing:null, names:{}, canWrite:null, me:null, fuShow:"open", recQuery:"", termlyScope:"focus",
  confirmDelete:null
};
const API="/_api/planning/cpomsaudit-db?token=__hub__";

function currentYear(){const d=new Date();const y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return `${y}-${String(y+1).slice(2)}`;}
function guessTerm(){const m=new Date().getMonth();return m>=8&&m<=9?"Term 1":m>=10?"Term 2":m<=1?"Term 3":m<=3?"Term 4":m===4?"Term 5":"Term 6";}
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = s=>{if(!s)return "";const [y,m,d]=String(s).split("-");return d?`${d}/${m}/${y.slice(2)}`:esc(s);};
const pct = (n,d)=>d?n/d:null;
const pctTxt = v=>v==null?"–":Math.round(v*100)+"%";
const pctCls = v=>v==null?"":v>=0.95?"hi":v>=0.8?"mid":"lo";
const todayISO = ()=>new Date().toISOString().slice(0,10);
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

/* ------------------------------------------------------------------ derived */
function ragOf(r){return r.rag||"";}
function focusAreas(r){
  const f=[];
  if(r.category==="Child on Child") f.push("Child on Child Abuse");
  if(r.category==="Positive Handling") f.push("Positive Handling");
  if(r.onlineSafety==="Yes") f.push("Online Safety");
  return f;
}
function coreFails(r){return CHECKS.filter(c=>c.core&&applies(c,r)&&r.answers?.[c.id]==="No").map(c=>c.id);}
function allFails(r){return CHECKS.filter(c=>applies(c,r)&&r.answers?.[c.id]==="No").map(c=>c.id);}
const fullyCompliant = r=>coreFails(r).length===0;
function allRecords(){return state.example?state.exampleRecords:state.records;}
function inScope(r,term=state.term,year=state.year){return (!year||r.year===year)&&(term==="Whole year"||r.term===term);}
function scoped(){return allRecords().filter(r=>inScope(r));}
function listActions(r){
  const out=[];
  for(const id of Object.keys(r.issues||{})){
    const c=CHECK[id]; const it=r.issues[id];
    if(!c||!applies(c,r)||r.answers?.[id]!=="No") continue;
    if(it&&(it.action||it.issue)) out.push({key:id, kind:"Check", label:c.short, issue:it.issue||"", action:it.action||"", owner:"", target:"", done:!!r.done?.[id]});
  }
  if(r.rag==="Amber"||r.rag==="Red") out.unshift({key:"fu", kind:r.rag, label:"RAG follow-up", issue:"", action:r.fuAction||"", owner:r.fuOwner||"", target:r.fuTarget||"", done:!!r.done?.fu});
  return out;
}

function metrics(recs){
  const m={n:recs.length, compliant:recs.filter(fullyCompliant).length, rag:{Green:0,Amber:0,Red:0}, checks:{}, ev:{}, int:{}, cats:{}, subs:{}, focus:{}, actions:{}, open:0, overdue:0, evYes:0, evNo:0, intYes:0, intNo:0, repeat:0};
  for(const c of CHECKS) m.checks[c.id]={Yes:0,No:0,"N/A":0};
  for(const e of EVIDENCE) m.ev[e]=0;
  for(const e of INTERVENTIONS) m.int[e]=0;
  for(const f of FOCUS) m.focus[f]=0;
  for(const r of recs){
    if(m.rag[r.rag]!=null) m.rag[r.rag]++;
    for(const c of CHECKS){if(!applies(c,r))continue;const v=r.answers?.[c.id];if(m.checks[c.id][v]!=null)m.checks[c.id][v]++;}
    if(r.evidence==="Yes"){m.evYes++;for(const e of r.evTypes||[]) if(m.ev[e]!=null) m.ev[e]++;} else if(r.evidence==="No") m.evNo++;
    if(r.interventions==="Yes"){m.intYes++;for(const e of r.intTypes||[]) if(m.int[e]!=null) m.int[e]++;} else if(r.interventions==="No") m.intNo++;
    const cat=r.category||"Unknown";
    m.cats[cat]=m.cats[cat]||{n:0,Green:0,Amber:0,Red:0,compliant:0};
    m.cats[cat].n++; if(r.rag) m.cats[cat][r.rag]++; if(fullyCompliant(r)) m.cats[cat].compliant++;
    if(r.sub){const k=cat+" › "+r.sub;m.subs[k]=(m.subs[k]||0)+1;}
    for(const f of focusAreas(r)) m.focus[f]++;
    if(r.repeat==="Yes") m.repeat++;
    for(const a of listActions(r)){
      const k=(a.action||"").trim().toLowerCase(); if(k) m.actions[k]=(m.actions[k]||{text:a.action.trim(),n:0}), m.actions[k].n++;
      if(!a.done){m.open++; if(a.target&&a.target<todayISO()) m.overdue++;}
    }
  }
  m.pctYes = id=>{const c=m.checks[id];return pct(c.Yes,c.Yes+c.No);};
  return m;
}

/* ------------------------------------------------------------------ data layer (WFA API via the signed-in /_api proxy) */
async function api(method,body){
  const opt={method,headers:{"X-WFA-Proxy":"1"},credentials:"same-origin",cache:"no-store"};
  if(body){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  let res;
  try{res=await fetch(method==="GET"?API+"&action=load":API,opt);}catch(e){throw {kind:"net",message:"No connection. Check the network and try again."};}
  if(res.status===401) throw {kind:"signin",message:"Your sign-in has run out. Reload the page to sign in again."};
  let j=null; try{j=await res.json();}catch(e){}
  if(!res.ok||!j) throw {kind:"server",message:"The school server did not answer properly (status "+res.status+")."};
  if(j.error==="not allowed") throw {kind:"denied",message:j.message||"This tool is for the DSL only."};
  if(j.error) throw {kind:"server",message:j.error};
  return j;
}
async function boot(){
  try{
    const j=await api("GET");
    state.me=j.me||""; state.records=j.audits||[];
    if(j.settings&&j.settings.academy) state.settings={...state.settings,...j.settings};
    state.year=state.settings.year; state.loaded=true; state.canWrite=true; showStatus(null);
  }catch(e){showStatus(e.kind==="signin"||e.kind==="denied"?e.kind:"err",e.message);}
  render();
}
function nameFromEmail(e){if(!e)return "";const p=e.split("@")[0].split(/[._-]+/).filter(Boolean);return p.map(w=>{w=w[0].toUpperCase()+w.slice(1);return /^Mc./.test(w)?"Mc"+w[2].toUpperCase()+w.slice(3):w;}).join(" ");}
const auditorName = r=>r.example?"Example":(r.createdBy?(r.createdBy===state.me?"You":nameFromEmail(r.createdBy)):"You");
function putLocal(rec){const i=state.records.findIndex(x=>x.id===rec.id);if(i>=0)state.records[i]=rec;else state.records.push(rec);}
async function saveRecord(rec){
  if(state.example){toast("Example mode: nothing is saved. Turn it off in Set-up.");return false;}
  if(!state.loaded){toast("Audits have not loaded yet, so nothing was saved. Reload the page.");return false;}
  const base=rec.id?(state.records.find(x=>x.id===rec.id)?.updatedAt||""):"";
  try{
    const j=await api("POST",{action:"save",audit:rec,base});
    if(j.conflict){putLocal(j.audit);render();toast("This audit was changed somewhere else. The latest version is now shown; make your change again.");return false;}
    if(!j.ok){toast("Not saved: "+(j.error||"unknown problem"));return false;}
    putLocal(j.audit); return true;
  }catch(e){if(e.kind==="signin")showStatus("signin",e.message);toast("Not saved: "+e.message);return false;}
}
async function patchRecord(id,patch){
  if(state.example){const r=state.exampleRecords.find(x=>x.id===id);if(r){Object.assign(r,patch,{done:{...(r.done||{}),...(patch.done||{})}});render();}return;}
  const [key,value]=Object.entries(patch.done||{}).find(([k,v])=>{const r=state.records.find(x=>x.id===id);return !!r?.done?.[k]!==v;})||[];
  if(!key) return;
  try{const j=await api("POST",{action:"setDone",id,key,value});if(!j.ok){toast("Not saved: "+j.error);return;}putLocal(j.audit);render();toast(value?"Marked done":"Reopened");}
  catch(e){toast("Not saved: "+e.message);}
}
async function deleteRecord(id){
  if(state.example){state.exampleRecords=state.exampleRecords.filter(r=>r.id!==id);render();return;}
  try{const j=await api("POST",{action:"delete",id});if(!j.ok){toast("Not deleted: "+j.error);return;}state.records=state.records.filter(r=>r.id!==id);render();toast("Audit deleted");}
  catch(e){toast("Not deleted: "+e.message);}
}
function showStatus(kind,msg){
  if(kind!==undefined){state.statusKind=kind;state.statusMsg=msg;} else {kind=state.statusKind;msg=state.statusMsg;}
  const el=document.getElementById("status");
  if(state.example){el.innerHTML=`<div class="banner"><b>Example data.</b> These audits are made up so you can see how the reports look. Nothing you do is saved. <button class="btn small" data-act="example-off">Turn off examples</button></div>`;return;}
  if(kind==="signin"){el.innerHTML=`<div class="banner err"><b>Signed out.</b> ${esc(msg)} <button class="btn small" data-act="reload">Reload</button></div>`;return;}
  if(kind==="denied"){el.innerHTML=`<div class="banner err"><b>No access.</b> ${esc(msg)}</div>`;return;}
  if(kind==="err"){el.innerHTML=`<div class="banner err"><b>Audits could not be loaded.</b> ${esc(msg||"")} <button class="btn small" data-act="reload">Reload</button></div>`;return;}
  el.innerHTML="";
}

function fillSubs(selected){
  const f=document.getElementById("auditForm"); if(!f) return;
  const subs=CATEGORIES[f.category.value]||[];
  const cur=selected!==undefined?selected:f.sub.value;

  document.getElementById("subWrap").hidden=!subs.length;
}
function readForm(){
  const f=document.getElementById("auditForm"); const fd=new FormData(f);
  const g=k=>(fd.get(k)||"").toString().trim();
  const rec={term:g("term"),year:g("year"),cpomsId:g("cpomsId"),incidentDate:g("incidentDate"),category:g("category"),sub:g("sub"),
    auditDate:g("auditDate"),onlineSafety:g("onlineSafety"),repeat:g("repeat"),context:g("context"),answers:{},issues:{},
    pvReason:g("pvReason"),evidence:g("evidence"),evTypes:fd.getAll("evTypes"),evOther:g("evOther"),
    interventions:g("interventions"),intTypes:fd.getAll("intTypes"),intOther:g("intOther"),response:g("response"),impactText:g("impactText"),
    rag:g("rag"),fuAction:g("fuAction"),fuOwner:g("fuOwner"),fuTarget:g("fuTarget")};
  for(const c of CHECKS){rec.answers[c.id]=g(c.id); const i=g(c.id+"_issue"), a=g(c.id+"_action"); if(i||a) rec.issues[c.id]={issue:i,action:a};}
  return rec;
}
function updateForm(e){
  const f=document.getElementById("auditForm"); if(!f) return;
  if(e&&e.target&&e.target.name==="category"){fillSubs("");}
  if(e&&e.target&&e.target.name==="sub"&&ONLINE_SUBS.includes(e.target.value)){const y=f.querySelector('input[name="onlineSafety"][value="Yes"]');if(y&&!f.querySelector('input[name="onlineSafety"]:checked'))y.checked=true;}
  const r=readForm();
  for(const c of CHECKS){
    const q=f.querySelector(`[data-q="${c.id}"]`); const on=applies(c,r); q.hidden=!on;
    const fl=f.querySelector(`[data-follow="${c.id}"]`); if(fl) fl.hidden=!(on&&r.answers[c.id]==="No");
  }
  f.querySelector('[data-sec="ph"]').hidden=r.category!=="Positive Handling";
  f.querySelector('[data-cond="pvReason"]').hidden=r.answers.pv1!=="No";
  f.querySelector('[data-cond="evTypes"]').hidden=r.evidence!=="Yes";
  f.querySelector('[data-cond="evOther"]').hidden=!r.evTypes.includes("Other");
  f.querySelector('[data-cond="intTypes"]').hidden=r.interventions!=="Yes";
  f.querySelector('[data-cond="intOther"]').hidden=!r.intTypes.includes("Other");
  f.querySelector('[data-cond="fu"]').hidden=!(r.rag==="Amber"||r.rag==="Red");
  if(e) {const left=missing(r).length;document.getElementById("formMsg").textContent=left?`${left} answer${left>1?"s":""} still to give`:"Ready to save";}
}
function missing(r){
  const m=[];
  for(const k of ["term","year","cpomsId","incidentDate","category","auditDate","onlineSafety","repeat","evidence","interventions","rag"]) if(!r[k]) m.push(k);
  if((CATEGORIES[r.category]||[]).length&&!r.sub) m.push("sub");
  for(const c of CHECKS) if(applies(c,r)&&!r.answers[c.id]) m.push(c.id);
  if(r.rag==="Amber"||r.rag==="Red") for(const k of ["fuAction","fuOwner","fuTarget"]) if(!r[k]) m.push(k);
  return m;
}
async function submitForm(e){
  e.preventDefault();
  const f=e.target; const r=readForm(); const miss=missing(r);
  f.querySelectorAll(".missing").forEach(x=>x.classList.remove("missing"));
  if(miss.length){
    for(const k of miss){const el=f.querySelector(`[data-q="${k}"],[data-f="${k}"]`);if(el)el.classList.add("missing");}
    const first=f.querySelector(".missing"); if(first) first.scrollIntoView({block:"center",behavior:"smooth"});
    document.getElementById("formMsg").textContent=`${miss.length} answer${miss.length>1?"s":""} still to give (marked in red)`;
    return;
  }
  // drop answers to questions that no longer apply
  for(const c of CHECKS) if(!applies(c,r)){delete r.answers[c.id];delete r.issues[c.id];}
  for(const id of Object.keys(r.issues)) if(r.answers[id]!=="No") delete r.issues[id];
  if(r.answers.pv1!=="No") r.pvReason="";
  if(r.evidence!=="Yes"){r.evTypes=[];r.evOther="";}
  if(r.interventions!=="Yes"){r.intTypes=[];r.intOther="";}
  if(!(r.rag==="Amber"||r.rag==="Red")){r.fuAction="";r.fuOwner="";r.fuTarget="";}
  const prev=state.editing;
  const rec={...r,v:1,done:prev?.done||{},createdAt:prev?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  if(prev?.id) rec.id=prev.id;
  if(state.example){rec.id=rec.id||"ex"+Date.now();rec.example=true;state.exampleRecords=state.exampleRecords.filter(x=>x.id!==rec.id).concat(rec);toast("Example mode: added to the example data only");}
  else {document.getElementById("saveBtn").disabled=true; const ok=await saveRecord(rec); document.getElementById("saveBtn").disabled=false; if(!ok) return; toast(prev?"Changes saved":"Audit saved");}
  const keepTerm=r.term, keepYear=r.year;
  state.editing=null; formBuilt=false;
  if(prev){go("records");return;}
  renderAudit();
  const nf=document.getElementById("auditForm"); nf.term.value=keepTerm; nf.year.value=keepYear;
  window.scrollTo(0,0);
}

/* ------------------------------------------------------------------ termly review (trust template) */
function termlyRows(){
  let recs=scoped();
  if(state.termlyScope==="focus") recs=recs.filter(r=>focusAreas(r).length);
  const order=r=>{const f=focusAreas(r);return f.length?FOCUS.indexOf(f[0]):3;};
  return recs.slice().sort((a,b)=>order(a)-order(b)||String(a.incidentDate).localeCompare(String(b.incidentDate)));
}
function termlyCells(r){
  const type=(r.category==="Child on Child"||!r.sub?(r.sub||r.category):r.category+" › "+r.sub)+(r.onlineSafety==="Yes"&&r.category!=="Child on Child"?" (online)":"")+(r.context?" — "+r.context:"");
  const ivs=(r.intTypes||[]).map(x=>x==="Other"&&r.intOther?r.intOther:x);
  const evs=(r.evTypes||[]).map(x=>x==="Other"&&r.evOther?r.evOther:x);
  const resp=[r.response, ivs.length?"Interventions: "+ivs.join(", "):"No interventions recorded", evs.length?"Evidence: "+evs.join(", "):""].filter(Boolean).join(". ");
  const pv=r.answers?.pv1==="Yes"?"Y":r.answers?.pv1==="No"?"N":"N/A";
  const imp=[r.impactText, r.answers?.ii4==="Yes"?"Impact recorded.":r.answers?.ii4==="No"?"Impact not recorded.":"",
    (r.rag==="Amber"||r.rag==="Red")&&r.fuAction?`Follow-up: ${r.fuAction} (${r.fuOwner}${r.fuTarget?", by "+fmtDate(r.fuTarget):""}).`:""].filter(Boolean).join(" ");
  const cat=focusAreas(r).join(" / ")||r.category;
  return [fmtDate(r.incidentDate), cat, `${type} (CPOMS ${r.cpomsId})`, resp, pv, imp, r.rag];
}

      <div class="row"><button class="btn" data-act="${state.example?"example-off":"example-on"}">${state.example?"Turn off example data":"Show example data"}</button></div>
    </div>
    <div class="card"><h3>How it counts</h3>
      <p class="note"><b>Fully compliant</b>: no recording, timeliness, pupil voice or intervention check answered No (Q1–24 in the proposal). Parental feedback and the positive handling checks are reported separately.</p>
      <p class="note"><b>% Yes</b>: Yes ÷ (Yes + No). N/A and questions that did not apply are left out.</p>
      <p class="note"><b>Focus areas</b> (termly review): Child on Child Abuse = category Child on Child; Positive Handling = category Positive Handling; Online Safety = answered Yes to the online safety question. One incident can count in two.</p>
    </div>
  </div>`;
}
async function saveSettings(){
  const academy=document.getElementById("setAcademy").value.trim()||"Wallscourt Farm Academy";
  const year=document.getElementById("setYear").value.trim()||currentYear();
  if(state.example){state.settings={academy,year};state.year=year;render();toast("Example mode: details not saved");return;}
  try{const j=await api("POST",{action:"saveSettings",settings:{academy,year}});if(!j.ok){toast("Not saved: "+j.error);return;}state.settings={...state.settings,...j.settings};state.year=year;render();toast("Details saved");}
  catch(e){toast("Not saved: "+e.message);}
}

/* ------------------------------------------------------------------ export + copy */
function csvEsc(v){v=Array.isArray(v)?v.join("; "):String(v??"");return /[",\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function toCSV(rows){return "﻿"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");}
function offer(filename,data){
  const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function allCSV(){
  const head=["Year","Term","CPOMS ID","Incident date","Category","Sub-category","Online safety","Repeat concern","Audit date","Auditor","Incident type/context",
    ...CHECKS.flatMap((c,i)=>[`Q${i+1} ${c.t}`,`Q${i+1} issue`,`Q${i+1} required action`]),
    "Reason pupil voice not recorded","Evidence obtained","Evidence types","Other evidence","Interventions implemented","Intervention types","Other intervention",
    "Academy response","Impact / follow-up","RAG","Follow-up action","Responsible","Target date","Follow-up done","Fully compliant","Checks answered No"];
  const rows=allRecords().slice().sort((a,b)=>String(a.year+a.term+a.incidentDate).localeCompare(String(b.year+b.term+b.incidentDate))).map(r=>[
    r.year,r.term,r.cpomsId,r.incidentDate,r.category,r.sub,r.onlineSafety,r.repeat,r.auditDate,auditorName(r),r.context,
    ...CHECKS.flatMap(c=>[applies(c,r)?(r.answers?.[c.id]||""):"",r.issues?.[c.id]?.issue||"",r.issues?.[c.id]?.action||""]),
    r.pvReason,r.evidence,r.evTypes||[],r.evOther,r.interventions,r.intTypes||[],r.intOther,r.response,r.impactText,r.rag,r.fuAction,r.fuOwner,r.fuTarget,
    r.done?.fu?"Yes":"",fullyCompliant(r)?"Yes":"No",allFails(r).map(id=>CHECK[id].short)]);
  return toCSV([head,...rows]);
}
async function copyText(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok);}catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    let done=false;try{done=document.execCommand("copy");}catch(_){}ta.remove();toast(done?ok:"Copy blocked here. Use Download CSV instead.");
  }
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="example-on"){state.example=true;state.exampleRecords=makeExamples();state.year=state.settings.year;render();toast("Showing example data");}
  else if(act==="example-off"){state.example=false;state.exampleRecords=[];render();}
  else if(act==="edit"){state.editing=allRecords().find(r=>r.id===id)||null;formBuilt=false;go("audit");}
  else if(act==="cancel-edit"){state.editing=null;formBuilt=false;go("records");}
  else if(act==="clear-form"){formBuilt=false;renderAudit();}
  else if(act==="ask-delete"){state.confirmDelete=id;renderRecords();}
  else if(act==="cancel-delete"){state.confirmDelete=null;renderRecords();}
  else if(act==="delete"){state.confirmDelete=null;deleteRecord(id);}
  else if(act==="toggle-done"){const r=allRecords().find(x=>x.id===id);if(r){const v=!r.done?.[b.dataset.key];patchRecord(id,{done:{...(r.done||{}),[b.dataset.key]:v}});}}
  else if(act==="save-settings"){saveSettings();}
  else if(act==="reload"){location.reload();}
  else if(act==="csv-all"){offer(`CPOMS audits ${state.year}.csv`,allCSV());}
  else if(act==="csv-termly"){offer(`CPOMS termly review ${scopeLabel()}.csv`,toCSV([["Academy",state.settings.academy],["Term",scopeLabel()],...FOCUS.map(f=>[`No. of ${f} incidents`,metrics(scoped()).focus[f]]),[],["Incident Date","Category","Incident Type/Context","Academy Response","Pupil Voice (Y or N)","Impact of Interventions/Follow Up","RAG"],...termlyRows().map(termlyCells)]));}
  else if(act==="copy-termly"){copyText([["Incident Date","Category","Incident Type/Context","Academy Response","Pupil Voice (Y or N)","Impact of Interventions/Follow Up","RAG"],...termlyRows().map(termlyCells)].map(r=>r.map(c=>String(c??"").replace(/[\t\n]/g," ")).join("\t")).join("\n"),"Table copied. Paste it into the Word template.");}
  else if(act==="copy-gov"){copyText(`Safeguarding record audit — ${state.settings.academy}, ${scopeLabel()}\n\n`+governorLines().join("\n"),"Summary copied");}
});

/* ------------------------------------------------------------------ example data (never saved) */
function makeExamples(){
  let s=20261029; const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648; const pick=a=>a[Math.floor(rnd()*a.length)];
  const cats=["Child on Child","Child on Child","Child on Child","Positive Handling","Positive Handling","Safeguarding","Mental Health and Wellbeing","Behaviour Incident","Cause for Concern","Prejudicial Related Incident","Attendance","Brook Traffic Light Tool"];
  const acts=["Remind staff to record within 24 hours","Add pupil voice to the record","Re-categorise in CPOMS","Upload body map","Record outcome of parent meeting","Add rationale for decision","DSL to review escalation"];
  const out=[]; const y=state.settings.year;
  ["Term 1","Term 1","Term 2","Term 3"].forEach((t,ti)=>{for(let i=0;i<9;i++){
    const category=pick(cats), subs=CATEGORIES[category], sub=subs.length?pick(subs):"";
    const r={id:`ex${ti}-${i}`,example:true,year:y,term:t,cpomsId:String(40000+ti*100+i*7),incidentDate:`20${y.slice(0,2)==="20"?y.slice(2,4):"26"}-${["09","10","11","12"][ti]}-${String(1+Math.floor(rnd()*27)).padStart(2,"0")}`,
      category,sub,onlineSafety:ONLINE_SUBS.includes(sub)||rnd()<.15?"Yes":"No",repeat:rnd()<.25?"Yes":"No",auditDate:todayISO(),context:"",answers:{},issues:{},done:{}};
    const q=ti>=2?.93:.85;
    for(const c of CHECKS){if(!applies(c,r))continue;
      let v=rnd()<q?"Yes":rnd()<.6?"No":"N/A"; if(c.opts&&v==="N/A") v="Yes"; if(c.id==="ii5"&&r.repeat!=="Yes") v="N/A";
      r.answers[c.id]=v; if(v==="No"&&!c.noFollow) r.issues[c.id]={issue:"Example issue",action:pick(acts)};}
    if(r.answers.pv1==="No") r.pvReason="Pupil not available";
    r.evidence=rnd()<.85?"Yes":"No"; r.evTypes=r.evidence==="Yes"?EVIDENCE.filter(()=>rnd()<.3):[];
    r.interventions=rnd()<.9?"Yes":"No"; r.intTypes=r.interventions==="Yes"?INTERVENTIONS.filter(()=>rnd()<.28):[];
    const nos=allFails(r).length; r.rag=nos===0?"Green":nos<3?"Amber":"Red";
    if(r.rag!=="Green"){r.fuAction=pick(acts);r.fuOwner="DSL";r.fuTarget=`20${y.slice(2,4)}-${["10","11","12","01"][ti]}-15`.replace(/^20(\d\d)-01/,(m,a)=>`20${+a+1}-01`);r.done.fu=rnd()<.4;}
    out.push(r);}});
  return out;
}

/* ------------------------------------------------------------------ start */
const startHash=(location.hash||"").slice(1);
if(["audit","dashboard","termly","council","followups","records","setup"].includes(startHash)) state.view=startHash;
state.year=state.settings.year; state.term=guessTerm();
render();
boot();
