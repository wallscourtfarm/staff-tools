<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:#fff;font-family:'Nunito',sans-serif}
#app{width:100%;height:100%;display:flex;flex-direction:column;outline:5px solid #1798d3;outline-offset:-2px}

#date-hdr{display:flex;align-items:center;justify-content:space-between;padding:0.06em 0.5em;border-bottom:3px solid #111;flex-shrink:0;line-height:1.05}
#date-logo{height:clamp(48px,7vh,80px);width:auto;object-fit:contain;flex-shrink:0}
#date-text{font-size:clamp(2.8rem,8vh,6rem);font-weight:700;color:#111;letter-spacing:0.01em;flex:1;text-align:center}
#class-name{font-size:clamp(2rem,5vh,4rem);font-weight:900;color:#1798d3;line-height:1}
#version-tag{font-size:clamp(0.45rem,1vh,0.7rem);font-weight:600;color:#AAA;letter-spacing:0.05em;line-height:1;text-align:right;display:block;margin-top:0.1em}

#lunch-bar{display:grid;grid-template-columns:1.8fr 1.8fr 1.2fr 1.2fr 1.2fr 1fr;border-bottom:3px solid #111;flex-shrink:0}
.lc{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(1.3rem,3.2vh,2.2rem);padding:0.4em 0.6em;text-align:center;line-height:1.2;min-height:clamp(60px,9.5vh,100px);min-width:0;flex-direction:column;gap:0.15em}
.lc img.food-img{height:clamp(38px,6vh,62px);width:auto;object-fit:contain;flex-shrink:0}
.lc+.lc{border-left:2.5px solid rgba(0,0,0,0.18)}
.lc-r{background:#E00;color:#fff;position:relative}.lc-g{background:#3A9922;color:#fff}.lc-p{background:#E07070;color:#fff}.lc-j{background:#6B4820;color:#F0DFC0}.lc-b{background:#111;color:#fff}.lc-roll{background:#D9A441;color:#fff}
.halal-badge{position:absolute;top:3px;right:3px;width:42%;max-width:90px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))}

#main{flex:1;min-height:0;overflow:hidden}
#img-grid{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:12px}
.img-slot{position:relative;border:3px solid #EEE;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FAFAFA;min-height:0}
.img-slot img{max-width:100%;max-height:100%;object-fit:contain;display:none}
.img-slot img.has{display:block}
.slot-placeholder{color:#CCC;font-size:clamp(1rem,2.4vh,1.4rem);font-weight:800;text-align:center;padding:1em}
.slot-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:7px;padding:0.4em 0.9em;font-size:clamp(0.7rem,1.5vh,0.95rem);font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif}
.slot-btn:hover{background:rgba(0,0,0,0.75)}
.slot-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:7px;padding:0.25em 0.7em;font-size:clamp(0.65rem,1.4vh,0.85rem);cursor:pointer;font-family:'Nunito',sans-serif}

.slot-input{display:none}

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function todayStr(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function getMon(ds){const dt=new Date(ds+'T12:00:00');const d=dt.getDay();dt.setDate(dt.getDate()-(d===0?6:d-1));return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function getDK(ds){return DAYS[new Date(ds+'T12:00:00').getDay()]}

function getMenu(){
  const ts=todayStr(),dk=getDK(ts);
  if(!['Mon','Tue','Wed','Thu','Fri'].includes(dk))return['No school today',''];
  const mon=getMon(ts);
  const base=(MENU_BY_WEEK[mon]&&MENU_BY_WEEK[mon][dk])||['Menu not yet set',''];
  return base;
}

async function loadSharedMenu(){
  try{
    const res=await fetch('https://staff.wallscourt-farm-academy.co.uk/menu.json',{cache:'no-cache'});
    if(!res.ok)throw new Error('fetch failed');
    const data=await res.json();
    if(data&&data.weeks&&typeof data.weeks==='object'){
      Object.keys(MENU_BY_WEEK).forEach(k=>delete MENU_BY_WEEK[k]);
      Object.assign(MENU_BY_WEEK,data.weeks);
      console.log('[SharedMenu] Loaded',Object.keys(MENU_BY_WEEK).length,'weeks');
    }
  }catch(e){console.log('[SharedMenu] Using in-file fallback:',e.message);}
}

  'Penne pasta with house tomato sauce':'tomato-pasta.png',
  'Penne pasta with a creamy cheese sauce':'creamy-cheese-pasta.png',
  'Creamy pesto penne pasta':'pesto-pasta.png',

const FILLED_ROLL_BY_DAY={Mon:'Ham, Cheese or Tuna',Tue:'Ham, Cheese or Tuna',Wed:'Ham, Cheese or Tuna',Thu:'Ham, Cheese or Tuna',Fri:'Cheese or Tuna'};

function setLunchCell(id,mealName){
  const el=document.getElementById(id);
  const imgFile=MEAL_IMG[mealName];
  const badge=id==='lc0'?'<img class="halal-badge" src="../img/halal-badge.png" alt="Halal option available">':'';
  el.innerHTML=(imgFile?`<img class="food-img" src="../img/${imgFile}" alt="">${mealName}`:mealName)+badge;
}
function getPastaForToday(){
  const ts=todayStr(),dk=getDK(ts);
  if(!['Mon','Tue','Wed','Thu','Fri'].includes(dk))return'';
  const mon=getMon(ts);
  const week=MENU_BY_WEEK[mon];
  return(week&&week[dk]&&week[dk][2])||'Pasta';
}
function setPastaCell(){
  const p=getPastaForToday();
  const el=document.getElementById('lc-pasta');
  const imgFile=PASTA_IMG[p];
  el.innerHTML=imgFile?`<img class="food-img" src="../img/${imgFile}" alt="">${p}`:p;
}
function setRollCell(){
  const dk=getDK(todayStr());
  const filling=FILLED_ROLL_BY_DAY[dk]||'Ham, Cheese or Tuna';
  const el=document.getElementById('lc-roll');
  el.innerHTML=`<img class="food-img" src="../img/filled-roll.png" alt="">Filled Roll<br><span style="font-size:0.72em;font-weight:600;opacity:0.9">${filling}</span>`;
}
function renderLunch(){
  const[m1,m2]=getMenu();
  setLunchCell('lc0',m1);
  setLunchCell('lc1',m2);
  setPastaCell();
  setRollCell();
}
function renderDate(){
  const n=new Date();
  document.getElementById('date-text').textContent=`${DAYNAMES[n.getDay()]},  ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}

// ═══════════════════════════════════════════════════════════
// IMAGE SLOTS — 4 fixed slots, stored per-device in localStorage
// ═══════════════════════════════════════════════════════════
let activeSlot=null;
function pickImg(n){
  activeSlot=n;
  document.getElementById('slot-input').click();
}
function handleImgFile(ev){
  const file=ev.target.files[0];
  if(!file||!activeSlot)return;
  const reader=new FileReader();
  reader.onload=()=>{
    localStorage.setItem('eyfs_oak_img_'+activeSlot,reader.result);
    renderSlot(activeSlot);
  };
  reader.readAsDataURL(file);
  ev.target.value='';
}
function removeImg(n){
  localStorage.removeItem('eyfs_oak_img_'+n);
  renderSlot(n);
}
function renderSlot(n){
  const data=localStorage.getItem('eyfs_oak_img_'+n);
  const img=document.getElementById('slot-img-'+n);
  const slot=document.getElementById('slot-'+n);
  const removeBtn=document.getElementById('slot-remove-'+n);
  if(data){
    img.src=data;
    img.classList.add('has');
    slot.querySelector('.slot-placeholder').style.display='none';
    removeBtn.style.display='block';
  }else{
    img.src='';
    img.classList.remove('has');
    slot.querySelector('.slot-placeholder').style.display='block';
    removeBtn.style.display='none';
  }
}
function loadSlots(){for(let n=1;n<=4;n++)renderSlot(n)}

function init(){
  renderDate();renderLunch();loadSlots();
}
loadSharedMenu().then(renderLunch);
init();
setInterval(renderDate,60000);
