const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function todayStr(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function getMon(ds){const dt=new Date(ds+'T12:00:00');const d=dt.getDay();dt.setDate(dt.getDate()-(d===0?6:d-1));return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function getDK(ds){return DAYS[new Date(ds+'T12:00:00').getDay()]}

function getMenu(){
  const ts=todayStr(),dk=getDK(ts);
  if(!['Mon','Tue','Wed','Thu','Fri'].includes(dk))return['No school today',''];
  if(CENTRAL_OVERRIDES[ts])return CENTRAL_OVERRIDES[ts];
  const lookupDate=CENTRAL_SWAPS[ts]||ts,lookupDk=getDK(lookupDate);
  const mon=getMon(lookupDate);
  const base=(MENU_BY_WEEK[mon]&&MENU_BY_WEEK[mon][lookupDk])||['Menu not yet set',''];
  return base;
}

async function loadSharedMenu(){
  try{
    const res=await fetch('https://staff.wallscourt-farm-academy.co.uk/menu.json',{cache:'no-cache'});
    if(!res.ok)throw new Error('fetch failed');
    const data=await res.json();
    if(data&&data.weeks&&typeof data.weeks==='object'){
      Object.keys(MENU_BY_WEEK).forEach(k=>delete MENU_BY_WEEK[k]);
      Object.assign(MENU_BY_WEEK,data.weeks);
      console.log('[SharedMenu] Loaded',Object.keys(MENU_BY_WEEK).length,'weeks');
    }
  }catch(e){console.log('[SharedMenu] Using in-file fallback:',e.message);}
  try{
    const or=await fetch(LUNCH_OVERRIDE_URL,{cache:'no-cache'});
    if(!or.ok)throw new Error('fetch failed');
    const od=await or.json();
    CENTRAL_OVERRIDES=od.overrides||{};
    CENTRAL_SWAPS=od.swaps||{};
  }catch(e){console.log('[LunchOverride] none available:',e.message);}
}

function getPastaForToday(){
  const ts=todayStr(),dk=getDK(ts);
  if(!['Mon','Tue','Wed','Thu','Fri'].includes(dk))return'';
  const mon=getMon(ts);
  const week=MENU_BY_WEEK[mon];
  return(week&&week[dk]&&week[dk][2])||'Pasta';
}
function setPastaCell(){
  const p=getPastaForToday();
  const el=document.getElementById('lc-pasta');
  const imgFile=PASTA_IMG[p];
  el.innerHTML=imgFile?`<img class="food-img" src="../img/${imgFile}" alt="">${p}`:p;
}
function setRollCell(){
  const dk=getDK(todayStr());
  const filling=FILLED_ROLL_BY_DAY[dk]||'Ham, Cheese or Tuna';
  const el=document.getElementById('lc-roll');
  el.innerHTML=`<img class="food-img" src="../img/filled-roll.png" alt="">Filled Roll<br><span style="font-size:0.72em;font-weight:600;opacity:0.9">${filling}</span>`;
}
function renderLunch(){
  const[m1,m2]=getMenu();
  setLunchCell('lc0',m1);
  setLunchCell('lc1',m2);
  setPastaCell();
  setRollCell();
}
function renderDate(){
  const n=new Date();
  document.getElementById('date-text').textContent=`${DAYNAMES[n.getDay()]},  ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}

// ═══════════════════════════════════════════════════════════
// IMAGE SLOTS — 4 fixed slots, stored per-device in localStorage
// ═══════════════════════════════════════════════════════════
let activeSlot=null;
function pickImg(n){
  activeSlot=n;
  document.getElementById('slot-input').click();
}
function handleImgFile(ev){
  const file=ev.target.files[0];
  if(!file||!activeSlot)return;
  const reader=new FileReader();
  reader.onload=()=>{
    localStorage.setItem('eyfs_oak_img_'+activeSlot,reader.result);
    renderSlot(activeSlot);
  };
  reader.readAsDataURL(file);
  ev.target.value='';
}
function removeImg(n){
  localStorage.removeItem('eyfs_oak_img_'+n);
  renderSlot(n);
}
function renderSlot(n){
  const data=localStorage.getItem('eyfs_oak_img_'+n);
  const img=document.getElementById('slot-img-'+n);
  const slot=document.getElementById('slot-'+n);
  const removeBtn=document.getElementById('slot-remove-'+n);
  if(data){
    img.src=data;
    img.classList.add('has');
    slot.querySelector('.slot-placeholder').style.display='none';
    removeBtn.style.display='block';
  }else{
    img.src='';
    img.classList.remove('has');
    slot.querySelector('.slot-placeholder').style.display='block';
    removeBtn.style.display='none';
  }
}
function loadSlots(){for(let n=1;n<=4;n++)renderSlot(n)}

function init(){
  renderDate();renderLunch();loadSlots();
}
loadSharedMenu().then(renderLunch);
// Re-poll for central lunch overrides periodically — boards are opened once
// in the morning and left running, so a same-day override needs this to
// reach a display that's already open before lunch.
setInterval(()=>{loadSharedMenu().then(renderLunch);},5*60*1000);
init();
setInterval(renderDate,60000);
</script>
</body>
