  // Y6_NC_15 area of parallelograms and triangles
  // figure with a dashed perpendicular height. kind 'tri' or 'para'; units in cm, drawn to fit
  function heightFig(kind, b, h, off, lab) {
    const u = Math.min(60 / (b + Math.max(0, off)), 38 / h, 7), pad = 9;
    const minx = Math.min(0, off);
    const X = x => pad + (x - minx) * u, Y = y => pad + (h - y) * u;
    const pts = kind === 'tri' ? [[0, 0], [b, 0], [off, h]] : [[0, 0], [b, 0], [b + off, h], [off, h]];
    let s = D.poly(pts.map(p => [X(p[0]), Y(p[1])]), 'shape');
    if (off < 0 || off > b) s += D.line(X(off < 0 ? off : b), Y(0), X(off < 0 ? 0 : off), Y(0), 'hidden');
    s += D.line(X(off), Y(h), X(off), Y(0), 'hidden');
    const k = 2.4, dir = off > b / 2 && kind === 'tri' ? -1 : 1;
    s += D.pline([[X(off) + dir * k, Y(0)], [X(off) + dir * k, Y(0) - k], [X(off), Y(0) - k]], 'thin');
    s += D.txt((X(0) + X(b)) / 2, Y(0) + 5, lab.b, { size: 3.6 });
    s += D.txt(X(off) + dir * 1.8, (Y(0) + Y(h)) / 2 + 1.2, lab.h, { size: 3.6, anchor: dir > 0 ? 'start' : 'end' });
    if (lab.s) s += D.txt((X(0) + X(off)) / 2 - 2, (Y(0) + Y(h)) / 2, lab.s, { size: 3.6, anchor: 'end' });
    const W = (Math.max(b, b + (kind === 'para' ? off : 0), off) - minx) * u + 2 * pad + 6, H = h * u + 2 * pad;
    return D.svg(W, H, s);
  }

    const px = Math.sin(t), py = Math.cos(t), sg = px > 0 ? 1 : -1;

    if (o.circL) { const t = rad(o.circ); s += D.line(c + (r + 1) * Math.cos(t), c - (r + 1) * Math.sin(t), c + (r + 5) * Math.cos(t), c - (r + 5) * Math.sin(t), 'thin') + D.txt(c + (r + 8) * Math.cos(t), c - (r + 8) * Math.sin(t) + 1.3, o.circL, { size: 3.8, bold: true }); }

/* Questions built on the pictures added 28.11.26 (Innes chose "add all of them" in the pictures doc):

(function () {
  const { F, D } = RP;

  /* ---------- conversion graphs ---------- */
  // k = num/den; every x on an x-minor gridline gives a y on a y-minor gridline
  const GRAPHS = [

    { a: 'pounds (£)', b: 'euros (€)', au: '£', bu: '€', pre: true, num: 6, den: 5, xmax: 50, xstep: 10, xminor: 5, ymax: 60, ystep: 10, yminor: 2 },
    { a: 'inches', b: 'centimetres', au: 'inches', bu: 'cm', num: 5, den: 2, xmax: 20, xstep: 4, xminor: 2, ymax: 50, ystep: 10, yminor: 5 },
  ];
  const amt = (g, side, v) => side === 'a' ? (g.pre ? `£${F.n(v)}` : `${F.n(v)} ${g.au}`) : (g.pre ? `€${F.n(v)}` : `${F.n(v)} ${g.bu}`);
  const graph = (g, reads, A) => D.convGraph({ xmax: g.xmax, ymax: g.ymax, xstep: g.xstep, ystep: g.ystep, xminor: g.xminor, yminor: g.yminor, k: g.num / g.den, xlab: g.a, ylab: g.b, reads }, A);

  add({
    id: 'Y6_NC_13.convgraph', topics: ['Y6_NC_13'], level: 2,
    make(R) {
      const g = R.pick(GRAPHS);
      const steps = g.xmax / g.xminor, i = R.int(1, steps - 1);
      const x = i * g.xminor, y = x * g.num / g.den;
      if (!Number.isInteger(y) || x % g.xstep === 0 && R.chance(0.6)) return null;
      const fwd = R.chance(0.6);
      const ans = fwd ? y : x;
      return {
        marks: 1, answer: fwd ? amt(g, 'b', y) : amt(g, 'a', x), guide: 'Accept the number without the unit.',
        check: () => y * g.den === x * g.num && y % g.yminor === 0,
        body: A => `<p>This graph converts between ${g.a.replace(/ \(.*/, '')} and ${g.b.replace(/ \(.*/, '')}.</p>${graph(g, [{ x }], A)}<p>Use the graph to convert <b>${fwd ? amt(g, 'a', x) : amt(g, 'b', y)}</b> to ${fwd ? g.b.replace(/ \(.*/, '') : g.a.replace(/ \(.*/, '')}.</p>${A.box(F.n(ans), g.pre ? { pre: fwd ? '€' : '£' } : { unit: fwd ? g.bu : g.au })}`,
      };

  add({
    id: 'Y6_NC_21.convgraph-beyond', topics: ['Y6_NC_21', 'Y6_NC_13'], level: 3,
    make(R) {
      const g = R.pick(GRAPHS);
      const x0 = R.int(1, g.xmax / g.xminor - 1) * g.xminor, m = R.pick([4, 5, 10]);
      const x = x0 * m, y = x * g.num / g.den, y0 = x0 * g.num / g.den;
      if (!Number.isInteger(y0) || x <= g.xmax) return null;
      return {
        marks: 2, method: true, answer: amt(g, 'b', y), guide: `Award 1 mark for reading ${amt(g, 'a', x0)} = ${amt(g, 'b', y0)} (or another correct pair) and scaling.`,
        check: () => y === y0 * m && y * g.den === x * g.num,
        body: A => `<p>This graph converts between ${g.a.replace(/ \(.*/, '')} and ${g.b.replace(/ \(.*/, '')}.</p>${graph(g, [{ x: x0 }], A)}<p>The graph does not go as far as <b>${amt(g, 'a', x)}</b>.</p><p>Use the graph to convert <b>${amt(g, 'a', x)}</b> to ${g.b.replace(/ \(.*/, '')}.</p>${A.work(`${amt(g, 'a', x0)} = ${amt(g, 'b', y0)}, ${F.times} ${m}: ${amt(g, 'a', x)} = ${amt(g, 'b', y)}`, 22)}${A.box(F.n(y), g.pre ? { pre: '€' } : { unit: g.bu })}`,
      };
    },
  });

  /* ---------- shape-value puzzles ---------- */

  add({
    id: 'Y6_011.symbols', topics: ['Y6_011'], level: 3,
    make(R) {
      const [p, q] = R.sample(KINDS, 2), a = R.int(3, 24), b = R.intNot(3, 24, [a]);
      const n = R.int(2, 3), t1 = n * a + b, t2 = a + b;
      return {
        marks: 2, answer: `${S(p)} = ${a}, ${S(q)} = ${b}`, guide: 'Award 1 mark for one value correct, or both values that fit only one of the number sentences.',
        check: () => t1 - t2 === (n - 1) * a && t2 - a === b,
        body: A => `<p>Each shape stands for a number.</p>${eq([...Array(n).fill(p), q], t1)}${eq([p, q], t2)}<p>Work out the value of each shape.</p><div class="sent c">${S(p)} = ${A.blank(a, 16)} &nbsp;&nbsp;&nbsp; ${S(q)} = ${A.blank(b, 16)}</div>`,
      };
    },
  });
  add({
    id: 'Y6_NC_11.symbols-chain', topics: ['Y6_NC_11'], level: 2,

      };

  /* ---------- cube models ---------- */
  const cuboid = (a, b, c) => { const out = []; for (let z = 0; z < c; z++) for (let y = 0; y < b; y++) for (let x = 0; x < a; x++) out.push([x, y, z]); return out; };

  add({
    id: 'Y6_NC_16.cubes-cuboid', topics: ['Y6_NC_16'], level: 2,
    make(R) {
      const a = R.int(2, 5), b = R.int(2, 4), c = R.int(2, 4), cm = cuboid(a, b, c), v = a * b * c;

        check: () => cm.length === v,
        body: A => `<p>This cuboid is made from 1 cm cubes.</p>${D.cubes({ cubes: cm, s: 6.5 })}<p>What is its volume?</p>${A.box(F.n(v), { unit: 'cm³' })}`,

  add({

      const hs = [...Array(w)].map((_, i) => Math.max(1, H - R.int(0, Math.min(i, H - 1))));
      hs.sort((u, v) => v - u); hs[0] = H;
      const have = [], miss = [];
      hs.forEach((h, x) => { for (let z = 0; z < H; z++) (z < h ? have : miss).push([x, 0, z]); });

  add({

      const a = R.int(3, 5), b = R.int(2, 4), cs = [];

      for (let y = 0; y < b; y++) for (let x = 0; x < a; x++) {
        if (keep === 'L' && y > 0 && x >= cut) continue;
        if (keep === 'T' && y > 0 && (x === 0 || x === a - 1) && a > 2) continue;
        cs.push([x, y, 0]);
      }
      const z2 = R.chance(0.5) ? [[0, 0, 1]] : [];
      const all = cs.concat(z2), n = all.length;
      if (n < 4) return null;
      return {
        marks: 1, answer: F.n(n),
        check: () => new Set(all.map(p => p.join())).size === n,
        body: A => `<p>This model is made from cubes. There are no hidden cubes.</p>${D.cubes({ cubes: all, s: 7.5 })}<p>How many cubes are in the model?</p>${A.box(F.n(n), { unit: 'cubes' })}`,
      };
    },
  });

  /* ---------- protractor ---------- */
  const PROT = 'new_d_n8bvzswy_4_mwtc1a4g';
  add({
    id: PROT + '.protractor', topics: [PROT], level: 2,
    make(R) {
      const deg = R.int(3, 33) * 5, side = R.pick(['right', 'left']);

      };

  });

      if (cost % 100 === 0) return null;
      return {
        marks: 2, method: true, answer: F.money(ch, ch < 100), guide: `Award 1 mark for the total cost ${F.money(cost, cost < 100)}.`,
        check: () => ch + items[j][1] + items[i][1] === paid,
        body: A => `${D.priceList({ title: 'School café', items })}<p>${who} buys ${aan(items[i][0])} and ${aan(items[j][0])}.</p><p>${who} pays with a ${F.money(paid).replace('.00', '')} coin. How much change does ${who} get?</p>${A.work(`${F.money(items[i][1], true)} + ${F.money(items[j][1], true)} = ${F.money(cost, cost < 100)}, ${F.money(paid)} ${F.minus} ${F.money(cost, cost < 100)} = ${F.money(ch, ch < 100)}`, 24)}${ch < 100 ? A.box(F.n(ch), { unit: 'p' }) : A.box(pounds(ch), { pre: '£' })}`,
      };
    },
  });
  add({
    id: 'Y4_NC_18.receipt-missing', topics: ['Y4_NC_18'], level: 2,
    make(R) {
      const rows = pickItems(R, SHOP, 3).map(([n, p]) => [n, 1, p]), k = R.int(0, 2);
      const total = rows.reduce((s, r) => s + r[2], 0), miss = rows[k][2];
      const shown = rows.map((r, i) => i === k ? [r[0], 1, { a: miss }] : r);
      return {
        marks: 1, answer: F.money(miss),
        check: () => total - rows.filter((_, i) => i !== k).reduce((s, r) => s + r[2], 0) === miss,
        body: A => `<p>Part of this receipt is missing.</p>${D.receipt({ shop: 'Corner Shop', rows: shown, total }, A)}<p>Write the missing price.</p>`,
      };
    },
  });
  add({
    id: 'Y5_NC_19.receipt-complete', topics: ['Y5_NC_19'], level: 3,
    make(R) {
      const items = pickItems(R, SHOP, 4);
      const pickd = R.sample([0, 1, 2, 3], 2), q = [R.int(2, 4), R.int(2, 5)];
      const lines = pickd.map((i, n) => [items[i][0], q[n], items[i][1] * q[n]]);
      const total = lines[0][2] + lines[1][2], paid = total < 1000 ? 1000 : 2000, ch = paid - total;
      if (ch <= 0) return null;
      return {
        marks: 2, answer: `${F.money(lines[0][2])}, ${F.money(lines[1][2])}, ${F.money(total)}, ${F.money(ch)}`,
        guide: 'Award 2 marks for all four correct. Award 1 mark for three correct, or for later values that follow correctly from one wrong value.',
        check: () => ch + total === paid && lines.every((l, n) => l[2] / q[n] === items[pickd[n]][1]),
        body: A => `${D.priceList({ title: 'Stationery prices', items, pence: false })}<p>Complete the receipt.</p>${D.receipt({ shop: 'Stationery Shop', rows: lines.map(([n, k, p]) => [n, k, { a: p }]), total: { a: total }, paid, change: { a: ch } }, A)}`,
      };
    },
  });

  /* ---------- multiplication grid ---------- */
  const tgrid = (A, cols, rows, cell) => A.table(rows.map((r, i) => [r.h, ...cols.map((c, j) => cell(i, j))]), { head: [F.times, ...cols.map(c => c.h)], rowHead: true, cls: 'tgrid' });

  add({
    id: 'Y3_009.tgrid', topics: ['Y3_009'], level: 1,
    make(R) {
      const rs = R.sample([2, 4, 5, 8, 10], 3), cs = R.sample([2, 3, 4, 5, 6, 7, 8, 9, 10], 3);
      if (!rs.some(r => [4, 8].includes(r))) return null;
      const blanks = R.sample([...Array(9).keys()], 3);
      const ans = blanks.sort((a, b) => a - b).map(b => rs[Math.floor(b / 3)] * cs[b % 3]);
      return {
        marks: 1, answer: ans.join(', '), guide: 'All three needed.',
        check: () => blanks.every((b, n) => ans[n] / cs[b % 3] === rs[Math.floor(b / 3)]),
        body: A => `<p>Complete the multiplication grid.</p>${tgrid(A, cs.map(h => ({ h })), rs.map(h => ({ h })), (i, j) => blanks.includes(i * 3 + j) ? { a: rs[i] * cs[j] } : rs[i] * cs[j])}`,
      };
    },
  });
  add({
    id: 'Y4_008.tgrid-headers', topics: ['Y4_008'], level: 2,
    make(R) {
      const rs = R.sample([3, 4, 6, 7, 8, 9, 11, 12], 3), cs = R.sample([3, 4, 5, 6, 7, 8, 9, 12], 3);
      const mi = R.int(0, 2), mj = R.int(0, 2);
      const others = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (i !== mi && j !== mj) others.push([i, j]);
      const [oi, oj] = R.pick(others);
      const hidden = (i, j) => (i === mi && j === mj) || (i === oi && j === oj);
      const ans = [rs[mi], cs[mj], rs[mi] * cs[mj], rs[oi] * cs[oj]];
      return {
        marks: 2, answer: ans.join(', '), guide: 'Award 2 marks for all four correct, 1 mark for two or three correct.',
        check: () => cs.some((c, j) => j !== mj && rs[mi] * c / c === rs[mi]) && rs.some((r, i) => i !== mi && !hidden(i, mj)),
        body: A => `<p>Write the missing numbers in this multiplication grid.</p>${A.table(rs.map((r, i) => [i === mi ? { a: r } : r, ...cs.map((c, j) => hidden(i, j) ? { a: r * c } : r * c)]), { head: [F.times, ...cs.map((c, j) => j === mj ? { a: c } : c)], rowHead: true, cls: 'tgrid' })}`,
      };
    },
  });
})();

/* Questions on the second set of pictures added 28.11.26 (Innes: "add these" in the pictures doc):
 * digital clock, calendar page, Venn and Carroll diagrams. See src/GENERATORS.md for the rules.
 */
(function () {
  const { F, D } = RP;
  const add = RP.add;
  const ord = d => d + (d % 10 === 1 && d !== 11 ? 'st' : d % 10 === 2 && d !== 12 ? 'nd' : d % 10 === 3 && d !== 13 ? 'rd' : 'th');

  /* ---------- digital clock ---------- */
  add({
    id: 'Y4_NC_19.digital-write', topics: ['Y4_NC_19'], level: 2,
    make(R) {
      const h = R.int(13, 22), m = R.int(0, 11) * 5;
      const part = h < 17 ? 'in the afternoon' : 'in the evening';
      return {
        marks: 1, answer: F.t24(h, m),

        body: A => `<p>The clock shows a time ${part}.</p>${D.clock({ h: h - 12, m, size: 34 }, A)}<p>Write this time on the 24-hour digital clock.</p>${D.digital({ h, m, mode: '24', ans: true }, A)}`,
      };

  add({
    id: 'Y3_NC_11.digital-duration', topics: ['Y3_NC_11'], level: 2,
    make(R) {
      const h = R.int(8, 18), m1 = R.int(0, 9) * 5, len = R.int(3, 14) * 5;
      const t2 = h * 60 + m1 + len, h2 = Math.floor(t2 / 60), m2 = t2 % 60;
      if (h2 > 19) return null;
      const what = R.pick(['A swimming lesson', 'A film', 'A football match', 'A cooking class', 'A piano lesson']);
      return {
        marks: 1, answer: `${len} minutes`,
        check: () => (h2 - h) * 60 + (m2 - m1) === len,
        body: A => `<p>${what} starts and ends at these times.</p>${D.row([{ fig: D.digital({ h, m: m1, mode: '12', ampm: true }), cap: 'Starts' }, { fig: D.digital({ h: h2, m: m2, mode: '12', ampm: true }), cap: 'Ends' }], 14)}<p>How many minutes does it last?</p>${A.box(F.n(len), { unit: 'minutes' })}`,
      };
    },
  });
  add({
    id: 'new_d_afe4i7p9_5_mwt9fuwx.digital-fast', topics: ['new_d_afe4i7p9_5_mwt9fuwx'], level: 3,
    make(R) {
      const h = R.int(6, 21), m = R.int(0, 59), off = R.int(7, 48), fast = R.chance(0.5);
      const real = h * 60 + m + (fast ? -off : off);
      if (real < 0 || real >= 24 * 60) return null;
      const rh = Math.floor(real / 60), rm = real % 60;
      if (rh === h) return null;   // make it cross an hour
      return {
        marks: 1, answer: F.t24(rh, rm),
        check: () => Math.abs((rh * 60 + rm) - (h * 60 + m)) === off,
        body: A => `<p>This clock is <b>${off} minutes ${fast ? 'fast' : 'slow'}</b>.</p>${D.digital({ h, m, mode: '24' })}<p>What is the real time?</p>${D.digital({ h: rh, m: rm, mode: '24', ans: true }, A)}`,
      };
    },
  });

  /* ---------- calendar ---------- */
  const cal = (R) => { const year = R.int(2026, 2029), month = R.int(0, 11); return { year, month, n: D.daysIn(year, month) }; };

  add({
    id: 'Y1_NC_11.calendar-day', topics: ['Y1_NC_11'], level: 1,
    make(R) {
      const { year, month, n } = cal(R), d = R.int(1, n), wd = D.DAYS[D.dow(year, month, d)];
      return {
        marks: 1, answer: wd,
        check: () => new Date(Date.UTC(year, month, d)).toUTCString().startsWith(wd.slice(0, 3)),
        body: A => `<p>Here is a calendar.</p>${D.calendar({ year, month, ring: [d] })}<p>What day of the week is the circled date?</p>${A.line(wd, 50)}`,
      };
    },
  });
  add({
    id: 'Y3_NC_12.calendar-month', topics: ['Y3_NC_12'], level: 2,
    make(R) {
      // the last day of the month shown, then: what day is the 1st of the next month?
      const { year, month, n } = cal(R);
      const nextFirst = D.DAYS[(D.dow(year, month, n) + 1) % 7], next = D.MONTHS[(month + 1) % 12];
      return {
        marks: 1, answer: nextFirst,
        check: () => D.DAYS[D.dow(month === 11 ? year + 1 : year, (month + 1) % 12, 1)] === nextFirst,
        body: A => `${D.calendar({ year, month })}<p>What day of the week will the 1st of ${next} be?</p>${A.line(nextFirst, 50)}`,
      };
    },
  });
  add({
    id: 'Y4_NC_20.calendar-weeks', topics: ['Y4_NC_20'], level: 2,
    make(R) {
      const { year, month, n } = cal(R), who = R.name();
      const w = R.int(1, 3), dd = R.int(0, 6), gap = w * 7 + dd, d1 = R.int(1, n - gap), d2 = d1 + gap;
      if (d1 < 1) return null;
      const what = R.pick(['school trip', 'party', 'swimming gala', 'visit to the dentist', 'football tournament']);
      return {
        marks: 1, answer: `${D.DAYS[D.dow(year, month, d2)]} ${ord(d2)} ${D.MONTHS[month]}`, guide: 'Accept the date without the day.',
        check: () => (D.dow(year, month, d2) - D.dow(year, month, d1) + 7) % 7 === dd % 7,
        body: A => `${D.calendar({ year, month, ring: [d1] })}<p>${who} circles the ${ord(d1)} of ${D.MONTHS[month]}.</p><p>${who} has a ${what} <b>${F.pl(w, 'week')}${dd ? ' and ' + F.pl(dd, 'day') : ''}</b> after the circled date.</p><p>What is the date of the ${what}?</p>${A.box(ord(d2), { unit: D.MONTHS[month], w: 22 })}`,
      };
    },
  });

  /* ---------- Venn diagrams ---------- */
  const sortVenn = (nums, p, q) => {
    const o = { a: [], both: [], b: [], none: [] };
    nums.forEach(v => (p(v) && q(v) ? o.both : p(v) ? o.a : q(v) ? o.b : o.none).push(v));
    return o;
  };
  const vennAns = (o, la, lb) => [['Both', o.both], [la + ' only', o.a], [lb + ' only', o.b], ['Neither', o.none]].filter(r => r[1].length).map(r => `${r[0]}: ${r[1].join(', ')}`).join('; ');

  add({
    id: 'Y5_012.venn-multiples', topics: ['Y5_012'], level: 2,
    make(R) {
      const [x, y] = R.pick([[3, 4], [4, 6], [3, 5], [5, 6], [6, 8], [4, 5], [2, 7]]);
      const p = v => v % x === 0, q = v => v % y === 0;
      const pool = []; for (let v = 6; v <= 60; v++) pool.push(v);
      const pick = t => R.sample(pool.filter(t), 2);
      const nums = [...pick(v => p(v) && q(v)).slice(0, 1), ...pick(v => p(v) && !q(v)), ...pick(v => q(v) && !p(v)), ...pick(v => !p(v) && !q(v)).slice(0, 1)];
      if (new Set(nums).size !== 6) return null;
      const o = sortVenn(nums, p, q), la = `multiples of ${x}`, lb = `multiples of ${y}`, list = R.shuffle(nums.slice());
      return {
        marks: 1, answer: vennAns(o, la, lb), guide: 'All six numbers must be in the correct place.',
        check: () => o.both.every(v => v % F.lcm(x, y) === 0) && o.a.length + o.b.length + o.both.length + o.none.length === 6,
        body: A => `<p>Write each number in the correct place on the Venn diagram.</p><div class="sent c">${list.join(', &nbsp; ')}</div>${D.venn({ labels: [la, lb], ...o, ans: true }, A)}`,
      };
    },
  });
  add({
    id: 'Y6_NC_04.venn-factors', topics: ['Y6_NC_04'], level: 2,
    make(R) {
      const [x, y] = R.pick([[24, 36], [18, 30], [20, 30], [16, 24], [12, 30], [24, 40], [28, 42]]);
      const fx = v => x % v === 0, fy = v => y % v === 0;
      const facs = []; for (let v = 1; v <= Math.max(x, y); v++) if (fx(v) || fy(v)) facs.push(v);
      const both = facs.filter(v => fx(v) && fy(v) && v > 1), onlyA = facs.filter(v => fx(v) && !fy(v)), onlyB = facs.filter(v => fy(v) && !fx(v));
      if (both.length < 2 || !onlyA.length || !onlyB.length) return null;
      const nums = [...R.sample(both, 2), ...R.sample(onlyA, Math.min(2, onlyA.length)), ...R.sample(onlyB, Math.min(2, onlyB.length))];
      const extra = R.pick([7, 9, 11, 13, 25, 27].filter(v => !fx(v) && !fy(v)));
      nums.push(extra);
      const o = sortVenn(nums, fx, fy), la = `factors of ${x}`, lb = `factors of ${y}`, list = R.shuffle(nums.slice());
      return {
        marks: 1, answer: vennAns(o, la, lb), guide: 'All numbers must be in the correct place.',
        check: () => o.both.every(v => F.gcd(x, y) % v === 0),
        body: A => `<p>Write each number in the correct place on the Venn diagram.</p><div class="sent c">${list.join(', &nbsp; ')}</div>${D.venn({ labels: [la, lb], ...o, ans: true }, A)}`,
      };
    },
  });

  /* ---------- Carroll diagrams ---------- */
  add({
    id: 'Y2_NC_06.carroll-numbers', topics: ['Y2_NC_06'], level: 2,
    make(R) {
      const cut = R.pick([20, 25, 30, 40]);
      const nums = R.ints(6, 5, 60);
      const even = v => v % 2 === 0, big = v => v > cut;
      if (![[1, 1], [1, 0], [0, 1], [0, 0]].every(([e, b]) => nums.some(v => even(v) === !!e && big(v) === !!b))) return null;
      const cells = [[nums.filter(v => even(v) && big(v)), nums.filter(v => even(v) && !big(v))], [nums.filter(v => !even(v) && big(v)), nums.filter(v => !even(v) && !big(v))]];
      return {
        marks: 1, answer: `even, more than ${cut}: ${cells[0][0].join(', ')}; even, not: ${cells[0][1].join(', ')}; odd, more than ${cut}: ${cells[1][0].join(', ')}; odd, not: ${cells[1][1].join(', ')}`, guide: 'All six numbers must be in the correct place.',
        check: () => cells.flat(2).length === 6 && cells[1].flat().every(v => v % 2 === 1),
        body: A => `<p>Write each number in the correct place in the sorting table.</p><div class="sent c">${nums.join(', &nbsp; ')}</div>${D.carroll({ cols: [`more than ${cut}`, `not more than ${cut}`], rows: ['even', 'odd'], cells, ans: true }, A)}`,
      };
    },
  });
  const SHAPES = [
    ['square', [[0, 0], [18, 0], [18, 18], [0, 18]]],
    ['rectangle', [[0, 0], [28, 0], [28, 14], [0, 14]]],
    ['right-angled triangle', [[0, 0], [0, 20], [24, 20]]],
    ['parallelogram', [[7, 0], [29, 0], [22, 16], [0, 16]]],
    ['kite', [[11, 0], [22, 9], [11, 25], [0, 9]]],
    ['right-angled trapezium', [[0, 0], [16, 0], [27, 16], [0, 16]]],
    ['regular pentagon', D.regular(5, 12)],
    ['house pentagon', [[0, 9], [11, 0], [22, 9], [22, 23], [0, 23]]],
    ['regular hexagon', D.regular(6, 12)],
    ['isosceles triangle', [[10, 0], [20, 22], [0, 22]]],
    ['rhombus', [[12, 0], [24, 9], [12, 18], [0, 9]]],
  ];
  const hasRight = pts => pts.some((v, i) => { const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length]; return Math.abs((a[0] - v[0]) * (b[0] - v[0]) + (a[1] - v[1]) * (b[1] - v[1])) < 1e-6; });
  add({
    id: 'Y4_018.carroll-shapes', topics: ['Y4_018'], level: 2,
    make(R) {
      const sh = R.sample(SHAPES, 5), L = ['A', 'B', 'C', 'D', 'E'];
      const quad = s => s[1].length === 4;
      const cells = [[[], []], [[], []]];
      sh.forEach((s, i) => cells[hasRight(s[1]) ? 0 : 1][quad(s) ? 0 : 1].push(L[i]));
      if (cells.flat().filter(c => c.length).length < 3) return null;
      return {
        marks: 1, answer: `right angle, quadrilateral: ${cells[0][0].join(', ') || 'none'}; right angle, not: ${cells[0][1].join(', ') || 'none'}; no right angle, quadrilateral: ${cells[1][0].join(', ') || 'none'}; no right angle, not: ${cells[1][1].join(', ') || 'none'}`,
        guide: 'All five letters must be in the correct place.',
        check: () => sh.every((s, i) => cells.flat().some(c => c.includes(L[i]))) && cells[1].flat().every(l => !hasRight(sh[L.indexOf(l)][1])),
        body: A => `${D.row(sh.map((s, i) => ({ fig: D.shape({ pts: s[1], pad: 3 }), cap: L[i] })), 6)}<p>Write the letter of each shape in the correct place.</p>${D.carroll({ cols: ['quadrilateral', 'not a quadrilateral'], rows: ['has a right angle', 'has no right angle'], cells, ans: true }, A)}`,
      };
    },
  });
})();

/* Questions on weighing scales with a round dial (added 28.11.26, Innes: "add" in the pictures doc). */
(function () {

  // dials: [max, major, minor, unit]; values sit on a minor tick
  const pickVal = (R, max, minor, notMajor) => {
    const k = R.int(1, Math.round(max / minor) - 1), v = k * minor;
    return v;
  };

  add({
    id: 'Y2_NC_10.dial', topics: ['Y2_NC_10'], level: 1,
    make(R) {
      const [max, major, minor, unit] = R.pick([[10, 1, 1, 'kg'], [20, 5, 1, 'kg'], [20, 2, 1, 'kg'], [500, 100, 10, 'g']]);
      const v = pickVal(R, max, minor);
      if (v % major === 0 && R.chance(0.7)) return null;
      const what = R.pick(['bag of potatoes', 'parcel', 'box of books', 'pumpkin', 'bag of flour']);
      return {
        marks: 1, answer: `${v} ${unit}`,
        check: () => v % minor === 0 && v > 0 && v < max,
        body: A => `<p>A ${what} is on the scales.</p>${D.dial({ max, major, minor, value: v, unit }, A)}<p>How heavy is the ${what}?</p>${A.box(F.n(v), { unit })}`,
      };
    },
  });
  add({
    id: 'Y3_007.dial', topics: ['Y3_007'], level: 2,
    make(R) {
      const minor = R.pick([50, 25, 20, 10]), max = minor === 25 ? 400 : 500;
      const v = pickVal(R, max, minor);
      if (v % 100 === 0) return null;
      return {
        marks: 1, answer: `${v} g`,
        check: () => (v / minor) * minor === v && Math.round(100 / minor) * minor === 100,
        body: A => `<p>What mass do the scales show?</p>${D.dial({ max, major: 100, minor, value: v, unit: 'g' }, A)}${A.box(F.n(v), { unit: 'g' })}`,
      };
    },
  });
  add({
    id: 'Y4_007.dial', topics: ['Y4_007', 'Y4_NC_16'], level: 2,
    make(R) {
      const minor = R.pick([500, 250, 200, 100]), max = minor === 250 ? 4000 : 5000;
      const v = pickVal(R, max, minor);
      if (v % 1000 === 0) return null;
      return {
        marks: 1, answer: `${F.n(v)} g`, guide: `Accept ${F.n(v / 1000)} kg.`,
        check: () => v % minor === 0 && Math.round(1000 / minor) * minor === 1000,
        body: A => `<p>The scales are marked in kilograms.</p>${D.dial({ max, major: 1000, minor, value: v, unit: 'kg', fmt: x => F.n(x / 1000) }, A)}<p>How many <b>grams</b> do the scales show?</p>${A.box(F.n(v), { unit: 'g' })}`,
      };
    },
  });
  add({
    id: 'Y5_007.dial', topics: ['Y5_007'], level: 2,
    make(R) {
      // work in hundredths of a kg
      const minor = R.pick([50, 25, 20, 10]), max = minor === 25 ? 400 : 500;
      const v = pickVal(R, max, minor);
      if (v % 100 === 0) return null;
      return {
        marks: 1, answer: `${F.n(v / 100)} kg`, guide: `Accept ${F.n(v * 10)} g.`,
        check: () => v % minor === 0,
        body: A => `<p>What mass do the scales show? Give your answer in kilograms.</p>${D.dial({ max, major: 100, minor, value: v, unit: 'kg', fmt: x => F.n(x / 100) }, A)}${A.box(F.n(v / 100), { unit: 'kg' })}`,
      };
    },
  });
  add({
    id: 'Y3_NC_07.dial-difference', topics: ['Y3_NC_07'], level: 3,
    make(R) {
      const minor = R.pick([20, 25, 50]), max = 1000, major = minor === 25 ? 250 : 200;
      const a = pickVal(R, max, minor), b = pickVal(R, max, minor);
      if (Math.abs(a - b) < 100 || a % major === 0 || b % major === 0) return null;
      const [n1, n2] = R.pick([['apples', 'pears'], ['the red parcel', 'the blue parcel'], ['the cheese', 'the butter'], ['the carrots', 'the onions']]);
      const big = a > b ? n1 : n2, diff = Math.abs(a - b);
      return {

      else if (q.marks === 2) g.push('Award <b>2 marks</b> for a fully correct answer.');
      if (q.guide) g.push(q.guide);
      const t = TOPIC[q.topic];
      g.push(`<span style="color:#666">Assesses: ${t ? esc((t.code ? t.code + ' ' : '') + t.text) : q.topic}</span>`);
      guide = `<div class="guide">${g.join(' ')}</div>`;
    }
    return `<div class="q" data-i="${i}"><div class="qn">${i + 1}</div><div class="qb">${q.html(show)}</div><div class="qm">${markTxt(q.marks)}</div>${guide}
      <div class="qtools"><button data-swap="${i}" title="Swap this question for another one">&#8635; Swap</button></div></div>`;
  }
  const head = () => `<div class="ph"><span>Year ${S.year[1]} Mathematics: ${esc(S.title)}</span><span>Wallscourt Farm Academy</span></div>`;
  const foot = (p, n, show) => `<div class="pf"><span>${show ? 'Mark scheme' : ''}</span><b>${p}</b><span>${S.year}-${S.seed.toString(36).toUpperCase()}</span></div>`;

  function cover(total) {
    return `<div class="page"><div class="cover">
      <div class="ctop"><img src="../logo.png" alt="" onerror="this.style.display='none'"><span style="font-size:13pt">Wallscourt Farm Academy</span></div>
      <h1>Mathematics</h1><h2>Year ${S.year[1]}: ${esc(S.title)}</h2>
      <div class="fields"><span>Name</span><span></span><span>Class</span><span></span><span>Date</span><span></span></div>
      <div class="instr"><b>Instructions</b><ul>
        <li>You may not use a calculator.</li>
        <li>Answer every question you can. If you get stuck, go on to the next one.</li>
        <li>Write your answers in the boxes or on the lines.</li>
        <li>Where you see <b>Show your method</b>, write your working in the box. You may get a mark for it even if your answer is wrong.</li>
        <li>The number next to each question shows how many marks it is worth.</li>
      </ul></div>
      <div class="score">Total marks <span class="ab"></span> out of ${total}</div>
    </div>${foot('', 0, false)}</div>`;
  }

  // Measure questions at print width, then pack them onto A4 pages.
  function paginate(items) {
    const m = document.createElement('div');
    m.className = 'measure';
    m.innerHTML = `<div class="page">${head()}<div class="qs">${items.join('')}</div></div>`;
    document.body.appendChild(m);
    const pg = m.querySelector('.page');
    const mm = pg.getBoundingClientRect().width / 210;
    const avail = (297 - 13 - 15 - 6) * mm - m.querySelector('.ph').getBoundingClientRect().height - 8 * mm;
    const hs = [...m.querySelectorAll('.qs > *')].map(e => e.getBoundingClientRect().height);
    m.remove();
    const pages = [[]];
    let used = 0;
    hs.forEach((h, i) => {
      if (used + h > avail && pages[pages.length - 1].length) { pages.push([]); used = 0; }
      pages[pages.length - 1].push(items[i]);
      used += h;
    });
    return pages;
  }

  function summaryRows() {
    return paper.map((q, i) => {
      const t = TOPIC[q.topic];
      return `<tr><td class="c"><b>${i + 1}</b></td><td><span class="av">${q.answer === undefined ? 'See question' : q.answer}</span></td><td class="c">${q.marks}</td><td>${t ? esc(t.code || (t.nc ? 'Curriculum' : 'School')) : ''}</td><td>${t ? esc(t.text) : ''}</td></tr>`;
    });
  }
  const SUMHEAD = '<tr><th>Q</th><th>Answer</th><th>Marks</th><th>Code</th><th>What it assesses</th></tr>';
  function summaryPages() {
    const intro = `<div class="sumh">Mark scheme: answers</div><div class="sumn">Year ${S.year[1]} ${esc(S.title)}, paper ${S.year}-${S.seed.toString(36).toUpperCase()}. Total ${paper.reduce((a, q) => a + q.marks, 0)} marks. The pages after this table show each question with the answer drawn on it.</div>`;
    const rows = summaryRows();
    const m = document.createElement('div');
    m.className = 'measure';
    m.innerHTML = `<div class="page">${head()}<div class="si">${intro}</div><table class="sum">${SUMHEAD}${rows.join('')}</table></div>`;
    document.body.appendChild(m);
    const mm = m.querySelector('.page').getBoundingClientRect().width / 210;
    const full = (297 - 13 - 15 - 6) * mm - m.querySelector('.ph').getBoundingClientRect().height - 8 * mm;
    const introH = m.querySelector('.si').getBoundingClientRect().height;
    const trs = [...m.querySelectorAll('table.sum tr')];
    const headH = trs[0].getBoundingClientRect().height, hs = trs.slice(1).map(r => r.getBoundingClientRect().height);
    m.remove();
    const pages = [[]];
    let used = introH + headH;
    hs.forEach((h, i) => {
      if (used + h > full && pages[pages.length - 1].length) { pages.push([]); used = headH; }
      pages[pages.length - 1].push(rows[i]); used += h;
    });
    return pages.map((p, k) => `<div class="page">${head()}${k ? '' : intro}<table class="sum">${SUMHEAD}${p.join('')}</table>${foot('', 0, true)}</div>`).join('');
  }

  function renderPages() {
    const box = $('#pages');
    $('#empty').hidden = paper.length > 0;
    if (!paper.length) { box.innerHTML = ''; return; }
    const show = S.view === 'scheme';
    const items = paper.map((q, i) => qHTML(q, i, show));
    const pages = paginate(items);
    const total = paper.reduce((a, q) => a + q.marks, 0);
    let h = show ? summaryPages() : cover(total);
    pages.forEach((p, k) => h += `<div class="page">${head()}<div class="qs">${p.join('')}</div>${foot(k + 1, pages.length, show)}</div>`);
    box.innerHTML = h;
    $('#printBtn span').textContent = show ? 'Print scheme' : 'Print paper';
    fit();
  }
  function fit() {
    const v = $('#view'), w = v.clientWidth - 36, pagePx = 210 * 3.7795;
    const z = Math.min(1, w / pagePx);
    $('#pages').style.transform = z < 1 ? `scale(${z})` : '';
    $('#pages').style.marginBottom = z < 1 ? `-${(1 - z) * $('#pages').scrollHeight}px` : '';
  }

  /* ---------- popovers ---------- */
  function pop(html) {
    const p = $('#pop'); p.innerHTML = `<div class="card">${html}<div class="prow" style="justify-content:flex-end"><button class="btn pri" data-close>Close</button></div></div>`; p.hidden = false;
  }
  function yearPicker() {
    pop(`<h2>Which year group is the paper for?</h2><div class="yeargrid">${PAPER_YEARS.map(y => `<button data-year="${y}" class="${S.year === y ? 'on' : ''}">Year ${y[1]}</button>`).join('')}</div>
      <p style="font-size:15px;color:#456">You can also tick topics from earlier years.</p>`);
  }
  function help() {
    pop(`<h2>How to use</h2>
      <ol style="padding-left:20px;line-height:1.45">
        <li>Choose the <b>year group</b>.</li>
        <li><b>Tick the topics</b> you have taught. Earlier years' topics are further down the list.</li>
        <li>Choose a <b>length</b>: Short (about 10 marks), Standard (about 20) or Full (35 marks, like a SATs paper).</li>
        <li>Press <b>New paper</b> for a different set of questions. Point at a question and press <b>Swap</b> to change just that one.</li>
        <li><b>Paper</b> shows the test; <b>Mark scheme</b> shows the answers, drawn in red on each question, with a quick answer table first.</li>
        <li>Press <b>Print</b>. Print at <b>100% / Actual size</b> so drawings can be measured with a ruler or protractor.</li>
      </ol>
      <p style="font-size:15px;color:#456">Every question is made from the topic lists the year-group teams agreed in November 2026, plus the rest of the National Curriculum. Numbers are made fresh each time and every answer is checked by the tool. No pupil information is used or stored. Topics marked "not ready yet" have no questions yet.</p>`);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('button, [data-close]');
    if (e.target.id === 'pop') { $('#pop').hidden = true; return; }
    if (!b) return;
    if (b.dataset.close !== undefined) { $('#pop').hidden = true; return; }
    if (b.id === 'yearBtn') return yearPicker();
    if (b.id === 'helpBtn') return help();
    if (b.id === 'newBtn') return build(true);
    if (b.id === 'printBtn') { if (!paper.length) return; return window.print(); }
    if (b.id === 'panelBtn' || b.id === 'panelBtn2') { S.panel = !S.panel; $('#panel').classList.toggle('closed', !S.panel); save(); return fit(); }
    if (b.dataset.view) { S.view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x.dataset.view === S.view)); save(); return renderPages(); }
    if (b.dataset.year) { S.year = b.dataset.year; $('#yearBtn b').textContent = 'Year ' + S.year[1]; $('#pop').hidden = true; return build(false); }
    if (b.dataset.len) { S.length = b.dataset.len; return build(false); }
    if (b.dataset.all || b.dataset.none) {
      const y = b.dataset.all || b.dataset.none;
      S.ticks[y] = b.dataset.all ? (RP.TOPICS[y] || []).filter(t => ready(t.id)).map(t => t.id) : [];
      return build(false);
    }
    if (b.dataset.area) {
      const [y, a] = b.dataset.area.split('|');
      const ids = (RP.TOPICS[y] || []).filter(t => t.area === a && ready(t.id)).map(t => t.id);
      const cur = new Set(S.ticks[y] || []);
      const all = ids.every(id => cur.has(id));
      ids.forEach(id => all ? cur.delete(id) : cur.add(id));
      S.ticks[y] = [...cur];
      return build(false);
    }
    if (b.dataset.swap !== undefined) {
      const i = +b.dataset.swap;
      try { paper[i] = RP.swap(paper[i], Math.floor(Math.random() * 2147483647), ctx(), paper.map(q => q.gen.id)); }
      catch (err) { console.error(err); }
      renderPanel();
      return renderPages();
    }
  });
  document.addEventListener('change', e => {
    const c = e.target;
    if (c.dataset.t) {
      const y = c.dataset.y, cur = new Set(S.ticks[y] || []);
      c.checked ? cur.add(c.dataset.t) : cur.delete(c.dataset.t);
      S.ticks[y] = [...cur];
      build(false);
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'ttl') { S.title = e.target.value || 'Reasoning'; save(); clearTimeout(window._tt); window._tt = setTimeout(renderPages, 400); }
  });
  window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(fit, 150); });
  window.addEventListener('beforeprint', () => { $('#pages').style.transform = ''; $('#pages').style.marginBottom = ''; });
  window.addEventListener('afterprint', fit);

  /* ---------- start ---------- */
  $('#ver').textContent = RP.VERSION;
  $('#yearBtn b').textContent = 'Year ' + S.year[1];
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x.dataset.view === S.view));
  // test hook: ?test=Y4 ticks every topic up to Y4 (not saved); &seed=, &view=scheme
  const qp = new URLSearchParams(location.search);
  if (qp.get('test')) {
    const y = qp.get('test'); S.year = y; S.ticks = {}; S.length = qp.get('len') || 'full';
    YEARS.slice(0, YEARS.indexOf(y) + 1).forEach(yy => S.ticks[yy] = (RP.TOPICS[yy] || []).map(t => t.id));
    if (qp.get('seed')) S.seed = +qp.get('seed');
    if (qp.get('view')) S.view = qp.get('view');
    save = () => { };
    $('#yearBtn b').textContent = 'Year ' + S.year[1];
    document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x.dataset.view === S.view));
  }
  if (window.innerWidth <= 900 && ticked().length) S.panel = false;
  $('#panel').classList.toggle('closed', !S.panel);
  build(false);
})();

</script>
</body>
</html>
