<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reasoning Papers</title>
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><img src="../logo.png" alt="" onerror="this.style.display='none'"><div><b>Reasoning Papers</b><small>Maths reasoning tests, made from what you have taught</small></div></div>
    <button class="pick" id="yearBtn"><span class="lbl">Year group</span><b>Year 4</b></button>
    <div class="seg"><button data-view="paper" class="on">Paper</button><button data-view="scheme">Mark scheme</button></div>
    <div class="tools">
      <button class="tool" id="newBtn" title="Make a new paper">&#127922;<span>New paper</span></button>
      <button class="tool" id="printBtn" title="Print">&#128424;<span>Print paper</span></button>
      <button class="tool" id="panelBtn" title="Show or hide the topic list">&#9776;<span>Topics</span></button>
      <button class="tool" id="helpBtn" title="How to use">?<span>Help</span></button>
    </div>
  </div>
  <div id="stage">
    <div id="view"><div id="empty">Tick some topics on the right to make a paper.</div><div id="pages"></div></div>
    <div id="panel"><div class="pbody" id="pbody"></div></div>
  </div>
</div>
<div id="pop" hidden></div>
<div id="ver"></div>
<script>
/*JS*/
</script>
</body>
</html>
