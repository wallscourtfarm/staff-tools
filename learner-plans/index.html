<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const API = 'https://api.wallscourt-farm-academy.co.uk';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) throw new Error('Sign-in expired — reload the page.');
  if (!res.ok) { const t = await res.text(); throw new Error(t || res.statusText); }
  if (res.status === 204) return null;
  return res.json();
}

// ── STATE ────────────────────────────────────────────────────────────────────
let children = [];
let archivedChildren = [];
let planCache = {};       // childId -> { year -> plan } (all plans, for dashboard pills)
let activeYear = currentAcademicYear();
let activeYG = lsGet('wfa_lp_yg') || 'All';
let showEhcpOnly = false;
let showingArchive = false;
let currentChildId = null;
let currentChild = null;
let currentPlanId = null;
let currentPlan = null;   // { id, child_id, academic_year, doc }
let childPlans = [];      // all plans for current child
let saveTimer = null;
let dirty = false;

const NTERMS = 6;
const MAX_TARGETS = 3;
const STATUS = { met: 'Met', partial: 'Partially Met', not: 'Not Met' };
const PUPIL_PROMPTS = ['What is important to you?', 'When you are older – what would you like to be?', 'What are you good at?', 'How do you learn best?', 'What helps you to learn?', 'What doesn’t help you?'];
const FAMILY_PROMPTS = ['What has been going well?', 'What are your areas of concern?'];

// ── DATA FETCHING ─────────────────────────────────────────────────────────────
async function fetchArchivedChildren() {
  try {
    archivedChildren = await api('GET', '/learner-plans/children?archived=true');
    archivedChildren.sort((a, b) => a.name.localeCompare(b.name));
  } catch(e) { archivedChildren = []; }
}

async function fetchChildren() {
  try {
    children = await api('GET', '/learner-plans/children');
    children.sort((a, b) => a.name.localeCompare(b.name));
  } catch(e) { toast('Could not load data: ' + e.message, 'error'); children = []; }
  await fetchArchivedChildren();
  renderDashboard();
  // fetch all plans in one call for pill colouring
  try {
    const allPlans = await api('GET', '/learner-plans/all-plans');
    planCache = {};
    allPlans.forEach(p => {
      if (!planCache[p.child_id]) planCache[p.child_id] = {};
      planCache[p.child_id][p.academic_year] = p;
    });
    // no upper bound on years: staff legitimately prepare next year's plans early
    const years = [...new Set(allPlans.map(p => p.academic_year))].sort().reverse();
    if (years.length && !years.includes(activeYear)) activeYear = years[0];
    const ySel = document.getElementById('dashYearSel');
    if (ySel) {
      ySel.innerHTML = years.map(y => `<option value="${y}"${y===activeYear?' selected':''}>${y}</option>`).join('');
    }
    renderDashboard();
  } catch(e) {}
}

async function fetchPlansForChild(childId) {
  try {
    return await api('GET', `/learner-plans/plans/${childId}`);
  } catch(e) { toast('Could not load plans: ' + e.message, 'error'); return []; }
}

// ── PLAN DOCUMENT ────────────────────────────────────────────────────────────
// Stored in lp_plan.terms as one JSON document: { v: 2, strengths, areas,
// outcomesLabel, outcomes[6], rowsShown, t: { 1..6: { date, rows[3], pupilVoice, familyVoice } } }.
// A row holds the review of the PREVIOUS term's target (status, notes) and the
// target + provision set in THIS term — the same as one column block in the spreadsheet.
function blankRow() { return { target: '', provision: '', status: '', notes: '' }; }
function blankTerm() { return { date: '', rows: [blankRow(), blankRow(), blankRow()], pupilVoice: '', familyVoice: '' }; }
function blankDoc() {
  const t = {};
  for (let n = 1; n <= NTERMS; n++) t[n] = blankTerm();
  return { v: 2, strengths: '', areas: '', outcomesLabel: '', outcomes: ['', '', '', '', '', ''], rowsShown: 1, t };
}

function normaliseDoc(plan) {
  const raw = plan.terms;
  let doc;
  if (raw && raw.v === 2) doc = raw;
  else {
    doc = blankDoc();
    // Plans written in the old format are kept untouched inside the new document.
    const hadOld = (plan.assess && Object.keys(plan.assess).length) || (raw && Object.keys(raw).length);
    if (hadOld) doc.legacy = { assess: plan.assess || {}, terms: raw || {} };
  }
  const d = blankDoc();
  doc.strengths = doc.strengths || ''; doc.areas = doc.areas || '';
  doc.outcomesLabel = doc.outcomesLabel || '';
  doc.outcomes = Array.from({ length: 6 }, (_, i) => (doc.outcomes || [])[i] || '');
  doc.format = (doc.format === 'ehcp' || doc.format === 'standard') ? doc.format : '';
  doc.rowsShown = Math.min(MAX_TARGETS, Math.max(1, doc.rowsShown || 1));
  doc.t = doc.t || {};
  for (let n = 1; n <= NTERMS; n++) {
    const tm = doc.t[n] || d.t[n];
    tm.date = tm.date || ''; tm.pupilVoice = tm.pupilVoice || ''; tm.familyVoice = tm.familyVoice || '';
    tm.rows = Array.from({ length: MAX_TARGETS }, (_, i) => Object.assign(blankRow(), (tm.rows || [])[i] || {}));
    doc.t[n] = tm;
  }
  for (let i = 0; i < MAX_TARGETS; i++) {
    if (rowHasContent(doc, i)) doc.rowsShown = Math.max(doc.rowsShown, i + 1);
  }
  return doc;
}

function rowHasContent(doc, i) {
  for (let n = 1; n <= NTERMS; n++) {
    const r = doc.t[n].rows[i];
    if (r.target || r.provision || r.status || r.notes) return true;
  }
  return false;
}

function termHasData(doc, n) {
  const tm = doc.t[n];
  return !!(tm.date || tm.pupilVoice || tm.familyVoice || tm.rows.some(r => r.target || r.provision || r.status || r.notes));
}

// A plan is in EHCP format if the plan says so; otherwise it follows the Bromcom EHCP flag.
function planIsEhcp(child, plan) {
  const f = plan && plan.terms && plan.terms.format;
  if (f === 'ehcp') return true;
  if (f === 'standard') return false;
  return !!child && child.is_ehcp === 'true';
}

function planHasTermData(plan, n) {
  if (!plan || !plan.terms || plan.terms.v !== 2 || !plan.terms.t || !plan.terms.t[n]) return false;
  const tm = plan.terms.t[n];
  return (tm.rows || []).some(r => r.target || r.status || r.notes);
}

// ── SAVING ───────────────────────────────────────────────────────────────────
function scheduleSave() {
  dirty = true;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 900);
}

async function flushSave() {
  clearTimeout(saveTimer);
  if (!currentPlanId || !currentPlan || !dirty) return;
  const sending = JSON.stringify(currentPlan.doc);
  try {
    const res = await api('POST', `/learner-plans/plans/${currentPlanId}/update`, { terms: currentPlan.doc });
    if (!res || res.ok !== true) throw new Error('unexpected reply');
    if (JSON.stringify(currentPlan.doc) === sending) dirty = false;
    // keep the cached copies (dashboard pills, year switching, new-year rollover) in step with what was saved
    if (!planCache[currentPlan.child_id]) planCache[currentPlan.child_id] = {};
    planCache[currentPlan.child_id][currentPlan.academic_year] = { id: currentPlan.id, child_id: currentPlan.child_id, academic_year: currentPlan.academic_year, terms: JSON.parse(sending) };
    const mine = childPlans.find(p => p.id === currentPlanId);
    if (mine) mine.terms = JSON.parse(sending);
    document.getElementById('saveBanner').style.display = 'none';
    setStatus('saved');
  } catch(e) {
    setStatus('error');
    const b = document.getElementById('saveBanner');
    b.style.display = 'flex';
  }
}

function setStatus(s) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  if (s === 'saving') { el.textContent = 'Saving…'; el.className = 'save-status saving'; }
  else if (s === 'saved') { el.textContent = 'Saved ✓'; el.className = 'save-status'; setTimeout(() => { if (!dirty) el.textContent = ''; }, 2500); }
  else if (s === 'error') { el.textContent = 'Not saved!'; el.className = 'save-status error'; }
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', () => { flushSave(); });

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
const YG_ORDER = ['All','EYFS','Year 1','Year 2','Year 3','Year 4','Year 5','Year 6'];

function childCard(c) {
  const plan = planCache[c.id]?.[activeYear];
  const pills = [1,2,3,4,5,6].map(n => {
    const has = planHasTermData(plan, n);
    return `<span class="pill${has?' complete':''}">Term ${n}</span>`;
  }).join('');
  return `<div class="child-card" onclick="openChild('${c.id}')">
    <h3>${esc(c.name)}${planIsEhcp(c, plan) ? '<span class="ehcp-badge">EHCP</span>' : ''}</h3>
    <div class="meta">${[c.class_name, c.teacher].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="term-pills">${pills}</div>
  </div>`;
}

function renderDashboard() {
  const sb = document.getElementById('searchBar');
  if (sb) sb.style.display = '';
  const filter = (sb?.value || '').toLowerCase();
  const grid = document.getElementById('childrenGrid');

  const ygsPresent = ['All', ...YG_ORDER.filter(y => y !== 'All' && children.some(c => c.year_group === y))];
  if (!ygsPresent.includes(activeYG)) activeYG = 'All';
  const ygNav = document.getElementById('ygNav');
  if (ygNav) ygNav.innerHTML = ygsPresent.map(y =>
    `<button class="yg-btn${activeYG===y?' active':''}" onclick="setYG('${y}')">${y}</button>`
  ).join('') + `<span style="color:var(--border);margin:0 4px">|</span><button class="yg-btn${showEhcpOnly?' active':''}" style="${showEhcpOnly?'background:#c0392b;border-color:#c0392b;':''}" onclick="toggleEhcpFilter()">EHCP</button>`;

  const ygList = (activeYG === 'All' ? children : children.filter(c => c.year_group === activeYG))
    .filter(c => !filter || c.name.toLowerCase().includes(filter))
    .filter(c => !showEhcpOnly || planIsEhcp(c, planCache[c.id]?.[activeYear]));

  if (!ygList.length) {
    grid.style.display = 'grid';
    grid.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem;margin-bottom:10px">📋</div>
      <h3>No matching learners</h3><p style="margin-top:5px">Try a different filter or click <strong>+ New Learner</strong>.</p>
    </div>`;
    return;
  }

  if (activeYG === 'All') {
    grid.innerHTML = ygList.map(childCard).join('');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(260px, 1fr))';
  } else {
    const classNames = [...new Set(ygList.map(c => c.class_name).filter(Boolean).sort())];
    if (classNames.length <= 1) {
      grid.innerHTML = ygList.map(childCard).join('');
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(260px, 1fr))';
    } else {
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
      grid.innerHTML = classNames.map(cl => {
        const classChildren = ygList.filter(c => c.class_name === cl);
        const teacher = classChildren[0]?.teacher || '';
        return `<div>
          <div style="font-weight:800;font-size:.95rem;color:var(--blue);margin-bottom:6px;padding-bottom:6px;border-bottom:2px solid var(--blue)">${esc(cl)}<span style="font-weight:400;font-size:.8rem;color:var(--muted);margin-left:8px">${esc(teacher)}</span></div>
          ${classChildren.map(childCard).join('')}
        </div>`;
      }).join('');
    }
  }
}

function setYG(yg) { activeYG = yg; lsSet('wfa_lp_yg', yg); showEhcpOnly = false; renderDashboard(); }
function toggleEhcpFilter() { showEhcpOnly = !showEhcpOnly; renderDashboard(); }

function toggleArchiveView() {
  showingArchive = !showingArchive;
  document.getElementById('archiveToggleBtn').textContent = showingArchive ? '← Active Plans' : '📦 View Archive';
  document.getElementById('dashTitle').textContent = showingArchive ? 'Archived Plans' : 'All Learner Plans';
  document.getElementById('newLearnerBtn').style.display = showingArchive ? 'none' : '';
  if (showingArchive) renderArchive(); else renderDashboard();
}

function renderArchive() {
  const ygNav = document.getElementById('ygNav');
  const searchBar = document.getElementById('searchBar');
  const grid = document.getElementById('childrenGrid');
  if (ygNav) ygNav.innerHTML = '';
  if (searchBar) searchBar.style.display = 'none';

  if (!archivedChildren.length) {
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(260px, 1fr))';
    grid.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem;margin-bottom:10px">📦</div>
      <h3>No archived plans</h3><p style="margin-top:5px">Plans you archive will appear here.</p></div>`;

  }

  grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(280px, 1fr))';

      <h3 style="color:var(--muted)">${esc(c.name)}</h3>

      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-ghost btn-sm" onclick="restoreChild('${c.id}')">↩ Restore</button>
        <button class="btn btn-danger btn-sm" onclick="currentChildId='${c.id}';deleteChild()">Delete permanently</button>
      </div>

}

// ── OPEN CHILD ────────────────────────────────────────────────────────────────
async function openChild(childId) {
  currentChildId = childId;
  currentChild = children.find(c => c.id === childId) || archivedChildren.find(c => c.id === childId) || null;
  const child = currentChild;
  document.getElementById('planName').innerHTML = esc(child.name);
  document.getElementById('planMeta').textContent = [child.year_group, child.class_name, child.teacher].filter(Boolean).join(' · ');
  showPage('plan-view');
  childPlans = await fetchPlansForChild(childId);
  if (!childPlans.length) {
    const made = await createPlan(childId, currentAcademicYear());
    if (!made) return;
    childPlans = await fetchPlansForChild(childId);
    if (!childPlans.length) return;
  }
  renderYearSelector();
  const wanted = childPlans.find(p => p.academic_year === activeYear) || childPlans[childPlans.length - 1];
  await loadPlan(wanted.id);
}

function currentAcademicYear() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth(); // 0-based; September = month 8
  const startYear = m >= 8 ? y : y - 1;
  return `${startYear}-${String(startYear + 1).slice(-2)}`;
}

function setActiveYear(year) {
  activeYear = year;
  renderDashboard();
}

function renderYearSelector() {
  const sel = document.getElementById('yearSelector');
  sel.innerHTML = childPlans.map(p => `<option value="${p.id}">${p.academic_year}</option>`).join('');
  sel.value = currentPlanId || childPlans[childPlans.length - 1].id;
}

async function switchYear(planId) {
  await flushSave();
  await loadPlan(planId);
}

async function loadPlan(planId) {
  currentPlanId = planId;
  const raw = childPlans.find(p => p.id === planId);
  currentPlan = { id: raw.id, child_id: raw.child_id, academic_year: raw.academic_year, doc: normaliseDoc(JSON.parse(JSON.stringify(raw))) };
  dirty = false;
  document.getElementById('yearSelector').value = planId;
  renderPlan();
}

async function createPlan(childId, year, doc = null) {
  try {
    return await api('POST', '/learner-plans/plans', { child_id: childId, academic_year: year, assess: {}, terms: doc || blankDoc() });
  } catch(e) { toast('Could not create plan: ' + e.message, 'error'); return null; }
}

async function createNextYear() {
  await flushSave();
  childPlans = await fetchPlansForChild(currentChildId);
  const latest = childPlans[childPlans.length - 1];
  const startYear = parseInt(latest.academic_year.slice(0, 4), 10) + 1;
  const year = `${startYear}-${String(startYear + 1).slice(-2)}`;
  if (childPlans.some(p => p.academic_year === year)) { toast(`A ${year} plan already exists.`); return; }
  if (!confirm(`Start the ${year} plan for ${currentChild.name}? Strengths, areas of development${planIsEhcp(currentChild, childPlans[childPlans.length - 1]) ? ', EHCP outcomes' : ''} and the Term 6 new targets carry over.`)) return;
  const from = normaliseDoc(JSON.parse(JSON.stringify(latest)));
  const doc = blankDoc();
  doc.strengths = from.strengths; doc.areas = from.areas;
  doc.outcomesLabel = from.outcomesLabel; doc.outcomes = from.outcomes.slice(); doc.format = from.format;
  from.t[6].rows.forEach((r, i) => { doc.t[1].rows[i].target = r.target; doc.t[1].rows[i].provision = r.provision; });
  doc.rowsShown = from.rowsShown;
  const made = await createPlan(currentChildId, year, doc);
  if (!made) return;
  childPlans = await fetchPlansForChild(currentChildId);
  renderYearSelector();
  await loadPlan(made.id);
  toast(`${year} plan created — Term 6 targets are now the Term 1 targets.`, 'success');
}

// ── PLAN VIEW ────────────────────────────────────────────────────────────────
function isEhcpNow() { return planIsEhcp(currentChild, { terms: currentPlan.doc }); }

function renderPlanHeader() {
  const e = isEhcpNow();
  document.getElementById('planName').innerHTML = esc(currentChild.name) + (e ? '<span class="ehcp-badge">EHCP</span>' : '');
  document.getElementById('formatBtn').textContent = e ? 'Switch to standard Learner Plan' : 'Switch to EHCP termly targets';
}

function toggleFormat() {
  const toEhcp = !isEhcpNow();
  const msg = toEhcp
    ? `Switch ${currentChild.name} to the EHCP termly targets format? The long-term outcomes section appears. Nothing already written is changed.`
    : `Switch ${currentChild.name} back to the standard Learner Plan format? The EHCP outcomes are hidden, not deleted.`;
  if (!confirm(msg)) return;
  currentPlan.doc.format = toEhcp ? 'ehcp' : 'standard';
  renderPlanHeader();
  renderProfile();
  scheduleSave();
}

function renderPlan() {
  renderPlanHeader();
  renderProfile();
  renderTermNav();
  renderTerms();
  const doc = currentPlan.doc;
  let last = 0;
  for (let n = 1; n <= NTERMS; n++) if (termHasData(doc, n)) last = n;
  setTimeout(() => scrollToTerm(Math.min(NTERMS, Math.max(1, last)), false), 30);
}

function renderProfile() {
  const doc = currentPlan.doc;
  const ehcp = isEhcpNow();
  let html = '';
  if (ehcp) {
    html += `<div class="card" style="border-left:4px solid #e74c3c">
      <div class="card-header"><h3>Long Term Outcomes from EHCP – End of <input class="fld" style="display:inline-block;width:170px;padding:3px 8px;margin-left:4px" data-f="outcomesLabel" value="${esc(doc.outcomesLabel)}" placeholder="e.g. Key Stage 2" oninput="setField(this)"></h3></div>
      <div class="card-body">
        <div class="help">What outcomes does the EHCP want achieved by the end of the next Key Stage? (End of EYFS, Key Stage 1, Key Stage 2 and occasionally Key Stage 3.)</div>
        ${doc.outcomes.map((o, i) => `<div class="outcome-row"><span class="n">${i + 1}</span><textarea class="fld" data-f="outcomes.${i}" oninput="setField(this)">${esc(o)}</textarea></div>`).join('')}
      </div>
    </div>`;
  }
  html += `<div class="card">
    <div class="card-header"><h3>Strengths and Areas of Development</h3></div>
    <div class="card-body"><div class="profile-grid">
      <div><label class="lbl">Strengths</label><textarea class="fld" data-f="strengths" oninput="setField(this)">${esc(doc.strengths)}</textarea></div>
      <div><label class="lbl">Areas of Development</label><textarea class="fld" data-f="areas" oninput="setField(this)">${esc(doc.areas)}</textarea></div>
    </div></div>
  </div>`;
  const filled = doc.strengths || doc.areas || doc.outcomes.some(o => o);
  document.getElementById('profileCard').innerHTML = `<details class="profile"${filled ? '' : ' open'}>
    <summary>${ehcp ? 'EHCP outcomes, strengths and areas of development' : 'Strengths and areas of development'} <span>(click to ${filled ? 'show / edit' : 'hide'})</span></summary>${html}</details>`;
}

function renderTermNav() {
  const doc = currentPlan.doc;
  document.getElementById('termNav').innerHTML = [1,2,3,4,5,6].map(n =>
    `<button class="term-chip${termHasData(doc, n) ? ' has-data' : ''}" id="chip-${n}" onclick="scrollToTerm(${n}, true)">Term ${n}</button>`
  ).join('') + '<span class="hint">Scroll across to move between terms</span>';
}

function renderTerms() {
  const sc = document.getElementById('termScroller');
  sc.innerHTML = [1,2,3,4,5,6].map(termCardHtml).join('');
  sc.onscroll = () => {
    const cards = [...sc.querySelectorAll('.term-card')];
    let best = 0, bestD = Infinity;
    cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft - sc.offsetLeft - sc.scrollLeft); if (d < bestD) { bestD = d; best = i; } });
    markChip(best + 1);
  };
}

function markChip(n) {
  document.querySelectorAll('.term-chip').forEach(el => el.classList.remove('active'));
  document.getElementById(`chip-${n}`)?.classList.add('active');
}

function scrollToTerm(n, smooth) {
  const sc = document.getElementById('termScroller');
  const card = document.getElementById(`term-${n}`);
  if (!sc || !card) return;
  sc.scrollTo({ left: card.offsetLeft - sc.offsetLeft, behavior: smooth ? 'smooth' : 'auto' });
  markChip(n);
}

function termCardHtml(n) {
  const doc = currentPlan.doc;
  const tm = doc.t[n];
  const prev = n > 1 ? doc.t[n - 1] : null;
  const shown = Math.min(MAX_TARGETS, Math.max(doc.rowsShown, 1));
  let rows = '';
  for (let i = 0; i < shown; i++) rows += rowHtml(n, i);
  const addBtn = shown < MAX_TARGETS ? `<button class="add-target-btn" onclick="addTargetRow()">+ Add target ${shown + 1} (maximum ${MAX_TARGETS})</button>` : '';
  const carryAll = (n > 1 && prev.rows.slice(0, shown).some((r, i) => r.target && r.status !== 'met' && !tm.rows[i].target))
    ? `<button class="carry-btn" onclick="carryAll(${n})">↻ Carry forward all not yet Met</button>` : '';
  return `<div class="term-card" id="term-${n}">
    <div class="th">
      <h3>Term ${n}${n > 1 ? ' update' : ''}</h3>
      <div class="datefld"><label>Meeting date</label><input type="date" data-f="t.${n}.date" value="${esc(tm.date)}" oninput="setField(this)"></div>
    </div>
    <div class="tb">
      ${carryAll ? `<div style="margin-bottom:10px">${carryAll}</div>` : ''}
      ${rows}${addBtn}
      <div class="lbl" style="margin-top:6px">Pupil voice and family voice</div>
      <div class="voice">
        <div class="vb pupil"><div class="vt">Pupil Voice</div>
          <div class="vp">${PUPIL_PROMPTS.map(esc).join(' · ')}</div>
          <textarea class="fld" style="min-height:90px" data-f="t.${n}.pupilVoice" oninput="setField(this)">${esc(tm.pupilVoice)}</textarea></div>
        <div class="vb family"><div class="vt">Family Voice</div>
          <div class="vp">${FAMILY_PROMPTS.map(esc).join(' · ')}</div>
          <textarea class="fld" style="min-height:90px" data-f="t.${n}.familyVoice" oninput="setField(this)">${esc(tm.familyVoice)}</textarea></div>
      </div>
    </div>
    <div class="tf"><button class="btn btn-primary btn-sm" onclick="printTerm(${n})">📄 Term ${n} PDF for parents</button></div>
  </div>`;
}

function rowHtml(n, i) {
  const doc = currentPlan.doc;
  const r = doc.t[n].rows[i];
  const prevRow = n > 1 ? doc.t[n - 1].rows[i] : null;
  let review = '';
  if (prevRow && prevRow.target) {
    review = `<div class="review"><div class="rl">Term ${n - 1} target being reviewed</div>
      <div style="white-space:pre-wrap">${esc(prevRow.target)}</div>
      ${prevRow.provision ? `<div class="rp" style="white-space:pre-wrap">Provision: ${esc(prevRow.provision)}</div>` : ''}
      ${n === 2 && prevRow.notes ? `<div class="rp" style="white-space:pre-wrap">Notes so far: ${esc(prevRow.notes)}</div>` : ''}
    </div>
    <div class="status-group">${Object.keys(STATUS).map(k =>
      `<button class="status-btn ${k}${r.status === k ? ' sel' : ''}" onclick="setStatusBtn(${n},${i},'${k}')">${STATUS[k]}</button>`).join('')}</div>
    <label class="lbl">Progress notes</label>
    <textarea class="fld" data-f="t.${n}.rows.${i}.notes" oninput="setField(this)">${esc(r.notes)}</textarea>`;
  }
  const canCarry = prevRow && prevRow.target && !(r.target === prevRow.target && r.provision === prevRow.provision);
  const newLabel = n === 1 ? 'Target' : (n === NTERMS ? 'New target (for next year)' : 'New target');
  return `<div class="trow" id="row-${n}-${i}">
    <div class="tn">Target ${i + 1}</div>
    ${review}
    <div class="${review ? 'newt' : ''}">
      <div class="newt-head"><label class="lbl" style="margin:0">${newLabel}</label>${canCarry ? `<button class="carry-btn" onclick="carryRow(${n},${i})">↻ Same target as Term ${n - 1}</button>` : ''}</div>
      <textarea class="fld" data-f="t.${n}.rows.${i}.target" oninput="setField(this)">${esc(r.target)}</textarea>
      <div class="sub"><label class="lbl">Provision</label>
      <textarea class="fld" data-f="t.${n}.rows.${i}.provision" oninput="setField(this)">${esc(r.provision)}</textarea></div>
      ${n === 1 ? `<div class="sub"><label class="lbl">Progress notes so far</label>
      <textarea class="fld" data-f="t.1.rows.${i}.notes" oninput="setField(this)">${esc(r.notes)}</textarea></div>` : ''}
    </div>
  </div>`;
}

// ── EDITING ──────────────────────────────────────────────────────────────────
function setByPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let k = 0; k < parts.length - 1; k++) o = o[parts[k]];
  o[parts[parts.length - 1]] = value;
}

function setField(el) {
  const path = el.dataset.f;
  setByPath(currentPlan.doc, path, el.value);
  // the next term shows this target for review, so redraw that card when it changes
  const m = /^t\.(\d)\.rows\.\d\.(target|provision)$/.exec(path);
  if (m && +m[1] < NTERMS) rerenderTerm(+m[1] + 1);
  refreshChips();
  scheduleSave();
}

function refreshChips() {
  const doc = currentPlan.doc;
  for (let n = 1; n <= NTERMS; n++) document.getElementById(`chip-${n}`)?.classList.toggle('has-data', termHasData(doc, n));
}

function rerenderTerm(n) {
  const old = document.getElementById(`term-${n}`);
  const sc = document.getElementById('termScroller');
  const keep = sc.scrollLeft;
  const tmp = document.createElement('div');
  tmp.innerHTML = termCardHtml(n);
  old.replaceWith(tmp.firstElementChild);
  sc.scrollLeft = keep;
}

function setStatusBtn(n, i, k) {
  const r = currentPlan.doc.t[n].rows[i];
  r.status = r.status === k ? '' : k;
  rerenderTerm(n);
  refreshChips();
  scheduleSave();
}

function carryRow(n, i) {
  const doc = currentPlan.doc;
  const src = doc.t[n - 1].rows[i], dst = doc.t[n].rows[i];
  if ((dst.target || dst.provision) && !confirm('Replace what is already written in this target with last term\'s?')) return;
  dst.target = src.target; dst.provision = src.provision;
  rerenderTerm(n);
  refreshChips();
  scheduleSave();
}

function carryAll(n) {
  const doc = currentPlan.doc;
  doc.t[n - 1].rows.forEach((src, i) => {
    const dst = doc.t[n].rows[i];
    if (src.target && src.status !== 'met' && !dst.target && !dst.provision) { dst.target = src.target; dst.provision = src.provision; }
  });
  rerenderTerm(n);
  refreshChips();
  scheduleSave();
}

function addTargetRow() {
  const doc = currentPlan.doc;
  if (doc.rowsShown >= MAX_TARGETS) return;
  doc.rowsShown++;
  for (let n = 1; n <= NTERMS; n++) rerenderTerm(n);
  scheduleSave();
}

// ── CHILD CRUD ────────────────────────────────────────────────────────────────

// Roster picker (create only) — pupils not yet tracked in Learner Plans
let rosterCandidates = [];
let rosterPicked = null;

async function loadRosterCandidates() {
  try { rosterCandidates = await api('GET', '/learner-plans/roster'); }
  catch (e) { rosterCandidates = []; toast('Could not load the roster: ' + e.message, 'error'); }
}

function renderRosterResults() {
  const q = document.getElementById('rosterSearch').value.trim().toLowerCase();
  const box = document.getElementById('rosterResults');
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const matches = rosterCandidates.filter(p =>
    `${p.first} ${p.last}`.toLowerCase().includes(q)).slice(0, 15);
  if (!matches.length) {
    box.style.display = 'block';
    box.innerHTML = '<div style="padding:10px 12px;color:var(--muted);font-size:.85rem">No match — check they\'re on the active roster (Roster Import).</div>';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = matches.map(p => `
    <div onclick="pickRosterPupil('${p.upn}')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)" onmouseover="this.style.background='var(--light-bg)'" onmouseout="this.style.background=''">
      <strong>${esc(p.first)} ${esc(p.last)}</strong>
      <span style="color:var(--muted);font-size:.82rem"> · ${esc(p.yearGroup || '')} ${esc(p.class || '')}</span>
    </div>`).join('');
}

function pickRosterPupil(upn) {
  rosterPicked = rosterCandidates.find(p => p.upn === upn);
  if (!rosterPicked) return;
  document.getElementById('nUpn').value = upn;
  document.getElementById('rosterResults').style.display = 'none';
  document.getElementById('rosterSearch').value = '';
  document.getElementById('rosterPickedLine').style.display = 'block';
  document.getElementById('rosterPickedLine').textContent =
    `✓ ${rosterPicked.first} ${rosterPicked.last} — ${rosterPicked.yearGroup || ''} ${rosterPicked.class || ''}`;
}

async function showNewChildModal() {
  document.getElementById('nUpn').value = '';
  rosterPicked = null;
  document.getElementById('rosterSearch').value = '';
  document.getElementById('rosterResults').style.display = 'none';
  document.getElementById('rosterPickedLine').style.display = 'none';
  document.getElementById('nAcYear').value = currentAcademicYear();
  document.getElementById('childModal').style.display = 'flex';
  await loadRosterCandidates();
}

function closeChildModal() { document.getElementById('childModal').style.display = 'none'; }

async function saveChild() {
  if (!rosterPicked) { alert('Search for and select the pupil first.'); return; }
  const payload = { upn: rosterPicked.upn };
  const acYear = document.getElementById('nAcYear').value.trim() || currentAcademicYear();
  closeChildModal();
  let created;
  try {
    created = await api('POST', '/learner-plans/children', payload);
  } catch(e) { toast('Could not create: ' + e.message, 'error'); return; }
  await fetchChildren();
  const plan = await createPlan(created.id, acYear);
  if (!plan) return;
  await openChild(created.id);
}

async function archiveChild() {
  const c = children.find(c => c.id === currentChildId);
  if (!confirm(`Archive ${c.name}'s learner plan? It will be moved to the archive and can be restored later.`)) return;
  await flushSave();
  try {
    await api('POST', `/learner-plans/children/${currentChildId}/archive`);
  } catch(e) { toast('Archive failed: ' + e.message, 'error'); return; }
  await fetchChildren();
  goBack();
  toast(`${c.name} archived`);
}

async function deleteChild() {
  const c = archivedChildren.find(c => c.id === currentChildId) || children.find(c => c.id === currentChildId);
  if (!confirm(`Permanently delete ALL plans for ${c?.name}? This cannot be undone.`)) return;
  try {
    await api('POST', `/learner-plans/children/${currentChildId}/delete`);
  } catch(e) { toast('Delete failed: ' + e.message, 'error'); return; }
  await fetchChildren();
  await fetchArchivedChildren();
  goBack();
  toast('Plan permanently deleted');
}

async function restoreChild(childId) {
  try {
    await api('POST', `/learner-plans/children/${childId}/unarchive`);
  } catch(e) { toast('Restore failed: ' + e.message, 'error'); return; }
  await fetchChildren();
  await fetchArchivedChildren();
  renderArchive();
  toast('Plan restored');
}

// ── PARENT PDF (one term) ────────────────────────────────────────────────────
function ukDate(iso) {
  if (!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function printTerm(n) {
  await flushSave();
  const child = currentChild || {};
  const doc = currentPlan.doc;
  const tm = doc.t[n];
  const prev = n > 1 ? doc.t[n - 1] : null;
  const ehcp = isEhcpNow();
  const used = [0, 1, 2].filter(i => [tm.rows[i], prev && prev.rows[i]].some(r => r && (r.target || r.provision || r.status || r.notes)));
  const rowIdx = used.length ? used : [0];
  const BORDER = '1px solid #9bb7c7';
  const STATUS_COL = { met: ['#d4f0e0', '#1a7a43'], partial: ['#fff3cd', '#856404'], not: ['#fde2df', '#a02a1f'] };
  const th = (t, w) => `<th style="border:${BORDER};background:#daeef8;color:#0e5f86;font-size:9pt;text-align:left;padding:5px 7px;${w ? 'width:' + w + ';' : ''}">${t}</th>`;
  const td = (t, extra = '') => `<td style="border:${BORDER};vertical-align:top;padding:6px 7px;font-size:10pt;line-height:1.45;white-space:pre-wrap;${extra}">${t}</td>`;
  const box = (title, colour, bg, text, prompts) => `<td style="width:50%;vertical-align:top;padding:0 4px">
    <div style="border:1px solid ${colour};background:${bg};border-radius:6px;padding:8px 10px;min-height:70px">
      <div style="font-size:9pt;font-weight:800;text-transform:uppercase;color:${colour};margin-bottom:3px">${title}</div>
      <div style="font-size:8pt;color:#666;margin-bottom:4px">${prompts}</div>
      <div style="font-size:10pt;line-height:1.45;white-space:pre-wrap">${esc(text)}</div>
    </div></td>`;

  let head, body = '';
  if (n === 1) {
    const withNotes = rowIdx.some(i => tm.rows[i].notes);
    head = th('', '4%') + th('Target', withNotes ? '36%' : '48%') + th('Provision', withNotes ? '30%' : '48%') + (withNotes ? th('Progress notes so far', '30%') : '');
    for (const i of rowIdx) { const r = tm.rows[i]; body += `<tr>${td(String(i + 1), 'font-weight:700;text-align:center')}${td(esc(r.target))}${td(esc(r.provision))}${withNotes ? td(esc(r.notes)) : ''}</tr>`; }
  } else {
    head = th('', '3%') + th(`Term ${n - 1} target`, '20%') + th('Outcome', '9%') + th('Progress notes', '24%') + th(n === NTERMS ? 'New target (next year)' : 'New target', '22%') + th('Provision', '22%');
    for (const i of rowIdx) {
      const r = tm.rows[i], p = prev.rows[i];
      const sc = STATUS_COL[r.status];
      body += `<tr>${td(String(i + 1), 'font-weight:700;text-align:center')}${td(esc(p.target))}
        ${td(r.status ? `<span style="display:inline-block;padding:2px 6px;border-radius:4px;font-weight:700;font-size:9pt;background:${sc[0]};color:${sc[1]}">${STATUS[r.status]}</span>` : '')}
        ${td(esc(r.notes))}${td(esc(r.target))}${td(esc(r.provision))}</tr>`;
    }
  }

  let outcomes = '';
  if (ehcp && doc.outcomes.some(o => o)) {
    outcomes = `<div style="margin-bottom:10px"><div style="font-size:9.5pt;font-weight:800;color:#0e5f86;margin-bottom:3px">Long Term Outcomes from EHCP – End of ${esc(doc.outcomesLabel || '…')}</div>
      <ol style="margin-left:18px;font-size:10pt;line-height:1.45">${doc.outcomes.map(o => o ? `<li>${esc(o)}</li>` : '').join('')}</ol></div>`;
  }

  const html = `<div style="font-family:'Segoe UI',sans-serif;color:#1a1a1a">
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px"><tr>
      <td style="vertical-align:middle">
        <div style="font-size:15pt;font-weight:800">${ehcp ? 'EHCP Termly Targets' : 'Learner Plan'} — Term ${n}${n > 1 ? ' update' : ''}</div>
        <div style="font-size:10.5pt;margin-top:4px"><b>Learner's name:</b> ${esc(child.name || '')} &nbsp;&nbsp; <b>Year group:</b> ${esc(child.year_group || '')} ${esc(child.class_name || '')} &nbsp;&nbsp; <b>Academic year:</b> ${esc(currentPlan.academic_year)}${tm.date ? ` &nbsp;&nbsp; <b>Meeting date:</b> ${esc(ukDate(tm.date))}` : ''}</div>
      </td>
      <td style="text-align:right;vertical-align:middle">${LOGO_DATA_URL ? `<img src="${LOGO_DATA_URL}" style="height:56px">` : ''}</td>
    </tr></table>
    ${outcomes}
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px"><tr>
      <td style="width:50%;vertical-align:top;padding-right:4px"><div style="border:${BORDER};border-radius:6px;padding:7px 9px"><div style="font-size:9pt;font-weight:800;color:#0e5f86;text-transform:uppercase;margin-bottom:3px">Strengths</div><div style="font-size:10pt;line-height:1.45;white-space:pre-wrap">${esc(doc.strengths)}</div></div></td>
      <td style="width:50%;vertical-align:top;padding-left:4px"><div style="border:${BORDER};border-radius:6px;padding:7px 9px"><div style="font-size:9pt;font-weight:800;color:#0e5f86;text-transform:uppercase;margin-bottom:3px">Areas of Development</div><div style="font-size:10pt;line-height:1.45;white-space:pre-wrap">${esc(doc.areas)}</div></div></td>
    </tr></table>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px;page-break-inside:avoid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    <table style="width:100%;border-collapse:collapse;page-break-inside:avoid"><tr>
      ${box('Pupil Voice', '#6d28d9', '#f5f0ff', tm.pupilVoice, PUPIL_PROMPTS.map(esc).join(' · '))}
      ${box('Family Voice', '#b45309', '#fef9f0', tm.familyVoice, FAMILY_PROMPTS.map(esc).join(' · '))}
    </tr></table>
  </div>`;

  let pr = document.getElementById('printRoot');
  if (!pr) { pr = document.createElement('div'); pr.id = 'printRoot'; document.body.appendChild(pr); }
  pr.innerHTML = html;
  await new Promise(r => setTimeout(r, 120));
  window.print();
  pr.innerHTML = '';
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
async function goBack() { await flushSave(); showPage('dashboard'); renderDashboard(); }
function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── START ─────────────────────────────────────────────────────────────────────
init();
</script>

<footer style="text-align:center;padding:16px;color:#bbb;font-size:.73rem;margin-top:28px">

</footer>
</body>
</html>
