<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #f8fafc; color: #1e293b; }

.header { background: #1798d3; color: white; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.header h1 { font-size: 17px; font-weight: 900; line-height: 1.1; }
.header h1 small { display: block; font-size: 10px; font-weight: 600; opacity: .8; }

.controls { display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: white; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
.btn { padding: 5px 11px; border-radius: 5px; border: 1.5px solid #e2e8f0; background: white; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn:hover { background: #f0f8fd; }
.btn.active { background: #1798d3; color: white; border-color: #1798d3; }
input[type=date] { font-family: 'Nunito', sans-serif; font-size: 11px; border: 1.5px solid #e2e8f0; border-radius: 5px; padding: 5px 8px; color: #1e293b; }
.spacer { flex: 1; }
.sheet-status { font-size: 10px; padding: 3px 8px; border-radius: 3px; }
.sheet-status.ok  { color: #16a34a; background: #dcfce7; }
.sheet-status.err { color: #b91c1c; background: #fee2e2; }

.cover-alert { background: #fee2e2; border-left: 4px solid #ef4444; padding: 10px 14px; margin: 8px; border-radius: 4px; }
.cover-alert h3 { font-size: 12px; font-weight: 900; color: #b91c1c; margin-bottom: 6px; }
.cover-item { font-size: 11px; color: #7f1d1d; padding: 2px 0; }
.cover-item.critical { font-weight: 700; }

/* ── GRID VIEW ── */
.grid-wrap { overflow-x: auto; padding-bottom: 12px; }
table.sched { border-collapse: collapse; font-size: 10.5px; }
table.sched th, table.sched td { border: 1px solid #e2e8f0; padding: 4px 5px; }
.tc { width: 46px; min-width: 46px; font-weight: 700; font-size: 9.5px; color: #64748b; background: #f8fafc; position: sticky; left: 0; z-index: 2; white-space: nowrap; text-align: right; border-right: 2px solid #cbd5e1; }
table.sched thead .tc { z-index: 3; }
table.sched thead th { position: sticky; top: 0; background: white; z-index: 1; }
.lh { min-width: 76px; text-align: center; padding: 5px 4px; }
.lh-bar { height: 4px; border-radius: 2px 2px 0 0; margin: -5px -4px 4px; }
.lh-name { font-weight: 900; font-size: 11px; display: block; }
.lh-role { font-size: 8.5px; color: #64748b; font-weight: 600; display: block; }
.lh.absent-hd .lh-name { text-decoration: line-through; color: #94a3b8; }
td.absent-col { background: repeating-linear-gradient(45deg,#f8fafc,#f8fafc 4px,#f1f5f9 4px,#f1f5f9 8px) !important; }
td.act { white-space: pre-line; line-height: 1.25; vertical-align: middle; font-size: 10px; }
td.empty { background: #f8fafc; }
tr.all-row td.all-cell { font-weight: 700; text-align: center; font-size: 11px; padding: 5px; }
tr.note-row td { font-size: 9px; color: #94a3b8; font-style: italic; padding: 2px 6px; background: #f8fafc; border-top: none; }

/* ── ABSENT TOGGLE ── */
.absent-pill { display: inline-block; margin-top: 4px; font-size: 8.5px; font-weight: 700; font-family: 'Nunito', sans-serif; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 1px 7px; cursor: pointer; background: white; color: #94a3b8; white-space: nowrap; }
.absent-pill:hover { border-color: #fca5a5; color: #b91c1c; }
.absent-pill.is-absent { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
.card-absent-btn { width: 100%; margin-top: 6px; padding: 3px 0; font-family: 'Nunito', sans-serif; font-size: 9.5px; font-weight: 700; border: 1.5px solid #e2e8f0; border-radius: 6px; background: white; color: #94a3b8; cursor: pointer; }
.card-absent-btn:hover { border-color: #fca5a5; color: #b91c1c; }
.card-absent-btn.is-absent { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

/* ── CARD VIEW ── */
.cards-wrap { padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(155px,1fr)); gap: 8px; }
.leader-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.leader-card.absent { opacity: .4; }
.card-hd { padding: 8px 10px 8px; border-top: 5px solid #e2e8f0; }
.card-name { font-weight: 900; font-size: 13px; }
.card-role { font-size: 9px; font-weight: 600; color: #64748b; margin-top: 1px; }
.card-timeline { padding-bottom: 4px; }
.tl-row { display: flex; gap: 5px; padding: 4px 10px 3px; border-top: 1px solid #f1f5f9; align-items: flex-start; }
.tl-time { font-size: 9px; font-weight: 700; color: #64748b; min-width: 30px; padding-top: 1px; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
.tl-label { font-size: 10px; font-weight: 600; line-height: 1.3; flex: 1; }

/* ── SCHEDULE EDITOR ── */
.sched-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; overflow-y: auto; }
.sched-overlay.open { display: block; }
.sched-editor { background: white; min-height: 100%; max-width: 860px; margin: 0 auto; }
.sed-head { position: sticky; top: 0; background: white; border-bottom: 2px solid #e2e8f0; padding: 10px 12px; display: flex; align-items: center; gap: 6px; z-index: 10; flex-wrap: wrap; }
.sed-head h2 { font-size: 14px; font-weight: 900; flex: 1; }
.sed-body { padding: 10px; }
.sed-slot { border: 1.5px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.sed-slot-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
.sed-time-in { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; border: 1.5px solid #cbd5e1; border-radius: 4px; padding: 3px 6px; width: 65px; }
.sed-note-in { font-family: 'Nunito', sans-serif; font-size: 10px; border: 1.5px solid #e2e8f0; border-radius: 4px; padding: 3px 6px; flex: 1; min-width: 100px; color: #64748b; }
.sed-icon-btn { font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; border: 1.5px solid #e2e8f0; border-radius: 4px; padding: 3px 8px; background: white; cursor: pointer; }
.sed-icon-btn:hover { background: #f0f8fd; }
.sed-icon-btn.danger { color: #b91c1c; border-color: #fca5a5; }
.sed-icon-btn.danger:hover { background: #fee2e2; }
.sed-item { padding: 8px 10px 6px; border-bottom: 1px solid #f1f5f9; }
.sed-item-row1 { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
.sed-colour-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; flex-shrink: 0; margin-top: 3px; }
.sed-label-ta { flex: 1; font-family: 'Nunito', sans-serif; font-size: 11px; border: 1.5px solid #e2e8f0; border-radius: 4px; padding: 4px 6px; resize: vertical; min-height: 34px; line-height: 1.4; }
.sed-label-ta:focus { outline: none; border-color: #1798d3; }
.sed-palette { display: none; flex-wrap: wrap; gap: 4px; padding: 4px 0 3px 24px; }
.sed-leaders { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.sed-ldr-chip { font-family: 'Nunito', sans-serif; font-size: 9px; font-weight: 700; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 2px 7px; cursor: pointer; background: white; color: #64748b; user-select: none; }
.sed-ldr-chip.sel { background: #1798d3; color: white; border-color: #1798d3; }
.sed-ldr-chip.all-chip.sel { background: #7c3aed; border-color: #7c3aed; color: white; }
.sed-ldr-chip.dim { opacity: .3; cursor: default; }
.sed-add-item { display: block; width: calc(100% - 20px); margin: 5px 10px 8px; padding: 5px; font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; border: 1.5px dashed #cbd5e1; border-radius: 5px; background: none; color: #94a3b8; cursor: pointer; }
.sed-add-item:hover { border-color: #1798d3; color: #1798d3; background: #f0f9ff; }
.sed-add-slot { display: block; width: 100%; padding: 9px; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; border: 1.5px dashed #cbd5e1; border-radius: 6px; background: none; color: #94a3b8; cursor: pointer; margin-bottom: 20px; }
.sed-add-slot:hover { border-color: #1798d3; color: #1798d3; background: #f0f9ff; }

/* ── PRINT ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .controls, #coverAlert, footer { display: none !important; }
  .header { padding: 6px 10px; }
  #mainContent { display: block !important; }
  .cards-wrap { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 6px; }
  .leader-card { break-inside: avoid; page-break-inside: avoid; box-shadow: none; border: 1px solid #cbd5e1; border-radius: 6px; }
  .card-absent-btn { display: none; }
  .grid-wrap { display: none; }
}

/* ── LEADER MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: white; border-radius: 10px; padding: 18px; width: min(93vw,420px); max-height: 85vh; overflow-y: auto; }
.modal h2 { font-size: 15px; font-weight: 900; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.modal h2 button { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; line-height: 1; }
.ldr-row { display: flex; align-items: center; gap: 5px; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
.colour-swatch { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.15); cursor: pointer; flex-shrink: 0; }
.ldr-row input { border: 1.5px solid #e2e8f0; border-radius: 4px; padding: 4px 6px; font-family: 'Nunito', sans-serif; font-size: 11px; }
.ldr-row .name-in { flex: 1; }
.ldr-row .role-in { width: 80px; }
.ldr-del { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 15px; padding: 0 2px; }
.ldr-del:hover { color: #ef4444; }
.add-row { display: flex; gap: 6px; margin-top: 8px; }
.add-row input { border: 1.5px solid #e2e8f0; border-radius: 4px; padding: 5px 7px; font-family: 'Nunito', sans-serif; font-size: 11px; }
.palette-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0 2px; }
.pal-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
.pal-swatch:hover { transform: scale(1.2); }
.pal-swatch.sel { border-color: #1e293b; }
.modal-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }

footer { text-align: center; font-size: 10px; color: #94a3b8; padding: 10px; border-top: 1px solid #e2e8f0; margin-top: 8px; }
</style>
</head>

<div class="header">
  <h1>Lunchtime Leaders<small>Wallscourt Farm Academy</small></h1>
</div>

<div class="controls">
  <button class="btn active" id="btnGrid" onclick="setView('grid')">Grid</button>

  <span class="spacer"></span>
  <button class="btn" onclick="openMgr()">✏️ Leaders</button>
  <button class="btn" onclick="openSchedEditor()">📋 Schedule</button>
  <button class="btn" onclick="printCards()">🖨 Print</button>
  <span class="sheet-status" id="sheetStatus">Loading…</span>
</div>

<div id="coverAlert"></div>
<div id="mainContent"></div>

<!-- Leader manager modal -->
<div class="modal-overlay" id="ldrModal">
  <div class="modal">
    <h2>Manage Leaders <button onclick="closeMgr()">×</button></h2>
    <div id="ldrList"></div>
    <div class="add-row">
      <input type="text" id="newName" placeholder="Name…" class="name-in" style="flex:1">
      <input type="text" id="newRole" placeholder="Role (opt.)" class="role-in">
      <button class="btn" onclick="addLeader()">+ Add</button>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="resetLeaders()">Reset defaults</button>
      <button class="btn active" onclick="closeMgr()">Done</button>
    </div>
  </div>
</div>

<!-- Schedule editor (full-page overlay) -->
<div class="sched-overlay" id="schedOverlay">
  <div class="sched-editor">
    <div class="sed-head">
      <h2>📋 Edit Schedule</h2>
      <button class="btn" onclick="resetSched()">Reset to default</button>
      <button class="btn" onclick="closeSchedEditor()">Cancel</button>
      <button class="btn active" onclick="saveSchedEditor()">Save for everyone</button>
    </div>
    <div class="sed-body" id="schedEdBody"></div>
  </div>
</div>

<footer>Wallscourt Farm Academy · Lunchtime Leaders · 30.07.26c</footer>

function deepClone(x) { return JSON.parse(JSON.stringify(x)); }
function escHtml(s) {

}
function absentToday() { return absences[selectedDate] || []; }

function save() {
  localStorage.setItem('wfa_ll_absences', JSON.stringify(absences));
  localStorage.setItem('wfa_ll_leaders',  JSON.stringify(LEADERS));
  localStorage.setItem('wfa_ll_schedule', JSON.stringify(scheduleRows));
  if (SYNC_URL) {
    fetch(SYNC_URL, { method:'POST', body: JSON.stringify({ absences, leaders: LEADERS, schedule: scheduleRows }) }).catch(() => {});
  }
}
function loadLocal() {
  try { const s = localStorage.getItem('wfa_ll_absences'); if (s) absences = JSON.parse(s); } catch(e) {}
  try { const s = localStorage.getItem('wfa_ll_leaders');  if (s) { const l = JSON.parse(s); if (l?.length) LEADERS = l; } } catch(e) {}
  try { const s = localStorage.getItem('wfa_ll_schedule'); if (s) { const sc = JSON.parse(s); if (sc?.length) scheduleRows = sc; } } catch(e) {}
}

// ── Cover analysis ────────────────────────────────────────────────────────────
function getCoverNeeds() {
  const abs = absentToday();
  if (!abs.length) return [];
  const seen = new Set();
  const needs = [];
  for (const row of scheduleRows) {
    for (const item of row.items) {
      if (item.leaders === 'ALL') continue;
      const absentFrom = item.leaders.filter(id => abs.includes(id));
      if (!absentFrom.length) continue;
      const key = item.label.replace(/\n/g,' ');
      if (seen.has(key)) continue;
      seen.add(key);
      const presentCount = item.leaders.filter(id => !abs.includes(id)).length;
      const absentNames = absentFrom.map(id => LEADERS.find(l => l.id === id)?.name || id);
      needs.push({ label: key, absentNames, presentCount, critical: presentCount === 0 });
    }
  }
  return needs;
}

// ── Render ────────────────────────────────────────────────────────────────────
function setView(v) {
  view = v;
  document.getElementById('btnGrid').classList.toggle('active', v === 'grid');
  document.getElementById('btnCards').classList.toggle('active', v === 'cards');
  render();
}
function onDateChange() {
  selectedDate = document.getElementById('dateInput').value || todayStr();
  render();
}
function render() {
  renderCoverAlert();
  document.getElementById('mainContent').innerHTML = view === 'grid' ? renderGrid() : renderCards();
}

function renderCoverAlert() {
  const needs = getCoverNeeds();
  const el = document.getElementById('coverAlert');
  if (!needs.length) { el.innerHTML = ''; return; }
  const absNames = absentToday().map(id => LEADERS.find(l => l.id === id)?.name || id);
  el.innerHTML = `<div class="cover-alert">
    <h3>🛑 Absent: ${absNames.join(', ')} — activities needing cover:</h3>
    ${needs.map(n => `<div class="cover-item${n.critical?' critical':''}">
      ${n.critical ? '🛑' : '⚠️'} <strong>${escHtml(n.label)}</strong>
      <span style="color:#b91c1c;font-size:9px;margin-left:4px">(${n.absentNames.join(', ')} absent${n.presentCount ? '; '+n.presentCount+' remaining' : ' — no cover!'})</span>
    </div>`).join('')}
  </div>`;
}

function renderGrid() {
  const abs = absentToday();
  let h = '<div class="grid-wrap"><table class="sched"><thead><tr>';
  h += '<th class="tc" style="background:#f8fafc;border-right-color:#cbd5e1"></th>';
  h += LEADERS.map(l => {
    const isAbs = abs.includes(l.id);
    return `<th>
      <div class="lh${isAbs?' absent-hd':''}">
        <div class="lh-bar" style="background:${l.colour}"></div>
        <span class="lh-name">${escHtml(l.name)}</span>
        ${l.role ? `<span class="lh-role">${escHtml(l.role)}</span>` : ''}
        <button class="absent-pill${isAbs?' is-absent':''}" onclick="toggleAbsent('${l.id}')">${isAbs ? '✗ Absent' : 'Mark absent'}</button>
      </div>
    </th>`;
  }).join('');
  h += '</tr></thead><tbody>';
  for (const row of scheduleRows) {
    const allItem = row.items.find(i => i.leaders === 'ALL');
    if (allItem) {
      h += `<tr class="all-row"><td class="tc">${escHtml(row.time)}</td>
        <td class="all-cell" colspan="${LEADERS.length}" style="background:${allItem.colour}28;border-left:4px solid ${allItem.colour}">${escHtml(allItem.label)}</td>
      </tr>`;
      if (row.note) h += `<tr class="note-row"><td class="tc"></td><td colspan="${LEADERS.length}">${escHtml(row.note)}</td></tr>`;
      continue;
    }
    h += `<tr><td class="tc">${escHtml(row.time)}</td>`;
    for (const l of LEADERS) {
      if (abs.includes(l.id)) { h += `<td class="absent-col" title="${escHtml(l.name)} — absent"></td>`; continue; }
      const item = row.items.find(i => Array.isArray(i.leaders) && i.leaders.includes(l.id));
      h += item
        ? `<td class="act" style="background:${item.colour}28;border-left:3px solid ${item.colour}">${escHtml(item.label)}</td>`
        : '<td class="empty"></td>';
    }
    h += '</tr>';
    if (row.note) h += `<tr class="note-row"><td class="tc"></td><td colspan="${LEADERS.length}">${escHtml(row.note)}</td></tr>`;
  }
  h += '</tbody></table></div>';
  return h;
}

function renderCards() {
  const abs = absentToday();
  return `<div class="cards-wrap">${LEADERS.map(l => {
    const isAbs = abs.includes(l.id);
    const timeline = [];
    const seen = new Set();
    for (const row of scheduleRows) {
      for (const item of row.items) {
        const ids = item.leaders === 'ALL' ? LEADERS.map(x => x.id) : item.leaders;
        if (!ids.includes(l.id)) continue;
        const key = row.time + '|' + item.label;
        if (seen.has(key)) continue;
        seen.add(key);
        timeline.push({ time: row.time, label: item.label.replace(/\n/g,' '), colour: item.colour });
      }
    }
    return `<div class="leader-card${isAbs?' absent':''}">
      <div class="card-hd" style="border-top-color:${l.colour}">
        <div class="card-name">${escHtml(l.name)}</div>
        ${l.role?`<div class="card-role">${escHtml(l.role)}</div>`:''}
        <button class="card-absent-btn${isAbs?' is-absent':''}" onclick="toggleAbsent('${l.id}')">${isAbs ? '✗ Absent today — tap to clear' : 'Mark absent today'}</button>
      </div>
      <div class="card-timeline">${timeline.map(t =>
        `<div class="tl-row">
          <span class="tl-time">${escHtml(t.time)}</span>
          <div class="tl-dot" style="background:${t.colour}"></div>
          <span class="tl-label">${escHtml(t.label)}</span>
        </div>`
      ).join('')}</div>
    </div>`;
  }).join('')}</div>`;
}

// ── Leader manager ────────────────────────────────────────────────────────────
function openMgr() {
  pickingColourFor = null;
  renderMgr();
  document.getElementById('ldrModal').classList.add('open');
}
function closeMgr() {
  document.getElementById('ldrModal').classList.remove('open');
  save();
  render();
}
function renderMgr() {
  document.getElementById('ldrList').innerHTML = LEADERS.map((l,i) =>
    `<div class="ldr-row">
      <div class="colour-swatch" style="background:${l.colour}" onclick="openPalette(${i})" title="Change colour"></div>
      <input class="name-in" type="text" value="${escHtml(l.name)}" oninput="LEADERS[${i}].name=this.value">
      <input class="role-in" type="text" value="${escHtml(l.role||'')}" placeholder="Role" oninput="LEADERS[${i}].role=this.value">
      <button class="ldr-del" onclick="removeLeader(${i})">×</button>
    </div>
    ${pickingColourFor===i ? `<div class="palette-row">${PALETTE.map(c =>
      `<div class="pal-swatch${l.colour===c?' sel':''}" style="background:${c}" onclick="setColour(${i},'${c}')"></div>`
    ).join('')}</div>` : ''}`
  ).join('');
}
function removeLeader(i) { LEADERS.splice(i,1); renderMgr(); }
function openPalette(i) { pickingColourFor = (pickingColourFor === i ? null : i); renderMgr(); }
function setColour(i, c) { LEADERS[i].colour = c; pickingColourFor = null; renderMgr(); }
function addLeader() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return;
  const role = document.getElementById('newRole').value.trim();
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'_') + '_' + Date.now().toString(36);
  LEADERS.push({ id, name, role, colour: PALETTE[LEADERS.length % PALETTE.length] });
  document.getElementById('newName').value = '';
  document.getElementById('newRole').value = '';
  renderMgr();
}
function resetLeaders() {
  if (!confirm('Reset to default leader list? Custom changes will be lost.')) return;
  LEADERS = DEFAULT_LEADERS.map(l => ({...l}));
  renderMgr();
}

// ── Schedule editor ───────────────────────────────────────────────────────────
function openSchedEditor() {
  editSched = deepClone(scheduleRows);
  renderSchedEditor();
  document.getElementById('schedOverlay').classList.add('open');
}
function closeSchedEditor() {
  editSched = null;
  document.getElementById('schedOverlay').classList.remove('open');
}
function saveSchedEditor() {
  scheduleRows = deepClone(editSched);
  save();
  closeSchedEditor();
  render();
}
function resetSched() {
  if (!confirm('Reset to built-in default schedule? All edits will be lost.')) return;
  editSched = deepClone(DEFAULT_SCHEDULE);
  renderSchedEditor();
}

function renderSchedEditor() {
  const overlay = document.getElementById('schedOverlay');
  const scrollTop = overlay.scrollTop;
  document.getElementById('schedEdBody').innerHTML =
    editSched.map((slot, si) => {
      return `<div class="sed-slot">
        <div class="sed-slot-head">
          <input class="sed-time-in" value="${escHtml(slot.time)}" placeholder="Time" oninput="editSched[${si}].time=this.value">
          ${slot.note !== undefined
            ? `<input class="sed-note-in" value="${escHtml(slot.note||'')}" placeholder="Note shown below row…" oninput="editSched[${si}].note=this.value">`
            : `<button class="sed-icon-btn" type="button" onclick="addNote(${si})">+ note</button>`}
          <span style="flex:1"></span>
          <button class="sed-icon-btn danger" type="button" onclick="removeSlot(${si})">Delete slot</button>
        </div>
        ${slot.items.map((item, ii) => {
          const isAll = item.leaders === 'ALL';
          return `<div class="sed-item">
            <div class="sed-item-row1">
              <div class="sed-colour-dot" id="dot-${si}-${ii}" style="background:${item.colour}" onclick="togglePalette(${si},${ii})" title="Change colour"></div>
              <textarea class="sed-label-ta" rows="2" oninput="editSched[${si}].items[${ii}].label=this.value">${escHtml(item.label)}</textarea>
              <button class="sed-icon-btn danger" type="button" onclick="removeItem(${si},${ii})">×</button>
            </div>
            <div class="sed-palette" id="pal-${si}-${ii}">
              ${PALETTE.map(c => `<div class="pal-swatch${item.colour===c?' sel':''}" style="background:${c}" onclick="setItemColour(${si},${ii},'${c}')"></div>`).join('')}
            </div>
            <div class="sed-leaders">
              <label class="sed-ldr-chip all-chip${isAll?' sel':''}" onclick="toggleAll(${si},${ii},${!isAll})">ALL</label>
              ${LEADERS.map(l => {
                const inArr = !isAll && Array.isArray(item.leaders) && item.leaders.includes(l.id);
                const style = inArr ? `border-color:${l.colour};background:${l.colour}22` : '';
                const click = isAll ? '' : `onclick="toggleLeader(${si},${ii},'${l.id}',${!inArr})"`;
                return `<label class="sed-ldr-chip${inArr?' sel':''}${isAll?' dim':''}" style="${style}" ${click}>${escHtml(l.name)}</label>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
        <button class="sed-add-item" type="button" onclick="addItem(${si})">+ Add activity</button>
      </div>`;
    }).join('') + `<button class="sed-add-slot" type="button" onclick="addSlot()">+ Add time slot</button>`;
  overlay.scrollTop = scrollTop;
}

function togglePalette(si, ii) {
  const pal = document.getElementById(`pal-${si}-${ii}`);
  const showing = pal.style.display === 'flex';
  document.querySelectorAll('.sed-palette').forEach(p => p.style.display = 'none');
  if (!showing) pal.style.display = 'flex';
}
function setItemColour(si, ii, c) {
  editSched[si].items[ii].colour = c;
  document.getElementById(`dot-${si}-${ii}`).style.background = c;
  const pal = document.getElementById(`pal-${si}-${ii}`);
  pal.style.display = 'none';
  pal.querySelectorAll('.pal-swatch').forEach((el, pi) => el.classList.toggle('sel', PALETTE[pi] === c));
}
function toggleAll(si, ii, makeAll) {
  editSched[si].items[ii].leaders = makeAll ? 'ALL' : [];
  renderSchedEditor();
}
function toggleLeader(si, ii, id, add) {
  const item = editSched[si].items[ii];
  if (!Array.isArray(item.leaders)) item.leaders = [];
  if (add) { if (!item.leaders.includes(id)) item.leaders.push(id); }
  else { item.leaders = item.leaders.filter(x => x !== id); }
  renderSchedEditor();
}
function addSlot() {
  editSched.push({ time: '', items: [{ leaders: [], label: '', colour: '#d1d5db' }] });
  renderSchedEditor();
  const slots = document.querySelectorAll('#schedEdBody .sed-slot');
  if (slots.length) slots[slots.length-1].scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function removeSlot(si) {
  if (!confirm('Delete this time slot?')) return;
  editSched.splice(si, 1);
  renderSchedEditor();
}
function addItem(si) {
  editSched[si].items.push({ leaders: [], label: '', colour: '#d1d5db' });
  renderSchedEditor();
}
function removeItem(si, ii) {
  if (editSched[si].items.length === 1) {
    alert('A slot needs at least one activity. Delete the whole slot instead.');
    return;
  }
  editSched[si].items.splice(ii, 1);
  renderSchedEditor();
}
function addNote(si) {
  editSched[si].note = '';
  renderSchedEditor();
}

function printCards() {
  if (view !== 'cards') { setView('cards'); }
  setTimeout(() => window.print(), 100);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  loadLocal();
  if (!scheduleRows) scheduleRows = deepClone(DEFAULT_SCHEDULE);
  document.getElementById('dateInput').value = selectedDate;
  render();
  const status = document.getElementById('sheetStatus');
  try {
    if (!SYNC_URL) throw new Error('No sync');
    const raw = await fetch(SYNC_URL).then(r => r.text());
    if (raw && raw !== '{}') {
      try {
        const remote = JSON.parse(raw);
        if (remote.absences) absences = remote.absences;
        if (remote.leaders?.length) LEADERS = remote.leaders;
        if (remote.schedule?.length) scheduleRows = remote.schedule;
      } catch(e) {}
    }
    localStorage.setItem('wfa_ll_absences', JSON.stringify(absences));
    localStorage.setItem('wfa_ll_leaders',  JSON.stringify(LEADERS));
    localStorage.setItem('wfa_ll_schedule', JSON.stringify(scheduleRows));
    status.textContent = 'Synced ✓';
    status.className = 'sheet-status ok';
  } catch(e) {
    status.textContent = 'Offline';
    status.className = 'sheet-status err';
  }
  render();
}

init();
</script>
