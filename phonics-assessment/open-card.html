<!DOCTYPE html>
<!--
 WFA Phonics cards on an iPad (open page) - WFA-14.11.26a
 Shows the Phonics Assessment cards (sounds, words, tricky words) for a list given in the web address, so the
 teacher can point the iPad camera at the "Show on iPad" QR code on the laptop page (Phonics Assessment.html, in the
 CLF Staff-Tools library) and show the child the cards. The laptop is where the marks are recorded.
 HOLDS NO PUPIL DATA and calls no API or WFA server. The address carries only which cards to show:
   #c=<catalogue check>&l=<card list>&p=<card number, from 0>[&f=od]
   l = positions in the order the laptop shows cards (within each phase: every set's GPCs, then the tricky words,
       then the blending), base 36, runs written "a-b", joined with "."; m=1: more cards follow (scan again)
   c = FNV-1a hash (base 36) of the item ids in that order joined with "\n": a different catalogue is refused.
 Everything after # stays on the iPad (browsers never send it to the website).
 Fonts load as the live child.html does: Sassoon Infant from this site, OpenDyslexic from jsDelivr.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Phonics cards</title>
<link rel="icon" href="../favicon.png">
<style>
  @font-face { font-family: 'WFA Sassoon'; src: url('../precision-teaching/fonts/SassoonInfant.ttf') format('truetype'); font-display: swap; }
  @font-face { font-family: 'OpenDyslexic'; src: url('https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.2.5/files/opendyslexic-latin-400-normal.woff2') format('woff2'); font-display: swap; }

  /* The CHILD's screen: a card and nothing else. The adult's iPad (index.html, card mode) chooses what shows.
     Cream background and soft black text (dyslexia-friendly); font Sassoon Infant or OpenDyslexic, as the adult chose. */
  :root { --cardfont: 'WFA Sassoon', system-ui, sans-serif; }
  body.font-od { --cardfont: 'OpenDyslexic', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #fdf6e3; color: #1f1f1f; font-family: system-ui, sans-serif; overflow: hidden;
               -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  #card { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 4vw; box-sizing: border-box; }
  .big { font-family: var(--cardfont); font-size: min(40vh, 28vw); line-height: 1.1; text-align: center; word-break: break-word; }
  .big.word { font-size: min(26vh, 15vw); }
  body.font-od .big { font-size: min(30vh, 21vw); }
  body.font-od .big.word { font-size: min(19vh, 11vw); }
  .listen { font-size: min(40vh, 30vw); line-height: 1; }
  #dot { position: fixed; left: 12px; bottom: 12px; width: 10px; height: 10px; border-radius: 50%; background: #c9c2b0; }
  #dot.bad { background: #e57d24; }
  #menu { position: fixed; right: 8px; top: 8px; border: 0; background: none; color: #c9c2b0; font-size: 1.6rem; padding: 6px 10px; }
  #lost { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; text-align: center; color: #8a6d3b; font-weight: 700; }
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fdf6e3; }
  #setup .box { text-align: center; max-width: 520px; padding: 20px; }
  #setup h1 { font-size: 1.5rem; margin: 0 0 10px; }
  #setup p { color: #5b6b7b; margin: 0 0 16px; }
  #setup input { font: inherit; font-size: 2rem; letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 9ch;
                 padding: 10px; border: 3px solid #d9e3ec; border-radius: 12px; }
  #setup button { font: inherit; font-weight: 800; font-size: 1.1rem; margin-left: 8px; padding: 14px 20px; border: 0; border-radius: 12px; background: #1798d3; color: #fff; }
  #setup .err { color: #c62828; font-weight: 700; margin-top: 12px; min-height: 1.2em; }
  #ver { position: fixed; right: 10px; bottom: 8px; font-size: .7rem; color: #c9c2b0; }

  /* ── the iPad's own buttons (the teacher's; small and pale so the card is what the child sees) ── */
  .nav { position: fixed; bottom: 0; border: 0; background: none; color: #b9ae94; font: 800 1.25rem system-ui, sans-serif;
         padding: 22px 28px calc(22px + env(safe-area-inset-bottom)); min-width: 120px; -webkit-tap-highlight-color: transparent; }
  .nav:active { color: #6b6250; }
  .nav[disabled] { opacity: .25; }
  #prev { left: 0; text-align: left; } #next { right: 0; text-align: right; }
  #count { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); color: #c9c2b0; font: 700 .95rem system-ui, sans-serif; white-space: nowrap; }
  #menu { font-family: system-ui, sans-serif; }
  #ver { position: fixed; right: 10px; top: auto; bottom: 4px; }
  #done { text-align: center; font-family: system-ui, sans-serif; color: #5b6b7b; }
  #done b { display: block; font-size: 2.4rem; color: #1f1f1f; margin-bottom: 8px; }
  #pick { position: fixed; inset: 0; overflow-y: auto; background: #fdf6e3; font-family: system-ui, sans-serif; padding: 24px 16px 60px; box-sizing: border-box; z-index: 5; }
  #pick .box { max-width: 900px; margin: 0 auto; }
  #pick h1 { font-size: 1.6rem; margin: 0 0 6px; }
  #pick p { color: #5b6b7b; margin: 0 0 14px; line-height: 1.45; }
  #pick .msg { background: #fff3e0; color: #8a4b00; border-radius: 10px; padding: 10px 12px; font-weight: 700; }
  #pick .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 18px; }
  #pick h2 { font-size: 1.05rem; margin: 18px 0 8px; color: #5b6b7b; }
  #pick .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  #pick .sets button, #pick .row button { font: 700 1.05rem system-ui, sans-serif; text-align: left; padding: 14px 14px; border: 2px solid #eadfc2; border-radius: 12px; background: #fffaf0; color: #1f1f1f; }
  #pick .sets button small { display: block; font-weight: 600; color: #8a8270; margin-top: 4px; font-size: .85rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #pick .row button.on { border-color: #1798d3; background: #e6f4fb; }
  #pick .close { float: right; }
</style>
</head>
<body>
<div id="card"></div>
<button class="nav" id="prev" aria-label="Back">‹ Back</button>
<span id="count"></span>
<button class="nav" id="next" aria-label="Next">Next ›</button>
<button id="menu" aria-label="Choose cards or font">⋯</button>

</div></div>
